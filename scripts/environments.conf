# Environment Configuration for K3s Infrastructure Scripts
# This file defines all available environments and their properties
#
# Format: environment_name:ansible_group:display_name:emoji:kubectl_context:default_verbosity
#
# environment_name: Short name used in --env flag (e.g., "prod", "test", "stage")
# ansible_group: Ansible inventory group name (e.g., "k3s_cluster", "k3s_cluster_test")
# display_name: Human-readable name for output (e.g., "Production", "Test")
# emoji: Emoji for visual identification in output
# kubectl_context: Context name for k3s-context-manager.sh
# default_verbosity: Default verbosity level ("" for standard, "-v" for verbose)

prod:k3s_cluster_prod:Production:🚀:prod:
stage:k3s_cluster_stage:Staging:🎭:stage:-v
test:k3s_cluster_test:Test:🧪:test:-v