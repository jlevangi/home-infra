---
# Unified K3s Cluster Deployment with NFS Authentication
# 
# IMPORTANT: This playbook uses Ansible Vault for NFS credentials
# 
# Usage examples:
# Production cluster:
#   ansible-playbook -i k3s-inventory playbooks/k3s-deploy-cluster.yml --ask-vault-pass
# Test cluster:
#   ansible-playbook -i k3s-inventory playbooks/k3s-deploy-cluster.yml -e target_cluster=k3s_test_cluster --ask-vault-pass
#
- name: Deploy K3s Cluster with Roles
  hosts: "{{ target_cluster | default('k3s_cluster') }}"
  become: yes
  gather_facts: yes
  
  vars_files:
    - ../group_vars/k3s_cluster_vault.yml
    - ../group_vars/k3s_cluster.yml
    - "../group_vars/{{ target_cluster | default('k3s_cluster') }}.yml"

  roles:
    - ../roles/common    # Apply common system configuration
    - ../roles/k3s       # Install and configure K3s cluster
    - role: ../roles/k3s-apps  # Deploy applications
      when: deploy_applications | default(true) | bool
    - ../roles/telegraf

  post_tasks:
    # - name: Automatically setup local kubeconfig
    #   shell: |
    #     chmod +x /mnt/c/Users/pierc/git/home-infra/setup-local-kubeconfig.sh
    #     /mnt/c/Users/pierc/git/home-infra/setup-local-kubeconfig.sh
    #   delegate_to: localhost
    #   run_once: true
    #   become: no
    #   ignore_errors: yes
      
    - name: Display deployment completion message
      debug:
        msg:
          - "🎉 K3s deployment completed successfully!"
          - ""
          - "📋 Cluster is ready to use:"
          - "1. Kubeconfig has been automatically configured"
          - "2. Start a new terminal or run: source ~/.bashrc"
          - "3. Test with: kubectl get nodes"
          - ""
          - "📊 Check your cluster:"
          - "   kubectl get nodes -o wide"
          - "   kubectl get pods -A"
          - ""
          - "🔧 Useful aliases (already added to your shell):"
          - "   k = kubectl"
          - "   kgp = kubectl get pods"
          - "   kgn = kubectl get nodes"
          - "   kgs = kubectl get services"
          - ""
          - "🏷️ Cluster Type: {{ target_cluster | default('k3s_cluster (production)') }}"
          - "🌐 Environment: {{ cluster_environment | default('production') }}"
      run_once: true
      delegate_to: localhost