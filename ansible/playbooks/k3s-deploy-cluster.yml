---
# Unified K3s Cluster Deployment with NFS Authentication
#
# IMPORTANT: This playbook uses Ansible Vault for NFS credentials
#
# Usage examples:
# Production cluster:
#   ansible-playbook -i inventories/production/hosts.yml playbooks/k3s-deploy-cluster.yml -e target_cluster=k3s_cluster_prod --ask-vault-pass
# Test cluster:
#   ansible-playbook -i inventories/test/hosts.yml playbooks/k3s-deploy-cluster.yml -e target_cluster=k3s_cluster_test --ask-vault-pass
#
# Masters run with serial: 1 so the first master can finish bootstrapping
# embedded etcd (--cluster-init) before the others attempt to join via
# --server. Without this, joining masters would deadlock waiting for the
# first master's API while ansible's linear strategy holds the play at
# that task. Workers then deploy in parallel.

- name: Deploy K3s masters (serial for HA bootstrap order)
  hosts: "{{ target_cluster | default('k3s_cluster') }}_master"
  become: yes
  gather_facts: yes
  serial: 1

  vars_files:
    - ../group_vars/k3s_cluster_vault.yml
    - ../group_vars/k3s_cluster.yml
    - "../group_vars/{{ target_cluster | default('k3s_cluster') }}.yml"
    # Node roles and Longhorn storage layout for every host, all environments.
    - ../group_vars/k3s_cluster_topology.yml

  roles:
    - ../roles/common
    - ../roles/k3s
    - role: ../roles/telegraf
      when: k3s_install_telegraf | default(false)

- name: Deploy K3s workers (parallel)
  hosts: "{{ target_cluster | default('k3s_cluster') }}_workers"
  become: yes
  gather_facts: yes

  vars_files:
    - ../group_vars/k3s_cluster_vault.yml
    - ../group_vars/k3s_cluster.yml
    - "../group_vars/{{ target_cluster | default('k3s_cluster') }}.yml"
    # Node roles and Longhorn storage layout for every host, all environments.
    - ../group_vars/k3s_cluster_topology.yml

  roles:
    - ../roles/common
    - ../roles/k3s
    - role: ../roles/telegraf
      when: k3s_install_telegraf | default(false)

  post_tasks:
    - name: Fail if any worker failed to join
      fail:
        msg: |
          Worker join FAILED.
          Failed hosts: {{ ansible_play_hosts_all | difference(ansible_play_hosts) | join(', ') }}
          Review the task output above for the specific error.
      when: ansible_play_hosts_all | difference(ansible_play_hosts) | length > 0
      run_once: true
      delegate_to: localhost

# Helm-driven infrastructure installs run AFTER masters and workers join so
# Longhorn has eligible storage nodes when PVC-backed components (Traefik,
# ArgoCD, Vault) reach their wait-for-ready step. Targets the first master
# only — Helm releases would otherwise race across multiple servers.
- name: Install infra components on first master
  hosts: "{{ target_cluster | default('k3s_cluster') }}_master[0]"
  become: yes
  gather_facts: yes

  vars_files:
    - ../group_vars/k3s_cluster_vault.yml
    - ../group_vars/k3s_cluster.yml
    - "../group_vars/{{ target_cluster | default('k3s_cluster') }}.yml"
    # Node roles and Longhorn storage layout for every host, all environments.
    - ../group_vars/k3s_cluster_topology.yml

  pre_tasks:
    - name: Skip infra-install play when requested
      meta: end_play
      when: skip_infra_install | default(false) | bool

    - name: Read reachable kubeconfig from first master
      ansible.builtin.slurp:
        src: "/home/{{ k3s_user | default(ansible_user) }}/.kube/config"
      register: platform_kubeconfig_raw

    - name: Create temporary kubeconfig file on controller
      ansible.builtin.tempfile:
        state: file
        prefix: "{{ target_cluster | default('k3s_cluster') }}-platform-"
        suffix: .kubeconfig
      register: platform_kubeconfig_tempfile
      delegate_to: localhost
      become: false

    - name: Write fetched kubeconfig to controller temp file
      ansible.builtin.copy:
        content: "{{ platform_kubeconfig_raw.content | b64decode }}"
        dest: "{{ platform_kubeconfig_tempfile.path }}"
        mode: "0600"
      delegate_to: localhost
      become: false

  tasks:
    - name: Run Helm-driven infra installs
      include_role:
        name: ../roles/cluster_platform
        apply:
          delegate_to: localhost
          become: false
      vars:
        kubeconfig_path: "{{ platform_kubeconfig_tempfile.path }}"
        platform_primary_node_ip: >-
          {{
            hostvars[groups[master_group][0]].ansible_host
            | default(hostvars[groups[master_group][0]].ansible_default_ipv4.address)
            | default(groups[master_group][0])
          }}
        platform_master_nodes: "{{ groups[master_group] | default([]) }}"
        platform_worker_nodes: "{{ groups[worker_group] | default([]) }}"
        platform_cluster_nodes: "{{ groups[cluster_group] | default([]) }}"
        platform_cluster_node_count: "{{ groups[cluster_group] | default([]) | length }}"
        # Node topology, keyed by hostname, from
        # ansible/group_vars/k3s_cluster_topology.yml. Resolved there rather
        # than extracted from hostvars — vars_files values are play vars and
        # never appear in hostvars. Covers the whole cluster rather than just
        # workers so control-plane nodes are reconciled (and their undeclared
        # default disks reported) too.
        platform_node_tags: "{{ k3s_node_tags_by_host }}"
        platform_node_disks: "{{ k3s_node_disks_by_host }}"
        platform_node_manage_disks: "{{ k3s_node_manage_disks_by_host }}"
        platform_gpu_nodes: "{{ k3s_gpu_nodes }}"
        platform_install_longhorn: "{{ k3s_install_longhorn | default(true) }}"
        platform_install_metallb: "{{ k3s_install_metallb | default(true) }}"
        platform_install_traefik: "{{ k3s_install_traefik | default(true) }}"
        platform_install_argocd: "{{ k3s_install_argocd | default(true) }}"
        platform_configure_vault: "{{ k3s_configure_vault | default(true) }}"

  post_tasks:
    - name: Remove temporary controller kubeconfig
      ansible.builtin.file:
        path: "{{ platform_kubeconfig_tempfile.path }}"
        state: absent
      delegate_to: localhost
      become: false
      when: platform_kubeconfig_tempfile is defined

    # Fail loudly if any host dropped out of the play so the completion banner
    # below only ever runs on a real success.
    - name: Fail if any host failed during deployment
      fail:
        msg: |
          K3s deployment FAILED.
          Failed hosts: {{ ansible_play_hosts_all | difference(ansible_play_hosts) | join(', ') }}
          Review the task output above for the specific error.
      when: ansible_play_hosts_all | difference(ansible_play_hosts) | length > 0
      run_once: true
      delegate_to: localhost
      become: false

    - name: Display deployment completion message
      debug:
        msg:
          - "K3s deployment process completed!"
          - ""
          - "REFER TO CLUSTER STATUS ABOVE for detailed health information"
          - "The comprehensive status summary shows if any components failed"
          - ""
          - "If the status shows issues:"
          - "   - Check the specific component status in the summary above"
          - "   - Review logs: kubectl logs -n <namespace> <pod-name>"
          - "   - Verify connectivity: kubectl get pods -A"
          - "   - Re-run deployment to retry failed components"
          - ""
          - "Cluster Type: {{ target_cluster | default('k3s_cluster (production)') }}"
          - "Environment: {{ cluster_environment | default('production') }}"
      run_once: true
      delegate_to: localhost
      become: false
