---
# Test playbook to configure Longhorn backup target
# This playbook focuses specifically on setting up the backup target
# for Longhorn using the correct variables and methods

- name: Configure Longhorn Backup Target - Test Playbook
  hosts: "{{ target_hosts | default('k3s_test_master') }}"
  become: yes
  gather_facts: yes
  vars:
    # Override for testing - use direct paths to avoid vault dependency
    test_nfs_backup_path: "/volume1/k3s-storage/longhorn/test"
    
  tasks:
    - name: Debug - Display backup target variables
      debug:
        msg: |
          🔍 Longhorn Backup Target Configuration Variables:
          
          📊 Cluster Information:
          - Cluster Environment: {{ cluster_environment | default('undefined') }}
          - Worker Group: {{ worker_group | default('undefined') }}
          - Master Group: {{ master_group | default('undefined') }}
          
          🌐 NFS Configuration:
          - NFS Server IP: {{ nfs_server_ip | default('undefined') }}
          - NFS Share Backup: {{ nfs_share_backup | default('undefined') }}
          - Test NFS Backup Path: {{ test_nfs_backup_path }}
          - Enable Longhorn Backup: {{ enable_longhorn_backup | default('undefined') }}
          
          🎯 Constructed Backup Target:
          - Using nfs_server_ip: nfs://{{ nfs_server_ip | default('MISSING') }}:{{ test_nfs_backup_path }}
          - Using vault var: nfs://{{ nfs_server_ip | default('MISSING') }}:{{ nfs_share_backup | default('MISSING') }}
          
          💡 Critical Discovery:
          - NFS URL MUST have colon (:) after IP address for Longhorn to mount correctly
          - Format: nfs://host:path NOT nfs://host/path
          
          ⚙️  Node Information:
          - Current Node: {{ inventory_hostname }}
          - Ansible User: {{ ansible_user | default('undefined') }}

    - name: Check if Longhorn is deployed
      shell: |
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get namespace longhorn-system
      register: longhorn_namespace_check
      failed_when: false
      changed_when: false

    - name: Display Longhorn deployment status
      debug:
        msg: |
          {% if longhorn_namespace_check.rc == 0 %}
          ✅ Longhorn namespace exists - proceeding with backup target configuration
          {% else %}
          ❌ Longhorn namespace not found - Longhorn may not be deployed
          Error: {{ longhorn_namespace_check.stderr | default('Unknown') }}
          {% endif %}

    - name: Check current Longhorn settings related to backup
      shell: |
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get settings.longhorn.io -n longhorn-system | grep backup || echo "No backup settings found"
      register: current_backup_settings
      failed_when: false
      changed_when: false
      when: longhorn_namespace_check.rc == 0

    - name: Display current backup settings
      debug:
        msg: |
          🔍 Current Longhorn Backup Settings:
          {{ current_backup_settings.stdout_lines | default(['No output']) | join('\n') }}
      when: longhorn_namespace_check.rc == 0

    - name: Check Longhorn version
      shell: |
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl describe pod $(kubectl get pods -n longhorn-system | grep longhorn-manager | head -1 | awk '{print $1}') -n longhorn-system | grep "Image:" | head -1
      register: longhorn_version_check
      failed_when: false
      changed_when: false
      when: longhorn_namespace_check.rc == 0

    - name: Display Longhorn version information
      debug:
        msg: |
          🔍 Longhorn Version Information:
          {{ longhorn_version_check.stdout | default('Could not determine version') }}
          
          📚 Blog Post Insights:
          - Longhorn versions < 1.3.0 require backup target to be set during initial helm install
          - Backup target cannot be set retroactively in older versions
          - Must be set using --set-string defaultSettings.backupTarget during helm upgrade --install
      when: longhorn_version_check is defined

    - name: Attempt to create backup-target setting (Method 1 - Direct Setting Creation)
      shell: |
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl create -f - <<EOF
        apiVersion: longhorn.io/v1beta2
        kind: Setting
        metadata:
          name: backup-target
          namespace: longhorn-system
        value: "nfs://{{ nfs_server_ip }}:{{ test_nfs_backup_path }}"
        EOF
      register: backup_target_create_result
      failed_when: false
      when: 
        - longhorn_namespace_check.rc == 0
        - nfs_server_ip is defined

    - name: Display backup target creation result (Method 1)
      debug:
        msg: |
          🔧 Backup Target Creation (Method 1 - Direct Create):
          {% if backup_target_create_result.rc == 0 %}
          ✅ Successfully created backup-target setting
          Target: nfs://{{ nfs_server_ip }}{{ test_nfs_backup_path }}
          {% else %}
          ❌ Failed to create backup-target setting
          Error: {{ backup_target_create_result.stderr | default('Unknown error') }}
          {% endif %}
      when: backup_target_create_result is defined

    - name: Attempt to patch backup-target setting (Method 2 - Patch Existing)
      shell: |
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl patch setting.longhorn.io backup-target -n longhorn-system \
          --type='merge' -p='{"value":"nfs://{{ nfs_server_ip }}{{ test_nfs_backup_path }}"}'
      register: backup_target_patch_result
      failed_when: false
      when: 
        - longhorn_namespace_check.rc == 0
        - nfs_server_ip is defined
        - backup_target_create_result is defined
        - backup_target_create_result.rc != 0

    - name: Display backup target patch result (Method 2)
      debug:
        msg: |
          🔧 Backup Target Patch (Method 2 - Patch Existing):
          {% if backup_target_patch_result is defined %}
          {% if backup_target_patch_result.rc == 0 %}
          ✅ Successfully patched backup-target setting
          Target: nfs://{{ nfs_server_ip }}{{ test_nfs_backup_path }}
          {% else %}
          ❌ Failed to patch backup-target setting
          Error: {{ backup_target_patch_result.stderr | default('Unknown error') }}
          {% endif %}
          {% else %}
          ⏭️  Skipped - Method 1 succeeded or prerequisites not met
          {% endif %}
      when: backup_target_patch_result is defined

    - name: Check if backup-target setting exists after our attempts
      shell: |
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get setting.longhorn.io backup-target -n longhorn-system -o yaml
      register: final_backup_target_check
      failed_when: false
      changed_when: false
      when: longhorn_namespace_check.rc == 0

    - name: Display final backup target status
      debug:
        msg: |
          🎯 Final Backup Target Status:
          {% if final_backup_target_check is defined %}
          {% if final_backup_target_check.rc == 0 %}
          ✅ Backup target setting exists!
          
          Current Configuration:
          {{ final_backup_target_check.stdout | default('No output') }}
          {% else %}
          ❌ Backup target setting does not exist
          Error: {{ final_backup_target_check.stderr | default('Unknown error') }}
          {% endif %}
          {% else %}
          ⚠️  Could not check backup target status - Longhorn may not be deployed
          {% endif %}

    - name: Test NFS connectivity to backup target
      shell: |
        ping -c 2 {{ nfs_server_ip }} && echo "NFS server reachable" || echo "NFS server unreachable"
      register: nfs_connectivity_test
      failed_when: false
      changed_when: false
      when: nfs_server_ip is defined

    - name: Display NFS connectivity test results
      debug:
        msg: |
          🌐 NFS Server Connectivity Test:
          Target: {{ nfs_server_ip | default('undefined') }}
          Result: {{ nfs_connectivity_test.stdout_lines | default(['Test not run']) | join(' ') }}
      when: nfs_connectivity_test is defined

    - name: Test helm upgrade approach (Method 3 - Blog Post Method)
      shell: |
        helm repo add longhorn https://charts.longhorn.io 2>/dev/null || echo "Repo already exists"
        helm repo update
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install longhorn longhorn/longhorn \
          --namespace longhorn-system \
          --set-string defaultSettings.backupTarget="nfs://{{ nfs_server_ip }}:{{ test_nfs_backup_path }}" \
          --reuse-values
      register: helm_upgrade_result
      failed_when: false
      when: 
        - longhorn_namespace_check.rc == 0
        - nfs_server_ip is defined

    - name: Display helm upgrade result (Method 3)
      debug:
        msg: |
          🔧 Helm Upgrade with Backup Target (Method 3 - Blog Post Method):
          {% if helm_upgrade_result is defined %}
          {% if helm_upgrade_result.rc == 0 %}
          ✅ Successfully ran helm upgrade with backup target
          {% else %}
          ❌ Helm upgrade failed
          Error: {{ helm_upgrade_result.stderr | default('Unknown error') }}
          {% endif %}
          {% else %}
          ⏭️  Skipped - Prerequisites not met
          {% endif %}
      when: helm_upgrade_result is defined

    - name: Wait for Longhorn to stabilize after helm upgrade
      pause:
        seconds: 30
        prompt: "Waiting for Longhorn to process helm upgrade changes..."
      when: 
        - helm_upgrade_result is defined 
        - helm_upgrade_result.rc == 0

    - name: Check backup target after helm upgrade
      shell: |
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get setting.longhorn.io backup-target -n longhorn-system -o yaml
      register: post_helm_backup_check
      failed_when: false
      changed_when: false
      when: 
        - helm_upgrade_result is defined 
        - helm_upgrade_result.rc == 0

    - name: Display post-helm backup target status
      debug:
        msg: |
          📊 Backup Target Status After Helm Upgrade:
          {% if post_helm_backup_check is defined %}
          {% if post_helm_backup_check.rc == 0 %}
          ✅ Backup target setting exists after helm upgrade!
          
          Configuration:
          {{ post_helm_backup_check.stdout | default('No output') }}
          {% else %}
          ❌ Backup target still does not exist after helm upgrade
          {% endif %}
          {% else %}
          ⏭️  Check skipped - helm upgrade was not successful
          {% endif %}
      when: post_helm_backup_check is defined

    - name: Summary of backup target configuration attempt
      debug:
        msg: |
          📋 LONGHORN BACKUP TARGET CONFIGURATION SUMMARY:
          
          🎯 Target Configuration:
          - NFS Server: {{ nfs_server_ip | default('UNDEFINED') }}
          - Backup Path: {{ test_nfs_backup_path }}
          - Full Target: nfs://{{ nfs_server_ip | default('UNDEFINED') }}:{{ test_nfs_backup_path }}
          
          ✅ Successful Operations:
          {% if longhorn_namespace_check.rc == 0 %}
          - Longhorn namespace found
          {% endif %}
          {% if backup_target_create_result is defined and backup_target_create_result.rc == 0 %}
          - Backup target setting created successfully
          {% endif %}
          {% if backup_target_patch_result is defined and backup_target_patch_result.rc == 0 %}
          - Backup target setting patched successfully
          {% endif %}
          {% if final_backup_target_check is defined and final_backup_target_check.rc == 0 %}
          - Backup target setting verified to exist
          {% endif %}
          
          ❌ Failed Operations:
          {% if longhorn_namespace_check.rc != 0 %}
          - Longhorn namespace not found
          {% endif %}
          {% if backup_target_create_result is defined and backup_target_create_result.rc != 0 %}
          - Backup target setting creation failed
          {% endif %}
          {% if backup_target_patch_result is defined and backup_target_patch_result.rc != 0 %}
          - Backup target setting patch failed
          {% endif %}
          {% if final_backup_target_check is defined and final_backup_target_check.rc != 0 %}
          - Backup target setting verification failed
          {% endif %}
          
          💡 Next Steps:
          {% if final_backup_target_check is defined and final_backup_target_check.rc == 0 %}
          - ✅ Backup target is configured! Test with a volume backup.
          {% else %}
          - 🔍 Investigate why backup target setting cannot be created/found
          - 📖 Check Longhorn documentation for backup target configuration
          - 🛠️  Consider using Longhorn UI to manually configure backup target
          {% endif %}