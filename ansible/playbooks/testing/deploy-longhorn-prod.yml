---
# Deploy Longhorn to production cluster with shared backup configuration
- name: Deploy Longhorn to Production Cluster
  hosts: "{{ target_hosts | default('k3s_master') }}"
  become: yes
  gather_facts: yes
  vars:
    nfs_server_ip: "172.20.20.5"
    nfs_share_backup: "/volume1/k3s-storage/longhorn"
    cluster_environment: "prod"
    worker_group: "k3s_workers"
    master_group: "k3s_master"
    longhorn_backup_shared_across_clusters: true
    enable_longhorn_backup: true
    
  tasks:
    - name: Calculate dynamic replica count for Longhorn
      set_fact:
        calculated_replica_count: "{{ [groups[worker_group] | length, 3] | min }}"
        longhorn_replica_count: "{{ [groups[worker_group] | length, 3] | min }}"

    - name: Display Longhorn deployment configuration
      debug:
        msg: |
          🚀 Longhorn Production Deployment Configuration:
          
          📊 Cluster Information:
          - Environment: {{ cluster_environment }}
          - Worker nodes: {{ groups[worker_group] | length }}
          - Replica count: {{ longhorn_replica_count }}
          
          🔄 Backup Configuration:
          - NFS Server: {{ nfs_server_ip }}
          - Backup Path: {{ nfs_share_backup }}/shared
          - Shared across clusters: {{ longhorn_backup_shared_across_clusters }}
          
          🎯 Target: nfs://{{ nfs_server_ip }}:{{ nfs_share_backup }}/shared

    - name: Install open-iscsi for Longhorn
      apt:
        name: open-iscsi
        state: present
        update_cache: yes

    - name: Start and enable iscsid service
      systemd:
        name: iscsid
        state: started
        enabled: yes

    - name: Add Longhorn Helm repo
      shell: helm repo add longhorn https://charts.longhorn.io
      register: helm_repo_add
      failed_when: false

    - name: Update Helm repos
      shell: helm repo update

    - name: Check if Longhorn is already installed
      shell: |
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm list -n longhorn-system | grep longhorn
      register: longhorn_check
      failed_when: false

    - name: Install Longhorn with shared backup configuration
      shell: |
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml helm upgrade --install longhorn longhorn/longhorn \
          --namespace longhorn-system \
          --create-namespace \
          --set defaultSettings.defaultReplicaCount={{ longhorn_replica_count }} \
          --set defaultSettings.defaultDataPath="/var/lib/longhorn/" \
          --set-string defaultSettings.backupTarget="nfs://{{ nfs_server_ip }}:{{ nfs_share_backup }}/shared" \
          --wait --timeout=600s
      register: longhorn_install_result
      when: longhorn_check.rc != 0

    - name: Display Longhorn installation result
      debug:
        msg: |
          🔧 Longhorn Installation Result:
          {% if longhorn_check.rc == 0 %}
          ✅ Longhorn was already installed
          {% elif longhorn_install_result.rc == 0 %}
          ✅ Longhorn successfully installed with shared backup target
          {% else %}
          ❌ Longhorn installation failed: {{ longhorn_install_result.stderr | default('Unknown error') }}
          {% endif %}

    - name: Wait for Longhorn manager pods to be ready
      shell: |
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl -n longhorn-system wait --for=condition=Ready pod -l app=longhorn-manager --timeout=300s
      register: longhorn_manager_wait
      failed_when: false

    - name: Check Longhorn storage class is available
      shell: |
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get storageclass longhorn
      register: longhorn_sc_check
      until: longhorn_sc_check.rc == 0
      retries: 10
      delay: 30

    - name: Update Longhorn StorageClass to correct replica count
      shell: |
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl patch configmap longhorn-storageclass -n longhorn-system \
          --type='merge' -p='{"data":{"storageclass.yaml":"kind: StorageClass\napiVersion: storage.k8s.io/v1\nmetadata:\n  name: longhorn\n  annotations:\n    storageclass.kubernetes.io/is-default-class: \"true\"\nprovisioner: driver.longhorn.io\nallowVolumeExpansion: true\nreclaimPolicy: \"Delete\"\nvolumeBindingMode: Immediate\nparameters:\n  numberOfReplicas: \"{{ longhorn_replica_count }}\"\n  staleReplicaTimeout: \"30\"\n  fromBackup: \"\"\n  fsType: \"ext4\"\n  dataLocality: \"disabled\"\n  unmapMarkSnapChainRemoved: \"ignored\"\n  disableRevisionCounter: \"true\"\n  dataEngine: \"v1\"\n  backupTargetName: \"default\"\n"}}'
      register: storageclass_configmap_update

    - name: Recreate StorageClass with correct replica count
      shell: |
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl delete storageclass longhorn
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f - <<EOF
        kind: StorageClass
        apiVersion: storage.k8s.io/v1
        metadata:
          name: longhorn
          annotations:
            storageclass.kubernetes.io/is-default-class: "true"
        provisioner: driver.longhorn.io
        allowVolumeExpansion: true
        reclaimPolicy: "Delete"
        volumeBindingMode: Immediate
        parameters:
          numberOfReplicas: "{{ longhorn_replica_count }}"
          staleReplicaTimeout: "30"
          fromBackup: ""
          fsType: "ext4"
          dataLocality: "disabled"
          unmapMarkSnapChainRemoved: "ignored"
          disableRevisionCounter: "true"
          dataEngine: "v1"
          backupTargetName: "default"
        EOF
      register: storageclass_recreate

    - name: Verify backup target configuration
      shell: |
        KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get backuptargets.longhorn.io default -n longhorn-system
      register: backup_target_check
      failed_when: false

    - name: Display final deployment status
      debug:
        msg: |
          🎉 LONGHORN PRODUCTION DEPLOYMENT COMPLETE!
          
          ✅ Installation Status:
          {% if longhorn_manager_wait.rc == 0 %}
          - Longhorn manager pods: Ready
          {% else %}
          - Longhorn manager pods: {{ longhorn_manager_wait.stderr | default('Check failed') }}
          {% endif %}
          {% if longhorn_sc_check.rc == 0 %}
          - Storage class: Available
          {% endif %}
          {% if backup_target_check.rc == 0 %}
          - Backup target: Configured
          {% else %}
          - Backup target: {{ backup_target_check.stderr | default('Not yet ready') }}
          {% endif %}
          
          🔧 Configuration:
          - Replica count: {{ longhorn_replica_count }} (matches {{ groups[worker_group] | length }} worker nodes)
          - Backup target: nfs://{{ nfs_server_ip }}:{{ nfs_share_backup }}/shared
          - Cross-cluster backup sharing: Enabled
          
          💡 Next Steps:
          1. Verify backup target sync with test cluster backups
          2. Begin production data migration from NFS to Longhorn
          3. Test cross-cluster backup functionality