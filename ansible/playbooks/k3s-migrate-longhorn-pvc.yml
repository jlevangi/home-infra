---
- name: Fail-closed one-PVC Longhorn migration preflight and stop
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [preflight-stop]
  vars:
    migration_contract_helper: "{{ playbook_dir }}/../roles/k3s/files/restore-volume-contract.py"
    migration_kubectl: kubectl
    migration_max_backup_age_hours: 24
    migration_skip_confirmation: false
    migration_test_force_failure_after_stop: false
    argo_namespace: argocd
    longhorn_namespace: longhorn-system

  pre_tasks:
    - name: Validate explicit migration inputs
      ansible.builtin.assert:
        that:
          - target_env is defined
          - target_env in ['prod', 'stage', 'test']
          - restore_namespace is defined
          - restore_namespace is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
          - restore_pvc_name is defined
          - restore_pvc_name is match('^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$')
          - restore_child_app is defined
          - restore_child_app is match('^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$')
          - restore_root_app is defined
          - restore_root_app == 'root-' ~ target_env
          - migration_phase is defined
          - migration_phase in ['preflight-stop', 'cutover', 'rollback']
          - not (target_env == 'prod' and migration_skip_confirmation | bool)
        fail_msg: >-
          Refusing migration: exact environment, namespace, PVC, child/root Argo app,
          and migration_phase (preflight-stop|cutover|rollback) are mandatory;
          production confirmation cannot be skipped.

    - name: Require explicit operator confirmation
      ansible.builtin.pause:
        prompt: >-
          Type PREFLIGHT-STOP {{ target_env }}/{{ restore_namespace }}/{{ restore_pvc_name }}
          to pause reconciliation and stop consumers (no destructive cutover)
      register: migration_confirmation
      when: not migration_skip_confirmation | bool

    - name: Validate operator confirmation
      ansible.builtin.assert:
        that:
          - migration_skip_confirmation | bool or migration_confirmation.user_input == 'PREFLIGHT-STOP ' ~ target_env ~ '/' ~ restore_namespace ~ '/' ~ restore_pvc_name
        fail_msg: Migration confirmation did not exactly match.

  tasks:
    - name: Fetch exact PVC
      ansible.builtin.command:
        argv: ["{{ migration_kubectl }}", -n, "{{ restore_namespace }}", get, pvc, "{{ restore_pvc_name }}", -o, json]
      register: migration_pvc_raw
      changed_when: false

    - name: Parse and validate bound PVC
      ansible.builtin.set_fact:
        migration_pvc: "{{ migration_pvc_raw.stdout | from_json }}"
        migration_pv_name: "{{ (migration_pvc_raw.stdout | from_json).spec.volumeName | default('') }}"
    - ansible.builtin.assert:
        that:
          - migration_pvc.metadata.name == restore_pvc_name
          - migration_pvc.metadata.namespace == restore_namespace
          - migration_pvc.status.phase == 'Bound'
          - migration_pv_name | length > 0
        fail_msg: Exact PVC is not coherently Bound.

    - name: Fetch exact bound PV
      ansible.builtin.command:
        argv: ["{{ migration_kubectl }}", get, pv, "{{ migration_pv_name }}", -o, json]
      register: migration_pv_raw
      changed_when: false
    - name: Parse exact CSI handle
      ansible.builtin.set_fact:
        migration_pv: "{{ migration_pv_raw.stdout | from_json }}"
        migration_volume_name: "{{ (migration_pv_raw.stdout | from_json).spec.csi.volumeHandle | default('') }}"
    - ansible.builtin.assert:
        that:
          - migration_pv.metadata.name == migration_pv_name
          - migration_pv.spec.claimRef.namespace == restore_namespace
          - migration_pv.spec.claimRef.name == restore_pvc_name
          - migration_pv.spec.csi.driver == 'driver.longhorn.io'
          - migration_volume_name | length > 0

    - name: Fetch exact CSI Longhorn Volume
      ansible.builtin.command:
        argv: ["{{ migration_kubectl }}", -n, "{{ longhorn_namespace }}", get, volumes.longhorn.io, "{{ migration_volume_name }}", -o, json]
      register: migration_volume_raw
      changed_when: false

    - name: Capture coherent storage contract
      ansible.builtin.shell:
        cmd: >-
          printf '%s' {{ {'pvc': migration_pvc_raw.stdout | from_json, 'pv': migration_pv_raw.stdout | from_json,
          'volume': migration_volume_raw.stdout | from_json} | to_json | quote }} |
          python3 {{ migration_contract_helper | quote }} capture-contract
      args:
        executable: /bin/bash
      register: migration_contract_raw
      changed_when: false
    - name: Parse storage contract
      ansible.builtin.set_fact:
        migration_contract: "{{ migration_contract_raw.stdout | from_json }}"

    - name: Fetch selected completed Backup
      ansible.builtin.command:
        argv: ["{{ migration_kubectl }}", -n, "{{ longhorn_namespace }}", get, backups.longhorn.io, "{{ restore_backup_name }}", -o, json]
      register: migration_backup_raw
      changed_when: false
    - name: Validate selected Backup identity, state, URL, source, size, and freshness
      vars:
        selected: "{{ migration_backup_raw.stdout | from_json }}"
        source_size: "{{ (migration_volume_raw.stdout | from_json).spec.size | int }}"
        backup_time: "{{ selected.status.backupCreatedAt | default(selected.metadata.creationTimestamp) | to_datetime('%Y-%m-%dT%H:%M:%SZ') }}"
        cutoff: "{{ ('%Y-%m-%dT%H:%M:%SZ' | strftime((ansible_date_time.epoch | default(lookup('pipe', 'date +%s'))) | int - migration_max_backup_age_hours * 3600)) | to_datetime('%Y-%m-%dT%H:%M:%SZ') }}"
      ansible.builtin.assert:
        that:
          - restore_backup_name is defined
          - selected.metadata.name == restore_backup_name
          - selected.status.state == 'Completed'
          - selected.status.volumeName == migration_volume_name
          - selected.status.url | default('') | length > 0
          - selected.status.volumeSize | default(0) | int == source_size
          - backup_time >= cutoff
        fail_msg: Selected backup is not fresh, Completed, exact-source, URL-bearing, and full-size.

    - name: Validate selected Backup URL exact query identities
      ansible.builtin.shell:
        cmd: >-
          printf '%s' {{ {'url': (migration_backup_raw.stdout | from_json).status.url} | to_json | quote }} |
          python3 {{ migration_contract_helper | quote }} verify-backup-url
          --backup-id {{ restore_backup_name | quote }} --volume {{ migration_volume_name | quote }}
      args: {executable: /bin/bash}
      changed_when: false

    - name: Fetch BackupVolume list
      ansible.builtin.command:
        argv: ["{{ migration_kubectl }}", -n, "{{ longhorn_namespace }}", get, backupvolumes.longhorn.io, -o, json]
      register: migration_backup_volumes_raw
      changed_when: false
    - name: Resolve exactly one BackupVolume through approved contract helper
      ansible.builtin.shell:
        cmd: >-
          printf '%s' {{ migration_backup_volumes_raw.stdout | quote }} |
          python3 {{ migration_contract_helper | quote }} backup-volume
          --source-volume {{ migration_volume_name | quote }} --backup-id {{ restore_backup_name | quote }}
      args: {executable: /bin/bash}
      register: migration_backup_volume_raw
      changed_when: false

    - name: Fetch all Argo Applications
      ansible.builtin.command:
        argv: ["{{ migration_kubectl }}", -n, "{{ argo_namespace }}", get, applications.argoproj.io, -o, json]
      register: migration_apps_raw
      changed_when: false
    - name: Resolve Argo applications through approved contract helper
      ansible.builtin.shell:
        cmd: >-
          printf '%s' {{ migration_apps_raw.stdout | quote }} |
          python3 {{ migration_contract_helper | quote }} argo-apps
          --root-app {{ restore_root_app | quote }} --target-namespace {{ restore_namespace | quote }}
      args: {executable: /bin/bash}
      register: migration_apps_contract_raw
      changed_when: false
    - name: Validate exact root and one exact child with no active operation
      vars:
        apps_contract: "{{ migration_apps_contract_raw.stdout | from_json }}"
        apps_by_name: "{{ dict(apps_contract.applications | map(attribute='metadata.name') | zip(apps_contract.applications)) }}"
      ansible.builtin.assert:
        that:
          - apps_contract.pauseOrder == [restore_root_app, restore_child_app]
          - apps_by_name[restore_root_app].operation | default(None) == None
          - apps_by_name[restore_child_app].operation | default(None) == None
          - apps_by_name[restore_root_app].status.operationState.phase | default('Succeeded') not in ['Running', 'Terminating']
          - apps_by_name[restore_child_app].status.operationState.phase | default('Succeeded') not in ['Running', 'Terminating']
        fail_msg: Exact root/child Argo identities or idle-operation gate failed.

    - name: Fetch workload resources in exact namespace
      ansible.builtin.command:
        argv: ["{{ migration_kubectl }}", -n, "{{ restore_namespace }}", get, "deployment,statefulset,daemonset,job,cronjob,pod,replicaset", -o, json]
      register: migration_workloads_raw
      changed_when: false
    - name: Resolve PVC consumers through approved contract helper
      ansible.builtin.shell:
        cmd: >-
          printf '%s' {{ migration_workloads_raw.stdout | quote }} |
          python3 {{ migration_contract_helper | quote }} workloads
          --namespace {{ restore_namespace | quote }} --pvc {{ restore_pvc_name | quote }}
      args: {executable: /bin/bash}
      register: migration_workloads_contract_raw
      changed_when: false
    - name: Parse consumers and reject unsafe kinds before mutation
      ansible.builtin.set_fact:
        migration_workloads: "{{ migration_workloads_contract_raw.stdout | from_json }}"
    - ansible.builtin.assert:
        that:
          - migration_workloads.daemonSets | length == 0
          - migration_workloads.jobs | length == 0
          - migration_workloads.pods | rejectattr('ownershipProven', 'equalto', true) | list | length == 0
        fail_msg: DaemonSet, Job, or unproven Pod owner chain consumes the target PVC.

    - name: Set timestamped recovery-state path
      ansible.builtin.set_fact:
        migration_state_dir: "/var/tmp/longhorn-migration/{{ restore_namespace }}-{{ restore_pvc_name }}"
        migration_state_file: "/var/tmp/longhorn-migration/{{ restore_namespace }}-{{ restore_pvc_name }}/state-{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}.json"
    - name: Create local recovery-state directory
      ansible.builtin.file:
        path: "{{ migration_state_dir }}"
        state: directory
        mode: '0700'
    - name: Persist exact original policies, replicas, and evidence before stopping
      ansible.builtin.copy:
        dest: "{{ migration_state_file }}"
        mode: '0600'
        content: >-
          {{ {'createdAt': lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ'), 'targetEnv': target_env,
          'source': migration_contract.source, 'storageContract': migration_contract,
          'selectedBackup': migration_backup_raw.stdout | from_json,
          'backupVolume': migration_backup_volume_raw.stdout | from_json,
          'applications': (migration_apps_contract_raw.stdout | from_json).applications,
          'controllerReplicas': migration_workloads.scalableControllers,
          'cronJobs': migration_workloads.cronJobs} | to_nice_json }}

    - name: Pause reconciliation and stop exact consumers
      block:
        - name: Pause root Argo automated sync first
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ argo_namespace }}", patch, application, "{{ restore_root_app }}", --type=json, -p, '[{"op":"remove","path":"/spec/syncPolicy/automated"}]']
        - name: Verify root automated sync absent
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ argo_namespace }}", get, application, "{{ restore_root_app }}", -o, 'jsonpath={.spec.syncPolicy.automated}']
          register: migration_root_automated
          changed_when: false
        - ansible.builtin.assert: {that: "migration_root_automated.stdout == ''"}
        - name: Wait after root pause
          ansible.builtin.pause: {seconds: 5}
        - name: Pause exact child Argo automated sync
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ argo_namespace }}", patch, application, "{{ restore_child_app }}", --type=json, -p, '[{"op":"remove","path":"/spec/syncPolicy/automated"}]']
        - name: Verify child automated sync absent
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ argo_namespace }}", get, application, "{{ restore_child_app }}", -o, 'jsonpath={.spec.syncPolicy.automated}']
          register: migration_child_automated
          changed_when: false
        - ansible.builtin.assert: {that: "migration_child_automated.stdout == ''"}
        - name: Wait after child pause
          ansible.builtin.pause: {seconds: 5}
        - name: Suspend matching CronJobs
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ restore_namespace }}", patch, cronjob, "{{ item.name }}", --type=merge, -p, '{"spec":{"suspend":true}}']
          loop: "{{ migration_workloads.cronJobs }}"
        - name: Scale matching controllers to zero
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ restore_namespace }}", scale, "{{ item.kind | lower }}/{{ item.name }}", --replicas=0]
          loop: "{{ migration_workloads.scalableControllers }}"
        - name: Intentional forced-failure test gate
          ansible.builtin.assert:
            that: not migration_test_force_failure_after_stop | bool
            fail_msg: Forced failure after pause/scale for fail-closed test.
        - name: Wait for each controller to reach zero replicas
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ restore_namespace }}", get, "{{ item.kind | lower }}", "{{ item.name }}", -o, 'jsonpath={.status.replicas} {.status.readyReplicas} {.status.availableReplicas}']
          loop: "{{ migration_workloads.scalableControllers }}"
          register: migration_zero_controller_checks
          until: >-
            migration_zero_controller_checks.stdout.split()
            | map('int') | select('ne', 0) | list | length == 0
          retries: 60
          delay: 5
          changed_when: false
        - name: Fetch first clean workload observation including ReplicaSets
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ restore_namespace }}", get, "deployment,statefulset,daemonset,job,cronjob,pod,replicaset", -o, json]
          register: migration_stopped_workloads_raw_1
          changed_when: false
        - name: Resolve first clean workload observation
          ansible.builtin.shell:
            cmd: >-
              printf '%s' {{ migration_stopped_workloads_raw_1.stdout | quote }} |
              python3 {{ migration_contract_helper | quote }} workloads
              --namespace {{ restore_namespace | quote }} --pvc {{ restore_pvc_name | quote }}
          args: {executable: /bin/bash}
          register: migration_stopped_contract_raw_1
          changed_when: false
        - name: Verify first clean workload observation
          vars:
            stopped: "{{ migration_stopped_contract_raw_1.stdout | from_json }}"
            selected_crons: "{{ migration_workloads.cronJobs | map(attribute='name') | sort | list }}"
          ansible.builtin.assert:
            that:
              - stopped.cronJobs | map(attribute='name') | sort | list == selected_crons
              - stopped.cronJobs | rejectattr('suspendPresent', 'equalto', true) | list | length == 0
              - stopped.cronJobs | rejectattr('suspend', 'equalto', true) | list | length == 0
              - stopped.daemonSets | length == 0
              - stopped.jobs | length == 0
              - stopped.pods | rejectattr('ownershipProven', 'equalto', true) | list | length == 0
              - stopped.pods | length == 0
            fail_msg: First post-stop workload observation was not clean.
        - name: Wait between clean workload observations
          ansible.builtin.pause: {seconds: 10}
        - name: Fetch second clean workload observation including ReplicaSets
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ restore_namespace }}", get, "deployment,statefulset,daemonset,job,cronjob,pod,replicaset", -o, json]
          register: migration_stopped_workloads_raw_2
          changed_when: false
        - name: Resolve second clean workload observation
          ansible.builtin.shell:
            cmd: >-
              printf '%s' {{ migration_stopped_workloads_raw_2.stdout | quote }} |
              python3 {{ migration_contract_helper | quote }} workloads
              --namespace {{ restore_namespace | quote }} --pvc {{ restore_pvc_name | quote }}
          args: {executable: /bin/bash}
          register: migration_stopped_contract_raw_2
          changed_when: false
        - name: Verify second clean workload observation
          vars:
            stopped: "{{ migration_stopped_contract_raw_2.stdout | from_json }}"
            selected_crons: "{{ migration_workloads.cronJobs | map(attribute='name') | sort | list }}"
          ansible.builtin.assert:
            that:
              - stopped.cronJobs | map(attribute='name') | sort | list == selected_crons
              - stopped.cronJobs | rejectattr('suspendPresent', 'equalto', true) | list | length == 0
              - stopped.cronJobs | rejectattr('suspend', 'equalto', true) | list | length == 0
              - stopped.daemonSets | length == 0
              - stopped.jobs | length == 0
              - stopped.pods | rejectattr('ownershipProven', 'equalto', true) | list | length == 0
              - stopped.pods | length == 0
            fail_msg: Second post-stop workload observation was not clean.
        - name: Fetch source Longhorn Volume after stop
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ longhorn_namespace }}", get, volumes.longhorn.io, "{{ migration_volume_name }}", -o, json]
          register: migration_detached_volume_raw
          changed_when: false
        - name: Fetch VolumeAttachments
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", get, volumeattachments.storage.k8s.io, -o, json]
          register: migration_attachments_raw
          changed_when: false
        - name: Verify source detached and no exact VolumeAttachment
          vars:
            stopped_volume: "{{ migration_detached_volume_raw.stdout | from_json }}"
            attachments: "{{ (migration_attachments_raw.stdout | from_json).items }}"
          ansible.builtin.assert:
            that:
              - stopped_volume.metadata.name == migration_volume_name
              - stopped_volume.status.state == 'detached'
              - attachments | selectattr('spec.source.persistentVolumeName', 'defined') | selectattr('spec.source.persistentVolumeName', 'equalto', migration_pv_name) | list | length == 0
            fail_msg: Source volume is not detached or an exact VolumeAttachment remains.
      rescue:
        - name: Print exact manual recovery state path
          ansible.builtin.debug:
            msg: >-
              FAIL-CLOSED: Argo and workloads remain stopped. No automatic resume was attempted.
              Recover only from exact state file {{ migration_state_file }}.
        - name: Fail migration preflight after stop
          ansible.builtin.fail:
            msg: "Migration stop failed; recovery state: {{ migration_state_file }}"

    - name: Stop before destructive cutover
      ansible.builtin.debug:
        msg: >-
          PREFLIGHT-STOP SUCCEEDED. Destructive cutover is NOT AUTHORIZED.
          No PVC, PV, Longhorn Volume, finalizer, or restore object was mutated or created.
          Exact recovery state: {{ migration_state_file }}

# ============================================================
# CUTOVER PLAY — destructive restore into target identities
# Run with: --tags cutover -e migration_phase=cutover
# ============================================================
- name: Fail-closed one-PVC Longhorn migration cutover
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [cutover]
  vars:
    migration_contract_helper: "{{ playbook_dir }}/../roles/k3s/files/restore-volume-contract.py"
    migration_kubectl: kubectl
    migration_skip_confirmation: false
    migration_test_force_failure_after_delete: false
    migration_test_force_failure_after_restore: false
    migration_test_force_failure_after_integrity: false
    argo_namespace: argocd
    longhorn_namespace: longhorn-system
    migration_target_pv: "{{ restore_pvc_name }}-migrated"
    migration_target_volume: "lh-{{ restore_pvc_name | regex_replace('^pvc-', '') }}-migrated"
    migration_target_storage_class: longhorn-one-replica-tank
    migration_target_disk_selector: tank
    migration_target_replicas: 1
    migration_state_file: ''
    migration_integrity_command: ''
    migration_post_cutover_backup_timeout: 600

  pre_tasks:
    - name: Validate cutover inputs
      ansible.builtin.assert:
        that:
          - target_env is defined
          - restore_namespace is defined
          - restore_pvc_name is defined
          - restore_child_app is defined
          - restore_root_app is defined
          - restore_root_app == 'root-' ~ target_env
          - migration_state_file | length > 0
          - migration_integrity_command | length > 0
          - migration_target_storage_class in ['longhorn-one-replica-flash', 'longhorn-one-replica-tank']
          - migration_target_replicas | int == 1
        fail_msg: >-
          Cutover requires exact env, namespace, PVC, child/root app, state file path,
          integrity command, one-replica target class, and target_replicas=1.

  tasks:
    - name: Load recovery state file
      ansible.builtin.command:
        argv: [cat, "{{ migration_state_file }}"]
      register: migration_loaded_state_raw
      changed_when: false
    - name: Parse recovery state
      ansible.builtin.set_fact:
        migration_state: "{{ migration_loaded_state_raw.stdout | from_json }}"

    - name: Extract source identities from state
      ansible.builtin.set_fact:
        migration_state_source: "{{ (migration_loaded_state_raw.stdout | from_json).source }}"
        migration_state_contract: "{{ (migration_loaded_state_raw.stdout | from_json).storageContract }}"
        migration_state_backup: "{{ (migration_loaded_state_raw.stdout | from_json).selectedBackup }}"
        migration_state_backup_volume: "{{ (migration_loaded_state_raw.stdout | from_json).backupVolume }}"

    - name: Verify state source matches this migration's PVC identity
      ansible.builtin.assert:
        that:
          - migration_state_source.pvcName is defined
          - migration_state_source.pvcNamespace == restore_namespace
          - migration_state_source.longhornVolumeName | length > 0
        fail_msg: State file source identity does not match this migration's PVC namespace.

    - name: Require explicit cutover confirmation
      ansible.builtin.pause:
        prompt: >-
          Type CUTOVER {{ target_env }}/{{ restore_namespace }}/{{ restore_pvc_name }}
          to delete source PVC and restore into target identities.
          Source PV and Longhorn Volume will be preserved under Retain.
      register: migration_cutover_confirmation
      when: not migration_skip_confirmation | bool
    - name: Validate cutover confirmation
      ansible.builtin.assert:
        that:
          - migration_skip_confirmation | bool or migration_cutover_confirmation.user_input == 'CUTOVER ' ~ target_env ~ '/' ~ restore_namespace ~ '/' ~ restore_pvc_name
        fail_msg: Cutover confirmation did not exactly match.

    - name: Generate migration target resources from state contract
      ansible.builtin.shell:
        cmd: >-
          printf '%s' {{ {'state': migration_state} | to_json | quote }} |
          python3 {{ migration_contract_helper | quote }} migration-resources
          --target-pv {{ migration_target_pv | quote }}
          --target-volume {{ migration_target_volume | quote }}
          --target-storage-class {{ migration_target_storage_class | quote }}
          --target-disk-selector {{ migration_target_disk_selector | quote }}
          --target-replicas {{ migration_target_replicas | int }}
      args: {executable: /bin/bash}
      register: migration_resources_raw
      changed_when: false
    - name: Parse migration target resources
      ansible.builtin.set_fact:
        migration_target_resources: "{{ migration_resources_raw.stdout | from_json }}"

    - block: &cutover_destructive
        - name: Fetch source PV to verify Retain
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", get, pv, "{{ migration_state_source.pvName }}", -o, 'jsonpath={.spec.persistentVolumeReclaimPolicy}']
          register: migration_source_reclaim
          changed_when: false
        - name: Verify source PV is Retain
          ansible.builtin.assert:
            that: migration_source_reclaim.stdout == 'Retain'
            fail_msg: Source PV is not Retain — patch it before deleting PVC or data will be lost.

        - name: Delete source PVC
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ restore_namespace }}", delete, pvc, "{{ restore_pvc_name }}", "--wait=true"]

        - name: Verify source PVC is gone
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ restore_namespace }}", get, pvc, "{{ restore_pvc_name }}", -o, json]
          register: migration_pvc_deleted_check
          failed_when: migration_pvc_deleted_check.rc == 0
          changed_when: false
        - name: Verify source PV survived under Retain
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", get, pv, "{{ migration_state_source.pvName }}", -o, 'jsonpath={.spec.persistentVolumeReclaimPolicy}']
          register: migration_pv_survived
          changed_when: false
        - ansible.builtin.assert:
            that: migration_pv_survived.stdout == 'Retain'
            fail_msg: Source PV changed reclaim policy after PVC deletion.

        - name: Forced-failure test gate after delete
          ansible.builtin.assert:
            that: not migration_test_force_failure_after_delete | bool
            fail_msg: Forced failure after PVC deletion for fail-closed test.

        - name: Create target Longhorn Volume from backup
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", apply, -f, -]
            stdin: "{{ migration_target_resources.volume | to_nice_json }}"
          register: migration_volume_create
        - name: Wait for target Longhorn Volume to be detached and ready
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ longhorn_namespace }}", get, volumes.longhorn.io, "{{ migration_target_volume }}", -o, json]
          register: migration_target_volume_status
          until: (migration_target_volume_status.stdout | from_json).status.state == 'detached'
          retries: 60
          delay: 5
          changed_when: false

        - name: Create target PV with Retain
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", apply, -f, -]
            stdin: "{{ migration_target_resources.pv | to_nice_json }}"
          register: migration_pv_create

        - name: Create target PVC bound to target PV
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", apply, -f, -]
            stdin: "{{ migration_target_resources.pvc | to_nice_json }}"
          register: migration_pvc_create

        - name: Wait for target PVC to be Bound
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ restore_namespace }}", get, pvc, "{{ restore_pvc_name }}", -o, json]
          register: migration_target_pvc_wait
          until: (migration_target_pvc_wait.stdout | from_json).status.phase == 'Bound'
          retries: 60
          delay: 5
          changed_when: false

        - name: Fetch target binding for verification
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ restore_namespace }}", get, pvc, "{{ restore_pvc_name }}", -o, json]
          register: migration_target_pvc_raw
          changed_when: false
        - name: Fetch target PV for verification
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", get, pv, "{{ migration_target_pv }}", -o, json]
          register: migration_target_pv_raw
          changed_when: false
        - name: Fetch target Longhorn Volume for verification
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ longhorn_namespace }}", get, volumes.longhorn.io, "{{ migration_target_volume }}", -o, json]
          register: migration_target_volume_raw
          changed_when: false
        - name: Verify target binding through contract helper
          ansible.builtin.shell:
            cmd: >-
              printf '%s' {{ {'pvc': migration_target_pvc_raw.stdout | from_json,
              'pv': migration_target_pv_raw.stdout | from_json,
              'volume': migration_target_volume_raw.stdout | from_json} | to_json | quote }} |
              python3 {{ migration_contract_helper | quote }} verify-target-binding
              --namespace {{ restore_namespace | quote }}
              --pvc {{ restore_pvc_name | quote }}
              --pv {{ migration_target_pv | quote }}
              --volume {{ migration_target_volume | quote }}
              --replicas {{ migration_target_replicas | int }}
              --disk-selector {{ migration_target_disk_selector | quote }}
              --backup-volume {{ migration_state_backup_volume.metadata.name | quote }}
          args: {executable: /bin/bash}
          changed_when: false

        - name: Forced-failure test gate after restore
          ansible.builtin.assert:
            that: not migration_test_force_failure_after_restore | bool
            fail_msg: Forced failure after restore for fail-closed test.
      rescue:
        - name: Print cutover failure recovery state
          ansible.builtin.debug:
            msg: >-
              FAIL-CLOSED: Cutover failed. Workloads remain at zero and Argo remains paused.
              Source PV and Longhorn Volume are preserved under Retain.
              Recover from state file {{ migration_state_file }}.
        - name: Fail cutover
          ansible.builtin.fail:
            msg: "Cutover failed; recovery state: {{ migration_state_file }}"

    # --- Post-cutover validation and acceptance ---
    - block:
        - name: Resume child Argo to run workload
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ argo_namespace }}", patch, application, "{{ restore_child_app }}", --type=merge, -p, '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}']
        - name: Wait for child Argo to sync
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ argo_namespace }}", get, application, "{{ restore_child_app }}", -o, 'jsonpath={.status.sync.status}']
          register: migration_child_sync
          until: migration_child_sync.stdout == 'Synced'
          retries: 60
          delay: 5
          changed_when: false
        - name: Wait for workload pods to be ready
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ restore_namespace }}", get, pods, -o, json]
          register: migration_all_pods
          until: >-
            (migration_all_pods.stdout | from_json).items
            | map(attribute='status.phase')
            | select('equalto', 'Running')
            | list | length > 0
          retries: 60
          delay: 5
          changed_when: false

        - name: Run operator-provided integrity command
          ansible.builtin.shell:
            cmd: "{{ migration_integrity_command }}"
          args: {executable: /bin/bash}
          register: migration_integrity_result
          changed_when: false
        - name: Verify integrity command succeeded
          ansible.builtin.assert:
            that: migration_integrity_result.rc == 0
            fail_msg: >-
              Integrity command failed. Workload remains running on target.
              Do NOT resume root Argo until integrity is verified.

        - name: Forced-failure test gate after integrity
          ansible.builtin.assert:
            that: not migration_test_force_failure_after_integrity | bool
            fail_msg: Forced failure after integrity for fail-closed test.

        - name: Wait for post-cutover backup to be created
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ longhorn_namespace }}", get, backups.longhorn.io, -o, json]
          register: migration_post_backups_raw
          until: >-
            (migration_post_backups_raw.stdout | from_json).items
            | selectattr('spec.volumeName', 'defined')
            | selectattr('spec.volumeName', 'equalto', migration_target_volume)
            | map(attribute='status.state')
            | select('equalto', 'Completed')
            | list | length > 0
          retries: "{{ (migration_post_cutover_backup_timeout | int) // 5 }}"
          delay: 5
          changed_when: false
        - name: Verify exact post-cutover backup exists
          ansible.builtin.assert:
            that: >-
              (migration_post_backups_raw.stdout | from_json).items
              | selectattr('spec.volumeName', 'equalto', migration_target_volume)
              | selectattr('status.state', 'equalto', 'Completed')
              | list | length >= 1
            fail_msg: No completed post-cutover backup found for target volume.

        - name: Acceptance — resume root Argo
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ argo_namespace }}", patch, application, "{{ restore_root_app }}", --type=merge, -p, '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}']
        - name: Verify root Argo resumed
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ argo_namespace }}", get, application, "{{ restore_root_app }}", -o, 'jsonpath={.spec.syncPolicy.automated}']
          register: migration_root_resumed
          changed_when: false
        - ansible.builtin.assert:
            that: migration_root_resumed.stdout != ''

        - name: Cutover complete
          ansible.builtin.debug:
            msg: >-
              CUTOVER SUCCEEDED. PVC {{ restore_pvc_name }} now uses target Volume
              {{ migration_target_volume }} on {{ migration_target_storage_class }}.
              Source PV {{ migration_state_source.pvName }} and Volume
              {{ migration_state_source.longhornVolumeName }} are preserved under Retain for rollback.
              Post-cutover backup verified. Root and child Argo resumed.
      rescue:
        - name: Print post-cutover failure recovery state
          ansible.builtin.debug:
            msg: >-
              FAIL-CLOSED: Post-cutover validation failed. Workload may be running
              on target data. Root Argo is NOT resumed. Investigate integrity
              and backup before resuming root. State file: {{ migration_state_file }}
        - name: Fail post-cutover validation
          ansible.builtin.fail:
            msg: "Post-cutover validation failed; recovery state: {{ migration_state_file }}"

# ============================================================
# ROLLBACK PLAY — restore source PVC from preserved PV
# Run with: --tags rollback -e migration_phase=rollback
# ============================================================
- name: Fail-closed one-PVC Longhorn migration rollback
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [rollback]
  vars:
    migration_contract_helper: "{{ playbook_dir }}/../roles/k3s/files/restore-volume-contract.py"
    migration_kubectl: kubectl
    migration_skip_confirmation: false
    argo_namespace: argocd
    longhorn_namespace: longhorn-system
    migration_state_file: ''

  pre_tasks:
    - name: Validate rollback inputs
      ansible.builtin.assert:
        that:
          - target_env is defined
          - restore_namespace is defined
          - restore_pvc_name is defined
          - restore_child_app is defined
          - restore_root_app is defined
          - restore_root_app == 'root-' ~ target_env
          - migration_state_file | length > 0
        fail_msg: Rollback requires exact env, namespace, PVC, child/root app, and state file path.

  tasks:
    - name: Load recovery state file
      ansible.builtin.command:
        argv: [cat, "{{ migration_state_file }}"]
      register: migration_loaded_state_raw
      changed_when: false
    - name: Parse recovery state
      ansible.builtin.set_fact:
        migration_state: "{{ migration_loaded_state_raw.stdout | from_json }}"

    - name: Require explicit rollback confirmation
      ansible.builtin.pause:
        prompt: >-
          Type ROLLBACK {{ target_env }}/{{ restore_namespace }}/{{ restore_pvc_name }}
          to delete target PVC and recreate source PVC from preserved source PV.
      register: migration_rollback_confirmation
      when: not migration_skip_confirmation | bool
    - name: Validate rollback confirmation
      ansible.builtin.assert:
        that:
          - migration_skip_confirmation | bool or migration_rollback_confirmation.user_input == 'ROLLBACK ' ~ target_env ~ '/' ~ restore_namespace ~ '/' ~ restore_pvc_name
        fail_msg: Rollback confirmation did not exactly match.

    - block:
        - name: Verify source PV still exists under Retain
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", get, pv, "{{ migration_state.source.pvName }}", -o, 'jsonpath={.spec.persistentVolumeReclaimPolicy}']
          register: migration_rollback_pv_check
          changed_when: false
        - ansible.builtin.assert:
            that: migration_rollback_pv_check.stdout == 'Retain'
            fail_msg: Source PV is not Retain — rollback source may be lost.

        - name: Delete target PVC if it exists
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ restore_namespace }}", delete, pvc, "{{ restore_pvc_name }}", "--ignore-not-found=true", "--wait=true"]

        - name: Recreate source PVC bound to source PV
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", apply, -f, -]
            stdin: "{{ migration_state.storageContract.replaySafeContracts.pvc | combine({'spec': {'volumeName': migration_state.source.pvName}}) | to_nice_json }}"
          register: migration_rollback_pvc_create

        - name: Wait for source PVC to be Bound
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ restore_namespace }}", get, pvc, "{{ restore_pvc_name }}", -o, json]
          register: migration_rollback_pvc_wait
          until: (migration_rollback_pvc_wait.stdout | from_json).status.phase == 'Bound'
          retries: 60
          delay: 5
          changed_when: false

        - name: Resume child Argo
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ argo_namespace }}", patch, application, "{{ restore_child_app }}", --type=merge, -p, '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}']
        - name: Resume root Argo
          ansible.builtin.command:
            argv: ["{{ migration_kubectl }}", -n, "{{ argo_namespace }}", patch, application, "{{ restore_root_app }}", --type=merge, -p, '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}']

        - name: Rollback complete
          ansible.builtin.debug:
            msg: >-
              ROLLBACK SUCCEEDED. PVC {{ restore_pvc_name }} is rebound to source
              PV {{ migration_state.source.pvName }} and Longhorn Volume
              {{ migration_state.source.longhornVolumeName }}.
              Argo resumed. Target identities remain for separate cleanup.
      rescue:
        - name: Print rollback failure
          ansible.builtin.debug:
            msg: >-
              FAIL-CLOSED: Rollback failed. Investigate manually.
              State file: {{ migration_state_file }}
        - name: Fail rollback
          ansible.builtin.fail:
            msg: "Rollback failed; recovery state: {{ migration_state_file }}"
