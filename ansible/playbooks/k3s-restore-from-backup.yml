---
# =============================================================================
# K3s Cluster Restore from Longhorn Backup
# =============================================================================
# Discovers the latest Longhorn backup per (namespace, pvcName) and restores it
# without a static mapping. By default it uses Longhorn BackupVolume / Backup
# CRs for fast discovery, with an explicit NFS scan fallback mode retained for
# recovery edge cases.
#
# Use Cases:
#   1. Disaster Recovery: Rebuild prod cluster and restore all data
#   2. Stage Testing: Clone prod data to stage for testing changes
#   3. Single PVC / namespace restore: Restore a specific volume or namespace
#
# Usage:
#   # List discovered backups from Longhorn CR metadata
#   ansible-playbook k3s-restore-from-backup.yml \
#     -e "restore_action=list target_env=prod"
#
#   # Force the slower NFS scan path
#   ansible-playbook k3s-restore-from-backup.yml \
#     -e "restore_action=list target_env=prod discovery_mode=nfs-scan"
#
#   # Restore everything to stage from prod's latest backups
#   ansible-playbook k3s-restore-from-backup.yml \
#     -e "restore_action=restore target_env=stage"
#
#   # Restore a single PVC
#   ansible-playbook k3s-restore-from-backup.yml \
#     -e "restore_action=restore target_env=stage restore_pvc_only=bookstack-app-data-pvc"
#
#   # Restore everything in one namespace
#   ansible-playbook k3s-restore-from-backup.yml \
#     -e "restore_action=restore target_env=stage restore_namespace_only=bookstack"
#
#   # Restore everything except a few stale PVCs
#   ansible-playbook k3s-restore-from-backup.yml \
#     -e 'restore_action=restore target_env=prod restore_pvc_skip=["homepage-config","plex-config-pvc"]'
#
#   # Disaster recovery: restore prod from its own backups
#   ansible-playbook k3s-restore-from-backup.yml \
#     -e "restore_action=restore target_env=prod"
# =============================================================================

- name: K3s Cluster Restore from Longhorn Backup
  hosts: "{{ 'k3s_cluster_' + target_env + '_master' }}"
  become: yes
  gather_facts: yes

  vars:
    restore_action: "list"

    # Source environment for backups (prod is always the source of truth).
    # Used to filter discovery to volume.cfgs labeled with this cluster name.
    source_env: "prod"

    # Target environment to restore to.
    target_env: "{{ cluster_environment | default('stage') }}"

    # Optional filters (empty/[] = no filter)
    restore_pvc_only: ""        # exact PVC name; only this one is restored
    restore_namespace_only: ""  # only restore PVCs in this namespace
    restore_pvc_skip: []        # PVC names to skip even if discovered

    kubeconfig: "/etc/rancher/k3s/k3s.yaml"
    longhorn_namespace: "longhorn-system"

    # Discovery defaults to Longhorn CR metadata for speed. When that returns
    # no backups, optionally fall back to the slower direct NFS scan.
    discovery_mode: "longhorn-cr"
    discovery_fallback_to_nfs: true

    # NFS backupstore (matches the Longhorn backup target on the cluster)
    nfs_server: "172.20.20.5"
    nfs_path: "/volume1/k3s-storage/longhorn/shared"
    nfs_mount_point: "/tmp/longhorn-restore-nfs"

  tasks:
    # =========================================================================
    # PREREQUISITES
    # =========================================================================
    - name: Validate required variables
      assert:
        that:
          - restore_action in ['list', 'restore']
          - target_env in ['prod', 'stage', 'test']
        fail_msg: "Invalid restore_action or environment specified"
      run_once: true

    - name: Display operation info
      debug:
        msg: |
          ====================================================
          Longhorn Backup {{ 'Listing' if restore_action == 'list' else 'Restore' }} Operation
          ====================================================
          Action: {{ restore_action }}
          Source Environment: {{ source_env }}
          Target Environment: {{ target_env }}
          Discovery Mode: {{ discovery_mode }}
          PVC filter: {{ restore_pvc_only | default('(all)', true) }}
          Namespace filter: {{ restore_namespace_only | default('(all)', true) }}
          Skip list: {{ restore_pvc_skip | default([]) | join(', ') | default('(none)', true) }}
          ====================================================
      run_once: true

    # =========================================================================
    # DISCOVER BACKUPS
    # =========================================================================
    - name: Validate discovery mode
      assert:
        that:
          - discovery_mode in ['longhorn-cr', 'nfs-scan']
        fail_msg: "discovery_mode must be one of: longhorn-cr, nfs-scan"
      run_once: true

    - name: Discover backups from Longhorn CR metadata
      when: discovery_mode == 'longhorn-cr'
      block:
        - name: Run Longhorn CR discovery script
          ansible.builtin.script: >
            {{ playbook_dir }}/../roles/k3s/files/discover-backups.py
            --mode longhorn-cr
            --kubeconfig {{ kubeconfig }}
            --longhorn-namespace {{ longhorn_namespace }}
            --cluster-filter {{ source_env }}
          register: discovery_longhorn_raw
          changed_when: false

        - name: Parse Longhorn CR discovery output
          ansible.builtin.set_fact:
            discovered_backups: "{{ discovery_longhorn_raw.stdout | from_json }}"
            discovery_source: "longhorn-cr"
      run_once: true

    - name: Fall back to NFS scan when Longhorn CR discovery returns no backups
      when:
        - discovery_mode == 'longhorn-cr'
        - discovery_fallback_to_nfs | bool
        - discovered_backups | default([]) | length == 0
      block:
        - name: Ensure NFS mount point exists
          ansible.builtin.file:
            path: "{{ nfs_mount_point }}"
            state: directory
            mode: '0755'

        - name: Mount NFS backupstore (read-only)
          ansible.posix.mount:
            path: "{{ nfs_mount_point }}"
            src: "{{ nfs_server }}:{{ nfs_path }}"
            fstype: nfs
            opts: ro
            state: ephemeral

        - name: Run NFS backup discovery script
          ansible.builtin.script: >
            {{ playbook_dir }}/../roles/k3s/files/discover-backups.py
            --mode nfs-scan
            {{ nfs_mount_point }}
            {{ nfs_server }}
            {{ nfs_path }}
            --cluster-filter {{ source_env }}
          register: discovery_nfs_raw
          changed_when: false

        - name: Parse NFS discovery output
          ansible.builtin.set_fact:
            discovered_backups: "{{ discovery_nfs_raw.stdout | from_json }}"
            discovery_source: "nfs-scan-fallback"
      always:
        - name: Unmount NFS backupstore after fallback discovery
          ansible.posix.mount:
            path: "{{ nfs_mount_point }}"
            state: unmounted
          failed_when: false
      run_once: true

    - name: Discover backups directly from NFS backupstore
      when: discovery_mode == 'nfs-scan'
      block:
        - name: Ensure NFS mount point exists
          ansible.builtin.file:
            path: "{{ nfs_mount_point }}"
            state: directory
            mode: '0755'

        - name: Mount NFS backupstore (read-only)
          ansible.posix.mount:
            path: "{{ nfs_mount_point }}"
            src: "{{ nfs_server }}:{{ nfs_path }}"
            fstype: nfs
            opts: ro
            state: ephemeral

        - name: Run NFS backup discovery script
          ansible.builtin.script: >
            {{ playbook_dir }}/../roles/k3s/files/discover-backups.py
            --mode nfs-scan
            {{ nfs_mount_point }}
            {{ nfs_server }}
            {{ nfs_path }}
            --cluster-filter {{ source_env }}
          register: discovery_nfs_raw
          changed_when: false

        - name: Parse NFS discovery output
          ansible.builtin.set_fact:
            discovered_backups: "{{ discovery_nfs_raw.stdout | from_json }}"
            discovery_source: "nfs-scan"
      always:
        - name: Unmount NFS backupstore after direct discovery
          ansible.posix.mount:
            path: "{{ nfs_mount_point }}"
            state: unmounted
          failed_when: false
      run_once: true

    # =========================================================================
    # APPLY FILTERS
    # =========================================================================
    - name: Drop PVCs in skip list
      ansible.builtin.set_fact:
        volumes_to_restore: "{{ discovered_backups | rejectattr('pvc_name', 'in', restore_pvc_skip) | list }}"
      run_once: true

    - name: Filter to single PVC if restore_pvc_only is set
      ansible.builtin.set_fact:
        volumes_to_restore: "{{ volumes_to_restore | selectattr('pvc_name', 'equalto', restore_pvc_only) | list }}"
      when: restore_pvc_only != ''
      run_once: true

    - name: Filter to single namespace if restore_namespace_only is set
      ansible.builtin.set_fact:
        volumes_to_restore: "{{ volumes_to_restore | selectattr('namespace', 'equalto', restore_namespace_only) | list }}"
      when:
        - restore_namespace_only != ''
        - restore_pvc_only == ''
      run_once: true

    # =========================================================================
    # LIST or RESTORE
    # =========================================================================
    - name: Display discovered backups
      debug:
        msg: |
          ====================================================
          Discovered Backups (from {{ source_env }} via {{ discovery_source | default(discovery_mode) }})
          ====================================================
          {% for vol in volumes_to_restore %}
          - {{ vol.namespace }}/{{ vol.pvc_name }}
              source volume: {{ vol.volume_name }}
              backup id: {{ vol.backup_id }}
              created: {{ vol.backup_created_at }}
              size: {{ (vol.size_bytes / 1024 / 1024) | round(1) }} MiB
          {% endfor %}
          ====================================================
          Total: {{ volumes_to_restore | length }} PVC(s)
      run_once: true

    - name: Confirm restore operation
      pause:
        prompt: |

          ⚠️  This will restore {{ volumes_to_restore | length }} PVC(s) into {{ target_env }}.

          Each PVC will be:
            1. Have any matching deployment scaled to 0
            2. Have any existing PVC + PV deleted
            3. Have a fresh Longhorn volume created from the backup URL (READ-ONLY on NFS)
            4. Have a new PV + PVC created bound to it
            5. Have its deployment scaled back up

          Press ENTER to continue or Ctrl+C to abort.
      when:
        - restore_action == 'restore'
        - volumes_to_restore | length > 0
        - not (skip_confirm | default(false) | bool)
      run_once: true

    - name: Restore each volume
      ansible.builtin.include_tasks: ../roles/k3s/tasks/restore-volume.yml
      vars:
        restore_namespace: "{{ restore_volume.namespace }}"
        restore_pvc_name: "{{ restore_volume.pvc_name }}"
        pvc_size: "{{ restore_volume.size_bytes }}"
        pvc_size_bytes: "{{ restore_volume.size_bytes }}"
      loop: "{{ volumes_to_restore }}"
      loop_control:
        loop_var: restore_volume
        label: "{{ restore_volume.namespace }}/{{ restore_volume.pvc_name }}"
      when:
        - restore_action == 'restore'
        - volumes_to_restore | length > 0
      run_once: true

    # =========================================================================
    # SUMMARY
    # =========================================================================
    - name: Display completion message
      debug:
        msg: |
          ====================================================
          {{ 'Backup Listing' if restore_action == 'list' else 'Restore Operation' }} Complete
          ====================================================
          {% if restore_action == 'restore' %}
          Restored {{ volumes_to_restore | length }} volume(s) from {{ source_env }} backups to {{ target_env }}.

          Next Steps:
            1. kubectl get pvc -A      (every restored PVC should be Bound)
            2. kubectl get volumes.longhorn.io -n longhorn-system
            3. Re-enable ArgoCD auto-sync if it was disabled before the restore
          {% endif %}
          ====================================================
      run_once: true
