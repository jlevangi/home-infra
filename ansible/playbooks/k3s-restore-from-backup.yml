---
# =============================================================================
# K3s Cluster Restore from Longhorn Backup
# =============================================================================
# This playbook restores Longhorn volumes from backups stored on NFS.
# It queries the source cluster's Longhorn API to get backup URLs, ensuring
# the restore operation is READ-ONLY on the backup storage.
#
# Use Cases:
#   1. Disaster Recovery: Rebuild prod cluster and restore all data
#   2. Stage Testing: Clone prod data to stage for testing changes
#   3. Single App Restore: Restore specific application volumes
#
# Usage:
#   # List available backups (queries prod cluster)
#   ansible-playbook k3s-restore-from-backup.yml -e "restore_action=list"
#
#   # Restore all apps to stage from prod backups
#   ansible-playbook k3s-restore-from-backup.yml -e "restore_action=restore target_env=stage"
#
#   # Restore specific app
#   ansible-playbook k3s-restore-from-backup.yml -e "restore_action=restore target_env=stage app=bookstack"
#
#   # Disaster recovery - restore prod from its own backups
#   ansible-playbook k3s-restore-from-backup.yml -e "restore_action=restore target_env=prod"
# =============================================================================

- name: K3s Cluster Restore from Longhorn Backup
  hosts: "{{ 'k3s_cluster_' + target_env + '_master' }}"
  become: yes
  gather_facts: yes

  vars:
    # Default restore_action: list, restore
    restore_action: "list"

    # Source environment for backups (prod is always the source of truth)
    source_env: "prod"

    # Target environment to restore to
    target_env: "{{ cluster_environment | default('stage') }}"

    # Specific app to restore (empty = all apps)
    app: ""

    # Kubeconfig paths
    kubeconfig: "/etc/rancher/k3s/k3s.yaml"
    source_kubeconfig: "/etc/rancher/k3s/k3s.yaml"

    # SSH to source cluster for backup info (when target != source)
    source_cluster_host: "k3s-prod-node-1"

    # Mapping from backup volume names to target PVC configurations
    # Key: pattern to match in backup volume name
    # Value: target PVC details
    backup_to_pvc_mapping:
      bookstack-app:
        pvc_name: "bookstack-app-data-pvc"
        namespace: "bookstack"
        size: "500Mi"
        size_bytes: 536870912
      bookstack-db:
        pvc_name: "bookstack-db-data-pvc"
        namespace: "bookstack"
        size: "1Gi"
        size_bytes: 1073741824
      homepage:
        pvc_name: "homepage-config"
        namespace: "homepage"
        size: "500Mi"
        size_bytes: 536870912
      vaultwarden:
        pvc_name: "vaultwarden-data-pvc"
        namespace: "vaultwarden"
        size: "500Mi"
        size_bytes: 536870912
      pocketid:
        pvc_name: "pocketid-data-pvc"
        namespace: "pocketid"
        size: "500Mi"
        size_bytes: 536870912
      traefik:
        pvc_name: "traefik"
        namespace: "traefik-system"
        size: "1Gi"
        size_bytes: 1073741824

  tasks:
    # =========================================================================
    # PREREQUISITES
    # =========================================================================
    - name: Validate required variables
      assert:
        that:
          - restore_action in ['list', 'restore']
          - target_env in ['prod', 'stage', 'test']
        fail_msg: "Invalid restore_action or environment specified"

    - name: Display operation info
      debug:
        msg: |
          ====================================================
          Longhorn Backup {{ 'Listing' if restore_action == 'list' else 'Restore' }} Operation
          ====================================================
          Action: {{ restore_action }}
          Source Environment: {{ source_env }} (always prod)
          Target Environment: {{ target_env }}
          Specific App: {{ app | default('ALL APPS', true) }}
          ====================================================

    # =========================================================================
    # GET BACKUP INFORMATION FROM SOURCE CLUSTER
    # =========================================================================
    - name: Get backup information from prod cluster
      block:
        - name: Query Longhorn backups from prod
          shell: |
            {% if target_env == 'prod' %}
            KUBECONFIG={{ kubeconfig }} kubectl get backups -n longhorn-system -o json
            {% else %}
            ssh {{ source_cluster_host }} "KUBECONFIG={{ source_kubeconfig }} kubectl get backups -n longhorn-system -o json"
            {% endif %}
          register: backups_json
          changed_when: false

        - name: Parse backup information
          set_fact:
            all_backups: "{{ backups_json.stdout | from_json }}"

        - name: Build backup list with latest per volume
          set_fact:
            backup_volumes: >-
              {{
                all_backups.items
                | map(attribute='status')
                | selectattr('volumeName', 'defined')
                | selectattr('url', 'defined')
                | list
                | groupby('volumeName')
                | map('last')
                | map('sort', attribute='backupCreatedAt', reverse=true)
                | map('first')
                | list
              }}

    # =========================================================================
    # LIST BACKUPS
    # =========================================================================
    - name: Display available backups
      debug:
        msg: |
          ====================================================
          Available Longhorn Backups (from {{ source_env }})
          ====================================================
          {% for backup in backup_volumes %}
          Volume: {{ backup.volumeName }}
            Latest Backup: {{ backup.backupName | default('unknown') }}
            Created: {{ backup.backupCreatedAt | default('unknown') }}
            Size: {{ ((backup.size | default('0') | int) / 1024 / 1024) | round(2) }} MB
            URL: {{ backup.url }}
          {% endfor %}
          ====================================================

          Total: {{ backup_volumes | length }} volumes with backups
      when: restore_action == 'list'

    # =========================================================================
    # RESTORE BACKUPS
    # =========================================================================
    - name: Restore from backups
      block:
        - name: Build restore list with PVC mappings
          set_fact:
            volumes_to_restore: []

        - name: Match backups to target PVCs
          set_fact:
            volumes_to_restore: >-
              {{
                volumes_to_restore + [{
                  'volume_name': item.volumeName,
                  'backup_id': item.backupName | default(item.url | regex_search('backup=([^&]+)', '\1') | first),
                  'backup_url': item.url,
                  'backup_time': item.backupCreatedAt,
                  'target_pvc': matched_pvc.pvc_name,
                  'target_namespace': matched_pvc.namespace,
                  'target_size': matched_pvc.size,
                  'target_size_bytes': matched_pvc.size_bytes
                }]
              }}
          loop: "{{ backup_volumes }}"
          vars:
            matched_pvc: >-
              {{
                backup_to_pvc_mapping | dict2items
                | selectattr('key', 'in', item.volumeName)
                | map(attribute='value')
                | first
                | default({'pvc_name': item.volumeName + '-pvc', 'namespace': 'default', 'size': '1Gi', 'size_bytes': 1073741824})
              }}
          when:
            - app == '' or app in item.volumeName
            - backup_to_pvc_mapping | dict2items | selectattr('key', 'in', item.volumeName) | list | length > 0

        - name: Display volumes to restore
          debug:
            msg: |
              ====================================================
              Volumes to Restore
              ====================================================
              {% for vol in volumes_to_restore %}
              - Source: {{ vol.volume_name }}
                Backup: {{ vol.backup_id }}
                Time: {{ vol.backup_time }}
                Target PVC: {{ vol.target_namespace }}/{{ vol.target_pvc }}
                Size: {{ vol.target_size }}
              {% endfor %}
              ====================================================

              Total: {{ volumes_to_restore | length }} volume(s) to restore

        - name: Confirm restore operation
          pause:
            prompt: |

              ⚠️  WARNING: This will restore {{ volumes_to_restore | length }} volume(s) to {{ target_env }}.

              This operation will:
              1. Scale down applications using these volumes
              2. Delete existing PVCs (existing data will be replaced!)
              3. Create new volumes from {{ source_env }} backups (READ-ONLY on backup storage)
              4. Create new PV/PVC bindings
              5. Scale applications back up

              Press ENTER to continue or Ctrl+C to abort
          when: volumes_to_restore | length > 0

        - name: Restore each volume
          include_tasks: ../roles/k3s/tasks/restore-volume.yml
          vars:
            restore_namespace: "{{ item.target_namespace }}"
            restore_pvc_name: "{{ item.target_pvc }}"
            pvc_size: "{{ item.target_size }}"
            pvc_size_bytes: "{{ item.target_size_bytes }}"
          loop: "{{ volumes_to_restore }}"
          loop_control:
            loop_var: restore_volume
            label: "{{ item.volume_name }} -> {{ item.target_namespace }}/{{ item.target_pvc }}"
          when: volumes_to_restore | length > 0

      when: restore_action == 'restore'

    # =========================================================================
    # SUMMARY
    # =========================================================================
    - name: Display completion message
      debug:
        msg: |
          ====================================================
          {{ 'Backup Listing' if restore_action == 'list' else 'Restore Operation' }} Complete
          ====================================================
          {% if restore_action == 'restore' %}
          Restored {{ volumes_to_restore | default([]) | length }} volume(s) from {{ source_env }} to {{ target_env }}

          Next Steps:
          1. Verify applications are running: kubectl get pods -A
          2. Check Longhorn UI for volume health
          3. Test application functionality

          Application URLs ({{ target_env }}):
          {% if target_env == 'prod' %}
            - https://bookstack.levangie.dev
            - https://vw.levangie.dev
            - https://homepage.levangie.dev
          {% elif target_env == 'stage' %}
            - https://bookstack.stage.levangie.dev
            - https://vw.stage.levangie.dev
            - https://homepage.stage.levangie.dev
          {% else %}
            - https://bookstack.test.levangie.dev
            - https://vw.test.levangie.dev
            - https://homepage.test.levangie.dev
          {% endif %}
          {% endif %}
          ====================================================
