---
# Unseal Vault, reconfigure Kubernetes auth, and recover External Secrets
#
# Handles the common scenario where a Vault pod restart leaves Vault sealed
# and the Kubernetes auth JWT stale, causing all ExternalSecrets to fail.
#
# Works for any cluster (K3s or Talos) — runs entirely from localhost via kubectl.
#
# Usage:
#   ansible-playbook ansible/playbooks/maintenance/vault-unseal.yml \
#     -e "kubectl_context=k3s-prod"
#
#   ansible-playbook ansible/playbooks/maintenance/vault-unseal.yml \
#     -e "kubectl_context=talos-test"
#
# What it does:
#   1. Checks Vault seal status
#   2. Unseals using keys from the vault-init Kubernetes secret
#   3. Reconfigures Vault Kubernetes auth (refreshes the SA token/CA cert)
#   4. Restarts external-secrets operator deployments
#   5. Verifies ClusterSecretStore and all ExternalSecrets recover

- name: Vault unseal and External Secrets recovery
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vault_context_overrides:
      k3s-prod:
        vault_namespace: "vault-raft"
        vault_statefulset_name: "vault-raft"
        vault_primary_pod_name: "vault-raft-0"
        vault_service_name: "vault-raft"
        vault_active_service_name: "vault-raft-active"
        vault_internal_service_name: "vault-raft-internal"
    vault_context_defaults: "{{ vault_context_overrides.get(kubectl_context | default(''), {}) }}"
    vault_namespace: "{{ vault_context_defaults.vault_namespace | default('vault') }}"
    vault_statefulset_name: "{{ vault_context_defaults.vault_statefulset_name | default(vault_service_name) }}"
    vault_primary_pod_name: "{{ vault_context_defaults.vault_primary_pod_name | default(vault_statefulset_name + '-0') }}"
    vault_service_name: "{{ vault_context_defaults.vault_service_name | default('vault') }}"
    vault_active_service_name: "{{ vault_context_defaults.vault_active_service_name | default('vault-active') }}"
    vault_internal_service_name: "{{ vault_context_defaults.vault_internal_service_name | default('vault-internal') }}"
    vault_init_secret_name: "vault-init"
    external_secrets_namespace: "external-secrets"
    # How long to wait for ExternalSecrets to resync after recovery
    es_recovery_retries: 18
    es_recovery_delay: 10

  pre_tasks:
    - name: Assert kubectl_context is provided
      ansible.builtin.assert:
        that:
          - kubectl_context is defined
          - kubectl_context | length > 0
        fail_msg: "kubectl_context is required (e.g. k3s-prod, talos-test)"

  tasks:
    # ── Discover Vault pods ───────────────────────────────────────────
    - name: Find Vault pods
      shell: >
        kubectl --context {{ kubectl_context }} get pods
        -n {{ vault_namespace }}
        -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | sed '/^$/d' | sort
      register: vault_pod_check
      failed_when: false
      changed_when: false

    - name: Abort if Vault is not deployed
      ansible.builtin.fail:
        msg: "No Vault pods found in namespace '{{ vault_namespace }}' on context '{{ kubectl_context }}'"
      when: vault_pod_check.rc != 0 or (vault_pod_check.stdout_lines | default([]) | length) == 0

    - name: Set Vault pod facts
      set_fact:
        vault_pods: "{{ vault_pod_check.stdout_lines | default([]) | map('trim') | reject('equalto', '') | list }}"

    - name: Derive primary and follower Vault pods
      set_fact:
        vault_primary_pod: "{{ vault_primary_pod_name if vault_primary_pod_name in vault_pods else vault_pods | first }}"
        vault_api_addr: "{{ 'http://' + vault_active_service_name + '.' + vault_namespace + '.svc:8200' if (vault_pods | length) > 1 else 'http://127.0.0.1:8200' }}"
        vault_follower_pods: "{{ vault_pods | reject('equalto', (vault_primary_pod_name if vault_primary_pod_name in vault_pods else vault_pods | first)) | list }}"

    - name: Wait for Vault pods to be Running
      shell: >
        kubectl --context {{ kubectl_context }} get pod {{ item }}
        -n {{ vault_namespace }} -o jsonpath='{.status.phase}'
      register: vault_phase
      retries: 30
      delay: 10
      until: vault_phase.stdout == "Running"
      changed_when: false
      loop: "{{ vault_pods }}"

    # ── Check seal status ─────────────────────────────────────────────
    - name: Get Vault status for every pod
      # After a cluster restart the pod can be Running for several seconds
      # before the Vault server inside is ready to answer; an empty stdout
      # then breaks the from_json filter in the next task. Retry until each
      # pod returns a parseable JSON document.
      shell: >
        kubectl --context {{ kubectl_context }} exec -n {{ vault_namespace }}
        {{ item }} -- vault status -format=json
      register: vault_status_checks
      failed_when: false
      changed_when: false
      retries: 30
      delay: 5
      until: (vault_status_checks.stdout | default('') | trim | length) > 0
      loop: "{{ vault_pods }}"

    - name: Parse Vault pod status
      set_fact:
        vault_pod_statuses: >-
          {{
            dict(
              vault_status_checks.results
              | map(attribute='item')
              | zip(vault_status_checks.results | map(attribute='stdout') | map('trim') | map('from_json'))
            )
          }}
      when:
        - vault_status_checks is defined
        - vault_status_checks.results | default([]) | length > 0

    - name: Derive Vault seal state
      set_fact:
        vault_initialized: "{{ vault_pod_statuses[vault_primary_pod].initialized | default(false) }}"
        vault_sealed_pods: "{{ vault_pod_statuses | dict2items | selectattr('value.sealed', 'equalto', true) | map(attribute='key') | list }}"
        vault_primary_sealed: "{{ vault_pod_statuses[vault_primary_pod].sealed | default(true) }}"
        vault_follower_sealed_pods: "{{ (vault_pod_statuses | dict2items | selectattr('value.sealed', 'equalto', true) | map(attribute='key') | list) | difference([vault_primary_pod]) }}"
        vault_any_pod_sealed: "{{ (vault_pod_statuses | dict2items | selectattr('value.sealed', 'equalto', true) | list | length) > 0 }}"
      when:
        - vault_pod_statuses is defined

    - name: Abort if Vault is not initialized
      ansible.builtin.fail:
        msg: "Vault is not initialized. Run the bootstrap playbook first."
      when: not (vault_initialized | default(false))

    - name: Report Vault already unsealed
      debug:
        msg: "Vault is already unsealed — skipping unseal, proceeding to auth refresh."
      when: not (vault_any_pod_sealed | default(true))

    # ── Read init secret once for root token and, when needed, keys ───
    - name: Read vault-init secret
      shell: >
        kubectl --context {{ kubectl_context }} get secret {{ vault_init_secret_name }}
        -n {{ vault_namespace }} -o json
      register: vault_init_secret_raw
      failed_when: false
      changed_when: false
      no_log: true

    - name: Fail if vault-init secret is unavailable
      ansible.builtin.fail:
        msg: "Vault init secret '{{ vault_init_secret_name }}' is missing in namespace '{{ vault_namespace }}'. Root token access is required for auth refresh and unseal recovery."
      when:
        - vault_init_secret_raw.rc != 0

    - name: Parse root token from init secret
      set_fact:
        vault_root_token: "{{ (vault_init_secret_raw.stdout | from_json).data['root-token'] | b64decode }}"
      when: vault_init_secret_raw.stdout | default('') | length > 0
      no_log: true

    - name: Parse unseal keys when any pod is sealed
      set_fact:
        vault_unseal_keys:
          - "{{ (vault_init_secret_raw.stdout | from_json).data['unseal-key-1'] | b64decode }}"
          - "{{ (vault_init_secret_raw.stdout | from_json).data['unseal-key-2'] | b64decode }}"
          - "{{ (vault_init_secret_raw.stdout | from_json).data['unseal-key-3'] | b64decode }}"
      no_log: true
      when:
        - vault_any_pod_sealed | default(false)
        - vault_init_secret_raw.stdout | default('') | length > 0

    - name: Unseal primary Vault pod when needed
      shell: >
        kubectl --context {{ kubectl_context }} exec -n {{ vault_namespace }}
        {{ vault_primary_pod }} -- vault operator unseal '{{ item }}'
      loop: "{{ vault_unseal_keys }}"
      failed_when: false
      when:
        - vault_primary_sealed | default(false)
        - vault_unseal_keys is defined
      no_log: true

    - name: Verify primary Vault pod is unsealed
      shell: >
        kubectl --context {{ kubectl_context }} exec -n {{ vault_namespace }}
        {{ vault_primary_pod }} -- vault status -format=json
      register: vault_post_unseal
      retries: 5
      delay: 5
      until: vault_post_unseal.rc == 0 and not (vault_post_unseal.stdout | from_json).sealed
      changed_when: false
      when:
        - vault_primary_sealed | default(false)

    - name: Report primary Vault pod already unsealed
      debug:
        msg: "Primary Vault pod {{ vault_primary_pod }} is already unsealed."
      when:
        - not (vault_primary_sealed | default(true))

    - name: Join sealed follower Vault pods to the Raft cluster
      shell: >
        kubectl --context {{ kubectl_context }} exec -n {{ vault_namespace }}
        {{ item }} -- sh -ec 'vault operator raft join http://{{ vault_primary_pod }}.{{ vault_internal_service_name }}:8200 || true'
      loop: "{{ vault_follower_sealed_pods }}"
      failed_when: false
      when:
        - vault_raft_enabled | default(true)
        - vault_follower_sealed_pods | length > 0
      no_log: true

    - name: Unseal sealed follower Vault pods
      shell: >
        kubectl --context {{ kubectl_context }} exec -n {{ vault_namespace }}
        {{ item }} -- sh -ec 'for key in {{ vault_unseal_keys | join(" ") }}; do vault operator unseal "$key" >/dev/null 2>&1 || true; done'
      loop: "{{ vault_follower_sealed_pods }}"
      failed_when: false
      when:
        - vault_any_pod_sealed | default(false)
        - vault_follower_sealed_pods | length > 0
        - vault_unseal_keys is defined
      no_log: true

    - name: Verify sealed follower Vault pods are unsealed
      shell: >
        kubectl --context {{ kubectl_context }} exec -n {{ vault_namespace }}
        {{ item }} -- vault status -format=json
      register: vault_follower_status
      retries: 10
      delay: 5
      until:
        - vault_follower_status.rc == 0
        - (vault_follower_status.stdout | from_json).initialized
        - not (vault_follower_status.stdout | from_json).sealed
      changed_when: false
      loop: "{{ vault_follower_sealed_pods }}"
      when:
        - vault_follower_sealed_pods | length > 0

    - name: Vault pods unsealed
      debug:
        msg: "Vault pods are unsealed and, when present, sealed Raft followers have rejoined."
      when:
        - vault_unseal_keys is defined

    - name: Re-read Vault status after recovery
      shell: >
        kubectl --context {{ kubectl_context }} exec -n {{ vault_namespace }}
        {{ item }} -- vault status -format=json
      register: vault_status_after_recovery
      changed_when: false
      retries: 12
      delay: 5
      until: (vault_status_after_recovery.stdout | default('') | trim | length) > 0
      loop: "{{ vault_pods }}"

    - name: Parse Vault status after recovery
      set_fact:
        vault_pod_statuses_after_recovery: >-
          {{
            dict(
              vault_status_after_recovery.results
              | map(attribute='item')
              | zip(vault_status_after_recovery.results | map(attribute='stdout') | map('trim') | map('from_json'))
            )
          }}

    - name: Assert all Vault pods are unsealed
      ansible.builtin.assert:
        that:
          - (vault_pod_statuses_after_recovery | dict2items | selectattr('value.sealed', 'equalto', true) | list | length) == 0
        fail_msg: >-
          Vault is still sealed on pod(s):
          {{
            vault_pod_statuses_after_recovery
            | dict2items
            | selectattr('value.sealed', 'equalto', true)
            | map(attribute='key')
            | join(', ')
          }}
        success_msg: "All Vault pods are unsealed."

    # ── Reconfigure Kubernetes auth ───────────────────────────────────
    # After a pod restart, Vault's internal SA token for token review
    # may be stale. Re-writing the config forces Vault to pick up the
    # fresh token from its mounted service account.
    - name: Login to Vault
      # vault_api_addr points at the cluster-wide active service which has
      # no endpoints until raft elects a leader. After a fresh cluster
      # restart that election can take 30-60s after pods unseal, so retry
      # while the active service is still backendless.
      shell: >
        kubectl --context {{ kubectl_context }} exec -n {{ vault_namespace }}
        {{ vault_primary_pod }} -- sh -ec 'VAULT_ADDR="{{ vault_api_addr }}" vault login "{{ vault_root_token }}"'
      register: vault_login
      changed_when: false
      no_log: true
      retries: 12
      delay: 10
      until: vault_login.rc == 0

    - name: Reconfigure Kubernetes auth backend
      shell: >
        kubectl --context {{ kubectl_context }} exec -n {{ vault_namespace }}
        {{ vault_primary_pod }} -- sh -ec 'VAULT_ADDR="{{ vault_api_addr }}" vault write auth/kubernetes/config token_reviewer_jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" kubernetes_host="https://kubernetes.default.svc:443" kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt disable_iss_validation=true disable_local_ca_jwt=false'
      register: vault_k8s_auth_config
      changed_when: vault_k8s_auth_config.rc == 0

    - name: Kubernetes auth reconfigured
      debug:
        msg: "Vault Kubernetes auth backend has been refreshed with current SA token."

    # ── Recover External Secrets operator ─────────────────────────────
    - name: Check if external-secrets namespace exists
      shell: >
        kubectl --context {{ kubectl_context }} get namespace {{ external_secrets_namespace }}
      register: es_ns_check
      failed_when: false
      changed_when: false

    # ── Force ClusterSecretStore resync ───────────────────────────────
    - name: Get ClusterSecretStore names
      shell: >
        kubectl --context {{ kubectl_context }} get clustersecretstores
        -o jsonpath='{.items[*].metadata.name}'
      register: css_names
      failed_when: false
      changed_when: false
      when: es_ns_check.rc == 0

    - name: Annotate ClusterSecretStores to force resync
      shell: >
        kubectl --context {{ kubectl_context }} annotate clustersecretstore {{ item }}
        force-sync="{{ lookup('pipe', 'date +%s') }}" --overwrite
      loop: "{{ css_names.stdout.split() }}"
      when:
        - es_ns_check.rc == 0
        - css_names.stdout | default('') | length > 0

    - name: Wait for ClusterSecretStores to become Ready
      shell: >
        kubectl --context {{ kubectl_context }} get clustersecretstores
        -o jsonpath='{range .items[*]}{.metadata.name}={.status.conditions[0].reason}{" "}{end}'
      register: css_status
      retries: "{{ es_recovery_retries }}"
      delay: "{{ es_recovery_delay }}"
      until: "'InvalidProviderConfig' not in css_status.stdout and 'Valid' in css_status.stdout"
      changed_when: false
      when:
        - es_ns_check.rc == 0
        - css_names.stdout | default('') | length > 0

    - name: Get external-secrets deployments
      shell: >
        kubectl --context {{ kubectl_context }} get deployments
        -n {{ external_secrets_namespace }}
        -o jsonpath='{.items[*].metadata.name}'
      register: es_deployments
      when: es_ns_check.rc == 0
      changed_when: false

    - name: Restart external-secrets deployments after store is healthy
      shell: >
        kubectl --context {{ kubectl_context }} rollout restart
        deployment {{ item }} -n {{ external_secrets_namespace }}
      loop: "{{ es_deployments.stdout.split() }}"
      when:
        - es_ns_check.rc == 0
        - es_deployments.stdout | length > 0

    - name: Wait for external-secrets rollouts
      shell: >
        kubectl --context {{ kubectl_context }} rollout status
        deployment {{ item }} -n {{ external_secrets_namespace }} --timeout=180s
      loop: "{{ es_deployments.stdout.split() }}"
      when:
        - es_ns_check.rc == 0
        - es_deployments.stdout | length > 0
      changed_when: false

    - name: Get ExternalSecret resources
      shell: >
        kubectl --context {{ kubectl_context }} get externalsecrets -A -o json
      register: external_secrets_raw
      when: es_ns_check.rc == 0
      changed_when: false

    - name: Parse ExternalSecret resources
      set_fact:
        external_secrets_resources: "{{ (external_secrets_raw.stdout | from_json)['items'] | default([]) }}"
      when:
        - es_ns_check.rc == 0
        - external_secrets_raw.stdout | default('') | length > 0

    - name: Force ExternalSecret resync
      shell: >
        kubectl --context {{ kubectl_context }} annotate externalsecret
        -n {{ item.metadata.namespace }} {{ item.metadata.name }}
        external-secrets.io/force-sync="{{ lookup('pipe', 'date +%s') }}"
        --overwrite
      loop: "{{ external_secrets_resources | default([]) }}"
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
      when:
        - es_ns_check.rc == 0
        - external_secrets_resources | default([]) | length > 0

    # ── Verify recovery ──────────────────────────────────────────────

    - name: Check ExternalSecrets sync status
      shell: >
        kubectl --context {{ kubectl_context }} get externalsecrets -A
        -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}={.status.conditions[0].reason}{" "}{end}'
      register: es_status
      retries: "{{ es_recovery_retries }}"
      delay: "{{ es_recovery_delay }}"
      until: "'SecretSyncedError' not in es_status.stdout"
      changed_when: false
      failed_when: false
      when: es_ns_check.rc == 0

    - name: Get ExternalSecret resources after recovery
      shell: >
        kubectl --context {{ kubectl_context }} get externalsecrets -A -o json
      register: external_secrets_after_recovery_raw
      when: es_ns_check.rc == 0
      changed_when: false

    - name: Parse ExternalSecret resources after recovery
      set_fact:
        external_secrets_after_recovery: "{{ (external_secrets_after_recovery_raw.stdout | from_json)['items'] | default([]) }}"
        failing_external_secrets: >-
          {{
            (external_secrets_after_recovery_raw.stdout | from_json)['items']
            | rejectattr('status.conditions', 'undefined')
            | selectattr('status.conditions', 'defined')
            | selectattr('status.conditions.0.type', 'equalto', 'Ready')
            | rejectattr('status.conditions.0.status', 'equalto', 'True')
            | list
          }}
      when:
        - es_ns_check.rc == 0
        - external_secrets_after_recovery_raw.stdout | default('') | length > 0

    - name: Check target Secret presence for failing ExternalSecrets
      shell: >
        kubectl --context {{ kubectl_context }} get secret
        -n {{ item.metadata.namespace }}
        {{ item.spec.target.name | default(item.metadata.name) }}
      register: failing_external_secret_target_checks
      failed_when: false
      changed_when: false
      loop: "{{ failing_external_secrets | default([]) }}"
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
      when:
        - es_ns_check.rc == 0
        - failing_external_secrets | default([]) | length > 0

    - name: Derive blocking ExternalSecrets
      set_fact:
        blocking_external_secret_failures: >-
          {{
            failing_external_secret_target_checks.results
            | default([])
            | rejectattr('rc', 'equalto', 0)
            | map(attribute='item')
            | list
          }}
      when:
        - es_ns_check.rc == 0
        - failing_external_secrets | default([]) | length > 0

    - name: Warn about stale ExternalSecret status with existing target Secret
      debug:
        msg: >-
          ExternalSecret {{ item.item.metadata.namespace }}/{{ item.item.metadata.name }}
          still reports {{ item.item.status.conditions[0].reason | default('unknown') }},
          but target Secret {{ item.item.spec.target.name | default(item.item.metadata.name) }}
          exists. Treating this as a stale ESO status after provider recovery.
      loop: "{{ failing_external_secret_target_checks.results | default([]) }}"
      loop_control:
        label: "{{ item.item.metadata.namespace }}/{{ item.item.metadata.name }}"
      when:
        - es_ns_check.rc == 0
        - item.rc == 0

    - name: Fail if ExternalSecret recovery is still blocked
      ansible.builtin.fail:
        msg: >-
          ExternalSecret recovery is still blocked for:
          {{
            blocking_external_secret_failures
            | map(attribute='metadata')
            | map(attribute='namespace')
            | zip(blocking_external_secret_failures | map(attribute='metadata') | map(attribute='name'))
            | map('join', '/')
            | join(', ')
          }}
      when:
        - es_ns_check.rc == 0
        - blocking_external_secret_failures | default([]) | length > 0

    - name: Display final status
      shell: |
        echo "=== Vault Status ==="
        kubectl --context {{ kubectl_context }} exec -n {{ vault_namespace }} {{ vault_primary_pod }} -- vault status 2>&1 || true
        echo ""
        echo "=== ClusterSecretStores ==="
        kubectl --context {{ kubectl_context }} get clustersecretstores 2>&1 || echo "  (none)"
        echo ""
        echo "=== ExternalSecrets ==="
        kubectl --context {{ kubectl_context }} get externalsecrets -A 2>&1 || echo "  (none)"
      register: final_status
      changed_when: false

    - name: Recovery summary
      debug:
        msg: "{{ final_status.stdout_lines }}"
