---
# Safely shut down a K3s cluster for maintenance
#
# Required variables:
#   target_cluster    - Ansible group name (e.g., k3s_cluster_prod)
#   kubectl_context   - kubectl context name (e.g., k3s-prod)
#
# Optional variables:
#   skip_vm_shutdown  - Set to "true" to stop K3s only, leave VMs running (default: false)
#   drain_timeout     - Timeout for kubectl drain per node (default: 120s)

- name: Validate required variables
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Assert target_cluster and kubectl_context are defined
      assert:
        that:
          - target_cluster is defined
        fail_msg: "Required variable target_cluster must be set"

    - name: Assert target cluster group exists in inventory
      assert:
        that:
          - target_cluster in groups
          - groups[target_cluster] | length > 0
        fail_msg: "Cluster group '{{ target_cluster }}' not found or empty in inventory"

- name: Cordon and drain all cluster nodes
  hosts: "{{ target_cluster }}_master"
  gather_facts: no
  vars:
    drain_timeout: "60s"
  tasks:
    - name: Read reachable kubeconfig from first master
      ansible.builtin.slurp:
        src: "/home/{{ k3s_user | default(ansible_user) }}/.kube/config"
      register: maintenance_kubeconfig_raw
      run_once: true

    - name: Create temporary kubeconfig file on controller
      ansible.builtin.tempfile:
        state: file
        prefix: "{{ target_cluster }}-shutdown-"
        suffix: .kubeconfig
      register: maintenance_kubeconfig_tempfile
      delegate_to: localhost
      become: false
      run_once: true

    - name: Write fetched kubeconfig to controller temp file
      ansible.builtin.copy:
        content: "{{ maintenance_kubeconfig_raw.content | b64decode }}"
        dest: "{{ maintenance_kubeconfig_tempfile.path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Get list of all cluster nodes
      command: kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} get nodes -o jsonpath='{.items[*].metadata.name}'
      delegate_to: localhost
      become: no
      register: node_list
      changed_when: false
      run_once: true

    - name: Set node names
      set_fact:
        cluster_nodes: "{{ node_list.stdout.split() }}"
      run_once: true

    - name: Display nodes to be shut down
      debug:
        msg: "Shutting down nodes: {{ cluster_nodes | join(', ') }}"
      run_once: true

    - name: Cordon all nodes
      command: kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} cordon {{ item }}
      delegate_to: localhost
      become: no
      loop: "{{ cluster_nodes }}"
      changed_when: true
      run_once: true

    - name: List all namespaces
      command: >
        kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }}
        get namespaces -o jsonpath='{.items[*].metadata.name}'
      delegate_to: localhost
      become: no
      register: all_namespaces
      changed_when: false
      run_once: true

    - name: Determine workload namespaces to evict (preserve Longhorn + core stack)
      set_fact:
        workload_namespaces: >-
          {{ all_namespaces.stdout.split()
             | difference(['longhorn-system', 'kube-system']) }}
      run_once: true

    - name: Evict workload pods so Longhorn volumes detach cleanly
      # Delete only workload pods and KEEP the entire longhorn-system stack running
      # (longhorn-manager, instance-managers, AND the CSI controllers like
      # csi-attacher). Longhorn detaches volumes through the CSI flow, so the CSI
      # controllers must stay up — draining them strands every detach and volumes
      # never reach 'detached'. Instance-managers must also stay up so replicas
      # detach cleanly (failedAt empty) instead of being faulted into a full
      # rebuild on the next restart (the "all replicas degraded" storm).
      #
      # Nodes are already cordoned (previous task), so deleted pods stay Pending
      # and release their volumes; the restart playbook's uncordon lets the
      # controllers reschedule them — no scale-state bookkeeping needed.
      # kube-system is preserved to avoid disrupting core services during detach.
      command: >
        kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }}
        delete pods --all -n {{ item }} --grace-period=30 --wait=false
      delegate_to: localhost
      become: no
      loop: "{{ workload_namespaces }}"
      changed_when: true
      ignore_errors: yes
      run_once: true

    - name: Check if Longhorn volume CRD exists
      command: kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} get crd volumes.longhorn.io
      delegate_to: localhost
      become: no
      register: longhorn_volume_crd
      failed_when: false
      changed_when: false
      run_once: true

    - name: Wait for Longhorn volumes to detach after drain
      shell: >
        kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} get volumes.longhorn.io -n longhorn-system
        -o jsonpath='{range .items[?(@.status.state!="detached")]}{.metadata.name}{" "}{end}'
      delegate_to: localhost
      become: no
      register: attached_longhorn_volumes
      retries: 60
      delay: 10
      until: (attached_longhorn_volumes.stdout | trim) == ""
      changed_when: false
      run_once: true
      when: longhorn_volume_crd.rc == 0

    - name: Longhorn volumes detached
      debug:
        msg: "All Longhorn volumes are detached after drain"
      run_once: true
      when: longhorn_volume_crd.rc == 0

    - name: All nodes drained
      debug:
        msg: "All nodes cordoned and drained; shutdown can proceed"
      run_once: true

  post_tasks:
    - name: Remove temporary kubeconfig from controller
      ansible.builtin.file:
        path: "{{ maintenance_kubeconfig_tempfile.path }}"
        state: absent
      delegate_to: localhost
      become: false
      run_once: true
      when: maintenance_kubeconfig_tempfile is defined

- name: Stop K3s agent on worker nodes
  hosts: "{{ target_cluster }}_workers"
  become: yes
  gather_facts: no
  serial: 1
  tasks:
    - name: Stop k3s-agent service
      systemd:
        name: k3s-agent
        state: stopped

    - name: Verify k3s-agent is stopped
      command: systemctl is-active k3s-agent
      register: agent_status
      failed_when: agent_status.rc == 0 or agent_status.rc == 4
      changed_when: false

    - name: Worker agent stopped
      debug:
        msg: "k3s-agent stopped on {{ inventory_hostname }}"

- name: Stop K3s on master node
  hosts: "{{ target_cluster }}_master"
  become: yes
  gather_facts: no
  tasks:
    - name: Stop k3s service
      systemd:
        name: k3s
        state: stopped

    - name: Verify k3s is stopped
      command: systemctl is-active k3s
      register: master_status
      failed_when: master_status.rc == 0 or master_status.rc == 4
      changed_when: false

    - name: Master stopped
      debug:
        msg: "k3s stopped on {{ inventory_hostname }}"

- name: Shut down VMs
  hosts: "{{ target_cluster }}"
  become: yes
  gather_facts: no
  tasks:
    - name: Power off VM
      command: /sbin/shutdown -h now
      async: 1
      poll: 0
      ignore_errors: yes
      when: not (skip_vm_shutdown | default(false) | bool)

    - name: VMs shutting down
      debug:
        msg: "Shutdown signal sent to {{ inventory_hostname }}"
      when: not (skip_vm_shutdown | default(false) | bool)

    - name: VMs left running (skip_vm_shutdown=true)
      debug:
        msg: "K3s services stopped on {{ inventory_hostname }} — VM left running"
      when: skip_vm_shutdown | default(false) | bool
