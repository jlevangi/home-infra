---
# Restart a K3s cluster after maintenance shutdown
#
# Prerequisites:
#   - VMs must be running (start from Proxmox UI if they were powered off)
#
# Required variables:
#   target_cluster    - Ansible group name (e.g., k3s_cluster_prod)
#   kubectl_context   - kubectl context name (e.g., k3s-prod)

- name: Validate required variables
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Assert target_cluster and kubectl_context are defined
      assert:
        that:
          - target_cluster is defined
        fail_msg: "Required variable target_cluster must be set"

    - name: Assert target cluster group exists in inventory
      assert:
        that:
          - target_cluster in groups
          - groups[target_cluster] | length > 0
        fail_msg: "Cluster group '{{ target_cluster }}' not found or empty in inventory"

- name: Wait for all nodes to be reachable
  hosts: "{{ target_cluster }}"
  gather_facts: no
  tasks:
    - name: Wait for SSH connectivity
      wait_for_connection:
        delay: 5
        timeout: 300

    - name: Gather facts
      setup:

    - name: Node reachable
      debug:
        msg: "{{ inventory_hostname }} is online ({{ ansible_host }})"

- name: Start K3s on master node
  hosts: "{{ target_cluster }}_master"
  become: yes
  gather_facts: no
  serial: 1
  tasks:
    - name: Start k3s service
      systemd:
        name: k3s
        state: started

    - name: Wait for K3s API to be ready
      command: kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get nodes
      register: api_check
      retries: 30
      delay: 10
      until: api_check.rc == 0
      changed_when: false

    - name: K3s API is ready
      debug:
        msg: "K3s API server is responding on {{ inventory_hostname }}"

- name: Start K3s agent on worker nodes
  hosts: "{{ target_cluster }}_workers"
  become: yes
  gather_facts: no
  tasks:
    - name: Start k3s-agent service
      systemd:
        name: k3s-agent
        state: started

    - name: Wait for k3s-agent to be active
      command: systemctl is-active k3s-agent
      register: agent_status
      retries: 12
      delay: 5
      until: agent_status.rc == 0
      changed_when: false

    - name: Worker agent started
      debug:
        msg: "k3s-agent started on {{ inventory_hostname }}"

- name: Uncordon nodes and verify cluster health
  hosts: "{{ target_cluster }}_master"
  gather_facts: no
  vars:
    expected_node_count: "{{ groups[target_cluster] | length }}"
  tasks:
    - name: Read reachable kubeconfig from first master
      ansible.builtin.slurp:
        src: "/home/{{ k3s_user | default(ansible_user) }}/.kube/config"
      register: maintenance_kubeconfig_raw
      run_once: true

    - name: Create temporary kubeconfig file on controller
      ansible.builtin.tempfile:
        state: file
        prefix: "{{ target_cluster }}-restart-"
        suffix: .kubeconfig
      register: maintenance_kubeconfig_tempfile
      delegate_to: localhost
      become: false
      run_once: true

    - name: Write fetched kubeconfig to controller temp file
      ansible.builtin.copy:
        content: "{{ maintenance_kubeconfig_raw.content | b64decode }}"
        dest: "{{ maintenance_kubeconfig_tempfile.path }}"
        mode: "0600"
      delegate_to: localhost
      become: false
      run_once: true

    - name: Wait for all nodes to register with cluster
      shell: kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} get nodes --no-headers | wc -l
      delegate_to: localhost
      become: no
      register: node_count
      retries: 30
      delay: 10
      until: (node_count.stdout | trim | int) >= (expected_node_count | int)
      changed_when: false
      run_once: true

    - name: Get list of all cluster nodes
      command: kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} get nodes -o jsonpath='{.items[*].metadata.name}'
      delegate_to: localhost
      become: no
      register: node_list
      changed_when: false
      run_once: true

    - name: Set node names
      set_fact:
        cluster_nodes: "{{ node_list.stdout.split() }}"
      run_once: true

    - name: Uncordon all nodes
      command: kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} uncordon {{ item }}
      delegate_to: localhost
      become: no
      loop: "{{ cluster_nodes }}"
      changed_when: true
      run_once: true

    - name: Wait for all nodes to be Ready
      shell: >
        kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} get nodes --no-headers |
        grep -c ' Ready ' || true
      delegate_to: localhost
      become: no
      register: ready_count
      retries: 30
      delay: 10
      until: (ready_count.stdout | trim | int) >= (expected_node_count | int)
      changed_when: false
      run_once: true

    - name: Wait for kube-system pods to be running
      shell: >
        kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} get pods -n kube-system --no-headers |
        grep -v -E 'Running|Completed|Terminating' | wc -l
      delegate_to: localhost
      become: no
      register: unhealthy_pods
      retries: 30
      delay: 10
      until: (unhealthy_pods.stdout | trim | int) == 0
      changed_when: false
      run_once: true

    - name: Wait for Longhorn manager pods to be Ready
      command: >
        kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} wait
        --for=condition=Ready pod -l app=longhorn-manager
        -n longhorn-system --timeout=600s
      delegate_to: localhost
      become: no
      changed_when: false
      run_once: true

    - name: Wait for Longhorn manager DaemonSet rollout to complete
      command: >
        kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} rollout status
        daemonset/longhorn-manager -n longhorn-system --timeout=300s
      delegate_to: localhost
      become: no
      changed_when: false
      run_once: true

    - name: Wait for Longhorn CSI plugin rollout to complete
      command: >
        kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} rollout status
        daemonset/longhorn-csi-plugin -n longhorn-system --timeout=300s
      delegate_to: localhost
      become: no
      changed_when: false
      run_once: true

    - name: Wait for Longhorn CSI sidecars to be healthy
      shell: |
        kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} wait --for=condition=Ready pod -l app=csi-attacher -n longhorn-system --timeout=120s
        kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} wait --for=condition=Ready pod -l app=csi-provisioner -n longhorn-system --timeout=120s
        kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} wait --for=condition=Ready pod -l app=csi-resizer -n longhorn-system --timeout=120s
        kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} wait --for=condition=Ready pod -l app=csi-snapshotter -n longhorn-system --timeout=120s
      delegate_to: localhost
      become: no
      changed_when: false
      run_once: true

    - name: Wait for Longhorn instance-manager pods to be Ready
      # Instance-managers host the engine/replica processes. They cannot schedule
      # while a node is cordoned (they don't tolerate the unschedulable taint),
      # which is why uncordon must happen first. Gate here so we know the storage
      # data plane is up on every node before declaring the cluster healthy.
      command: >
        kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} wait
        --for=condition=Ready pod -l longhorn.io/component=instance-manager
        -n longhorn-system --timeout=600s
      delegate_to: localhost
      become: no
      changed_when: false
      run_once: true

    - name: Wait for Longhorn volumes to settle (no degraded/faulted robustness)
      # If the clean-detach shutdown worked, volumes re-attach with all reusable
      # replicas present and stay healthy. This catches any volume that attached
      # degraded (e.g. a workload raced ahead of an instance-manager) and is
      # rebuilding, so the restart does not report success mid-rebuild.
      shell: >
        kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }}
        get volumes.longhorn.io -n longhorn-system
        -o jsonpath='{range .items[?(@.status.robustness=="degraded")]}{.metadata.name}{" "}{end}{range .items[?(@.status.robustness=="faulted")]}{.metadata.name}{" "}{end}'
      delegate_to: localhost
      become: no
      register: unhealthy_volumes
      retries: 60
      delay: 10
      until: (unhealthy_volumes.stdout | trim) == ""
      changed_when: false
      failed_when: false
      run_once: true

    - name: Warn about volumes still degraded/faulted after settle window
      debug:
        msg: >-
          WARNING: these Longhorn volumes are still degraded/faulted after the
          settle window (likely rebuilding): {{ unhealthy_volumes.stdout | trim }}
      when: (unhealthy_volumes.stdout | default('') | trim) != ""
      run_once: true

    - name: Longhorn storage control plane is ready
      debug:
        msg: "Longhorn manager, CSI, and instance-manager pods are Ready"
      run_once: true

    - name: Get final cluster status
      command: kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} get nodes -o wide
      delegate_to: localhost
      become: no
      register: final_nodes
      changed_when: false
      run_once: true

    - name: Display cluster status
      debug:
        msg: "{{ final_nodes.stdout_lines }}"
      run_once: true

    - name: Get kube-system pod status
      command: kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} get pods -n kube-system
      delegate_to: localhost
      become: no
      register: system_pods
      changed_when: false
      run_once: true

    - name: Display system pods
      debug:
        msg: "{{ system_pods.stdout_lines }}"
      run_once: true

    - name: Get Longhorn pod status
      command: kubectl --kubeconfig {{ maintenance_kubeconfig_tempfile.path }} get pods -n longhorn-system
      delegate_to: localhost
      become: no
      register: longhorn_pods
      changed_when: false
      run_once: true

    - name: Display Longhorn pods
      debug:
        msg: "{{ longhorn_pods.stdout_lines }}"
      run_once: true

    - name: Cluster is healthy
      debug:
        msg: "All {{ expected_node_count }} nodes are Ready, kube-system pods are running, and Longhorn control-plane pods are Ready"
      run_once: true

  post_tasks:
    - name: Remove temporary kubeconfig from controller
      ansible.builtin.file:
        path: "{{ maintenance_kubeconfig_tempfile.path }}"
        state: absent
      delegate_to: localhost
      become: false
      run_once: true
      when: maintenance_kubeconfig_tempfile is defined
