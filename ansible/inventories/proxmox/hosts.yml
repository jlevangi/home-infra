---
# Dedicated inventory for Proxmox VE hosts.
#
# K3s cluster nodes and LXC guests use their own inventories. This group is for
# host-level Proxmox management such as LVM thin-pool protection, host exporters,
# and future node-specific maintenance.

proxmox_hosts:
  hosts:
    atlas:
      ansible_host: 172.20.20.6
      ansible_user: root
      proxmox_host_primary: true
      proxmox_host_manage_lvm: true
      proxmox_host_lvm_thin_pools:
        - vg: pve
          name: data
          description: Atlas VM OS disk thin pool
  vars:
    ansible_python_interpreter: /usr/bin/python3
