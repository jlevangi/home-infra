---
# Test K3s Cluster Inventory
# Connection defaults (private_key_file) live in ansible/ansible.cfg.
# ansible_user must be pinned here (not just in ansible.cfg's remote_user)
# because roles reference it as a Jinja2 variable (e.g. k3s_user in
# k3s_cluster.yml). Test was rebuilt with ci_user=ansible.
all:
  vars:
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3

k3s_cluster_test:
  children:
    k3s_cluster_test_master:
      hosts:
        k3s-test-cp-1:
          ansible_host: 172.20.20.124
        k3s-test-cp-2:
          ansible_host: 172.20.20.125
    k3s_cluster_test_workers:
      hosts:
        k3s-test-worker-1:
          ansible_host: 172.20.20.121
        k3s-test-worker-2:
          ansible_host: 172.20.20.122
        k3s-test-worker-3:
          ansible_host: 172.20.20.123
