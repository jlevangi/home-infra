---
# Test K3s Cluster Inventory
# Connection defaults (private_key_file) live in ansible/ansible.cfg.
# ansible_user is pinned here because the test cluster is the first to be
# rebuilt under the new cloud-init default (ci_user=ansible); prod and
# stage still run as `pierce` until they are rebuilt, so they inherit
# remote_user from ansible.cfg rather than being pinned here.
all:
  vars:
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3

k3s_cluster_test:
  children:
    k3s_cluster_test_master:
      hosts:
        k3s-test-node-1:
          ansible_host: 172.20.20.121
    k3s_cluster_test_workers:
      hosts:
        k3s-test-node-2:
          ansible_host: 172.20.20.122
        k3s-test-node-3:
          ansible_host: 172.20.20.123
