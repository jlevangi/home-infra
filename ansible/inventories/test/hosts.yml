---
# Test K3s Cluster Inventory
all:
  vars:
    ansible_user: pierce
    ansible_ssh_private_key_file: ~/.ssh/pierce
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

k3s_cluster_test:
  children:
    k3s_cluster_test_master:
      hosts:
        k3s-test-node-1:
          ansible_host: 172.20.20.121
    k3s_cluster_test_workers:
      hosts:
        k3s-test-node-2:
          ansible_host: 172.20.20.122
        k3s-test-node-3:
          ansible_host: 172.20.20.123