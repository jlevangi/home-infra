---
# GPU-capable worker on Atlas. Plex and Jellyfin use the NVIDIA Quadro P4000,
# but ordinary workloads may use its otherwise-idle CPU and RAM. Keep the GPU
# label for targeted workloads without tainting the node against general pods.
nvidia_gpu_worker: true
longhorn_node_tags:
  - media-storage
# No tank disk on this host — its scsi2 is the LLM model disk (below), not a
# Longhorn-backing volume. Opt out of the group_vars default longhorn_tank_disk_slot.
longhorn_tank_disk_slot: ""
# Stable scsi1 path (by-id) — /dev/sd* enumeration is unreliable on this node
# because Longhorn CSI iSCSI volumes attached for Plex/Jellyfin grab earlier
# sd letters before the local data disk would.
longhorn_data_disk_device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
# Dedicated ssd3 (LVM) disk (scsi2) for LLM model files. Mounted at
# /mnt/llm-models and surfaced into Kubernetes as a static local PV consumed
# by the llama-cpp Argo app. By-id path for the same enumeration-stability
# reason called out above. Backed by LVM rather than ZFS so heavy write
# bursts during model staging don't pay compression/checksum/ARC overhead.
llm_model_disk_device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi2
llm_model_mount_path: /mnt/llm-models
k3s_agent_args:
  - "--node-label=accelerator=nvidia"
k3s_agent_removed_args:
  - "--node-taint=accelerator=nvidia:NoSchedule"
