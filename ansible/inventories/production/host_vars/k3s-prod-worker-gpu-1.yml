---
# Dedicated GPU worker on Atlas. Has a tank-backed scsi1 disk mounted at
# /var/lib/longhorn so it can host Longhorn replicas like the regular workers.
# Plex and Jellyfin run here for hardware transcoding (NVIDIA Quadro P4000
# passthrough); the Longhorn data-locality preference will naturally place a
# replica of their config volumes on this node.
nvidia_gpu_worker: true
# Stable scsi1 path (by-id) — /dev/sd* enumeration is unreliable on this node
# because Longhorn CSI iSCSI volumes attached for Plex/Jellyfin grab earlier
# sd letters before the local data disk would.
longhorn_data_disk_device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
k3s_agent_args:
  - "--node-label=accelerator=nvidia"
  - "--node-taint=accelerator=nvidia:NoSchedule"
