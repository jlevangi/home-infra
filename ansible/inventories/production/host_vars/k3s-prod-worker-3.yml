---
# Worker-3 lives on Atlas with two Longhorn-backing disks:
#  - scsi3 (flash zpool, 250G, /mnt/longhorn-flash) — the primary fast tier.
#    Currently mounted via fstab outside Ansible's purview; not managed here.
#  - scsi2 (tank zpool, 250G, /mnt/longhorn-tank) — added 2026-05-29 for
#    cross-pool replica resilience (plans/i-need-some-serious-ancient-adleman.md).
#    Managed by ansible/roles/k3s/tasks/longhorn-tank-disk.yml.
longhorn_node_tags:
  - general-storage
  - media-storage
longhorn_tank_disk_device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi2
