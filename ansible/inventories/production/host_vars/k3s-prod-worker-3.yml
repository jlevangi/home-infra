---
# Worker-3 lives on Atlas with a dedicated 300G tank-backed disk for Longhorn.
# This triggers ansible/roles/k3s/tasks/longhorn-data-disk.yml to format and
# mount the dedicated scsi1 disk at /var/lib/longhorn before Longhorn
# schedules replicas.
longhorn_node_tags:
  - general-storage
  - media-storage
longhorn_data_disk_device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
