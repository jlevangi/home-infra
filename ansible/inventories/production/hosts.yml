---
# Production K3s Cluster Inventory
# Connection defaults (remote_user, private_key_file) live in ansible/ansible.cfg.
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3

k3s_cluster_prod:
  children:
    k3s_cluster_prod_master:
      hosts:
        k3s-prod-node-1:
          ansible_host: 172.20.20.101
    k3s_cluster_prod_workers:
      hosts:
        k3s-prod-node-2:
          ansible_host: 172.20.20.102
        k3s-prod-node-3:
          ansible_host: 172.20.20.103
