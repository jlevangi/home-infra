---
# Production K3s Cluster Inventory
# Connection defaults (private_key_file) live in ansible/ansible.cfg.
# ansible_user must be pinned here (not just in ansible.cfg's remote_user)
# because roles reference it as a Jinja2 variable (e.g. k3s_user in
# k3s_cluster.yml).
all:
  vars:
    ansible_user: pierce
    ansible_python_interpreter: /usr/bin/python3

k3s_cluster_prod:
  children:
    k3s_cluster_prod_master:
      # Inventory order no longer defines the authoritative bootstrap peer.
      # ansible/group_vars/k3s_cluster_prod.yml pins k3s_primary_master to
      # cp-2 during the current control-plane recovery window.
      hosts:
        k3s-prod-cp-1:
          ansible_host: 172.20.20.104
        k3s-prod-cp-2:
          ansible_host: 172.20.20.105
        k3s-prod-cp-3:
          ansible_host: 172.20.20.106
        k3s-prod-cp-4:
          ansible_host: 172.20.20.111
    k3s_cluster_prod_workers:
      hosts:
        k3s-prod-worker-1:
          ansible_host: 172.20.20.101
        k3s-prod-worker-2:
          ansible_host: 172.20.20.102
        k3s-prod-worker-3:
          ansible_host: 172.20.20.103
        k3s-prod-worker-gpu-1:
          ansible_host: 172.20.20.107
        k3s-prod-worker-4:
          ansible_host: 172.20.20.108
