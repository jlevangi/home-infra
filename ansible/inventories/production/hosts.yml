---
# Production K3s Cluster Inventory
# Connection defaults (private_key_file) live in ansible/ansible.cfg.
# ansible_user must be pinned here (not just in ansible.cfg's remote_user)
# because roles reference it as a Jinja2 variable (e.g. k3s_user in
# k3s_cluster.yml). Flip to ansible after rebuilding with ci_user=ansible.
all:
  vars:
    ansible_user: pierce
    ansible_python_interpreter: /usr/bin/python3

k3s_cluster_prod:
  children:
    k3s_cluster_prod_master:
      # Order matters: groups[master_group][0] is treated as the canonical
      # join URL / token source by ansible/roles/k3s/tasks/master.yml.
      # cp-1 is first during Phase 5 because cp-3 is the in-flight migration
      # target; cp-1 has been on Atlas longest and is the most stable peer.
      hosts:
        k3s-prod-cp-1:
          ansible_host: 172.20.20.104
        k3s-prod-cp-2:
          ansible_host: 172.20.20.105
        k3s-prod-cp-3:
          ansible_host: 172.20.20.106
    k3s_cluster_prod_workers:
      hosts:
        k3s-prod-worker-1:
          ansible_host: 172.20.20.101
        k3s-prod-worker-2:
          ansible_host: 172.20.20.102
        k3s-prod-worker-3:
          ansible_host: 172.20.20.103
