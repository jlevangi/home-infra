---
# Production K3s Cluster Inventory
all:
  vars:
    cluster_admin_user: "{{ lookup('env', 'K3S_SSH_USER') or lookup('env', 'OPERATOR_USER') or lookup('env', 'USER') or 'ansible' }}"
    cluster_ssh_private_key_file: "{{ lookup('env', 'K3S_SSH_KEY') or lookup('env', 'OPERATOR_SSH_KEY') or ('~/.ssh/' ~ cluster_admin_user) }}"
    ansible_user: "{{ cluster_admin_user }}"
    ansible_ssh_private_key_file: "{{ cluster_ssh_private_key_file }}"
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

k3s_cluster_prod:
  children:
    k3s_cluster_prod_master:
      hosts:
        k3s-prod-node-1:
          ansible_host: 172.20.20.101
    k3s_cluster_prod_workers:
      hosts:
        k3s-prod-node-2:
          ansible_host: 172.20.20.102
        k3s-prod-node-3:
          ansible_host: 172.20.20.103
