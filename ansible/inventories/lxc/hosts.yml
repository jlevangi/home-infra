---
# LXC Container Inventory
# This file can be manually updated with container IPs after deployment
# or containers are dynamically added during playbook execution

lxc_containers:
  hosts:
    # Containers are added dynamically during deployment
    # After deployment, you can add static entries here:
    #
    # nbn-srv:
    #   ansible_host: 172.20.20.x  # Update with actual IP from DHCP

  vars:
    ansible_user: ansible
    ansible_become: true
    ansible_python_interpreter: /usr/bin/python3

# Proxmox host for delegated tasks
proxmox_hosts:
  hosts:
    pve1:
      ansible_host: 172.20.20.11
      ansible_user: root
