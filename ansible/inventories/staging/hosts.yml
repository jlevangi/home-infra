---
# Staging K3s Cluster Inventory
all:
  vars:
    ansible_user: pierce
    ansible_ssh_private_key_file: ~/.ssh/pierce
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

k3s_cluster_stage:
  children:
    k3s_cluster_stage_master:
      hosts:
        k3s-stage-node-1:
          ansible_host: 172.20.20.111
    k3s_cluster_stage_workers:
      hosts:
        k3s-stage-node-2:
          ansible_host: 172.20.20.112
        k3s-stage-node-3:
          ansible_host: 172.20.20.113