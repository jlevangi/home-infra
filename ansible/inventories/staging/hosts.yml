---
# Staging K3s Cluster Inventory
# Connection defaults (private_key_file) live in ansible/ansible.cfg.
# ansible_user must be pinned here (not just in ansible.cfg's remote_user)
# because roles reference it as a Jinja2 variable (e.g. k3s_user in
# k3s_cluster.yml). Flip to ansible after rebuilding with ci_user=ansible.
all:
  vars:
    ansible_user: pierce
    ansible_python_interpreter: /usr/bin/python3

k3s_cluster_stage:
  children:
    k3s_cluster_stage_master:
      hosts:
        k3s-stage-cp-1:
          ansible_host: 172.20.21.114
        k3s-stage-cp-2:
          ansible_host: 172.20.21.115
        k3s-stage-cp-3:
          ansible_host: 172.20.21.116
    k3s_cluster_stage_workers:
      hosts:
        k3s-stage-worker-1:
          ansible_host: 172.20.21.111
        k3s-stage-worker-2:
          ansible_host: 172.20.21.112
        k3s-stage-worker-3:
          ansible_host: 172.20.21.113
