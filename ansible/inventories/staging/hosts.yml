---
# Staging K3s Cluster Inventory
# Connection defaults (remote_user, private_key_file) live in ansible/ansible.cfg.
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3

k3s_cluster_stage:
  children:
    k3s_cluster_stage_master:
      hosts:
        k3s-stage-node-1:
          ansible_host: 172.20.20.111
    k3s_cluster_stage_workers:
      hosts:
        k3s-stage-node-2:
          ansible_host: 172.20.20.112
        k3s-stage-node-3:
          ansible_host: 172.20.20.113
