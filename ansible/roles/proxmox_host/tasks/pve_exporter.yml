---
- name: Install python3-venv for isolated pve-exporter environment
  ansible.builtin.apt:
    name: python3-venv
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create isolated virtualenv for pve-exporter
  ansible.builtin.pip:
    name: prometheus-pve-exporter
    state: present
    virtualenv: /opt/prometheus-pve-exporter/venv
    virtualenv_command: python3 -m venv

- name: Ensure pve-exporter config directory exists
  ansible.builtin.file:
    path: "{{ proxmox_host_pve_exporter_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy pve-exporter configuration
  ansible.builtin.template:
    src: pve-exporter.yml.j2
    dest: "{{ proxmox_host_pve_exporter_config_path }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart Prometheus PVE exporter

- name: Install pve-exporter systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus-pve-exporter.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus exporter for Proxmox VE
      Documentation=https://github.com/prometheus-pve/prometheus-pve-exporter

      [Service]
      Restart=always
      RestartSec=10
      User=root
      ExecStart=/opt/prometheus-pve-exporter/venv/bin/pve_exporter --config.file {{ proxmox_host_pve_exporter_config_path }}

      [Install]
      WantedBy=multi-user.target
  notify: Restart Prometheus PVE exporter

- name: Enable and start pve-exporter
  ansible.builtin.systemd:
    name: prometheus-pve-exporter
    enabled: true
    state: restarted
    daemon_reload: true
  register: pve_exporter_start

- name: Wait for pve-exporter to become ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ proxmox_host_pve_exporter_listen_port }}/pve"
    return_content: false
    status_code: 200
  register: pve_exporter_check
  until: pve_exporter_check.status == 200
  retries: 10
  delay: 3
