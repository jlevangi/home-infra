---
# K3s Apps Role Defaults
# These control the behavior of the k3s-apps role

# Enable/disable individual application deployments
deploy_bookstack: true
deploy_homepage: true
deploy_vaultwarden: true

# Default application configurations
application_timezone: "America/New_York"

# Role behavior controls
# Force redeploy settings are now controlled by group_vars for each environment:
# - Production (k3s_cluster.yml): force_redeploy defaults to false for safety
# - Test (k3s_test_cluster.yml): force_redeploy defaults to true for clean testing
# These defaults provide fallback values if not set in group_vars
bookstack_force_redeploy: false 
homepage_force_redeploy: false
vaultwarden_force_redeploy: false