- name: Include BookStack deployment
  include_tasks: bookstack.yml
  when: deploy_bookstack | default(false)

- name: Include Homepage Dashboard deployment
  include_tasks: homepage.yml
  when: deploy_homepage | default(false)

- name: Include Vaultwarden deployment
  include_tasks: vaultwarden.yml
  when: deploy_vaultwarden | default(false)