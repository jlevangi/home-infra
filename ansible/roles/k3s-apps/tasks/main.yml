---
# Main task file for applications deployment
# Using nested applications configuration

- name: Include BookStack deployment
  include_tasks: apps/bookstack.yml
  when: applications.bookstack.deploy | default(false)

- name: Include Homepage Dashboard deployment
  include_tasks: apps/homepage.yml
  when: applications.homepage.deploy | default(false)

- name: Include Vaultwarden deployment
  include_tasks: apps/vaultwarden.yml
  when: applications.vaultwarden.deploy | default(false)

- name: Include Pocket ID deployment
  include_tasks: apps/pocketid.yml
  when: applications.pocketid.deploy | default(false)

- name: Include Plex Media Server deployment
  include_tasks: apps/plex.yml
  when: applications.plex.deploy | default(false)