# ansible/roles/k3s-apps/tasks/cleanup_task.yml
# Generic cleanup task - variables should be passed when including this task
# Expected variables:
# - app_name: Display name of the application
# - k8s_namespace: Kubernetes namespace to clean up  
# - kubeconfig_path: Path to kubeconfig file
# - force_redeploy_var: Variable name to check for force redeploy
# - master_group: Inventory group name for master nodes
# - additional_cleanup_tasks: (optional) List of additional cleanup tasks

- name: "Clean up existing {{ app_name }} deployment (if requested)"
  block:
    - name: "Check if {{ app_name }} namespace exists for cleanup"
      shell: |
        kubectl --kubeconfig={{ kubeconfig_path }} get namespace {{ k8s_namespace }}
      register: cleanup_namespace_check
      failed_when: false
      changed_when: false

    # First: Execute additional cleanup tasks (PVCs, PVs) before namespace deletion
    - name: "Execute additional cleanup tasks for {{ app_name }}"
      shell: |
        kubectl --kubeconfig={{ kubeconfig_path }} {{ item.command }}
      loop: "{{ additional_cleanup_tasks | default([]) }}"
      when: 
        - cleanup_namespace_check.rc == 0
        - additional_cleanup_tasks is defined
      loop_control:
        label: "{{ item.name }}"

    # Second: Delete all resources in the namespace to avoid finalizer issues
    - name: "Delete all resources in {{ k8s_namespace }} namespace"
      shell: |
        echo "🗑️ Deleting all resources in {{ k8s_namespace }} namespace..."
        kubectl --kubeconfig={{ kubeconfig_path }} delete all --all -n {{ k8s_namespace }} --ignore-not-found=true --timeout=60s || true
        kubectl --kubeconfig={{ kubeconfig_path }} delete pvc --all -n {{ k8s_namespace }} --ignore-not-found=true --timeout=120s || true
        kubectl --kubeconfig={{ kubeconfig_path }} delete configmap --all -n {{ k8s_namespace }} --ignore-not-found=true --timeout=30s || true
        kubectl --kubeconfig={{ kubeconfig_path }} delete secret --all -n {{ k8s_namespace }} --ignore-not-found=true --timeout=30s || true
        echo "✅ Resource deletion complete"
      when: cleanup_namespace_check.rc == 0

    # Third: Force cleanup stuck PVCs by removing finalizers if needed
    - name: "Force cleanup stuck PVCs in {{ k8s_namespace }} (if any)"
      shell: |
        echo "🔧 Checking for stuck PVCs in {{ k8s_namespace }}..."
        # Get list of PVCs that might be stuck
        STUCK_PVCS=$(kubectl --kubeconfig={{ kubeconfig_path }} get pvc -n {{ k8s_namespace }} -o name 2>/dev/null || echo "")
        if [ ! -z "$STUCK_PVCS" ]; then
          echo "Found stuck PVCs, removing finalizers..."
          for pvc in $STUCK_PVCS; do
            kubectl --kubeconfig={{ kubeconfig_path }} patch $pvc -n {{ k8s_namespace }} -p '{"metadata":{"finalizers":null}}' --type=merge || true
          done
          echo "✅ Finalizer cleanup complete"
        else
          echo "✅ No stuck PVCs found"
        fi
      when: cleanup_namespace_check.rc == 0

    # Fourth: Delete the namespace
    - name: "Remove existing {{ app_name }} deployment"
      shell: |
        echo "🧹 Cleaning up existing {{ app_name }} deployment..."
        kubectl --kubeconfig={{ kubeconfig_path }} delete namespace {{ k8s_namespace }} --ignore-not-found=true
        echo "Waiting for namespace deletion to complete..."
        kubectl --kubeconfig={{ kubeconfig_path }} wait --for=delete namespace/{{ k8s_namespace }} --timeout=300s || echo "⚠️ Namespace deletion timed out, but continuing..."
        echo "✅ Cleanup complete"
      when: cleanup_namespace_check.rc == 0
      register: cleanup_result

    - name: "Display cleanup results for {{ app_name }}"
      debug:
        msg: |
          🧹 {{ app_name }} Cleanup Results:
          {% if cleanup_namespace_check.rc == 0 %}
          ✅ Existing deployment found and removed
          📝 Namespace '{{ k8s_namespace }}' has been deleted
          💾 Note: Persistent data in NFS storage is preserved
          {% else %}
          ℹ️  No existing deployment found - proceeding with fresh install
          {% endif %}
  when: 
    - inventory_hostname == groups[master_group][0]
    - vars[force_redeploy_var] | default(false) | bool