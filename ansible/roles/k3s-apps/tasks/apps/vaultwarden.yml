---
# Optional cleanup task - only runs when vaultwarden_force_redeploy is true
- name: Include cleanup task for Vaultwarden
  include_tasks: cleanup_task.yml
  vars:
    app_name: "Vaultwarden"
    k8s_namespace: "vaultwarden"
    kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"
    force_redeploy_var: "vaultwarden_force_redeploy"
    additional_cleanup_tasks:
      - name: "Delete Vaultwarden PVC"
        command: "delete pvc vaultwarden-data-pvc -n vaultwarden --ignore-not-found=true"
      - name: "Delete Vaultwarden PV"
        command: "delete pv vaultwarden-data-pv --ignore-not-found=true"

# Get NFS user context using shared task
- name: Get NFS user context for Vaultwarden
  include_tasks: shared/get_nfs_user_context.yml

# Create application directories using shared task
- name: Create Vaultwarden storage directories
  include_tasks: shared/create_app_directories.yml
  vars:
    app_name: "vaultwarden"
    app_directories:
      - "apps/vaultwarden"

# Apply Kubernetes resources using shared task
- name: Apply Vaultwarden Kubernetes resources
  include_tasks: shared/apply_k8s_resources.yml
  vars:
    app_name: "vaultwarden"
    k8s_resources:
      - name: "Namespace"
        template: "common/namespace.yaml.j2"
        vars:
          app_name: "vaultwarden"
      - name: "PV/PVC"
        template: "common/pv-pvc.yaml.j2"
        vars:
          app_name: "vaultwarden"
          volume_name: "data"
          volume_size: "{{ vaultwarden_data_storage_size }}"
          host_path: "{{ base_storage_path }}/apps/vaultwarden"
      - name: "ConfigMap"
        template: "vaultwarden/configmap.yaml.j2"
        vars:
          app_name: "vaultwarden"
      - name: "Service"
        template: "vaultwarden/service.yaml.j2"
        vars:
          app_name: "vaultwarden"
          service_port: "{{ vaultwarden_service_port }}"
      - name: "Deployment"
        template: "vaultwarden/deployment.yaml.j2"
        vars:
          app_name: "vaultwarden"
          image:
            registry: "docker.io"
            repository: "vaultwarden/server"
            tag: "latest"
            pullPolicy: "IfNotPresent"
          pvc_name: "vaultwarden-data"
          uid: "{{ dynamic_nfs_uid }}"
          gid: "{{ dynamic_nfs_gid }}"
          service_port: "{{ vaultwarden_service_port }}"
          smtp_host: "{{ smtp_host }}"
          smtp_port: "{{ smtp_port }}"
          smtp_security: "{{ smtp_security }}"
          smtp_username: "{{ smtp_username }}"
          smtp_password: "{{ smtp_password }}"
          admin_token: "{{ vaultwarden_admin_token }}"
      - name: "Ingress"
        template: "common/ingress.yaml.j2"
        vars:
          service_name: "vaultwarden"
          app_url: "{{ vaultwarden_app_url }}"
          service_port: "{{ vaultwarden_service_port }}"
  when: inventory_hostname == groups[master_group][0]

# Apply optional secret if enabled
- name: Apply Vaultwarden Secret (if enabled)
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml apply -f -
  args:
    stdin: "{{ lookup('template', 'vaultwarden/secret.yaml.j2') }}"
  vars:
    app_name: "vaultwarden"
  when: 
    - inventory_hostname == groups[master_group][0] 
    - vaultwarden_secret_enabled | default(false)

# Wait for deployment readiness using shared task
- name: Wait for Vaultwarden deployment readiness
  include_tasks: shared/wait_for_deployment.yml
  vars:
    app_name: "vaultwarden"
    k8s_namespace: "vaultwarden"
    deployment_checks:
      - name: "Vaultwarden deployment"
        type: "deployment" 
        selector: "app=vaultwarden"
        timeout: 300

# Final deployment information
- name: Display Vaultwarden deployment summary
  debug:
    msg: |
      🚀 Vaultwarden Deployment Complete!

      🔗 Access Information:
      - Application URL: {{ vaultwarden_app_url }}
      - Admin URL: {{ vaultwarden_app_url }}/admin
      - Service Port: {{ vaultwarden_service_port }}

      📁 Storage:
      - Data Path: /mnt/k3s-storage/apps/vaultwarden
      - Size: {{ vaultwarden_data_storage_size }}
      👤 Running as: {{ vault_nfs_username | default('k3s-app-user') }} ({{ dynamic_nfs_uid }}:{{ dynamic_nfs_gid }})

      🔒 Security:
      - Admin token configured via vault
      - HTTPS ingress enabled

      📊 Management Commands:
      kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get all -n vaultwarden
      kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml logs -n vaultwarden deployment/vaultwarden

      ⚠️  Next Steps:
      1. Ensure DNS points {{ vaultwarden_app_url | regex_replace('https://') }} to your Traefik load balancer
      2. Access admin panel at {{ vaultwarden_app_url }}/admin using the vault admin token
      3. Configure SMTP settings in the admin panel for user invitations
  when: inventory_hostname in groups[master_group]