---
# Optional cleanup task - only runs when vaultwarden_force_redeploy is true
- name: Include cleanup task for Vaultwarden
  include_tasks: cleanup_task.yml
  vars:
    app_name: "Vaultwarden"
    k8s_namespace: "vaultwarden"
    kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"
    force_redeploy_var: "applications.vaultwarden.force_redeploy"
    # PVC cleanup is now handled automatically by cleanup_task.yml

# Check if Vaultwarden deployment already exists (to respect force_redeploy flag)
- name: Check if Vaultwarden namespace exists
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get namespace vaultwarden
  register: vaultwarden_namespace_check
  failed_when: false
  changed_when: false
  when: inventory_hostname == groups[master_group][0]

# Set deployment condition: deploy if force_redeploy is true OR namespace doesn't exist
- name: Set Vaultwarden deployment condition
  set_fact:
    should_deploy_vaultwarden: "{{ applications.vaultwarden.force_redeploy | default(false) | bool or vaultwarden_namespace_check.rc != 0 }}"
  when: inventory_hostname == groups[master_group][0]

- name: Display Vaultwarden deployment decision
  debug:
    msg: |
      📋 Vaultwarden Deployment Decision:
      Force redeploy setting: {{ applications.vaultwarden.force_redeploy | default(false) }}
      Namespace exists: {{ 'Yes' if vaultwarden_namespace_check.rc == 0 else 'No' }}
      Will deploy: {{ should_deploy_vaultwarden | default(false) }}
      Reason: {{ 'Force redeploy enabled' if applications.vaultwarden.force_redeploy | default(false) | bool else ('Namespace missing - first deployment' if vaultwarden_namespace_check.rc != 0 else 'Skipping - deployment exists and force_redeploy=false') }}
  when: inventory_hostname == groups[master_group][0]

# Deploy Vaultwarden resources (only if should_deploy_vaultwarden is true)
- name: Deploy Vaultwarden Kubernetes resources
  block:
    # Apply Kubernetes resources using shared task
    - name: Apply Vaultwarden Kubernetes resources
      include_tasks: shared/apply_k8s_resources.yml
      vars:
        app_name: "vaultwarden"
        k8s_resources:
          - name: "Namespace"
            template: "common/namespace.yaml.j2"
            vars:
              app_name: "vaultwarden"
          - name: "ResourceQuota"
            template: "common/resource-quota.yaml.j2"
            vars:
              app_name: "vaultwarden"
              max_namespace_storage: "{{ applications.vaultwarden.storage.max_namespace_storage | default('50Gi') }}"
              max_pvcs: "{{ global_max_pvcs | default('10') }}"
          - name: "LimitRange"
            template: "common/limit-range.yaml.j2"
            vars:
              app_name: "vaultwarden"
              max_pvc_size: "{{ applications.vaultwarden.storage.max_pvc_size | default('30Gi') }}"
              min_pvc_size: "{{ global_min_pvc_size | default('10Mi') }}"
              default_pvc_size: "{{ applications.vaultwarden.storage.default_pvc_size | default('5Gi') }}"
          - name: "PV/PVC (Dynamic)"
            template: "common/pv-pvc.yaml.j2"
            vars:
              app_name: "vaultwarden"
              volume_name: "data"
              initial_volume_size: "{{ applications.vaultwarden.storage.data_initial_size | default('100Mi') }}"
          - name: "ConfigMap"
            template: "vaultwarden/configmap.yaml.j2"
            vars:
              app_name: "vaultwarden"
          - name: "Service"
            template: "vaultwarden/service.yaml.j2"
            vars:
              app_name: "vaultwarden"
              service_port: "{{ applications.vaultwarden.service_port }}"
          - name: "Deployment"
            template: "vaultwarden/deployment.yaml.j2"
            vars:
              app_name: "vaultwarden"
              image:
                registry: "docker.io"
                repository: "vaultwarden/server"
                tag: "latest"
                pullPolicy: "IfNotPresent"
              pvc_name: "vaultwarden-data"
              service_port: "{{ applications.vaultwarden.service_port }}"
          - name: "Ingress"
            template: "common/ingress.yaml.j2"
            vars:
              service_name: "vaultwarden"
              app_url: "{{ applications.vaultwarden.app_url }}"
              service_port: "{{ applications.vaultwarden.service_port }}"

    # Apply optional secret if enabled
    - name: Apply Vaultwarden Secret (if enabled)
      shell: |
        kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml apply -f -
      args:
        stdin: "{{ lookup('template', 'vaultwarden/secret.yaml.j2') }}"
      vars:
        app_name: "vaultwarden"
      when: vaultwarden_secret_enabled | default(false)

    # Wait for deployment readiness using shared task
    - name: Wait for Vaultwarden deployment readiness
      include_tasks: shared/wait_for_deployment.yml
      vars:
        app_name: "vaultwarden"
        k8s_namespace: "vaultwarden"
        deployment_checks:
          - name: "Vaultwarden deployment"
            type: "deployment" 
            selector: "app=vaultwarden"
            timeout: 300

    # Final deployment information
    - name: Display Vaultwarden deployment summary
      debug:
        msg: |
          🚀 Vaultwarden Deployment Complete!

          🔗 Access Information:
          - Application URL: {{ applications.vaultwarden.app_url }}
          - Admin URL: {{ applications.vaultwarden.app_url }}/admin
          - Service Port: {{ applications.vaultwarden.service_port }}

          📁 Storage:
          - Storage: Longhorn distributed storage
          - Size: {{ applications.vaultwarden.storage.default_pvc_size | default('5Gi') }}
          👤 Running as: Container default user (Longhorn storage)

          🔒 Security:
          - Admin token configured via vault
          - HTTPS ingress enabled

          📊 Management Commands:
          kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get all -n vaultwarden
          kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml logs -n vaultwarden deployment/vaultwarden

          ⚠️  Next Steps:
          1. Ensure DNS points {{ applications.vaultwarden.app_url | regex_replace('https://') }} to your Traefik load balancer
          2. Access admin panel at {{ applications.vaultwarden.app_url }}/admin using the vault admin token
          3. Configure SMTP settings in the admin panel for user invitations

  when: 
    - inventory_hostname == groups[master_group][0]
    - should_deploy_vaultwarden | default(false) | bool

# Show skip message when deployment is skipped
- name: Display Vaultwarden skip message
  debug:
    msg: |
      ⏭️ Vaultwarden Deployment Skipped
      
      📋 Reason: force_redeploy is false and Vaultwarden namespace already exists
      📊 Current Status: Vaultwarden is already deployed
      
      💡 To redeploy Vaultwarden, set vaultwarden_force_redeploy: true in your group_vars
      🔍 To check current status: kubectl get all -n vaultwarden
  when: 
    - inventory_hostname == groups[master_group][0]
    - not (should_deploy_vaultwarden | default(false) | bool)