---
# Homepage Dashboard Deployment
# Converted from Docker Compose using Kompose as base, enhanced for production K3s

# Optional cleanup task
- name: Include cleanup task for Homepage
  include_tasks: cleanup_task.yml
  vars:
    app_name: "Homepage"
    k8s_namespace: "homepage"
    kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"
    force_redeploy_var: "homepage_force_redeploy"

# Get NFS user context using shared task
- name: Get NFS user context for Homepage
  include_tasks: shared/get_nfs_user_context.yml

# Create application directories using shared task
- name: Create Homepage storage directories
  include_tasks: shared/create_app_directories.yml
  vars:
    app_name: "homepage"
    app_directories:
      - "apps/homepage/config"

# PVC cleanup is now handled by the generic cleanup_task.yml

# Apply Kubernetes resources using shared task
- name: Apply Homepage Kubernetes resources
  include_tasks: shared/apply_k8s_resources.yml
  vars:
    app_name: "homepage"
    k8s_resources:
      - name: "Namespace"
        template: "common/namespace.yaml.j2"
        vars:
          app_name: homepage
      - name: "ResourceQuota"
        template: "common/resource-quota.yaml.j2"
        vars:
          app_name: homepage
          max_namespace_storage: "{{ homepage_max_namespace_storage | default('10Gi') }}"
          max_pvcs: "{{ global_max_pvcs | default('10') }}"
      - name: "LimitRange"
        template: "common/limit-range.yaml.j2"
        vars:
          app_name: homepage
          max_pvc_size: "{{ homepage_max_pvc_size | default('5Gi') }}"
          min_pvc_size: "{{ global_min_pvc_size | default('10Mi') }}"
          default_pvc_size: "{{ homepage_default_pvc_size | default('1Gi') }}"
      - name: "ConfigMap"
        template: "homepage/configmap.yaml.j2"
      - name: "PV/PVC (Dynamic)"
        template: "common/pv-pvc.yaml.j2"
        vars:
          app_name: homepage
          volume_name: config
          initial_volume_size: "{{ default_initial_volume_size | default('100Mi') }}"
      - name: "Deployment"
        template: "homepage/deployment.yaml.j2"
      - name: "Service"
        template: "homepage/service.yaml.j2"
      - name: "Ingress"
        template: "common/ingress.yaml.j2"
        vars:
          service_name: "homepage"
          app_url: "{{ homepage_app_url }}"
          service_port: "{{ homepage_service_port }}"
  when: inventory_hostname == groups[master_group][0]

# Wait for deployment readiness using shared task
- name: Wait for Homepage deployment readiness
  include_tasks: shared/wait_for_deployment.yml
  vars:
    app_name: "homepage"
    k8s_namespace: "homepage"
    deployment_checks:
      - name: "Homepage deployment"
        type: "deployment"
        selector: "app=homepage"
        timeout: 300

# Final deployment information
- name: Display Homepage deployment summary
  debug:
    msg: |
      🏠 Homepage Dashboard Deployment Complete!
      
      📝 Namespace: homepage
      🌐 Service URL: {{ homepage_app_url }}
      📦 Storage: /mnt/k3s-storage/apps/homepage
      👤 Running as: {{ vault_nfs_username | default('k3s-app-user') }} ({{ dynamic_nfs_uid }}:{{ dynamic_nfs_gid }})
      
      📊 Management Commands:
      kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get all -n homepage
      kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml logs -n homepage deployment/homepage
      kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml port-forward -n homepage svc/homepage 8080:3000
  when: inventory_hostname == groups[master_group][0]
