---
# Plex Media Server Deployment using Reusable Helm Template

- name: Deploy Plex Media Server using reusable Helm template
  include_tasks: ../shared/helm_app_deployment.yml
  vars:
    app_name: "plex"
    helm_config:
      repo_name: "{{ app_definitions.plex.helm.repo_name }}"
      repo_url: "{{ app_definitions.plex.helm.repo_url }}"
      chart_name: "{{ app_definitions.plex.helm.chart_name }}"
      release_name: "{{ app_definitions.plex.helm.release_name }}"
      namespace: "{{ app_definitions.plex.helm.namespace }}"
      chart_version: "{{ app_definitions.plex.helm.chart_version | default(omit) }}"
      values_template: "plex/helm-values.yaml.j2"
    app_config:
      force_redeploy: "{{ 'plex' in force_redeploy_apps }}"
      service_name: "{{ app_definitions.plex.service_name }}"
      app_url: "{{ app_definitions.plex.app_url }}"
      service_port: "{{ app_definitions.plex.service_port }}"
      storage: "{{ app_definitions.plex.storage }}"
      pod_selector: "app.kubernetes.io/name=plex-media-server"  # Plex-specific selector