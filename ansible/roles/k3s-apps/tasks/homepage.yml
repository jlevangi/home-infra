---
# Homepage Dashboard Deployment
# Converted from Docker Compose using Kompose as base, enhanced for production K3s

- name: Display Homepage deployment info
  debug:
    msg: |
      🏠 Homepage Dashboard Deployment:
      Using host path volumes with NFS backing
      - Host paths: /mnt/k3s-storage/apps/homepage
      - Service User: {{ vault_nfs_username | default('k3s-app-user') }}
      - App URL: {{ homepage_app_url | default('https://homepage.levangie.org') }}
      {% if homepage_force_redeploy | default(false) | bool %}
      🔄 Force redeploy mode: ON (will clean up existing deployment first)
      {% endif %}
  when: inventory_hostname == groups['k3s_master'][0]

# Optional cleanup task
- name: Clean up existing Homepage deployment (if requested)
  block:
    - name: Check if Homepage namespace exists for cleanup
      shell: |
        kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get namespace homepage
      register: cleanup_namespace_check
      ignore_errors: yes

    - name: Remove existing Homepage deployment
      shell: |
        echo "🧹 Cleaning up existing Homepage deployment..."
        kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml delete namespace homepage --ignore-not-found=true
        echo "Waiting for namespace deletion to complete..."
        kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml wait --for=delete namespace/homepage --timeout=300s || true
        echo "✅ Cleanup complete"
      when: cleanup_namespace_check.rc == 0
  when: 
    - inventory_hostname == groups['k3s_master'][0]
    - homepage_force_redeploy | default(false) | bool

- name: Check if Homepage namespace exists
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get namespace homepage
  register: namespace_check
  ignore_errors: yes
  when: inventory_hostname == groups['k3s_master'][0]

- name: Create Homepage namespace if needed
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml create namespace homepage
  when: 
    - inventory_hostname == groups['k3s_master'][0]
    - namespace_check.rc != 0

- name: Get k3s-app-user UID and GID from system
  shell: |
    id -u {{ vault_nfs_username }} 2>/dev/null
  register: nfs_user_uid_result
  when: inventory_hostname == groups['k3s_master'][0]

- name: Get k3s-app-user GID from system  
  shell: |
    id -g {{ vault_nfs_username }} 2>/dev/null || echo "100"
  register: nfs_user_gid_result
  when: inventory_hostname == groups['k3s_master'][0]

- name: Set NFS user UID/GID for host path permissions
  set_fact:
    dynamic_nfs_uid: "{{ nfs_user_uid_result.stdout | default('1024') }}"
    dynamic_nfs_gid: "{{ nfs_user_gid_result.stdout | default('100') }}"
  when: inventory_hostname == groups['k3s_master'][0]

- name: Create Homepage storage directories on NFS
  file:
    path: "/mnt/k3s-storage/apps/homepage/config"
    state: directory
    owner: "{{ vault_nfs_username | default('k3s-app-user') }}"
    group: "users"
    mode: '0755'
    recurse: yes
  when: inventory_hostname == groups['k3s_master'][0]

- name: Copy Homepage configuration files to storage
  copy:
    src: "{{ item }}"
    dest: "/mnt/k3s-storage/apps/homepage/config/"
    owner: "{{ vault_nfs_username | default('k3s-app-user') }}"
    group: "users"
    mode: '0644'
  with_fileglob:
    - "docker-compose/homepage/*.yaml"
    - "docker-compose/homepage/*.yml"
  when: inventory_hostname == groups['k3s_master'][0]

- name: Check Homepage configuration files were copied
  shell: |
    echo "📂 Homepage config files in storage:"
    ls -la /mnt/k3s-storage/apps/homepage/config/
  register: homepage_config_files
  when: inventory_hostname == groups['k3s_master'][0]

- name: Display Homepage configuration files
  debug:
    msg: "{{ homepage_config_files.stdout_lines }}"
  when: inventory_hostname == groups['k3s_master'][0]

- name: Apply Homepage Kubernetes manifests
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml apply -f -
  args:
    stdin: "{{ lookup('template', 'homepage-hostpath.yaml.j2') }}"
  when: inventory_hostname == groups['k3s_master'][0]
  register: homepage_deploy_result

- name: Force restart Homepage deployment to pick up config changes
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml rollout restart deployment/homepage -n homepage
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml rollout status deployment/homepage -n homepage --timeout=300s
  when: inventory_hostname == groups['k3s_master'][0]
  register: homepage_restart_result

- name: Wait for Homepage deployment to be ready
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml wait --for=condition=available --timeout=300s deployment/homepage -n homepage
  when: inventory_hostname == groups['k3s_master'][0]
  register: homepage_ready_result

- name: Get Homepage service status
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get svc,pods -n homepage -o wide
  register: homepage_status
  when: inventory_hostname == groups['k3s_master'][0]

- name: Display Homepage deployment results
  debug:
    msg: |
      🏠 Homepage Dashboard Deployment Results:
      {% if homepage_deploy_result.rc == 0 %}
      ✅ Deployment successful
      📝 Namespace: homepage
      🌐 Service URL: {{ homepage_app_url | default('https://homepage.levangie.org') }}
      📦 Storage: /mnt/k3s-storage/apps/homepage
      👤 Running as: {{ vault_nfs_username | default('k3s-app-user') }} ({{ dynamic_nfs_uid }}:{{ dynamic_nfs_gid }})
      
      📊 Service Status:
      {{ homepage_status.stdout }}
      {% else %}
      ❌ Deployment failed
      Error: {{ homepage_deploy_result.stderr }}
      {% endif %}
  when: inventory_hostname == groups['k3s_master'][0]
