---
# Homepage Dashboard Deployment
# Converted from Docker Compose using Kompose as base, enhanced for production K3s

- name: Display Homepage deployment info
  debug:
    msg: |
      🏠 Homepage Dashboard Deployment:
      Using host path volumes with NFS backing
      - Host paths: /mnt/k3s-storage/apps/homepage
      - Service User: {{ vault_nfs_username | default('k3s-app-user') }}
      - App URL: {{ homepage_app_url | default('https://homepage.levangie.org') }}
      {% if homepage_force_redeploy | default(false) | bool %}
      🔄 Force redeploy mode: ON (will clean up existing deployment first)
      {% endif %}
  when: inventory_hostname == groups['k3s_master'][0]

# Optional cleanup task
- name: Clean up existing Homepage deployment (if requested)
  block:
    - name: Check if Homepage namespace exists for cleanup
      shell: |
        kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get namespace homepage
      register: cleanup_namespace_check
      ignore_errors: yes

    - name: Remove existing Homepage deployment
      shell: |
        echo "🧹 Cleaning up existing Homepage deployment..."
        kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml delete namespace homepage --ignore-not-found=true
        echo "Waiting for namespace deletion to complete..."
        kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml wait --for=delete namespace/homepage --timeout=300s || true
        echo "✅ Cleanup complete"
      when: cleanup_namespace_check.rc == 0
  when: 
    - inventory_hostname == groups['k3s_master'][0]
    - homepage_force_redeploy | default(false) | bool



- name: Get k3s-app-user UID and GID from system
  shell: |
    id -u {{ vault_nfs_username }} 2>/dev/null
  register: nfs_user_uid_result
  when: inventory_hostname == groups['k3s_master'][0]

- name: Get k3s-app-user GID from system  
  shell: |
    id -g {{ vault_nfs_username }} 2>/dev/null || echo "100"
  register: nfs_user_gid_result
  when: inventory_hostname == groups['k3s_master'][0]

- name: Set NFS user UID/GID for host path permissions
  set_fact:
    dynamic_nfs_uid: "{{ nfs_user_uid_result.stdout | default('1024') }}"
    dynamic_nfs_gid: "{{ nfs_user_gid_result.stdout | default('100') }}"
  when: inventory_hostname == groups['k3s_master'][0]

- name: Create Homepage storage directories on NFS
  shell: |
    mkdir -p "/mnt/k3s-storage/apps/homepage/config"
    # Skip Synology metadata files when changing ownership
    find "/mnt/k3s-storage/apps/homepage/config" \( -name "@eaDir" -o -name "*@SynoEAStream" \) -prune -o -type f -exec chown {{ vault_nfs_username | default('k3s-app-user') }}:users {} \; 2>/dev/null || true
    find "/mnt/k3s-storage/apps/homepage/config" \( -name "@eaDir" -o -name "*@SynoEAStream" \) -prune -o -type d -exec chown {{ vault_nfs_username | default('k3s-app-user') }}:users {} \; 2>/dev/null || true
    chmod -R 755 "/mnt/k3s-storage/apps/homepage/config" 2>/dev/null || true
  when: inventory_hostname == groups['k3s_master'][0]

- name: Apply Homepage namespace
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml apply -f -
  args:
    stdin: "{{ lookup('template', 'common/namespace.yaml.j2') }}"
  vars:
    app_name: homepage
  when: inventory_hostname == groups['k3s_master'][0]

- name: Apply Homepage ConfigMap
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml apply -f -
  args:
    stdin: "{{ lookup('template', 'homepage/configmap.yaml.j2') }}"
  when: inventory_hostname == groups['k3s_master'][0]

- name: Apply Homepage PV/PVC cleanup and creation
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml delete pvc homepage-config-pvc -n homepage --ignore-not-found=true
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml delete pv homepage-config-pv --ignore-not-found=true
    sleep 3
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml apply -f -
  args:
    stdin: "{{ lookup('template', 'common/pv-pvc.yaml.j2') }}"
  vars:
    app_name: homepage
    volume_name: config
    volume_size: 1Gi
    host_path: /mnt/k3s-storage/apps/homepage/config
  when: inventory_hostname == groups['k3s_master'][0]

- name: Apply Homepage Deployment
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml apply -f -
  args:
    stdin: "{{ lookup('template', 'homepage/deployment.yaml.j2') }}"
  when: inventory_hostname == groups['k3s_master'][0]
  register: homepage_deploy_result

- name: Apply Homepage Service
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml apply -f -
  args:
    stdin: "{{ lookup('template', 'homepage/service.yaml.j2') }}"
  when: inventory_hostname == groups['k3s_master'][0]

- name: Apply Homepage Ingress
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml apply -f -
  args:
    stdin: "{{ lookup('template', 'common/ingress.yaml.j2') }}"
  vars:
    service_name: "homepage"
    app_url: "{{ homepage_app_url }}"
    service_port: "{{ homepage_service_port }}"
  when: inventory_hostname == groups['k3s_master'][0]

- name: Force restart Homepage deployment to pick up config changes
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml rollout restart deployment/homepage -n homepage
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml rollout status deployment/homepage -n homepage --timeout=300s
  when: inventory_hostname == groups['k3s_master'][0]
  register: homepage_restart_result

- name: Check what Homepage container sees in /app/config
  shell: |
    echo "🔍 Checking Homepage container's view of config directory:"
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml exec -n homepage deployment/homepage -- ls -la /app/config/ || echo "Could not access /app/config in container"
    echo ""
    echo "📂 Checking if specific config files are mounted correctly:"
    for file in bookmarks.yaml services.yaml settings.yaml widgets.yaml; do
      if kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml exec -n homepage deployment/homepage -- test -f "/app/config/$file"; then
        echo "✅ $file exists in container"
        kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml exec -n homepage deployment/homepage -- ls -la "/app/config/$file"
      else
        echo "❌ $file missing in container"
      fi
    done
    echo ""
    echo "🔧 Checking PVC mount info:"
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml exec -n homepage deployment/homepage -- mount | grep /app/config || echo "No mount info for /app/config"
  register: homepage_container_config_check
  when: inventory_hostname == groups['k3s_master'][0]
  ignore_errors: yes

- name: Display Homepage container config check results
  debug:
    msg: "{{ homepage_container_config_check.stdout_lines | default(['No container config check results']) }}"
  when: inventory_hostname == groups['k3s_master'][0]

- name: Check PV/PVC status for Homepage
  shell: |
    echo "🔍 Checking PersistentVolume and PersistentVolumeClaim status:"
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get pv,pvc -n homepage
    echo ""
    echo "📂 Checking PVC details:"
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml describe pvc homepage-config-pvc -n homepage
  register: homepage_pvc_status
  when: inventory_hostname == groups['k3s_master'][0]
  ignore_errors: yes

- name: Display PV/PVC status
  debug:
    msg: "{{ homepage_pvc_status.stdout_lines | default(['No PVC status results']) }}"
  when: inventory_hostname == groups['k3s_master'][0]

- name: Wait for Homepage deployment to be ready
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml wait --for=condition=available --timeout=300s deployment/homepage -n homepage
  when: inventory_hostname == groups['k3s_master'][0]
  register: homepage_ready_result

- name: Get Homepage service status
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get svc,pods -n homepage -o wide
  register: homepage_status
  when: inventory_hostname == groups['k3s_master'][0]

- name: Display Homepage deployment results
  debug:
    msg: |
      🏠 Homepage Dashboard Deployment Results:
      {% if homepage_deploy_result.rc == 0 %}
      ✅ Deployment successful
      📝 Namespace: homepage
      🌐 Service URL: {{ homepage_app_url | default('https://homepage.levangie.org') }}
      📦 Storage: /mnt/k3s-storage/apps/homepage
      👤 Running as: {{ vault_nfs_username | default('k3s-app-user') }} ({{ dynamic_nfs_uid }}:{{ dynamic_nfs_gid }})
      
      📊 Service Status:
      {{ homepage_status.stdout }}
      {% else %}
      ❌ Deployment failed
      Error: {{ homepage_deploy_result.stderr }}
      {% endif %}
  when: inventory_hostname == groups['k3s_master'][0]
