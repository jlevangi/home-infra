---
# Shared task for waiting for deployment readiness
# This task standardizes deployment readiness checks across all apps
#
# Required variables:
# - app_name: Name of the application (e.g., "bookstack", "vaultwarden")
# - k8s_namespace: Kubernetes namespace where app is deployed
# - deployment_checks: List of deployments/resources to wait for
#   Each check should have:
#   - name: Display name
#   - type: Type of resource (deployment, pod, etc.)
#   - selector: Label selector for the resource
#   - timeout: Timeout in seconds (optional, defaults to 300s)
#
# Example deployment_checks:
# deployment_checks:
#   - name: "{{ app_name }} pods"
#     type: "pod"
#     selector: "app={{ app_name }}"
#     timeout: 600
#   - name: "{{ app_name }}-mariadb pods"
#     type: "pod"
#     selector: "app={{ app_name }}-mariadb"
#     timeout: 300

- name: Wait for {{ app_name }} deployments to be ready
  shell: |
    echo "Waiting for {{ item.name }} to be ready..."
    {% if item.type == 'deployment' %}
    # First check if deployment exists, then wait for it
    if kubectl get deployment -l {{ item.selector }} -n {{ k8s_namespace }} --no-headers | grep -q .; then
      kubectl wait --for=condition=available {{ item.type }} -l {{ item.selector }} -n {{ k8s_namespace }} --timeout={{ item.timeout | default('300') }}s
    else
      echo "No {{ item.type }} found with selector {{ item.selector }} in namespace {{ k8s_namespace }}"
      exit 1
    fi
    {% else %}
    # First check if resources exist, then wait for them
    if kubectl get {{ item.type }} -l {{ item.selector }} -n {{ k8s_namespace }} --no-headers | grep -q .; then
      kubectl wait --for=condition=Ready {{ item.type }} -l {{ item.selector }} -n {{ k8s_namespace }} --timeout={{ item.timeout | default('300') }}s
    else
      echo "No {{ item.type }} found with selector {{ item.selector }} in namespace {{ k8s_namespace }}"
      exit 1
    fi
    {% endif %}
  loop: "{{ deployment_checks }}"
  loop_control:
    label: "{{ item.name }}"
  register: wait_results
  ignore_errors: yes
  failed_when: false  # Don't fail the entire deployment if wait fails
  when: inventory_hostname == groups[master_group][0]

- name: Show {{ app_name }} status if wait failed
  shell: |
    echo "Current {{ app_name }} resource status:"
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get pods -n {{ k8s_namespace }} -o wide
    echo "Recent events:"
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get events -n {{ k8s_namespace }} --sort-by='.lastTimestamp' | tail -10
    echo "Container logs (last 20 lines):"
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml logs -n {{ k8s_namespace }} -l app={{ app_name }} --tail=20 || echo "No logs available"
  when: 
    - inventory_hostname == groups[master_group][0]
    - wait_results.results | selectattr('rc', 'ne', 0) | list | length > 0

- name: Get final {{ app_name }} deployment status
  shell: |
    kubectl --kubeconfig=/etc/rancher/k3s/k3s.yaml get pods,svc,ingress -n {{ k8s_namespace }}
  register: final_status
  ignore_errors: yes
  when: inventory_hostname == groups[master_group][0]

- name: Display {{ app_name }} deployment readiness results
  debug:
    msg: |
      ⏱️ {{ app_name }} Deployment Readiness Results:
      
      {% for result in wait_results.results %}
      {{ loop.index }}. {{ result.item.name }}: {{ 'Ready' if result.rc == 0 else 'Not Ready - Check logs' }}
      {% endfor %}
      
      📊 Final Resource Status:
      {{ final_status.stdout if final_status.rc == 0 else 'Unable to get status' }}
  when: inventory_hostname == groups[master_group][0]