---
# Shared task for creating NFS application directories
# This task is reused across all application deployments
#
# Required variables:
# - app_name: Name of the application (e.g., "bookstack", "vaultwarden")
# - app_directories: List of directories to create relative to {{ base_storage_path }}/
#   Example: ["apps/bookstack", "database/bookstack"]
# - dynamic_nfs_uid: UID for directory ownership (from get_nfs_user_context.yml)
# - dynamic_nfs_gid: GID for directory ownership (from get_nfs_user_context.yml)

- name: Verify NFS mount points exist on K3s nodes
  stat:
    path: "{{ base_storage_path }}/apps"
  register: nfs_mount_check
  failed_when: false

- name: Display NFS mount status
  debug:
    msg: |
      🔍 NFS Mount Point Check:
      {% if nfs_mount_check.stat.exists %}
      ✅ {{ base_storage_path }} is mounted
      {% else %}
      ❌ {{ base_storage_path }} not found - ensure NFS is mounted during K3s setup
      {% endif %}

- name: Check if {{ app_name }} directories exist
  stat:
    path: "{{ base_storage_path }}/{{ item }}"
  loop: "{{ app_directories }}"
  register: directory_check
  when: 
    - nfs_mount_check.stat.exists
    - inventory_hostname == groups[master_group][0]

- name: Create {{ app_name }} directories on mounted NFS storage (single node)
  shell: |
    mkdir -p "{{ base_storage_path }}/{{ item.item }}"
    # Skip Synology metadata files when changing ownership
    find "{{ base_storage_path }}/{{ item.item }}" \( -name "@eaDir" -o -name "*@SynoEAStream" \) -prune -o -type f -exec chown {{ dynamic_nfs_uid | default('1024') }}:{{ dynamic_nfs_gid | default('100') }} {} \; 2>/dev/null || true
    find "{{ base_storage_path }}/{{ item.item }}" \( -name "@eaDir" -o -name "*@SynoEAStream" \) -prune -o -type d -exec chown {{ dynamic_nfs_uid | default('1024') }}:{{ dynamic_nfs_gid | default('100') }} {} \; 2>/dev/null || true
    chmod -R 755 "{{ base_storage_path }}/{{ item.item }}" 2>/dev/null || true
  loop: "{{ directory_check.results | default([]) }}"
  become: yes
  register: directory_creation
  when: 
    - nfs_mount_check.stat.exists
    - inventory_hostname == groups[master_group][0]
    - not item.stat.exists

- name: Display {{ app_name }} directory creation results
  debug:
    msg: |
      📁 {{ app_name }} Directory Setup Complete:
      {% for dir in app_directories %}
      - {{ base_storage_path }}/{{ dir }} ({{ dynamic_nfs_uid }}:{{ dynamic_nfs_gid }})
      {% endfor %}
      
      💾 Storage Architecture:
      Using host path volumes with NFS backing
      - No NFS CSI driver needed (direct host mount approach)
      - Static PersistentVolumes with hostPath configuration
      - Service User: {{ vault_nfs_username | default('k3s-app-user') }}
  when: inventory_hostname == groups[master_group][0]