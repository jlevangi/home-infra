---
# =============================================================================
# Restore a single Longhorn volume from backup
# =============================================================================
# This task file is included from k3s-restore-from-backup.yml
#
# Required variables:
#   restore_volume:
#     volume_name: Name of the volume in the backup (e.g., bookstack-app-restored-volume)
#     backup_id: Backup ID to restore from (e.g., backup-3b243ab8bef24d36)
#     backup_url: Full backup URL from Longhorn
#   restore_namespace: Target namespace for the PVC
#   restore_pvc_name: Target PVC name
#   pvc_size: Size of the PVC (e.g., "500Mi", "1Gi")
#   pvc_size_bytes: Size in bytes for Longhorn Volume CRD
# =============================================================================

- name: "Restore {{ restore_volume.volume_name }}"
  block:
    - name: "Display restore info for {{ restore_volume.volume_name }}"
      debug:
        msg: |
          Restoring volume: {{ restore_volume.volume_name }}
          From backup: {{ restore_volume.backup_id }}
          Target namespace: {{ restore_namespace }}
          Target PVC: {{ restore_pvc_name }}
          Size: {{ pvc_size }} ({{ pvc_size_bytes }} bytes)

    # ==========================================================================
    # STEP 1: Find and delete any pods holding this PVC, then delete the PVC
    # ==========================================================================
    # We work at the pod level rather than scaling Deployments/StatefulSets,
    # because the master nodes don't have jq, and pod-level cleanup is uniform
    # across Deployment/STS/raw Pod. Workload controllers will recreate pods,
    # but those will block on Pending PVC until we recreate it below.
    - name: Find pods using this PVC
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pods -n {{ restore_namespace }} -o json 2>/dev/null | python3 -c "
        import json, sys
        try:
            data = json.load(sys.stdin)
        except Exception:
            sys.exit(0)
        target = '{{ restore_pvc_name }}'
        for p in data.get('items', []):
            for v in (p.get('spec', {}).get('volumes') or []):
                pc = v.get('persistentVolumeClaim') or {}
                if pc.get('claimName') == target:
                    print(p['metadata']['name'])
                    break
        "
      register: affected_pods
      failed_when: false
      changed_when: false

    - name: Display affected pods
      debug:
        msg: "Pods to delete: {{ affected_pods.stdout_lines | default([]) }}"

    - name: Delete pods using this PVC
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl delete pod {{ item }} -n {{ restore_namespace }} --grace-period=30 --wait=false
      loop: "{{ affected_pods.stdout_lines | default([]) }}"
      failed_when: false

    # ==========================================================================
    # STEP 2: Delete existing PVC and PV (force-clear finalizer if stuck)
    # ==========================================================================
    - name: Check if PVC exists
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pvc {{ restore_pvc_name }} -n {{ restore_namespace }} -o jsonpath='{.spec.volumeName}' 2>/dev/null
      register: existing_pv_name
      failed_when: false
      changed_when: false

    - name: Delete existing PVC
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl delete pvc {{ restore_pvc_name }} -n {{ restore_namespace }} --wait=true --timeout=30s
      when: existing_pv_name.rc == 0
      register: pvc_deleted
      failed_when: false

    # If the pvc-protection finalizer is still attached because a pod was
    # recreated by a controller before delete completed, strip it.
    - name: Force-remove finalizer if PVC still present
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pvc {{ restore_pvc_name }} -n {{ restore_namespace }} >/dev/null 2>&1 && \
        KUBECONFIG={{ kubeconfig }} kubectl patch pvc {{ restore_pvc_name }} -n {{ restore_namespace }} \
          --type=json -p='[{"op":"remove","path":"/metadata/finalizers"}]' || true
      when: existing_pv_name.rc == 0
      failed_when: false
      changed_when: false

    - name: Wait for PVC fully removed
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pvc {{ restore_pvc_name }} -n {{ restore_namespace }} >/dev/null 2>&1 && echo "exists" || echo "gone"
      register: pvc_check
      until: pvc_check.stdout == "gone"
      retries: 12
      delay: 5
      when: existing_pv_name.rc == 0
      failed_when: false
      changed_when: false

    - name: Delete existing PV if it was manually created
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl delete pv {{ restore_pvc_name | regex_replace('-pvc$', '-pv') }} --wait=false 2>/dev/null || true
      failed_when: false
      changed_when: false

    # Longhorn CSI finalizers (external-provisioner, external-attacher) can pin
    # a PV in Terminating when the underlying Longhorn volume is being replaced.
    # Force-remove them so the PV actually goes away before we recreate it.
    - name: Force-remove finalizers from stuck PV
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pv {{ restore_pvc_name | regex_replace('-pvc$', '-pv') }} >/dev/null 2>&1 && \
        KUBECONFIG={{ kubeconfig }} kubectl patch pv {{ restore_pvc_name | regex_replace('-pvc$', '-pv') }} \
          --type=json -p='[{"op":"remove","path":"/metadata/finalizers"}]' 2>/dev/null || true
      failed_when: false
      changed_when: false

    - name: Wait for PV fully removed
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pv {{ restore_pvc_name | regex_replace('-pvc$', '-pv') }} >/dev/null 2>&1 && echo "exists" || echo "gone"
      register: pv_check
      until: pv_check.stdout == "gone"
      retries: 12
      delay: 5
      failed_when: false
      changed_when: false

    # ==========================================================================
    # STEP 3: Create Longhorn Volume from backup (READ-ONLY on NFS)
    # ==========================================================================
    - name: Generate restored volume name
      set_fact:
        restored_volume_name: "{{ restore_pvc_name | regex_replace('-pvc$', '') }}"

    - name: Delete any existing restored volume with same name
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl delete volume {{ restored_volume_name }} -n longhorn-system --wait=true --timeout=60s 2>/dev/null || true
      failed_when: false

    - name: Create Longhorn Volume from backup
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl apply -f - <<'EOF'
        apiVersion: longhorn.io/v1beta2
        kind: Volume
        metadata:
          name: {{ restored_volume_name }}
          namespace: longhorn-system
        spec:
          frontend: blockdev
          size: "{{ pvc_size_bytes }}"
          numberOfReplicas: {{ longhorn_replica_count | default(2) }}
          fromBackup: "{{ restore_volume.backup_url }}"
        EOF
      register: volume_created

    - name: Wait for Longhorn volume to be ready
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get volume {{ restored_volume_name }} -n longhorn-system -o jsonpath='{.status.state}' 2>/dev/null
      register: volume_state
      until: volume_state.stdout in ['attached', 'detached']
      retries: 60
      delay: 5

    # Robustness only becomes 'healthy' after the volume is attached and replicas
    # come up — which doesn't happen until a pod mounts the PVC. Waiting here
    # blocks the entire restore loop on a state that cannot transition. Skip it.

    # ==========================================================================
    # STEP 4: Create PV and PVC bound to the restored volume
    # ==========================================================================
    - name: Generate PV name
      set_fact:
        restored_pv_name: "{{ restore_pvc_name | regex_replace('-pvc$', '-pv') }}"

    - name: Create PV for restored volume
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl apply -f - <<'EOF'
        apiVersion: v1
        kind: PersistentVolume
        metadata:
          name: {{ restored_pv_name }}
        spec:
          capacity:
            storage: {{ pvc_size }}
          volumeMode: Filesystem
          accessModes:
            - ReadWriteOnce
          persistentVolumeReclaimPolicy: Delete
          storageClassName: longhorn
          csi:
            driver: driver.longhorn.io
            fsType: ext4
            volumeHandle: {{ restored_volume_name }}
        EOF
      register: pv_created

    - name: Ensure target namespace exists
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl create namespace {{ restore_namespace }} --dry-run=client -o yaml | KUBECONFIG={{ kubeconfig }} kubectl apply -f -
      register: ns_ensured
      changed_when: "'created' in ns_ensured.stdout"

    - name: Create PVC bound to restored PV
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl apply -f - <<'EOF'
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: {{ restore_pvc_name }}
          namespace: {{ restore_namespace }}
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: {{ pvc_size }}
          storageClassName: longhorn
          volumeName: {{ restored_pv_name }}
        EOF
      register: pvc_created

    - name: Wait for PVC to be bound
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pvc {{ restore_pvc_name }} -n {{ restore_namespace }} -o jsonpath='{.status.phase}'
      register: pvc_phase
      until: pvc_phase.stdout == 'Bound'
      retries: 30
      delay: 5

    # Workload controllers (Deployment/STS/etc.) recreate pods automatically
    # once we delete them above; the new pods will bind to the freshly
    # restored PVC. No explicit scale-up step is needed.

    - name: "Restore complete for {{ restore_volume.volume_name }}"
      debug:
        msg: |
          ====================================================
          Volume Restored Successfully
          ====================================================
          Source Volume: {{ restore_volume.volume_name }}
          Source Backup: {{ restore_volume.backup_id }}
          Restored Volume: {{ restored_volume_name }}
          Target PV: {{ restored_pv_name }}
          Target PVC: {{ restore_pvc_name }}
          Namespace: {{ restore_namespace }}
          ====================================================
