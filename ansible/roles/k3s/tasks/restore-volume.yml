---
# =============================================================================
# Restore a single Longhorn volume from backup
# =============================================================================
# This task file is included from k3s-restore-from-backup.yml
#
# Required variables:
#   restore_volume:
#     volume_name: Name of the volume in the backup (e.g., bookstack-app-restored-volume)
#     backup_id: Backup ID to restore from (e.g., backup-3b243ab8bef24d36)
#     backup_url: Full backup URL from Longhorn
#   restore_namespace: Target namespace for the PVC
#   restore_pvc_name: Target PVC name
#   pvc_size: Size of the PVC (e.g., "500Mi", "1Gi")
#   pvc_size_bytes: Size in bytes for Longhorn Volume CRD
# =============================================================================

- name: "Restore {{ restore_volume.volume_name }}"
  block:
    - name: "Display restore info for {{ restore_volume.volume_name }}"
      debug:
        msg: |
          Restoring volume: {{ restore_volume.volume_name }}
          From backup: {{ restore_volume.backup_id }}
          Target namespace: {{ restore_namespace }}
          Target PVC: {{ restore_pvc_name }}
          Size: {{ pvc_size }} ({{ pvc_size_bytes }} bytes)

    - name: Find workload controllers referencing this PVC
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get deployment,statefulset -n {{ restore_namespace }} -o json 2>/dev/null | python3 -c "
        import json, sys
        try:
            data = json.load(sys.stdin)
        except Exception:
            print('[]')
            sys.exit(0)
        target = '{{ restore_pvc_name }}'
        matches = []
        for item in data.get('items', []):
            volumes = (((item.get('spec') or {}).get('template') or {}).get('spec') or {}).get('volumes') or []
            if not any((v.get('persistentVolumeClaim') or {}).get('claimName') == target for v in volumes):
                continue
            spec = item.get('spec') or {}
            matches.append({
                'kind': (item.get('kind') or '').lower(),
                'name': (item.get('metadata') or {}).get('name'),
                'replicas': spec.get('replicas', 1),
            })
        print(json.dumps(matches))
        "
      register: workload_controllers_raw
      failed_when: false
      changed_when: false

    - name: Parse workload controllers referencing this PVC
      set_fact:
        workload_controllers: "{{ workload_controllers_raw.stdout | default('[]') | from_json }}"

    - name: Display workload controllers to scale down
      debug:
        msg: "Workload controllers to scale down: {{ workload_controllers | default([]) }}"

    - name: Scale workload controllers down to zero
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl scale {{ item.kind }}/{{ item.name }} -n {{ restore_namespace }} --replicas=0
      loop: "{{ workload_controllers }}"
      loop_control:
        label: "{{ item.kind }}/{{ item.name }}"
      when: workload_controllers | length > 0
      failed_when: false

    # ==========================================================================
    # STEP 1: Find and delete any pods holding this PVC, then delete the PVC
    # ==========================================================================
    # We work at the pod level rather than scaling Deployments/StatefulSets,
    # because the master nodes don't have jq, and pod-level cleanup is uniform
    # across Deployment/STS/raw Pod. Workload controllers will recreate pods,
    # but those will block on Pending PVC until we recreate it below.
    - name: Find pods using this PVC
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pods -n {{ restore_namespace }} -o json 2>/dev/null | python3 -c "
        import json, sys
        try:
            data = json.load(sys.stdin)
        except Exception:
            sys.exit(0)
        target = '{{ restore_pvc_name }}'
        for p in data.get('items', []):
            for v in (p.get('spec', {}).get('volumes') or []):
                pc = v.get('persistentVolumeClaim') or {}
                if pc.get('claimName') == target:
                    print(p['metadata']['name'])
                    break
        "
      register: affected_pods
      failed_when: false
      changed_when: false

    - name: Display affected pods
      debug:
        msg: "Pods to delete: {{ affected_pods.stdout_lines | default([]) }}"

    - name: Delete pods using this PVC
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl delete pod {{ item }} -n {{ restore_namespace }} --grace-period=30 --wait=false
      loop: "{{ affected_pods.stdout_lines | default([]) }}"
      failed_when: false

    # ==========================================================================
    # STEP 2: Delete existing PVC and PV (force-clear finalizer if stuck)
    # ==========================================================================
    - name: Check if PVC exists
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pvc {{ restore_pvc_name }} -n {{ restore_namespace }} -o jsonpath='{.spec.volumeName}' 2>/dev/null
      register: existing_pv_name
      failed_when: false
      changed_when: false

    - name: Capture existing PVC backup policy labels
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pvc {{ restore_pvc_name }} -n {{ restore_namespace }} -o json 2>/dev/null | python3 -c 'import json, sys; data=json.load(sys.stdin); labels=data.get("metadata", {}).get("labels", {}); keep={k: v for k, v in labels.items() if k.startswith("recurring-job-group.longhorn.io/") or k.startswith("recurring-job.longhorn.io/")}; print(json.dumps(keep, sort_keys=True))'
      register: existing_pvc_backup_labels_raw
      failed_when: false
      changed_when: false

    - name: Parse existing PVC backup policy labels
      set_fact:
        restore_backup_labels: "{{ existing_pvc_backup_labels_raw.stdout | default('{}') | from_json }}"

    - name: Fail when target PVC has no backup policy labels
      fail:
        msg: >-
          No recurring-job backup labels were found on {{ restore_namespace }}/{{ restore_pvc_name }} before restore.
          Refusing to restore without an explicit backup policy because the restored Longhorn Volume would not be selected by backup jobs.
      when: restore_backup_labels | length == 0

    - name: Capture existing Longhorn volume handle from bound PV
      shell: |
        if [ -n "{{ existing_pv_name.stdout | default('') }}" ]; then
          KUBECONFIG={{ kubeconfig }} kubectl get pv {{ existing_pv_name.stdout }} -o jsonpath='{.spec.csi.volumeHandle}' 2>/dev/null
        fi
      register: existing_volume_handle
      failed_when: false
      changed_when: false

    - name: Delete existing PVC
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl delete pvc {{ restore_pvc_name }} -n {{ restore_namespace }} --wait=true --timeout=30s
      when: existing_pv_name.rc == 0
      register: pvc_deleted
      failed_when: false

    # If the pvc-protection finalizer is still attached because a pod was
    # recreated by a controller before delete completed, strip it.
    - name: Force-remove finalizer if PVC still present
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pvc {{ restore_pvc_name }} -n {{ restore_namespace }} >/dev/null 2>&1 && \
        KUBECONFIG={{ kubeconfig }} kubectl patch pvc {{ restore_pvc_name }} -n {{ restore_namespace }} \
          --type=json -p='[{"op":"remove","path":"/metadata/finalizers"}]' || true
      when: existing_pv_name.rc == 0
      failed_when: false
      changed_when: false

    - name: Wait for PVC fully removed
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pvc {{ restore_pvc_name }} -n {{ restore_namespace }} >/dev/null 2>&1 && echo "exists" || echo "gone"
      register: pvc_check
      until: pvc_check.stdout == "gone"
      retries: 12
      delay: 5
      when: existing_pv_name.rc == 0
      failed_when: false
      changed_when: false

    - name: Force-remove finalizer from PVC if it still exists after retries
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pvc {{ restore_pvc_name }} -n {{ restore_namespace }} >/dev/null 2>&1 && \
        KUBECONFIG={{ kubeconfig }} kubectl patch pvc {{ restore_pvc_name }} -n {{ restore_namespace }} \
          --type=json -p='[{"op":"remove","path":"/metadata/finalizers"}]' || true
      when:
        - existing_pv_name.rc == 0
        - pvc_check.stdout != "gone"
      failed_when: false
      changed_when: false

    - name: Re-check PVC removal after force-clearing finalizer
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pvc {{ restore_pvc_name }} -n {{ restore_namespace }} >/dev/null 2>&1 && echo "exists" || echo "gone"
      register: pvc_check_after_force
      until: pvc_check_after_force.stdout == "gone"
      retries: 12
      delay: 5
      when:
        - existing_pv_name.rc == 0
        - pvc_check.stdout != "gone"
      failed_when: false
      changed_when: false

    - name: Delete existing PV if it was manually created
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl delete pv {{ restore_pvc_name | regex_replace('-pvc$', '-pv') }} --wait=false 2>/dev/null || true
      failed_when: false
      changed_when: false

    # Longhorn CSI finalizers (external-provisioner, external-attacher) can pin
    # a PV in Terminating when the underlying Longhorn volume is being replaced.
    # Force-remove them so the PV actually goes away before we recreate it.
    - name: Force-remove finalizers from stuck PV
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pv {{ restore_pvc_name | regex_replace('-pvc$', '-pv') }} >/dev/null 2>&1 && \
        KUBECONFIG={{ kubeconfig }} kubectl patch pv {{ restore_pvc_name | regex_replace('-pvc$', '-pv') }} \
          --type=json -p='[{"op":"remove","path":"/metadata/finalizers"}]' 2>/dev/null || true
      failed_when: false
      changed_when: false

    - name: Wait for PV fully removed
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pv {{ restore_pvc_name | regex_replace('-pvc$', '-pv') }} >/dev/null 2>&1 && echo "exists" || echo "gone"
      register: pv_check
      until: pv_check.stdout == "gone"
      retries: 12
      delay: 5
      failed_when: false
      changed_when: false

    # ==========================================================================
    # STEP 3: Create Longhorn Volume from backup (READ-ONLY on NFS)
    # ==========================================================================
    - name: Generate restored volume name
      set_fact:
        restored_volume_name: "{{ existing_volume_handle.stdout | default('') | trim | default(restore_pvc_name | regex_replace('-pvc$', ''), true) }}"

    - name: Delete any existing restored volume with same name
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl delete volume {{ restored_volume_name }} -n longhorn-system --wait=true --timeout=60s 2>/dev/null || true
      failed_when: false

    # Longhorn v1.11.2 has an admission-webhook bug that rejects Volume CRs
    # created with `spec.fromBackup` set: "cannot get backup volume for backup
    # target  and volume X: backup target name and volume name cannot be
    # empty". Workaround: create the Volume *without* fromBackup first (the
    # webhook only validates fromBackup on CREATE, not UPDATE), then patch
    # fromBackup so the restore controller picks it up.
    - name: Create Longhorn Volume (empty)
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl apply -f - <<'EOF'
        apiVersion: longhorn.io/v1beta2
        kind: Volume
        metadata:
          name: {{ restored_volume_name }}
          namespace: longhorn-system
        spec:
          frontend: blockdev
          size: "{{ pvc_size_bytes }}"
          numberOfReplicas: {{ longhorn_replica_count | default(2) }}
          backupTargetName: default
        EOF
      register: volume_created

    - name: Patch Longhorn Volume with fromBackup (triggers restore)
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl -n longhorn-system patch volume {{ restored_volume_name }} \
          --type=merge -p '{"spec":{"fromBackup":"{{ restore_volume.backup_url }}"}}'
      register: volume_restore_patched

    # Longhorn v1.11.2: the volume controller doesn't propagate the
    # BackupVolume CR name into engine.spec.backupVolume after fromBackup
    # is patched on the volume. Without engine.spec.backupVolume the engine
    # logs "backup volume is empty for backup restoration" and the restore
    # never downloads any data (status stuck at RestoreInProgress with
    # actualSize=0 forever). Two manual fixes are needed:
    #
    #   1. Set the `backup-volume` LABEL on the volume CR so the volume
    #      controller's ReconcileBackupVolumeState can find the BV CR.
    #   2. Patch engine.spec.backupVolume directly (the controller respects
    #      the engine spec if it's already set; without this it stays empty).
    #
    # Look up the matching BackupVolume CR by status.volumeName == this
    # volume's name. There can be more than one BackupVolume CR per volume
    # name across history (after a rebuild); pick the one whose
    # lastBackupName matches the one we're restoring.
    - name: Look up BackupVolume CR for this volume
      # Uses kubectl jsonpath since `jq` isn't available on cp nodes.
      # Picks the first BackupVolume whose spec.volumeName matches the
      # restored volume's name. There may be more than one if a volume
      # has been rebuilt; this picks any, which is generally correct
      # because the BackupVolume controller dedupes by volumeName.
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl -n longhorn-system \
          get backupvolumes \
          -o jsonpath='{range .items[?(@.spec.volumeName=="{{ restored_volume_name }}")]}{.metadata.name}{"\n"}{end}' \
          | head -1
      register: backup_volume_cr_name
      changed_when: false

    - name: Build Longhorn Volume label arguments from PVC backup policy
      set_fact:
        restore_volume_label_args: >-
          backup-volume={{ backup_volume_cr_name.stdout }}
          {% for item in restore_backup_labels | dict2items %}
          {{ item.key }}={{ item.value }}
          {% endfor %}
      when: backup_volume_cr_name.stdout | length > 0

    - name: Apply backup metadata and PVC backup policy labels to Volume CR
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl -n longhorn-system label \
          volume {{ restored_volume_name }} \
          {{ restore_volume_label_args }} \
          --overwrite
      when:
        - backup_volume_cr_name.stdout | length > 0
        - restore_volume_label_args | default('') | trim | length > 0

    - name: Wait for engine to exist
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl -n longhorn-system \
          get engine \
          -o jsonpath='{range .items[?(@.spec.volumeName=="{{ restored_volume_name }}")]}{.metadata.name}{"\n"}{end}' \
          | head -1
      register: engine_name
      until: engine_name.stdout | length > 0
      retries: 20
      delay: 3
      changed_when: false

    - name: Patch engine.spec.backupVolume so restore actually starts
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl -n longhorn-system patch engine {{ engine_name.stdout }} \
          --type=merge -p '{"spec":{"backupVolume":"{{ backup_volume_cr_name.stdout }}"}}'
      when:
        - engine_name.stdout | length > 0
        - backup_volume_cr_name.stdout | length > 0

    - name: Wait for Longhorn volume to be ready
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get volume {{ restored_volume_name }} -n longhorn-system -o jsonpath='{.status.state}' 2>/dev/null
      register: volume_state
      until: volume_state.stdout in ['attached', 'detached']
      retries: 60
      delay: 5

    # Robustness only becomes 'healthy' after the volume is attached and replicas
    # come up — which doesn't happen until a pod mounts the PVC. Waiting here
    # blocks the entire restore loop on a state that cannot transition. Skip it.

    # ==========================================================================
    # STEP 4: Create PV and PVC bound to the restored volume
    # ==========================================================================
    - name: Generate PV name
      set_fact:
        restored_pv_name: "{{ restore_pvc_name | regex_replace('-pvc$', '-pv') }}"

    - name: Create PV for restored volume
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl apply -f - <<'EOF'
        apiVersion: v1
        kind: PersistentVolume
        metadata:
          name: {{ restored_pv_name }}
        spec:
          capacity:
            storage: {{ pvc_size }}
          volumeMode: Filesystem
          accessModes:
            - ReadWriteOnce
          persistentVolumeReclaimPolicy: Delete
          storageClassName: longhorn
          csi:
            driver: driver.longhorn.io
            fsType: ext4
            volumeHandle: {{ restored_volume_name }}
        EOF
      register: pv_created

    - name: Ensure target namespace exists
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl create namespace {{ restore_namespace }} --dry-run=client -o yaml | KUBECONFIG={{ kubeconfig }} kubectl apply -f -
      register: ns_ensured
      changed_when: "'created' in ns_ensured.stdout"

    - name: Build restored PVC metadata labels from backup policy
      set_fact:
        restore_pvc_label_yaml: |-
          {% for item in restore_backup_labels | dict2items %}
            {{ item.key }}: {{ item.value | to_json }}
          {% endfor %}

    - name: Create PVC bound to restored PV
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl apply -f - <<'EOF'
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: {{ restore_pvc_name }}
          namespace: {{ restore_namespace }}
          labels:
        {{ restore_pvc_label_yaml | indent(4, true) }}
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: {{ pvc_size }}
          storageClassName: longhorn
          volumeName: {{ restored_pv_name }}
        EOF
      register: pvc_created

    - name: Wait for PVC to be bound
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl get pvc {{ restore_pvc_name }} -n {{ restore_namespace }} -o jsonpath='{.status.phase}'
      register: pvc_phase
      until: pvc_phase.stdout == 'Bound'
      retries: 30
      delay: 5

    - name: Verify restored Longhorn Volume backup policy labels
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl -n longhorn-system get volume {{ restored_volume_name }} -o json | python3 -c '
        import json, sys
        expected = {{ restore_backup_labels | to_json }}
        labels = json.load(sys.stdin).get("metadata", {}).get("labels", {})
        missing = {k: v for k, v in expected.items() if labels.get(k) != v}
        if missing:
            print(json.dumps({"missing": missing, "labels": labels}, sort_keys=True))
            sys.exit(1)
        print(json.dumps({"ok": True, "labels": {k: labels[k] for k in expected}}, sort_keys=True))
        '
      register: restored_volume_policy_check
      changed_when: false

    - name: "Restore complete for {{ restore_volume.volume_name }}"
      debug:
        msg: |
          ====================================================
          Volume Restored Successfully
          ====================================================
          Source Volume: {{ restore_volume.volume_name }}
          Source Backup: {{ restore_volume.backup_id }}
          Restored Volume: {{ restored_volume_name }}
          Target PV: {{ restored_pv_name }}
          Target PVC: {{ restore_pvc_name }}
          Namespace: {{ restore_namespace }}
          ====================================================
  always:
    - name: Scale workload controllers back to original replica counts
      shell: |
        KUBECONFIG={{ kubeconfig }} kubectl scale {{ item.kind }}/{{ item.name }} -n {{ restore_namespace }} --replicas={{ item.replicas }}
      loop: "{{ workload_controllers | default([]) }}"
      loop_control:
        label: "{{ item.kind }}/{{ item.name }}"
      when: (workload_controllers | default([])) | length > 0
      failed_when: false
