---
# K3s worker installation tasks

- name: Check if K3s agent is already installed and running
  shell: |
    systemctl is-active k3s-agent && k3s --version | head -1
  register: k3s_agent_status_check
  failed_when: false
  changed_when: false

- name: Determine if reinstall is needed
  set_fact:
    k3s_needs_install: "{{ k3s_agent_status_check.rc != 0 }}"

- name: Display current K3s agent status
  debug:
    msg: |
      K3s Agent Status: {{ 'Running' if k3s_agent_status_check.rc == 0 else 'Not running or not installed' }}
      Will reinstall: {{ k3s_needs_install }}
      {{ k3s_agent_status_check.stdout if k3s_agent_status_check.rc == 0 else 'Will proceed with installation' }}

- name: Download K3s installation script
  get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: '0755'
  when: k3s_needs_install

- name: Wait for master to be ready
  wait_for:
    port: 6443
    host: "{{ hostvars[groups[master_group][0]]['ansible_default_ipv4']['address'] }}"
    delay: 10
    timeout: 300
  when: k3s_needs_install

- name: Install K3s worker
  shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} \
    K3S_URL=https://{{ hostvars[groups[master_group][0]]['ansible_default_ipv4']['address'] }}:6443 \
    K3S_TOKEN={{ hostvars[groups[master_group][0]]['k3s_node_token'] }} \
    sh -s - agent {% if k3s_agent_args %}{{ k3s_agent_args | join(' ') }}{% endif %}
  register: k3s_worker_install
  failed_when: k3s_worker_install.rc != 0
  when: 
    - hostvars[groups[master_group][0]]['k3s_node_token'] is defined
    - k3s_needs_install

- name: Display K3s worker installation output
  debug:
    var: k3s_worker_install.stdout_lines
  when: k3s_worker_install is defined and not k3s_worker_install.skipped|default(false)

- name: Verify K3s agent service is running
  systemd:
    name: k3s-agent
    state: started
    enabled: yes
  become: yes
