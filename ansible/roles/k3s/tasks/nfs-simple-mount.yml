---
# Simplified NFS Host Mount Configuration
# This creates a simple, reliable NFS mount for K3s host path volumes

- name: Install NFS utilities
  package:
    name:
      - nfs-common
    state: present
  become: yes
  tags: nfs-mount

- name: Test NFS server connectivity
  shell: "ping -c 2 {{ nfs_server }}"
  register: nfs_ping
  failed_when: nfs_ping.rc != 0
  changed_when: false
  tags: nfs-mount

- name: Display NFS server connectivity
  debug:
    msg: "✅ NFS server {{ nfs_server }} is reachable"
  tags: nfs-mount

- name: Test NFS exports availability
  shell: "showmount -e {{ nfs_server }}"
  register: nfs_exports
  failed_when: nfs_exports.rc != 0
  changed_when: false
  tags: nfs-mount

- name: Display available NFS exports
  debug:
    msg: "📁 Available NFS exports: {{ nfs_exports.stdout_lines }}"
  tags: nfs-mount

- name: Check if {{ base_storage_path }} is already mounted
  shell: mountpoint -q "{{ base_storage_path }}"
  register: mount_check
  failed_when: false
  changed_when: false
  tags: nfs-mount

- name: Unmount existing {{ base_storage_path }} if mounted
  shell: umount "{{ base_storage_path }}"
  become: yes
  when: mount_check.rc == 0
  tags: nfs-mount

- name: Ensure {{ base_storage_path }} directory exists
  file:
    path: "{{ base_storage_path }}"
    state: directory
    mode: '0755'
  become: yes
  tags: nfs-mount

- name: Check if GID already exists
  shell: getent group {{ nfs_gid | default('100') }}
  register: gid_check
  failed_when: false
  changed_when: false
  tags: nfs-mount

- name: Check if group exists
  shell: getent group {{ nfs_gid | default('100') }}
  register: group_check
  failed_when: false
  changed_when: false
  tags: nfs-mount

- name: Get group name for GID 100
  shell: "getent group 100 | cut -d: -f1"
  register: gid_100_group
  failed_when: false
  changed_when: false
  tags: nfs-mount

- name: Create NFS service user for app access (using existing GID 100)
  user:
    name: "{{ nfs_user | default('k3s-app-user') }}"
    uid: "{{ nfs_uid | default('1024') }}"
    group: "{{ gid_100_group.stdout | default('users') }}"
    system: yes
    shell: /bin/false
    home: "/var/lib/{{ nfs_user | default('k3s-app-user') }}"
    create_home: no
    comment: "K3s NFS Service User - matches NFS server admin UID"
  become: yes
  tags: nfs-mount

- name: Verify service user creation
  shell: |
    echo "=== Service User Verification ==="
    id {{ nfs_user | default('k3s-app-user') }}
    echo "UID: $(id -u {{ nfs_user | default('k3s-app-user') }})"
    echo "GID: $(id -g {{ nfs_user | default('k3s-app-user') }})"
  register: service_user_verification
  become: yes
  tags: nfs-mount

- name: Display service user creation results
  debug:
    msg: |
      👤 NFS Service User Created:
      {{ service_user_verification.stdout }}
  tags: nfs-mount

- name: Mount NFS share to {{ base_storage_path }}
  shell: |
    mount -t nfs -o {{ nfs_mount_options }} {{ nfs_server }}:{{ nfs_path }} "{{ base_storage_path }}"
  become: yes
  register: mount_result
  tags: nfs-mount

- name: Verify mount is successful
  shell: |
    mountpoint "{{ base_storage_path }}" && echo "✅ Mount successful" || echo "❌ Mount failed"
    df -h "{{ base_storage_path }}"
  register: mount_verification
  become: yes
  tags: nfs-mount

- name: Display mount verification
  debug:
    msg: "{{ mount_verification.stdout_lines }}"
  tags: nfs-mount

- name: Add NFS mount to /etc/fstab for persistence
  lineinfile:
    path: /etc/fstab
    line: "{{ nfs_server }}:{{ nfs_path }} {{ base_storage_path }} nfs {{ nfs_mount_options }} 0 0"
    state: present
    backup: yes
  become: yes
  tags: nfs-mount

- name: Test NFS access with service user
  shell: |
    echo "Testing NFS access with service user {{ nfs_user | default('k3s-app-user') }}..."
    if sudo -u {{ nfs_user | default('k3s-app-user') }} touch "{{ base_storage_path }}"/.test-write-{{ nfs_user | default('k3s-app-user') }} 2>/dev/null; then
      echo "✅ Service user can write to NFS mount"
      sudo -u {{ nfs_user | default('k3s-app-user') }} rm -f "{{ base_storage_path }}"/.test-write-{{ nfs_user | default('k3s-app-user') }}
    else
      echo "❌ Service user cannot write to NFS mount"
      echo "Mount permissions:"
      ls -la "{{ base_storage_path }}"/
    fi
  register: nfs_access_test
  become: yes
  ignore_errors: yes
  tags: nfs-mount

- name: Display NFS mount setup completion
  debug:
    msg: |
      🎉 NFS Mount Setup Complete!
      📁 Mount Point: {{ base_storage_path }}
      🔗 NFS Share: {{ nfs_server }}:{{ nfs_path }}
      👤 Service User: {{ nfs_user | default('k3s-app-user') }} (UID:{{ nfs_uid | default('1024') }}, GID:{{ nfs_gid | default('100') }})
      💾 Added to /etc/fstab for persistence
      
      🔍 NFS Access Test Results:
      {{ nfs_access_test.stdout }}
      
      📋 Next Steps:
      - K3s applications can now use hostPath volumes pointing to {{ base_storage_path }}/
      - All apps will run with UID 1024 (NFS admin user) for proper NFS permissions
      - Basic directory structure will be created automatically
      
      💡 NFS Configuration Note:
      Your NFS server maps all operations to UID 1024 (admin user)
      This is a secure configuration that we're now matching in K3s
  when: inventory_hostname == groups[master_group][0]
  tags: nfs-mount

- name: Create basic K3s storage directory structure
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: "{{ nfs_user | default('k3s-app-user') }}"
    group: "{{ gid_100_group.stdout | default('users') }}"
  loop:
    - "{{ base_storage_path }}/apps"
    - "{{ base_storage_path }}/database"
    - "{{ base_storage_path }}/config"
    - "{{ base_storage_path }}/logs"
  become: yes
  ignore_errors: yes
  register: directory_structure_result
  when: not (skip_directory_creation | default(false))
  tags: nfs-mount

- name: Display directory structure creation results
  debug:
    msg: |
      {% if skip_directory_creation | default(false) %}
      📁 K3s Storage Directory Structure: SKIPPED
      💡 Directory creation skipped - mount will remain clean for external management
      {% else %}
      📁 K3s Storage Directory Structure:
      {% for result in directory_structure_result.results | default([]) %}
      - {{ result.path }}: {{ 'CREATED' if result.changed else 'EXISTS' }}{% if result.failed %} (FAILED - {{ result.msg }}){% endif %}
      {% endfor %}
      
      💡 Note: If directory creation failed, hostPath volumes will create them automatically with default permissions
      {% endif %}
  tags: nfs-mount