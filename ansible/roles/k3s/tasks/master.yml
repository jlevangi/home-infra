---
# K3s master installation tasks

- name: Check if K3s service is active
  command: systemctl is-active k3s
  register: k3s_service_status
  failed_when: false
  changed_when: false

- name: Check if K3s binary is installed
  command: k3s --version
  register: k3s_version_check
  failed_when: false
  changed_when: false

- name: Check if K3s kubeconfig exists
  stat:
    path: "{{ k3s_config_dir }}/k3s.yaml"
  register: k3s_kubeconfig_status

- name: Check if K3s API server is responding
  uri:
    url: "https://{{ ansible_default_ipv4.address }}:6443/version"
    method: GET
    validate_certs: no
    timeout: 10
  register: k3s_api_check
  ignore_errors: yes
  failed_when: false
  when:
    - k3s_service_status.rc == 0
    - k3s_kubeconfig_status.stat.exists

- name: Determine if reinstall is needed
  set_fact:
    k3s_service_healthy: "{{ k3s_service_status.rc == 0 and k3s_version_check.rc == 0 }}"
    k3s_api_healthy: "{{ (k3s_api_check.status | default(0)) in [200, 401] }}"
    k3s_installed_and_healthy: >-
      {{
        (k3s_service_status.rc == 0) and
        (k3s_version_check.rc == 0) and
        (k3s_kubeconfig_status.stat.exists | default(false)) and
        ((k3s_api_check.status | default(0)) in [200, 401])
      }}

- name: Decide whether K3s master installation is needed
  set_fact:
    k3s_needs_install: >-
      {{ not k3s_installed_and_healthy }}

- name: Display current K3s status
  debug:
    msg: |
      K3s Service: {{ 'Active' if k3s_service_healthy else 'Inactive or missing' }}
      Kubeconfig: {{ 'Present' if k3s_kubeconfig_status.stat.exists | default(false) else 'Missing' }}
      API Server: {{ 'Responding' if k3s_api_healthy else 'Not responding or not checked' }}
      Will reinstall: {{ k3s_needs_install }}
      {{ k3s_version_check.stdout if k3s_version_check.rc == 0 else 'Will proceed with installation' }}

- name: Determine first-master hostname
  set_fact:
    k3s_first_master: "{{ k3s_primary_master | default('') | trim if (k3s_primary_master | default('') | trim | length > 0) else groups[master_group][0] }}"
    k3s_is_first_master: "{{ inventory_hostname == (k3s_primary_master | default('') | trim if (k3s_primary_master | default('') | trim | length > 0) else groups[master_group][0]) }}"

- name: Resolve first-master API URL for joining masters
  set_fact:
    k3s_join_server_host: >-
      {{
        hostvars[k3s_first_master]['ansible_host']
        | default(hostvars[k3s_first_master]['inventory_hostname'])
      }}
    k3s_join_server_url: >-
      https://{{
        hostvars[k3s_first_master]['ansible_host']
        | default(hostvars[k3s_first_master]['inventory_hostname'])
      }}:{{ k3s_api_port | default(6443) }}

- name: Build k3s server args (init vs join)
  set_fact:
    k3s_effective_server_args: >-
      {{
        k3s_server_args + (
          ['--cluster-init'] if k3s_is_first_master
          else ['--server', k3s_join_server_url]
        ) + (
          ['--node-taint=' ~ k3s_master_workload_taint]
          if (k3s_master_workload_taint | default('') | length > 0)
          else []
        )
      }}

- name: Wait for first master API server before joining
  wait_for:
    port: "{{ k3s_api_port | default(6443) }}"
    host: "{{ k3s_join_server_host }}"
    timeout: 300
  when:
    - not k3s_is_first_master
    - k3s_needs_install

- name: Install K3s master
  shell: |
    {% if k3s_datastore_endpoint %}
    export K3S_DATASTORE_ENDPOINT='{{ k3s_datastore_endpoint }}'
    {% endif %}
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} \
    K3S_TOKEN={{ k3s_token }} \
    sh -s - server {{ k3s_effective_server_args | join(' ') }}
  register: k3s_install_result
  failed_when: k3s_install_result.rc != 0
  when: k3s_needs_install

- name: Display K3s installation output
  debug:
    var: k3s_install_result.stdout_lines
  when: k3s_install_result is defined and not k3s_install_result.skipped|default(false)

- name: Wait for K3s API server to be ready
  wait_for:
    port: 6443
    host: "{{ ansible_default_ipv4.address }}"
    delay: 5
    timeout: 120
  when: k3s_needs_install

- name: Verify K3s service is running
  systemd:
    name: k3s
    state: started
    enabled: yes
  become: yes

- name: Get node token
  slurp:
    src: "{{ k3s_data_dir }}/server/node-token"
  register: node_token

- name: Save node token
  set_fact:
    k3s_node_token: "{{ node_token.content | b64decode | trim }}"

- name: Store node token for workers
  set_fact:
    k3s_node_token: "{{ k3s_node_token }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups[worker_group] }}"
  when: k3s_is_first_master | default(true)

- name: Set kubeconfig permissions for non-sudo access
  file:
    path: "{{ k3s_config_dir }}/k3s.yaml"
    mode: '0644'
  become: yes

- name: Create .kube directory for user
  file:
    path: "/home/{{ k3s_user }}/.kube"
    state: directory
    owner: "{{ k3s_user }}"
    group: "{{ k3s_group }}"
    mode: '0755'
  become: yes

- name: Copy kubeconfig to user home directory
  copy:
    src: "{{ k3s_config_dir }}/k3s.yaml"
    dest: "/home/{{ k3s_user }}/.kube/config"
    owner: "{{ k3s_user }}"
    group: "{{ k3s_group }}"
    mode: '0644'
    remote_src: yes
  become: yes
