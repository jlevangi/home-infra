---
# Post-installation configuration tasks
- name: Create .kube directory for user
  file:
    path: "/home/{{ k3s_user }}/.kube"
    state: directory
    owner: "{{ k3s_user }}"
    group: "{{ k3s_group }}"
    mode: '0755'
  when: k3s_setup_kubeconfig

- name: Copy kubeconfig for user
  copy:
    src: "{{ k3s_config_dir }}/k3s.yaml"
    dest: "/home/{{ k3s_user }}/.kube/config"
    owner: "{{ k3s_user }}"
    group: "{{ k3s_group }}"
    mode: '0600'
    remote_src: yes
  when: k3s_setup_kubeconfig

- name: Update kubeconfig server address
  replace:
    path: "/home/{{ k3s_user }}/.kube/config"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: >-
      https://{{
        (k3s_api_endpoint | default('') | trim)
        if (k3s_api_endpoint | default('') | trim | length > 0)
        else (load_balancer_ip | default(ansible_default_ipv4.address))
      }}:{{ k3s_api_port | default(6443) }}
  become: yes
  when: k3s_setup_kubeconfig

- name: Setup kubectl completion
  shell: kubectl completion bash > /etc/bash_completion.d/kubectl
  become: yes
  when: k3s_install_bash_completion

- name: Ensure kube-vip API manifests directory exists
  file:
    path: "{{ k3s_data_dir }}/server/manifests"
    state: directory
    mode: '0755'
  become: yes
  when:
    - inventory_hostname == k3s_first_master
    - k3s_install_kube_vip | default(true)
    - k3s_api_endpoint | default('') | trim | length > 0

- name: Install kube-vip API VIP manifest
  template:
    src: kube-vip-api.yaml.j2
    dest: "{{ k3s_data_dir }}/server/manifests/kube-vip-api.yaml"
    mode: '0644'
  become: yes
  when:
    - inventory_hostname == k3s_first_master
    - k3s_install_kube_vip | default(true)
    - k3s_api_endpoint | default('') | trim | length > 0

- name: Apply kube-vip API VIP manifest
  shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl apply -f {{ k3s_data_dir }}/server/manifests/kube-vip-api.yaml
  become: yes
  when:
    - inventory_hostname == k3s_first_master
    - k3s_install_kube_vip | default(true)
    - k3s_api_endpoint | default('') | trim | length > 0
  register: kube_vip_apply
  retries: 10
  delay: 10
  until: kube_vip_apply.rc == 0

- name: Wait for kube-vip API VIP daemonset rollout
  shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl -n kube-system rollout status daemonset/kube-vip-ds --timeout=180s
  become: yes
  when:
    - inventory_hostname == k3s_first_master
    - k3s_install_kube_vip | default(true)
    - k3s_api_endpoint | default('') | trim | length > 0

- name: Add kubectl aliases
  lineinfile:
    path: "/home/{{ k3s_user }}/.bashrc"
    line: "{{ item }}"
    create: yes
  loop:
    - 'alias k=kubectl'
    - 'alias kgp="kubectl get pods"'
    - 'alias kgs="kubectl get services"'
    - 'alias kgn="kubectl get nodes"'
    - 'alias h=helm'
    - 'alias hls="helm list"'
    - 'alias hla="helm list --all-namespaces"'
    - 'complete -F __start_kubectl k'
  become_user: "{{ k3s_user }}"
  when: k3s_install_bash_completion

- name: Wait for all nodes to be ready
  shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get nodes --no-headers | grep -E '\s+Ready\s+' | wc -l
  register: ready_nodes
  until: ready_nodes.stdout | int == groups[cluster_group] | length
  retries: 30
  delay: 10
  become: yes
  failed_when: false
  when: not (skip_infra_install | default(false) | bool)

- name: Display node readiness status for debugging
  debug:
    msg: |
      🔍 Node Readiness Status:
      Ready nodes count: {{ ready_nodes.stdout | default('0') }}
      Expected nodes count: {{ groups[cluster_group] | length }}
      Cluster group nodes: {{ groups[cluster_group] }}
      
      📊 Current node status:
  when:
    - not (skip_infra_install | default(false) | bool)
    - ready_nodes.stdout | int != groups[cluster_group] | length

- name: Show detailed node status if not all ready
  shell: KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get nodes -o wide
  register: node_details
  become: yes
  when:
    - not (skip_infra_install | default(false) | bool)
    - ready_nodes.stdout | int != groups[cluster_group] | length

- name: Display detailed node information
  debug:
    var: node_details.stdout_lines
  when:
    - not (skip_infra_install | default(false) | bool)
    - ready_nodes.stdout | int != groups[cluster_group] | length

- name: Continue deployment even if not all nodes are ready
  debug:
    msg: |
      ⚠️  Warning: Not all nodes are ready yet
      Ready: {{ ready_nodes.stdout | default('0') }}/{{ groups[cluster_group] | length }}
      
      This may be expected behavior if:
      - Worker nodes are still joining the cluster
      - Nodes are still downloading images
      - Network connectivity is being established
      
      The deployment will continue, but some features may not work until all nodes are ready.
  when:
    - not (skip_infra_install | default(false) | bool)
    - ready_nodes.stdout | int != groups[cluster_group] | length

- name: Display storage architecture information
  debug:
    msg: |
      💾 Storage Architecture:
      {% if k3s_install_longhorn | default(true) %}
      Using Longhorn distributed storage for dynamic provisioning
      - Longhorn provides replicated block storage using local node storage
      - Dynamic storage class available: longhorn (default)
      - High availability with configurable replica count
      - Built-in snapshots, backups, and disaster recovery
      {% else %}
      Using hostPath volumes with NFS backing
      - NFS mounted directly to /mnt/k3s-storage on all nodes
      - Applications use hostPath volumes pointing to NFS-backed storage
      - No CSI driver needed (simpler, but less resilient approach)
      {% endif %}

- name: Display cluster info
  shell: KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get nodes -o wide
  register: cluster_info
  become: yes

- name: Show cluster status
  debug:
    var: cluster_info.stdout_lines

- name: Check MetalLB deployment status
  shell: KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get pods -n metallb-system --no-headers 2>/dev/null | grep -c Running || echo "0"
  register: metallb_status
  ignore_errors: yes
  become: yes

- name: Check Traefik deployment status  
  shell: KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get pods -n traefik-system --no-headers 2>/dev/null | grep -c Running || echo "0"
  register: traefik_status
  ignore_errors: yes
  become: yes

- name: Check Longhorn deployment status
  shell: KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get pods -n longhorn-system --no-headers 2>/dev/null | grep -c Running || echo "0"
  register: longhorn_status
  ignore_errors: yes
  become: yes
  when: k3s_install_longhorn | default(true)

- name: Check LoadBalancer services
  shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get svc -A --no-headers | grep LoadBalancer | while read line; do
      namespace=$(echo "$line" | awk '{print $1}')
      service=$(echo "$line" | awk '{print $2}')
      external_ip=$(echo "$line" | awk '{print $5}')
      if [ "$external_ip" = "<pending>" ]; then
        echo "PENDING: $namespace/$service"
      else
        echo "READY: $namespace/$service ($external_ip)"
      fi
    done
  register: loadbalancer_status
  ignore_errors: yes
  become: yes

- name: Determine overall cluster health
  set_fact:
    cluster_healthy: >-
      {{
        (ready_nodes.stdout | int) == (groups[cluster_group] | length) and
        (metallb_status.stdout | int) > 0 and
        (traefik_status.stdout | int) > 0 and
        (longhorn_status.stdout | int > 0 if k3s_install_longhorn | default(true) else true)
      }}
    health_issues: >-
      {{
        ([] +
        (['Nodes not ready: ' + ready_nodes.stdout + '/' + (groups[cluster_group] | length | string)] if (ready_nodes.stdout | int) != (groups[cluster_group] | length) else []) +
        (['MetalLB not running'] if (metallb_status.stdout | int) == 0 else []) +
        (['Traefik not running'] if (traefik_status.stdout | int) == 0 else []) +
        (['Longhorn not running'] if k3s_install_longhorn | default(true) and (longhorn_status.stdout | int) == 0 else [])
        )
      }}
  when: not (skip_infra_install | default(false) | bool)

# Configure CoreDNS to use the internal DNS resolver for upstream lookups.
# Tight-memory test VMs can cause the k3s API server to flap briefly under
# load, so wait for port 6443 and retry the kubectl calls instead of letting
# one unlucky connection-refused fail the whole play.
- name: Wait for K3s API server to be available before CoreDNS configuration
  wait_for:
    port: 6443
    host: "{{ ansible_default_ipv4.address }}"
    timeout: 180

- name: Get current CoreDNS Corefile
  shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl get configmap coredns -n kube-system -o jsonpath='{.data.Corefile}'
  register: current_corefile
  become: yes
  changed_when: false
  retries: 10
  delay: 10
  until: current_corefile.rc == 0

- name: Configure CoreDNS to use internal upstream DNS
  shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl patch configmap coredns -n kube-system --type merge -p '{
      "data": {
        "Corefile": ".:53 {\n    errors\n    health\n    ready\n    kubernetes cluster.local in-addr.arpa ip6.arpa {\n      pods insecure\n      fallthrough in-addr.arpa ip6.arpa\n    }\n    hosts /etc/coredns/NodeHosts {\n      ttl 60\n      reload 15s\n      fallthrough\n    }\n    prometheus :9153\n    forward . {{ coredns_upstream_nameservers | join(' ') }}\n    cache 30\n    loop\n    reload\n    loadbalance\n    import /etc/coredns/custom/*.override\n}\nimport /etc/coredns/custom/*.server"
      }
    }'
  become: yes
  register: coredns_patch_result
  when: "'forward . ' ~ (coredns_upstream_nameservers | join(' ')) not in (current_corefile.stdout | default(''))"
  changed_when: coredns_patch_result.rc == 0
  retries: 5
  delay: 10
  until: coredns_patch_result is not failed

- name: Restart CoreDNS to apply DNS configuration changes
  shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl rollout restart deployment coredns -n kube-system
  become: yes
  when: coredns_patch_result.changed | default(false)

- name: Wait for CoreDNS to be ready after configuration
  shell: |
    KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl rollout status deployment/coredns -n kube-system --timeout=120s
  become: yes
  when: coredns_patch_result.changed | default(false)
  register: coredns_rollout
  failed_when: false

- name: Display CoreDNS rollout warning if failed
  debug:
    msg: "⚠️ CoreDNS rollout timed out - cluster may need manual intervention"
  when:
    - coredns_patch_result.changed | default(false)
    - coredns_rollout.rc | default(0) != 0

- name: Display CoreDNS configuration status
  debug:
    msg: |
      🌐 CoreDNS Configuration:
      {{ '✅ Updated to use internal upstream DNS (' ~ (coredns_upstream_nameservers | join(', ')) ~ ')' if coredns_patch_result.changed | default(false) else 'ℹ️  CoreDNS already configured correctly' }}

      🔍 This keeps pod DNS aligned with node DNS for split-horizon/internal records
      📋 Traefik ACME still uses traefik_external_nameservers for external DNS challenges
