---
# Main task file for K3s role
- name: Wait for cloud-init to complete
  wait_for:
    path: /var/lib/cloud/instance/boot-finished
    timeout: 300
  become: yes

- name: Include system preparation tasks
  include_tasks: prepare.yml

# - name: Include simplified NFS host mounting
#   include_tasks: nfs-simple-mount.yml
#   when: enable_nfs_storage | default(true)

- name: Include K3s master installation
  include_tasks: master.yml
  when: inventory_hostname in groups[master_group]

- name: Include K3s worker installation  
  include_tasks: worker.yml
  when: inventory_hostname in groups[worker_group]

- name: Include post-installation configuration
  include_tasks: post-install.yml
  when: inventory_hostname in groups[master_group]

# Storage Setup - Node preparation on all nodes
- name: Install open-iscsi for Longhorn on all nodes
  ansible.builtin.package:
    name: open-iscsi
    state: present
  become: yes
  when: k3s_install_longhorn | default(true)

- name: Start and enable iscsid service on all nodes
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: yes
  become: yes
  when: k3s_install_longhorn | default(true)

# Storage Setup - Longhorn installation on master only
- name: Include Longhorn storage installation
  include_tasks: longhorn.yml
  tags:
    - longhorn
    - storage
    - infrastructure
  when:
    - inventory_hostname == groups[master_group][0]
    - k3s_install_longhorn | default(true)

# LoadBalancer and Ingress Setup
- name: Include MetalLB installation
  include_tasks: metallb.yml
  tags:
    - metallb
    - loadbalancer
    - infrastructure
  when:
    - inventory_hostname in groups[master_group]
    - k3s_install_metallb | default(true)

- name: Include Traefik 2 installation
  include_tasks: traefik.yml
  tags:
    - traefik
    - ingress
    - infrastructure
  when:
    - inventory_hostname in groups[master_group]
    - k3s_install_traefik | default(true)

# ArgoCD GitOps Controller
- name: Include ArgoCD installation
  include_tasks: argocd.yml
  tags:
    - argocd
    - gitops
    - infrastructure
  when:
    - inventory_hostname in groups[master_group]
    - k3s_install_argocd | default(true)

# Vault + External Secrets bootstrap (ArgoCD-managed apps)
- name: Include Vault bootstrap
  include_tasks: vault.yml
  tags:
    - vault
    - secrets
    - gitops
  when:
    - inventory_hostname in groups[master_group]
    - k3s_configure_vault | default(true)
