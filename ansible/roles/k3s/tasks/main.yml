---
# Main task file for K3s role
- name: Wait for cloud-init to complete
  wait_for:
    path: /var/lib/cloud/instance/boot-finished
    timeout: 300
  become: yes

- name: Include system preparation tasks
  include_tasks: prepare.yml

- name: Include NVIDIA GPU worker preparation
  include_tasks: nvidia-worker.yml
  when: nvidia_gpu_worker | default(false) | bool

- name: Mount Longhorn data disk on hosts that have one
  include_tasks: longhorn-data-disk.yml
  when:
    - longhorn_data_disk_device is defined
    - longhorn_data_disk_device | length > 0

- name: Resolve longhorn_tank_disk_device from slot when not set explicitly
  # host_vars can set longhorn_tank_disk_device directly (non-QEMU layouts);
  # otherwise derive it from longhorn_disk_device_template + longhorn_tank_disk_slot.
  # Gated on worker_group so CP nodes (which inherit the cluster-level slot
  # default) skip cleanly. An empty slot signals "this worker has no tank disk".
  set_fact:
    longhorn_tank_disk_device: "{{ longhorn_disk_device_template | replace('{slot}', longhorn_tank_disk_slot) }}"
  when:
    - longhorn_tank_disk_device is not defined
    - longhorn_tank_disk_slot | default('') | length > 0
    - longhorn_disk_device_template is defined
    - inventory_hostname in groups[worker_group | default('')] | default([])

- name: Mount Longhorn tank disk on hosts that have one
  include_tasks: longhorn-tank-disk.yml
  when:
    - longhorn_tank_disk_device is defined
    - longhorn_tank_disk_device | length > 0
    - inventory_hostname in groups[worker_group | default('')] | default([])

- name: Mount LLM model disk on hosts that have one
  include_tasks: llm-model-disk.yml
  when:
    - llm_model_disk_device is defined
    - llm_model_disk_device | length > 0

# - name: Include simplified NFS host mounting
#   include_tasks: nfs-simple-mount.yml
#   when: enable_nfs_storage | default(true)

- name: Include K3s master installation
  include_tasks: master.yml
  when: inventory_hostname in groups[master_group]

- name: Include K3s worker installation  
  include_tasks: worker.yml
  when: inventory_hostname in groups[worker_group]

- name: Include post-installation configuration
  include_tasks: post-install.yml
  when: inventory_hostname in groups[master_group]

# Storage Setup - Node preparation on all nodes
- name: Install open-iscsi for Longhorn on all nodes
  ansible.builtin.package:
    name: open-iscsi
    state: present
  become: yes
  when: k3s_install_longhorn | default(true)

- name: Manage Longhorn iSCSI tuning block
  ansible.builtin.blockinfile:
    path: /etc/iscsi/iscsid.conf
    marker: "# {mark} ANSIBLE MANAGED LONGHORN TUNING"
    block: "{{ lookup('template', 'iscsid-longhorn.conf.j2') }}"
  become: yes
  when: k3s_install_longhorn | default(true)
  notify: restart iscsid

- name: Start and enable iscsid service on all nodes
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: yes
  become: yes
  when: k3s_install_longhorn | default(true)

# Helm-driven infrastructure installs now live in roles/cluster_platform and
# run from k3s-deploy-cluster.yml's third play, AFTER all masters and workers
# have joined. They cannot run during the masters play because a first master
# alone has no eligible storage nodes when longhorn_exclude_master_from_storage
# is true, which wedges any PVC-backed component on PVC binding.
