---
# Main task file for K3s role
- name: Wait for cloud-init to complete
  wait_for:
    path: /var/lib/cloud/instance/boot-finished
    timeout: 300
  become: yes

- name: Include system preparation tasks
  include_tasks: prepare.yml

# - name: Include simplified NFS host mounting
#   include_tasks: nfs-simple-mount.yml
#   when: enable_nfs_storage | default(true)

- name: Include K3s master installation
  include_tasks: master.yml
  when: inventory_hostname in groups[master_group]

- name: Include K3s worker installation  
  include_tasks: worker.yml
  when: inventory_hostname in groups[worker_group]

- name: Include post-installation configuration
  include_tasks: post-install.yml
  when: inventory_hostname in groups[master_group]

# Storage Setup - Node preparation on all nodes
- name: Install open-iscsi for Longhorn on all nodes
  ansible.builtin.package:
    name: open-iscsi
    state: present
  become: yes
  when: k3s_install_longhorn | default(true)

- name: Tune iSCSI noop_out_interval for Longhorn
  ansible.builtin.lineinfile:
    path: /etc/iscsi/iscsid.conf
    regexp: '^\s*node\.conn\[0\]\.timeo\.noop_out_interval\s*='
    line: "node.conn[0].timeo.noop_out_interval = {{ k3s_iscsi_noop_out_interval }}"
    state: present
  become: yes
  when: k3s_install_longhorn | default(true)
  notify: restart iscsid

- name: Tune iSCSI noop_out_timeout for Longhorn
  ansible.builtin.lineinfile:
    path: /etc/iscsi/iscsid.conf
    regexp: '^\s*node\.conn\[0\]\.timeo\.noop_out_timeout\s*='
    line: "node.conn[0].timeo.noop_out_timeout = {{ k3s_iscsi_noop_out_timeout }}"
    state: present
  become: yes
  when: k3s_install_longhorn | default(true)
  notify: restart iscsid

- name: Tune iSCSI session replacement_timeout for Longhorn
  ansible.builtin.lineinfile:
    path: /etc/iscsi/iscsid.conf
    regexp: '^\s*node\.session\.timeo\.replacement_timeout\s*='
    line: "node.session.timeo.replacement_timeout = {{ k3s_iscsi_replacement_timeout }}"
    state: present
  become: yes
  when: k3s_install_longhorn | default(true)
  notify: restart iscsid

- name: Start and enable iscsid service on all nodes
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: yes
  become: yes
  when: k3s_install_longhorn | default(true)

# Helm-driven infrastructure installs (Longhorn, MetalLB, Traefik, ArgoCD,
# Vault) live in infra-install.yml and run from k3s-deploy-cluster.yml's
# third play, AFTER all masters and workers have joined. They cannot run
# during the masters play because a first master alone has no eligible
# storage nodes when longhorn_exclude_master_from_storage is true, which
# wedges any PVC-backed component on PVC binding.
