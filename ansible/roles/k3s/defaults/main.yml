---
# K3s role default variables
k3s_version: "v1.28.5+k3s1"
k3s_token: "{{ vault_k3s_token }}"
kubectl_version: "v1.28.4"

# K3s server configuration. The cluster-init / server-join flag is appended
# dynamically in tasks/master.yml based on whether the current host is the
# first master (gets --cluster-init) or a joining master (gets --server URL).
k3s_server_args:
  - "--disable=traefik"         # Disable built-in Traefik (will install Traefik 2 manually)
  - "--disable=servicelb"       # Disable built-in service LB (will use MetalLB)
  - "--disable=metrics-server"  # Disable built-in metrics-server (deployed via ArgoCD chart)
  - "--write-kubeconfig-mode=644"
  - "--node-external-ip={{ ansible_default_ipv4.address }}"
  - "--tls-san={{ (k3s_api_endpoint | default('') | trim) if (k3s_api_endpoint | default('') | trim | length > 0) else (load_balancer_ip | default(ansible_default_ipv4.address)) }}"  # Support stable API endpoint / load balancer

k3s_agent_args: []
k3s_agent_removed_args: []

# Load balancer configuration (for future HA setup)
load_balancer_ip: ""  # Set this for HA deployment with load balancer
k3s_api_endpoint: ""  # Stable API endpoint (VIP/LB/DNS) for agents, joining masters, and kubeconfigs
k3s_api_port: 6443
k3s_primary_master: ""  # Inventory hostname of the authoritative bootstrap/join source; defaults to the first master
k3s_install_kube_vip: true
k3s_api_vip_interface: "eth0"
k3s_api_vip_image: "ghcr.io/kube-vip/kube-vip:v0.8.4"
k3s_datastore_endpoint: ""  # Set this for external database (MySQL/PostgreSQL)

# User configuration  
k3s_user: "{{ ansible_user }}"
k3s_group: "{{ ansible_user }}"

# Directories
k3s_config_dir: "/etc/rancher/k3s"
k3s_data_dir: "/var/lib/rancher/k3s"
local_storage_dir: "/opt/local-path-provisioner"

# Network configuration
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"

# Enhanced kernel modules
k3s_kernel_modules:
  - br_netfilter
  - overlay
  - ip_vs
  - ip_vs_rr
  - ip_vs_wrr
  - ip_vs_sh
  - nf_conntrack

# Enhanced sysctl settings
k3s_sysctl_settings:
  - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
  - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
  - { name: 'net.ipv4.ip_forward', value: '1' }
  - { name: 'net.ipv4.conf.all.forwarding', value: '1' }
  - { name: 'net.ipv6.conf.all.forwarding', value: '1' }
  - { name: 'net.netfilter.nf_conntrack_max', value: '131072' }
  # Inotify limits — Promtail and other log/file watchers exhaust the kernel
  # default of 128 instances on busy nodes (50+ pods).
  - { name: 'fs.inotify.max_user_instances', value: '512' }
  - { name: 'fs.inotify.max_user_watches', value: '524288' }

# iSCSI timeouts for Longhorn. Defaults are too aggressive — a 5s noop
# timeout drops sessions whenever the Proxmox host has a brief disk-IO
# spike, which marks the device offline and forces the replica
# filesystem read-only. These values match the Longhorn-recommended
# tuning.
k3s_iscsi_noop_out_interval: 10
k3s_iscsi_noop_out_timeout: 30
k3s_iscsi_replacement_timeout: 86400

# Features
k3s_install_kubectl: true
k3s_install_helm: true
k3s_setup_kubeconfig: true
k3s_install_bash_completion: true
k3s_enable_auto_deploy: true

# LoadBalancer and Ingress Setup
k3s_install_metallb: true
k3s_install_traefik: true

# ArgoCD GitOps Controller
k3s_install_argocd: true

# MetalLB Configuration
# metallb_ip_range is defined in group_vars per cluster:
# - Production: 172.20.20.200-172.20.20.210 (k3s_cluster.yml)
# - Stage: 172.20.21.101-172.20.21.109 (k3s_cluster_stage.yml)
# - Test: 172.20.21.201-172.20.21.210 (k3s_cluster_test.yml)

# Traefik 2 Configuration
traefik_loadbalancer_ip: ""  # Leave empty for auto-assignment by MetalLB
traefik_dashboard_enabled: true
traefik_dashboard_insecure: true  # Set to false for production
traefik_dashboard_host: "traefik.local"  # Change to your domain
traefik_dashboard_auth_enabled: false  # Enable for production
traefik_access_logs: true
traefik_persistence_enabled: false  # Enable for SSL cert persistence
traefik_tls_enabled: false  # Enable for Let's Encrypt SSL
