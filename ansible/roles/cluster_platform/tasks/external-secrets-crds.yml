---
- name: Define the External Secrets CRD files to bootstrap
  ansible.builtin.set_fact:
    external_secrets_crd_templates:
      - acraccesstoken.yaml
      - cloudsmithaccesstoken.yaml
      - clusterexternalsecret.yaml
      - clustergenerator.yaml
      - clustersecretstore.yaml
      - ecrauthorizationtoken.yaml
      - externalsecret.yaml
      - fake.yaml
      - gcraccesstoken.yaml
      - generatorstate.yaml
      - githubaccesstoken.yaml
      - grafana.yaml
      - mfa.yaml
      - password.yaml
      - quayaccesstoken.yaml
      - secretstore.yaml
      - sshkey.yaml
      - stssessiontoken.yaml
      - uuid.yaml
      - vaultdynamicsecret.yaml
      - webhook.yaml
    external_secrets_crd_names:
      - acraccesstokens.generators.external-secrets.io
      - cloudsmithaccesstokens.generators.external-secrets.io
      - clusterexternalsecrets.external-secrets.io
      - clustergenerators.generators.external-secrets.io
      - clustersecretstores.external-secrets.io
      - ecrauthorizationtokens.generators.external-secrets.io
      - externalsecrets.external-secrets.io
      - fakes.generators.external-secrets.io
      - gcraccesstokens.generators.external-secrets.io
      - generatorstates.generators.external-secrets.io
      - githubaccesstokens.generators.external-secrets.io
      - grafanas.generators.external-secrets.io
      - mfas.generators.external-secrets.io
      - passwords.generators.external-secrets.io
      - quayaccesstokens.generators.external-secrets.io
      - secretstores.external-secrets.io
      - sshkeys.generators.external-secrets.io
      - stssessiontokens.generators.external-secrets.io
      - uuids.generators.external-secrets.io
      - vaultdynamicsecrets.generators.external-secrets.io
      - webhooks.generators.external-secrets.io

- name: Add External Secrets Helm repository for CRD bootstrap
  ansible.builtin.shell: |
    export KUBECONFIG={{ kubeconfig_path }}
    helm repo add external-secrets https://charts.external-secrets.io >/dev/null 2>&1 || true
    helm repo update external-secrets >/dev/null

- name: Apply External Secrets CRDs from Helm chart
  ansible.builtin.shell: |
    export KUBECONFIG={{ kubeconfig_path }}
    helm template external-secrets-crds external-secrets/external-secrets \
      --version {{ external_secrets_crds_chart_version }} \
      --set installCRDs=true \
      {% for crd_template in external_secrets_crd_templates %}
      --show-only templates/crds/{{ crd_template }} \
      {% endfor %} | \
      awk '
        /^      selectableFields:/ { skip=1; next }
        skip && /^      served: true/ { skip=0 }
        !skip { print }
      ' | \
      kubectl --kubeconfig={{ kubeconfig_path }} apply --server-side -f -
  register: external_secrets_crds_apply
  changed_when: >-
    'created' in external_secrets_crds_apply.stdout or
    'configured' in external_secrets_crds_apply.stdout

- name: Wait for External Secrets CRDs to be established
  include_tasks: shared/wait-for-crd.yml
  vars:
    crd_name: "{{ item }}"
  loop: "{{ external_secrets_crd_names }}"
