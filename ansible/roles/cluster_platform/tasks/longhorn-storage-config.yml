---
- name: Check Longhorn storage class is available
  ansible.builtin.shell: |
    KUBECONFIG={{ kubeconfig_path }} kubectl get storageclass longhorn
  register: longhorn_sc_check
  until: longhorn_sc_check.rc == 0
  retries: 10
  delay: 30

- name: Wait for API server before settings update
  pause:
    seconds: 3

- name: Update Longhorn default settings to match cluster configuration
  ansible.builtin.shell: |
    KUBECONFIG={{ kubeconfig_path }} kubectl patch setting default-replica-count -n longhorn-system \
      --type='merge' -p='{"value":"{{ longhorn_replica_count | default(calculated_replica_count | default(3)) }}"}'
  register: setting_update_result
  failed_when: false

- name: Update Longhorn storage reservation setting to match cluster configuration
  ansible.builtin.shell: |
    KUBECONFIG={{ kubeconfig_path }} kubectl patch setting storage-reserved-percentage-for-default-disk -n longhorn-system \
      --type='merge' -p='{"value":"{{ longhorn_storage_reserved_percentage_for_default_disk | default(5) }}"}'
  register: storage_reservation_setting_update_result
  failed_when: false

- name: Update Longhorn replica auto-balance setting
  ansible.builtin.shell: |
    KUBECONFIG={{ kubeconfig_path }} kubectl patch setting replica-auto-balance -n longhorn-system \
      --type='merge' -p='{"value":"{{ longhorn_replica_auto_balance | default("best-effort") }}"}'
  register: replica_auto_balance_setting_result
  failed_when: false

- name: Update Longhorn storage over-provisioning percentage
  ansible.builtin.shell: |
    KUBECONFIG={{ kubeconfig_path }} kubectl patch setting storage-over-provisioning-percentage -n longhorn-system \
      --type='merge' -p='{"value":"{{ longhorn_storage_over_provisioning_percentage | default(150) }}"}'
  register: storage_overprov_setting_result
  failed_when: false

- name: Update Longhorn replica auto-balance disk-pressure percentage
  ansible.builtin.shell: |
    KUBECONFIG={{ kubeconfig_path }} kubectl patch setting replica-auto-balance-disk-pressure-percentage -n longhorn-system \
      --type='merge' -p='{"value":"{{ longhorn_replica_auto_balance_disk_pressure_percentage | default(90) }}"}'
  register: disk_pressure_setting_result
  failed_when: false

- name: Update Longhorn rebuild and integrity tuning settings
  ansible.builtin.shell: |
    KUBECONFIG={{ kubeconfig_path }} kubectl patch setting {{ item.name }} -n longhorn-system \
      --type='merge' -p='{{ {"value": item.value | string} | to_json }}'
  loop:
    - name: auto-salvage
      value: "{{ longhorn_auto_salvage | default(true) | string | lower }}"
    - name: engine-replica-timeout
      value: '{"v1":"{{ longhorn_engine_replica_timeout | default(30) }}","v2":"{{ longhorn_engine_replica_timeout | default(30) }}"}'
    - name: replica-replenishment-wait-interval
      value: "{{ longhorn_replica_replenishment_wait_interval | default(600) }}"
    - name: concurrent-replica-rebuild-per-node-limit
      value: "{{ longhorn_concurrent_replica_rebuild_per_node_limit | default(2) }}"
    - name: snapshot-data-integrity
      value: '{"v1":"{{ longhorn_snapshot_data_integrity | default("disabled") }}","v2":"{{ longhorn_snapshot_data_integrity | default("disabled") }}"}'
  register: longhorn_tuning_setting_results
  failed_when: false

- name: Display Longhorn setting update result
  debug:
    msg: |
      🔧 Longhorn Default Replica Count Setting Update:
      {% if setting_update_result.rc == 0 %}
      ✅ Successfully updated default-replica-count to {{ longhorn_replica_count | default(calculated_replica_count | default(3)) }}
      {% else %}
      ⚠️  Setting update failed (may not exist yet): {{ setting_update_result.stderr | default('Unknown error') }}
      💡 This is normal for fresh installations - settings will be applied via existing volume updates below
      {% endif %}
      {% if storage_reservation_setting_update_result.rc == 0 %}
      ✅ Successfully updated storage-reserved-percentage-for-default-disk to {{ longhorn_storage_reserved_percentage_for_default_disk | default(5) }}%
      {% else %}
      ⚠️  Storage reservation setting update failed (may not exist yet): {{ storage_reservation_setting_update_result.stderr | default('Unknown error') }}
      {% endif %}
      {% if replica_auto_balance_setting_result.rc == 0 %}
      ✅ Successfully updated replica-auto-balance to {{ longhorn_replica_auto_balance | default('best-effort') }}
      {% else %}
      ⚠️  Replica auto-balance setting update failed (may not exist yet): {{ replica_auto_balance_setting_result.stderr | default('Unknown error') }}
      {% endif %}
      {% if storage_overprov_setting_result.rc == 0 %}
      ✅ Successfully updated storage-over-provisioning-percentage to {{ longhorn_storage_over_provisioning_percentage | default(150) }}%
      {% else %}
      ⚠️  Storage over-provisioning setting update failed (may not exist yet): {{ storage_overprov_setting_result.stderr | default('Unknown error') }}
      {% endif %}
      {% if disk_pressure_setting_result.rc == 0 %}
      ✅ Successfully updated replica-auto-balance-disk-pressure-percentage to {{ longhorn_replica_auto_balance_disk_pressure_percentage | default(90) }}%
      {% else %}
      ⚠️  Disk-pressure percentage setting update failed (may not exist yet): {{ disk_pressure_setting_result.stderr | default('Unknown error') }}
      {% endif %}
      Longhorn tuning settings reconciled: {{ longhorn_tuning_setting_results.results | default([]) | selectattr('rc', 'equalto', 0) | list | length }}/{{ longhorn_tuning_setting_results.results | default([]) | length }}

# The default `longhorn`, `longhorn-flash`, and `longhorn-tank` StorageClasses
# are now managed declaratively by ArgoCD via
# argocd/manifests/longhorn-storage-classes/. The Longhorn helm chart's
# persistence.defaultClass is set to false (see longhorn-values.yaml.j2) so
# the helm-managed longhorn-storageclass ConfigMap no longer auto-applies the
# default SC and won't fight ArgoCD. See home-infra-btv.
- name: Remove legacy Helm StorageClass creator now owned by GitOps
  ansible.builtin.shell: |
    KUBECONFIG={{ kubeconfig_path }} kubectl delete configmap longhorn-storageclass -n longhorn-system --ignore-not-found
  register: legacy_storageclass_cleanup
  changed_when: "'deleted' in legacy_storageclass_cleanup.stdout"

- name: Wait for API server before BackupTarget update
  pause:
    seconds: 10
  when:
    - enable_longhorn_backup | default(true)
    - nfs_server_ip is defined
    - nfs_share_backup is defined

- name: Update Longhorn BackupTarget resource with correct NFS format
  ansible.builtin.shell: |
    KUBECONFIG={{ kubeconfig_path }} kubectl patch backuptarget.longhorn.io default -n longhorn-system \
      --type='merge' -p='{"spec":{"backupTargetURL":"nfs://{{ nfs_server_ip }}:{{ nfs_share_backup }}{% if longhorn_backup_shared_across_clusters | default(false) %}/shared{% else %}/{{ cluster_environment | default('prod') }}{% endif %}"}}'
  register: backup_target_update_result
  failed_when: false
  when:
    - enable_longhorn_backup | default(true)
    - nfs_server_ip is defined
    - nfs_share_backup is defined

- name: Display Longhorn backup target update result
  debug:
    msg: |
      🔧 Longhorn BackupTarget Resource Update:
      {% if backup_target_update_result.rc == 0 %}
      ✅ Successfully updated BackupTarget resource to nfs://{{ nfs_server_ip }}:{{ nfs_share_backup }}
      💡 Fixed NFS format with colon (:) after IP address for proper mounting
      {% else %}
      ⚠️  BackupTarget update failed: {{ backup_target_update_result.stderr | default('Unknown error') }}
      💡 This is normal for fresh installations - backup target will be applied via helm values above
      {% endif %}
  when:
    - enable_longhorn_backup | default(true)
    - nfs_server_ip is defined
    - nfs_share_backup is defined
