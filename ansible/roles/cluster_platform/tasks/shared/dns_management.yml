---
# Shared DNS Management Tasks
# This task file manages DNS records for applications and system services

- name: Check if DNS management is enabled
  debug:
    msg: "DNS management is {{ 'enabled' if manage_dns_records | default(false) else 'disabled' }}"

- name: Validate DNS management variables
  assert:
    that:
      - technitium_dns_server is defined
      - technitium_api_token is defined
      - dns_record_name is defined
      - dns_record_ip is defined or dns_record_target is defined
    fail_msg: "Required DNS variables are missing. Ensure technitium_dns_server, technitium_api_token, dns_record_name, and either dns_record_ip or dns_record_target are defined."
    success_msg: "DNS management variables validated successfully"
  when: manage_dns_records | default(false)

# Technitium's `overwrite: true` flag only updates records of the SAME type.
# RFC 1034 forbids a CNAME co-existing with any other record type at a name,
# so adding a CNAME where an A record exists (or vice versa) fails with
# "a CNAME record cannot exists with other record types for the same name".
# Pre-delete the conflicting type before each add so the role is idempotent
# when an old A record (e.g. from a prior external-dns sync) is squatting
# on a name we now want as a CNAME.

- name: Pre-delete conflicting CNAME before creating A record
  uri:
    url: "http://{{ technitium_dns_server }}:5380/api/zones/records/delete"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ technitium_api_token }}"
      domain: "{{ dns_record_name }}.{{ cluster_tld }}"
      type: "CNAME"
    status_code: [200, 201, 404]
    timeout: 30
  register: dns_predelete_cname
  failed_when: false
  when:
    - manage_dns_records | default(false)
    - dns_record_action | default('create') == 'create'
    - dns_record_type | default('A') == 'A'
    - dns_record_ip is defined

- name: Create/Update DNS A record
  uri:
    url: "http://{{ technitium_dns_server }}:5380/api/zones/records/add"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ technitium_api_token }}"
      domain: "{{ dns_record_name }}.{{ cluster_tld }}"
      type: "A"
      value: "{{ dns_record_ip }}"
      ttl: "{{ dns_record_ttl | default(3600) }}"
      overwrite: "true"  # This will update existing records
    status_code: [200, 201]
    timeout: 30
  register: dns_create_a_result
  failed_when: >-
    (dns_create_a_result.json is defined) and
    (dns_create_a_result.json.status | default('ok') != 'ok')
  when:
    - manage_dns_records | default(false)
    - dns_record_action | default('create') == 'create'
    - dns_record_type | default('A') == 'A'
    - dns_record_ip is defined
  ignore_errors: yes

- name: Pre-delete conflicting A records before creating CNAME
  uri:
    url: "http://{{ technitium_dns_server }}:5380/api/zones/records/delete"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ technitium_api_token }}"
      domain: "{{ dns_record_name }}.{{ cluster_tld }}"
      type: "A"
    status_code: [200, 201, 404]
    timeout: 30
  register: dns_predelete_a
  failed_when: false
  when:
    - manage_dns_records | default(false)
    - dns_record_action | default('create') == 'create'
    - dns_record_type | default('A') == 'CNAME'
    - dns_record_target is defined

- name: Create/Update DNS CNAME record
  uri:
    url: "http://{{ technitium_dns_server }}:5380/api/zones/records/add"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ technitium_api_token }}"
      domain: "{{ dns_record_name }}.{{ cluster_tld }}"
      type: "CNAME"
      value: "{{ dns_record_target }}"
      ttl: "{{ dns_record_ttl | default(3600) }}"
      overwrite: "true"  # This will update existing records
    status_code: [200, 201]
    timeout: 30
  register: dns_create_cname_result
  failed_when: >-
    (dns_create_cname_result.json is defined) and
    (dns_create_cname_result.json.status | default('ok') != 'ok')
  when:
    - manage_dns_records | default(false)
    - dns_record_action | default('create') == 'create'
    - dns_record_type | default('A') == 'CNAME'
    - dns_record_target is defined
  ignore_errors: yes

- name: Consolidate DNS create result
  set_fact:
    dns_create_result: >-
      {{
        dns_create_cname_result
        if dns_create_cname_result is defined and not (dns_create_cname_result.skipped | default(false))
        else dns_create_a_result
        if dns_create_a_result is defined
        else {'skipped': true}
      }}
  when:
    - manage_dns_records | default(false)
    - dns_record_action | default('create') == 'create'

- name: Display DNS record creation result
  debug:
    msg: |
      📡 DNS Record Management:
      Record: {{ dns_record_name }}.{{ cluster_tld }} → {{ dns_record_ip | default(dns_record_target) }}
      Type: {{ dns_record_type | default('A') }}
      {% if dns_create_result.skipped | default(false) %}
      ⏭️  DNS management disabled or skipped
      {% elif dns_create_result.failed | default(false) %}
      ❌ Failed to create DNS record: {{ dns_create_result.json.errorMessage | default(dns_create_result.msg | default('Unknown error')) }}
      {% else %}
      ✅ DNS record created/updated successfully
      {% endif %}
  when: manage_dns_records | default(false)

- name: Delete DNS A record
  uri:
    url: "http://{{ technitium_dns_server }}:5380/api/zones/records/delete"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ technitium_api_token }}"
      domain: "{{ dns_record_name }}.{{ cluster_tld }}"
      type: "A"
    status_code: [200, 201, 404]  # 404 is OK if record doesn't exist
    timeout: 30
  register: dns_delete_a_result
  failed_when: >-
    (dns_delete_a_result.json is defined) and
    (dns_delete_a_result.json.status | default('ok') != 'ok') and
    ('not found' not in (dns_delete_a_result.json.errorMessage | default('') | lower))
  when: 
    - manage_dns_records | default(false)
    - dns_record_action | default('create') == 'delete'
    - dns_record_type | default('A') == 'A'
  ignore_errors: yes

- name: Delete DNS CNAME record
  uri:
    url: "http://{{ technitium_dns_server }}:5380/api/zones/records/delete"
    method: POST
    body_format: form-urlencoded
    body:
      token: "{{ technitium_api_token }}"
      domain: "{{ dns_record_name }}.{{ cluster_tld }}"
      type: "CNAME"
    status_code: [200, 201, 404]  # 404 is OK if record doesn't exist
    timeout: 30
  register: dns_delete_cname_result
  failed_when: >-
    (dns_delete_cname_result.json is defined) and
    (dns_delete_cname_result.json.status | default('ok') != 'ok') and
    ('not found' not in (dns_delete_cname_result.json.errorMessage | default('') | lower))
  when: 
    - manage_dns_records | default(false)
    - dns_record_action | default('create') == 'delete'
    - dns_record_type | default('A') == 'CNAME'
  ignore_errors: yes

- name: Consolidate DNS delete result
  set_fact:
    dns_delete_result: >-
      {{
        dns_delete_cname_result
        if dns_delete_cname_result is defined and not (dns_delete_cname_result.skipped | default(false))
        else dns_delete_a_result
        if dns_delete_a_result is defined
        else {'skipped': true}
      }}
  when:
    - manage_dns_records | default(false)
    - dns_record_action | default('create') == 'delete'

- name: Display DNS record deletion result
  debug:
    msg: |
      📡 DNS Record Cleanup:
      Record: {{ dns_record_name }}.{{ cluster_tld }}
      {% if dns_delete_result.skipped | default(false) %}
      ⏭️  DNS cleanup disabled or skipped
      {% elif dns_delete_result.failed | default(false) %}
      ❌ Failed to delete DNS record: {{ dns_delete_result.json.errorMessage | default(dns_delete_result.msg | default('Unknown error')) }}
      {% else %}
      ✅ DNS record deleted successfully (or didn't exist)
      {% endif %}
  when: 
    - manage_dns_records | default(false)
    - dns_record_action | default('create') == 'delete'
