---
# LXC Role - Template Download/Preparation
# Uses Proxmox API to check and download templates

- name: Check available templates via API
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ container.node | default(lxc_default_node) }}/storage/{{ template.storage | default(lxc_template_storage) }}/content"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
    validate_certs: false
  register: storage_content
  delegate_to: localhost

- name: Check if template exists
  ansible.builtin.set_fact:
    template_exists: "{{ storage_content.json.data | selectattr('volid', 'search', template.template_file) | list | length > 0 }}"

- name: Download template via API if not present
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ container.node | default(lxc_default_node) }}/aplinfo"
    method: POST
    headers:
      Authorization: "PVEAPIToken={{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
    body_format: form-urlencoded
    body:
      storage: "{{ template.storage | default(lxc_template_storage) }}"
      template: "{{ template.template_file }}"
    validate_certs: false
  register: template_download
  when: not template_exists
  delegate_to: localhost

- name: Wait for template download to complete
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ container.node | default(lxc_default_node) }}/tasks/{{ template_download.json.data }}/status"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ proxmox_api_token_id }}={{ proxmox_api_token_secret }}"
    validate_certs: false
  register: download_status
  until: download_status.json.data.status == "stopped"
  retries: 60
  delay: 5
  when: not template_exists and template_download is defined and template_download.json is defined
  delegate_to: localhost

- name: Display template status
  ansible.builtin.debug:
    msg: "Template {{ template.template_file }} is {{ 'already available' if template_exists else 'now downloaded' }} on {{ proxmox_api_host }}"
