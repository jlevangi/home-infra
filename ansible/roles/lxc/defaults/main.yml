---
# LXC Role Defaults

# Proxmox connection (override with vault variables)
proxmox_api_host: "{{ vault_proxmox_api_host }}"
proxmox_api_user: "{{ vault_proxmox_api_user }}"
proxmox_api_token_id: "{{ vault_proxmox_api_token_id }}"
proxmox_api_token_secret: "{{ vault_proxmox_api_token_secret }}"

# Default Proxmox node
lxc_default_node: pve1

# Default container resources
lxc_default_cores: 2
lxc_default_memory: 2048
lxc_default_swap: 512
lxc_default_disk_size: 16
lxc_default_storage: local-lvm

# Default network settings
lxc_default_bridge: vmbr0
lxc_gateway: 172.20.20.1
lxc_nameservers:
  - 172.20.20.4
  - 172.20.20.5

# Default container features
lxc_default_unprivileged: true
lxc_default_nesting: true

# Primary non-ansible user. Override with LXC_PRIMARY_USER or OPERATOR_USER.
lxc_primary_user: "{{ lookup('env', 'LXC_PRIMARY_USER') or lookup('env', 'OPERATOR_USER') or lookup('env', 'USER') or 'ansible' }}"
lxc_primary_user_home: "/home/{{ lxc_primary_user }}"

# User configuration
lxc_users:
  - name: "{{ lxc_primary_user }}"
    groups: sudo
    shell: /bin/bash
    create_home: true
  - name: ansible
    groups: sudo
    shell: /bin/bash
    create_home: true

lxc_ssh_public_key: "{{ vault_ssh_public_key }}"

# Template storage location on Proxmox
lxc_template_storage: local

# Definitions path (relative to playbook)
lxc_definitions_path: "{{ playbook_dir }}/../lxc_definitions"

# Docker installation defaults
docker_edition: ce
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
