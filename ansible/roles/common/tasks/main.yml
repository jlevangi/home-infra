
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install initial packages
  apt:
    name:
      - qemu-guest-agent  # Proxmox guest agent for VM management
      - cron          # Daemon to execute scheduled commands
      - cockpit       # Web-based server management interface
      - tmux          # Terminal multiplexer
      - micro         # Modern text editor
      - fzf           # General-purpose command-line fuzzy finder
      - btop          # Resource monitor
      - dos2unix      # Converts line endings from Windows-style to Unix format
      - curl          # Required for Superfile installation
      - wget          # Command-line utility for downloading files
      - rsync          # Utility for efficiently transferring and synchronizing files
    state: present

- name: Enable and start qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: yes
    state: started

- name: Raise inotify limits for watcher-heavy Kubernetes workloads
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-k8s-inotify.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # MeshCentral and other Node.js-based workloads can exhaust the Debian
      # defaults after a node reboot, causing EMFILE crashes from fs.watch().
      fs.inotify.max_user_watches = 1048576
      fs.inotify.max_user_instances = 8192
  notify: Reload sysctl

