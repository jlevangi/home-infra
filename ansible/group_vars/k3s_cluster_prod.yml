---
# =============================================================================
# PRODUCTION ENVIRONMENT OVERRIDES
# =============================================================================
# Only settings that DIFFER from the base k3s_cluster.yml
# =============================================================================

cluster_environment: "prod"

# Actual reached versions: rollout paused; never redeploy the shared 1.28 pin.
# Resolve here because deployment vars_files override inventory host variables.
k3s_version: "{{ k3s_prod_node_versions[inventory_hostname] }}"
k3s_prod_node_versions:
  k3s-prod-cp-1: "v1.31.14+k3s1"
  k3s-prod-cp-3: "v1.31.14+k3s1"
  k3s-prod-cp-4: "v1.31.14+k3s1"
  k3s-prod-worker-1: "v1.31.14+k3s1"
  k3s-prod-worker-4: "v1.30.14+k3s2"
  k3s-prod-worker-5: "v1.30.14+k3s2"
  k3s-prod-worker-6: "v1.30.14+k3s2"
  k3s-prod-worker-gpu-1: "v1.30.14+k3s2"

# -----------------------------------------------------------------------------
# NETWORK CONFIGURATION
# -----------------------------------------------------------------------------
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"
metallb_ip_range: "172.20.20.200-172.20.20.210"
traefik_loadbalancer_ip: "172.20.20.200"
# Set this to a stable API VIP / load balancer endpoint once kube-vip or
# HAProxy is in place. Workers, joining masters, and generated kubeconfigs will
# use it instead of pinning themselves to cp-1.
k3s_api_endpoint: "172.20.20.199"
k3s_primary_master: "k3s-prod-cp-1"

# -----------------------------------------------------------------------------
# LONGHORN OVERRIDES (prod has 3 dedicated workers, masters are CP-only)
# All workers live on a single Proxmox host, so 3-way replication adds no
# hardware redundancy beyond 2-way; backups (NFS) cover host-level loss.
# -----------------------------------------------------------------------------
# Back up idle CronJob PVCs even when their consumers finish before backup time.
longhorn_allow_recurring_job_while_volume_detached: true
longhorn_replica_count: 2
longhorn_exclude_master_from_storage: true
# Stop Longhorn auto-creating a default disk on a new node's OS root
# filesystem (the worker-4 incident). Prod disks come only from the topology
# file. Test/stage keep false: simple-node relies on the default disk.
longhorn_create_default_disk_labeled_nodes: true
longhorn_guaranteed_instance_manager_cpu: 12

# -----------------------------------------------------------------------------
# CONTROL-PLANE NODE TAINT
# -----------------------------------------------------------------------------
# Keep regular workloads off the master/CP nodes. The taint matches the
# existing Longhorn defaultSettings.taintToleration so longhorn-manager and
# instance-manager pods continue to run on CP nodes, while ArgoCD, app
# databases, monitoring, etc. are pushed onto worker nodes.
k3s_master_workload_taint: "CriticalAddonsOnly=true:NoExecute"

# -----------------------------------------------------------------------------
# VAULT HA (prod-only)
# -----------------------------------------------------------------------------
vault_namespace: "vault-raft"
vault_statefulset_name: "vault-raft"
vault_pod_name: "vault-raft-0"
vault_primary_pod_name: "vault-raft-0"
vault_service_name: "vault-raft"
vault_active_service_name: "vault-raft-active"
vault_internal_service_name: "vault-raft-internal"
vault_ha_enabled: true
vault_raft_enabled: true
vault_replica_count: 3
