---
# Group mappings for production cluster
master_group: "k3s_master"
worker_group: "k3s_workers" 
cluster_group: "k3s_cluster"

# TLD for production cluster
cluster_tld: "levangie.dev"

# Variables for all K3s cluster nodes
k3s_version: "v1.28.5+k3s1"
k3s_token: "{{ vault_k3s_token }}"
kubectl_version: "v1.28.4"

# Cluster environment identifier
cluster_environment: "prod"

# Base storage mount path for this cluster
base_storage_path: "/mnt/k3s-storage"

# User configuration
k3s_user: "{{ ansible_user }}"
k3s_group: "{{ ansible_user }}"

# Network configuration
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"
metallb_ip_range: "172.20.20.200-172.20.20.210"

# Traefik LoadBalancer Configuration
traefik_loadbalancer_ip: "172.20.20.200"  # Fixed IP for Traefik LoadBalancer

# Tech Tim's HA configuration options
# Uncomment and configure these for true HA deployment:
# load_balancer_ip: "172.20.20.100"  # IP of your load balancer
# k3s_datastore_endpoint: "mysql://k3s:password@tcp(172.20.20.10:3306)/k3s"  # External database

# Features
k3s_install_kubectl: true
k3s_setup_kubeconfig: true
k3s_install_bash_completion: true
k3s_enable_auto_deploy: true

# Enhanced kernel modules for better networking support
k3s_kernel_modules:
  - br_netfilter
  - overlay
  - ip_vs
  - ip_vs_rr
  - ip_vs_wrr
  - ip_vs_sh
  - nf_conntrack

# Enhanced sysctl settings for production
k3s_sysctl_settings:
  - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
  - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
  - { name: 'net.ipv4.ip_forward', value: '1' }
  - { name: 'net.ipv4.conf.all.forwarding', value: '1' }
  - { name: 'net.ipv6.conf.all.forwarding', value: '1' }
  - { name: 'net.netfilter.nf_conntrack_max', value: '131072' }

# Synology NFS Shared Storage Configuration
enable_nfs_storage: true
enable_nfs_host_mount: true
nfs_server_ip: "172.20.20.5"  # Direct NAS IP address for backup target configuration
nfs_server: "{{ vault_nfs_server }}"  # Your Synology NAS IP address (was nas-1)
nfs_share_root: "{{ vault_nfs_share_root }}"  # Root path from vault (e.g., "/volume1/k3s-storage")
nfs_path: "{{ nfs_share_root }}"  # Main NFS export path
nfs_user: "{{ vault_nfs_username }}"  # From vault file
nfs_password: "{{ vault_nfs_password }}"  # From vault file
nfs_uid: "{{ vault_nfs_uid }}"  # Service user UID from vault
nfs_gid: "{{ vault_nfs_gid }}"  # Service user GID from vault

# NFS mount options for Synology - simplified and compatible
nfs_mount_options: "rw,hard,intr,rsize=65536,wsize=65536,timeo=600,retrans=2,vers=4"

# NFS subdirectories (non-sensitive, can be in regular vars)
nfs_share_apps: "{{ nfs_share_root }}/apps"
nfs_share_database: "{{ nfs_share_root }}/database"
nfs_share_backup: "{{ vault_nfs_share_backup_root }}"
nfs_share_shared: "{{ nfs_share_root }}/shared"

# Storage Classes
storage_classes:
  nfs_database: "nfs-database"
  nfs_apps: "nfs-apps"
  nfs_shared: "nfs-shared"
  nfs_backup: "nfs-backup"

# Global SMTP Configuration for Applications
# These settings can be used by any application that needs email functionality
smtp_host: "{{ vault_smtp_host }}"
smtp_port: 587
smtp_from: "lab@levangie.org"
smtp_from_name: "LeVangie Home Lab"
smtp_username: "{{ vault_smtp_username }}"
smtp_password: "{{ vault_smtp_password }}"
smtp_security: "starttls"  # Options: starttls, ssl, none
smtp_auth_mechanism: "Login"  # Default auth mechanism

# Application-specific SMTP overrides (when needed)
application_timezone: "America/New_York"  # Default timezone for all apps

# Production Environment - App Deployment Control
deploy_bookstack: true
deploy_homepage: true
deploy_vaultwarden: true

# Global storage limits for production environment (generous for large nodes)
global_max_pvc_size: "10Gi"              # Global max per PVC
global_min_pvc_size: "100Mi"             # Global min per PVC
global_max_pvcs: "20"                    # Max PVCs per namespace

# Longhorn Configuration for Production Cluster
# Dynamic replica count based on available worker nodes
# Calculates based on nodes in the worker_group (k3s_workers)
longhorn_replica_count: "{{ [groups[worker_group] | length, 3] | min }}"
longhorn_exclude_master_from_storage: true

# Longhorn UI Access Configuration
longhorn_ui_ingress_enabled: false  # Disabled in production for security
longhorn_ui_app_url: "https://longhorn.levangie.dev"

# Longhorn Backup Configuration
enable_longhorn_backup: true  # Enable automatic backups to NFS
longhorn_backup_shared_across_clusters: true   # Use shared backup location for cross-cluster restore
longhorn_backup_schedule_daily: "0 2 * * *"    # Daily at 2 AM
longhorn_backup_schedule_weekly: "0 3 * * 0"   # Weekly on Sunday at 3 AM
longhorn_backup_retain_daily: 7                # Keep 7 daily backups
longhorn_backup_retain_weekly: 4               # Keep 4 weekly backups

# Production Environment - Dynamic Storage Configuration with Limits
# Fully dynamic sizing with generous limits for production workloads
# Global initial size for all PVCs (starts small, grows as needed)
default_initial_volume_size: "500Mi"

# Database-specific initial sizes (databases need more space for initialization)
bookstack_database_initial_volume_size: "1Gi"

# Per-application storage limits (maximum each app can consume)
bookstack_max_namespace_storage: "15Gi"   # Total for BookStack namespace
bookstack_max_pvc_size: "10Gi"             # Max per individual PVC
bookstack_default_pvc_size: "5Gi"          # Default PVC size

vaultwarden_max_namespace_storage: "15Gi"
vaultwarden_max_pvc_size: "10Gi"
vaultwarden_default_pvc_size: "5Gi"

homepage_max_namespace_storage: "3Gi"
homepage_max_pvc_size: "2Gi"
homepage_default_pvc_size: "1Gi"


# Production Environment - Force Redeploy Configuration
# Only enable these manually when intentional redeployment is needed
bookstack_force_redeploy: false
homepage_force_redeploy: false  
vaultwarden_force_redeploy: false