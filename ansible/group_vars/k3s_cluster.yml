---
# =============================================================================
# K3s CLUSTER BASE CONFIGURATION
# =============================================================================
# This file contains shared defaults for ALL environments.
# Environment-specific overrides go in k3s_cluster_{env}.yml files.
#
# Variable loading order (later overrides earlier):
#   1. k3s_cluster_vault.yml (secrets)
#   2. k3s_cluster.yml (THIS FILE - shared defaults)
#   3. k3s_cluster_{env}.yml (environment overrides)
# =============================================================================

# -----------------------------------------------------------------------------
# DERIVED VARIABLES (computed from cluster_environment)
# -----------------------------------------------------------------------------
# These are automatically derived - no need to set per-environment

# Domain structure:
#   prod:  app.levangie.dev (no subdomain)
#   stage: app.stage.levangie.dev
#   test:  app.test.levangie.dev
cluster_tld: "levangie.dev"
environment_domain: "{{ (cluster_environment + '.' + cluster_tld) if cluster_environment != 'prod' else cluster_tld }}"
environment_prefix: "{{ (cluster_environment + '.') if cluster_environment != 'prod' else '' }}"
cluster_dns_name: "k3s-{{ cluster_environment }}.{{ cluster_tld }}"

# Group mappings (derived from cluster_environment)
master_group: "k3s_cluster_{{ cluster_environment }}_master"
worker_group: "k3s_cluster_{{ cluster_environment }}_workers"
cluster_group: "k3s_cluster_{{ cluster_environment }}"

# Storage paths
base_storage_path: "/mnt/k3s-storage{{ '-' + cluster_environment if cluster_environment != 'prod' else '' }}"
nfs_path: "{{ nfs_share_root }}{{ '-' + cluster_environment if cluster_environment != 'prod' else '' }}"

# -----------------------------------------------------------------------------
# K3S CLUSTER SETTINGS
# -----------------------------------------------------------------------------
k3s_version: "v1.28.5+k3s1"
k3s_token: "{{ vault_k3s_token }}"
kubectl_version: "v1.28.4"

# User configuration
k3s_user: "{{ ansible_user }}"
k3s_group: "{{ ansible_user }}"

# Features
k3s_install_kubectl: true
k3s_setup_kubeconfig: true
k3s_install_bash_completion: true
k3s_enable_auto_deploy: true

# Enhanced kernel modules for better networking support
k3s_kernel_modules:
  - br_netfilter
  - overlay
  - ip_vs
  - ip_vs_rr
  - ip_vs_wrr
  - ip_vs_sh
  - nf_conntrack

# Enhanced sysctl settings
k3s_sysctl_settings:
  - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
  - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
  - { name: 'net.ipv4.ip_forward', value: '1' }
  - { name: 'net.ipv4.conf.all.forwarding', value: '1' }
  - { name: 'net.ipv6.conf.all.forwarding', value: '1' }
  - { name: 'net.netfilter.nf_conntrack_max', value: '131072' }

# -----------------------------------------------------------------------------
# TRAEFIK / SSL CONFIGURATION
# -----------------------------------------------------------------------------
traefik_tls_enabled: true
traefik_acme_enabled: true
traefik_acme_dns_provider: "cloudflare"
traefik_acme_email: "admin@levangie.dev"
traefik_persistence_enabled: true
traefik_dashboard_enabled: true
traefik_dashboard_insecure: false
traefik_custom_domain: "*.{{ environment_domain }}"

# Wildcard Certificate Configuration
traefik_wildcard_cert_enabled: true
traefik_wildcard_domain: "*.{{ environment_domain }}"
# Additional wildcard domains (e.g. secondary TLDs served by the same cluster)
traefik_additional_wildcard_domains:
  - main: "*.levangie.org"
    sans:
      - "levangie.org"

# Critical DNS Configuration for ACME validation
traefik_dns_policy: "None"
traefik_external_nameservers:
  - "1.1.1.1"
  - "8.8.8.8"
traefik_dns_ndots: "2"

# CoreDNS should use internal DNS so in-cluster workloads can resolve
# split-horizon/internal records the same way cluster nodes do.
coredns_upstream_nameservers:
  - "172.20.20.4"

# -----------------------------------------------------------------------------
# DNS MANAGEMENT
# -----------------------------------------------------------------------------
manage_dns_records: true
technitium_dns_server: "{{ vault_technitium_dns_server }}"
technitium_api_token: "{{ vault_technitium_api_token }}"
dns_record_ttl: 3600

# ExternalDNS webhook credentials (for Technitium webhook sidecar)
technitium_webhook_url: "http://{{ vault_technitium_dns_server }}:5380"
technitium_webhook_username: "{{ vault_technitium_username }}"
technitium_webhook_password: "{{ vault_technitium_password }}"

# -----------------------------------------------------------------------------
# ARGOCD GITOPS CONFIGURATION
# -----------------------------------------------------------------------------
argocd_ingress_enabled: true
argocd_app_url: "https://argocd.{{ environment_domain }}"

# ArgoCD component replicas (single instance for homelab)
argocd_server_replicas: 1
argocd_reposerver_replicas: 1
argocd_controller_replicas: 1
argocd_appset_replicas: 1

# ArgoCD optional features
argocd_dex_enabled: false           # SSO/OIDC provider
argocd_notifications_enabled: false  # Notification controller
argocd_grpc_ingress_enabled: false  # gRPC ingress for external CLI

# ArgoCD GitOps source configuration
# All environments track the same Git revision and select their manifests by path:
#   test:  argocd/apps/test
#   stage: argocd/apps/stage
#   prod:  argocd/apps/prod
argocd_target_revision: "main"
argocd_deploy_root_app: true         # Deploy root app-of-apps Application

# -----------------------------------------------------------------------------
# VAULT / EXTERNAL SECRETS CONFIGURATION
# -----------------------------------------------------------------------------
k3s_configure_vault: true
vault_namespace: "vault"
vault_statefulset_name: "vault"
vault_primary_pod_name: "{{ vault_statefulset_name }}-0"
vault_pod_name: "{{ vault_primary_pod_name }}"
vault_service_name: "vault"
vault_active_service_name: "vault-active"
vault_internal_service_name: "vault-internal"
vault_ha_enabled: false
vault_raft_enabled: false
vault_replica_count: 1
vault_raft_join_address: "http://{{ vault_primary_pod_name }}.{{ vault_internal_service_name }}:8200"
vault_api_addr: "{{ 'http://' + vault_active_service_name + '.' + vault_namespace + '.svc:8200' if vault_ha_enabled else 'http://127.0.0.1:8200' }}"
vault_kv_path: "kv"
vault_init_secret_name: "vault-init"
external_secrets_namespace: "external-secrets"
external_secrets_service_account: "external-secrets"
vault_external_secrets_policy: "external-secrets"
vault_external_secrets_role: "external-secrets"
external_secrets_bootstrap_crds: false
external_secrets_crds_chart_version: "2.3.0"

# ArgoCD server resource limits (homelab-appropriate)
argocd_server_cpu_limit: "500m"
argocd_server_memory_limit: "512Mi"
argocd_server_cpu_request: "100m"
argocd_server_memory_request: "256Mi"

# ArgoCD repo server resource limits
argocd_reposerver_cpu_limit: "500m"
argocd_reposerver_memory_limit: "512Mi"
argocd_reposerver_cpu_request: "100m"
argocd_reposerver_memory_request: "256Mi"

# ArgoCD controller resource limits
# Memory bumped from 1Gi/512Mi to match stage after observability rollout:
# 1Gi was insufficient with the new applications added (Loki, Promtail,
# Blackbox, monitoring-config resources) — controller was OOMKilled mid-sync.
argocd_controller_cpu_limit: "1000m"
argocd_controller_memory_limit: "2Gi"
argocd_controller_cpu_request: "250m"
argocd_controller_memory_request: "1Gi"

# ArgoCD redis resource limits
argocd_redis_cpu_limit: "200m"
argocd_redis_memory_limit: "256Mi"
argocd_redis_cpu_request: "50m"
argocd_redis_memory_request: "128Mi"

# -----------------------------------------------------------------------------
# NFS STORAGE CONFIGURATION
# -----------------------------------------------------------------------------
enable_nfs_storage: true
enable_nfs_host_mount: true
nfs_server_ip: "172.20.20.5"
nfs_server: "{{ vault_nfs_server }}"
nfs_share_root: "{{ vault_nfs_share_root }}"
nfs_user: "{{ vault_nfs_username }}"
nfs_password: "{{ vault_nfs_password }}"
nfs_uid: "{{ vault_nfs_uid }}"
nfs_gid: "{{ vault_nfs_gid }}"

# NFS mount options
nfs_mount_options: "rw,hard,intr,rsize=65536,wsize=65536,timeo=600,retrans=2,vers=4"

# NFS subdirectories (derived from cluster_environment)
nfs_share_apps: "{{ nfs_share_root }}/{{ cluster_environment + '-' if cluster_environment != 'prod' else '' }}apps"
nfs_share_database: "{{ nfs_share_root }}/{{ cluster_environment + '-' if cluster_environment != 'prod' else '' }}database"
nfs_share_backup: "{{ vault_nfs_share_backup_root }}"
nfs_share_shared: "{{ nfs_share_root }}/{{ 'shared' if cluster_environment == 'prod' else cluster_environment }}"

# Storage Classes
storage_classes:
  nfs_database: "nfs-database"
  nfs_apps: "nfs-apps"
  nfs_shared: "nfs-shared"
  nfs_backup: "nfs-backup"

# -----------------------------------------------------------------------------
# GLOBAL STORAGE LIMITS (defaults - can override per environment)
# -----------------------------------------------------------------------------
global_max_pvc_size: "10Gi"
global_min_pvc_size: "100Mi"
global_max_pvcs: "20"
default_initial_volume_size: "500Mi"

# -----------------------------------------------------------------------------
# LONGHORN CONFIGURATION
# -----------------------------------------------------------------------------
longhorn_replica_count: 2
longhorn_replica_auto_balance: "best-effort"
longhorn_exclude_master_from_storage: false
longhorn_storage_reserved_percentage_for_default_disk: 5
longhorn_default_node_selector: ""
longhorn_media_node_selector: ""
longhorn_media_storage_class_name: "longhorn-media"
longhorn_ui_ingress_enabled: true
longhorn_ui_app_url: "https://longhorn.{{ environment_domain }}"

# Longhorn Backup Configuration
enable_longhorn_backup: true
longhorn_backup_shared_across_clusters: true
longhorn_backup_schedule_daily: "0 6 * * *"
longhorn_backup_schedule_weekly: "0 7 * * 0"
longhorn_backup_retain_daily: 7
longhorn_backup_retain_weekly: 4

# -----------------------------------------------------------------------------
# NVIDIA GPU WORKER CONFIGURATION
# -----------------------------------------------------------------------------
# Intentionally leave node-role toggles undefined here so inventory host_vars can
# opt specific workers into GPU behavior and Longhorn replica exclusion.
nvidia_gpu_node_label_key: "accelerator"
nvidia_gpu_node_label_value: "nvidia"
nvidia_gpu_node_taint: "accelerator=nvidia:NoSchedule"
nvidia_container_toolkit_repo: "https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list"

# -----------------------------------------------------------------------------
# SMTP CONFIGURATION
# -----------------------------------------------------------------------------
smtp_host: "{{ vault_smtp_host }}"
smtp_port: 587
smtp_from: "lab@levangie.org"
smtp_from_name: "LeVangie Home Lab"
smtp_username: "{{ vault_smtp_username }}"
smtp_password: "{{ vault_smtp_password }}"
smtp_security: "starttls"
smtp_auth_mechanism: "Login"

# Application timezone
application_timezone: "America/New_York"

# Apps are deployed by ArgoCD from argocd/apps/<env>/ on `main`. The previous
# Ansible app-deploy pipeline (app_definitions, enabled_apps,
# force_redeploy_apps, the k3s-apps role) has been removed.
