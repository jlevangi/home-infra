---
# Group_vars for the prod worker pool (k3s-prod-worker-{1,2,3} + worker-gpu-1).
# Auto-loaded by Ansible's inventory group_vars matching for hosts in
# k3s_cluster_prod_workers. Lives here rather than k3s_cluster.yml so the
# control-plane group (k3s_cluster_prod_master) doesn't inherit worker-only
# defaults — and so per-host overrides in host_vars actually win (vars_files
# loaded by the playbook has higher precedence than auto-loaded group_vars,
# but lower than host_vars).

# Atlas workers expose Longhorn disks via QEMU SCSI virtual slots. The Atlas
# Terraform module (terraform/modules/proxmox-cloudinit-nodes) provisions the
# tank-backed data disk at a configurable slot (default scsi1; the prod stack
# uses scsi2). The role derives longhorn_tank_disk_device from the template +
# slot below so worker host_vars don't need to spell out the full by-id path.
#
# Override longhorn_tank_disk_slot to "" in host_vars when a worker has no
# tank disk (e.g. the GPU worker, whose scsi2 is the LLM model disk).
# Hosts on non-QEMU layouts can set longhorn_tank_disk_device directly and
# the slot mechanism is skipped.
longhorn_disk_device_template: "/dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-{slot}"
longhorn_tank_disk_slot: scsi2
