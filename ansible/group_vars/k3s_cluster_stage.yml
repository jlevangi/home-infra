---
# =============================================================================
# STAGING ENVIRONMENT OVERRIDES
# =============================================================================
# Only settings that DIFFER from the base k3s_cluster.yml
# =============================================================================

cluster_environment: "stage"

# -----------------------------------------------------------------------------
# NETWORK CONFIGURATION
# -----------------------------------------------------------------------------
k3s_cluster_cidr: "10.44.0.0/16"
k3s_service_cidr: "10.45.0.0/16"
metallb_ip_range: "172.20.20.211-172.20.20.221"
traefik_loadbalancer_ip: "172.20.20.211"

# -----------------------------------------------------------------------------
# APPLICATIONS TO DEPLOY
# -----------------------------------------------------------------------------
enabled_apps:
  - bookstack
  - vaultwarden
  - homepage
  - pocketid

force_redeploy_apps:
  - bookstack
  - vaultwarden
  - homepage
  - pocketid

# -----------------------------------------------------------------------------
# STAGING-SPECIFIC OVERRIDES
# -----------------------------------------------------------------------------
# Offset backup schedules from prod
longhorn_backup_schedule_daily: "0 1 * * *"
longhorn_backup_schedule_weekly: "0 2 * * 6"
longhorn_backup_retain_daily: 3
longhorn_backup_retain_weekly: 2
