---
# =============================================================================
# STAGING ENVIRONMENT OVERRIDES
# =============================================================================
# Only settings that DIFFER from the base k3s_cluster.yml
# =============================================================================

cluster_environment: "stage"

# -----------------------------------------------------------------------------
# NETWORK CONFIGURATION
# -----------------------------------------------------------------------------
k3s_cluster_cidr: "10.44.0.0/16"
k3s_service_cidr: "10.45.0.0/16"
metallb_ip_range: "172.20.20.211-172.20.20.221"
traefik_loadbalancer_ip: "172.20.20.211"

# -----------------------------------------------------------------------------
# STAGING-SPECIFIC OVERRIDES
# -----------------------------------------------------------------------------
# Disable backups for stage (restores from prod backups for testing)
enable_longhorn_backup: false

# Stage tracks the ESO chart with installCRDs=false, so fresh rebuilds need the
# CRDs pre-seeded before ArgoCD syncs ExternalSecret resources.
external_secrets_bootstrap_crds: true

# Stage needs more ArgoCD controller headroom during branch-isolated rollout
# testing because the application-controller is reconciling the full app tree
# plus new observability apps on slower storage.
argocd_controller_memory_limit: "2Gi"
argocd_controller_memory_request: "1Gi"

# -----------------------------------------------------------------------------
# LONGHORN TOPOLOGY (mirrors prod for HA validation)
# -----------------------------------------------------------------------------
# Stage now runs 3 dedicated CP nodes + 3 dedicated workers, matching prod.
# Longhorn replicas live only on workers; CP nodes run only kube-apiserver/etcd
# and are excluded from storage scheduling.
longhorn_replica_count: 3
longhorn_exclude_master_from_storage: true
longhorn_guaranteed_instance_manager_cpu: 12

# -----------------------------------------------------------------------------
# K3S DATASTORE — embedded etcd HA (validates prod plan)
# -----------------------------------------------------------------------------
# Stage previously ran SQLite on a single master to dodge the embedded-etcd
# fsync watchdog (see IMPORTANT_NOTE.md). With 3 dedicated CP nodes that don't
# host Longhorn or app pods, etcd should keep within the 100ms fsync bound.
# The role default + master.yml init/join logic now drives --cluster-init on
# cp-1 and --server <url> on cp-2/cp-3, so no override is needed here.
# If etcd crash-loops, fall back is moving CP disks to faster storage or
# running stage as a single-master with SQLite again.
