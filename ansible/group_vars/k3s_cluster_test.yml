---
# =============================================================================
# TEST ENVIRONMENT OVERRIDES
# =============================================================================
# Only settings that DIFFER from the base k3s_cluster.yml
# =============================================================================

cluster_environment: "test"

# -----------------------------------------------------------------------------
# NETWORK CONFIGURATION
# -----------------------------------------------------------------------------
k3s_cluster_cidr: "10.46.0.0/16"
k3s_service_cidr: "10.47.0.0/16"
metallb_ip_range: "172.20.20.230-172.20.20.240"
traefik_loadbalancer_ip: "172.20.20.230"

# -----------------------------------------------------------------------------
# APPLICATIONS TO DEPLOY
# -----------------------------------------------------------------------------
# Apps are now managed by ArgoCD - disable Ansible deployment
enabled_apps: []
force_redeploy_apps: []

# -----------------------------------------------------------------------------
# TEST-SPECIFIC OVERRIDES
# -----------------------------------------------------------------------------
# Conservative storage limits for test environment
global_max_pvc_size: "5Gi"
global_min_pvc_size: "10Mi"
global_max_pvcs: "5"
default_initial_volume_size: "100Mi"

# Disable backups for test environment (ephemeral data)
enable_longhorn_backup: false

# Test tracks the same ESO chart path as stage and may be rebuilt from scratch.
external_secrets_bootstrap_crds: true

# Shorter DNS TTL for test (faster iteration)
dns_record_ttl: 300

# Point test ArgoCD at feature branch (revert to "main" after merge)
argocd_target_revision: "feature/external-dns-automation"

# -----------------------------------------------------------------------------
# K3S DATASTORE — SQLite (not embedded etcd)
# -----------------------------------------------------------------------------
# Explicit override of roles/k3s/defaults/main.yml's k3s_server_args to drop
# `--cluster-init`. See IMPORTANT_NOTE.md at the repo root for the full story.
#
# Short version: `--cluster-init` switches k3s from SQLite/kine to embedded
# etcd. Embedded etcd has a ~100ms disk fsync watchdog that our local-lvm
# Proxmox storage cannot reliably meet during Longhorn + ArgoCD install,
# which causes k3s to crash loop (NRestarts > 15 observed). SQLite is
# tolerant of slower disks and we do not need HA on a 1-master cluster.
k3s_server_args:
  - "--disable=traefik"
  - "--disable=servicelb"
  - "--write-kubeconfig-mode=644"
  - "--node-external-ip={{ ansible_default_ipv4.address }}"
  - "--tls-san={{ load_balancer_ip | default(ansible_default_ipv4.address) }}"
