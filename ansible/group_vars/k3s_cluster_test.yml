---
# Group mappings for test cluster
master_group: "k3s_cluster_test_master"
worker_group: "k3s_cluster_test_workers"
cluster_group: "k3s_cluster_test"

# Test cluster specific overrides (if any)
# Most settings will inherit from k3s_cluster.yml, but you can override here

# Override TLD for test cluster
cluster_tld: "test"

# Override app URLs for test cluster to use .test TLDs
bookstack_app_url: "https://bookstack.test"
homepage_app_url: "https://homepage.test"
vaultwarden_app_url: "https://vw.test"

# Example: Different version for testing
# k3s_version: "v1.29.0+k3s1"  # Uncomment to test newer version

# Example: Different network ranges to avoid conflicts
k3s_cluster_cidr: "10.44.0.0/16"  # Different from prod: 10.42.0.0/16
k3s_service_cidr: "10.45.0.0/16"  # Different from prod: 10.43.0.0/16

# MetalLB Configuration
metallb_ip_range: "172.20.20.220-172.20.20.230"

# Traefik LoadBalancer Configuration  
traefik_loadbalancer_ip: "172.20.20.220"  # Fixed IP for Traefik LoadBalancer

# Test-specific NFS paths (optional)
# You might want test apps to use different NFS subdirectories
nfs_share_apps: "{{ nfs_share_root }}/test-apps"
nfs_share_database: "{{ nfs_share_root }}/test-database" 
nfs_share_backup: "{{ vault_nfs_share_backup_root }}"
nfs_share_shared: "{{ nfs_share_root }}/test-shared"

# Cluster environment identifier
cluster_environment: "test"

# Base storage mount path for this cluster  
base_storage_path: "/mnt/k3s-storage-test"

# Direct NFS server IP (same as production)
nfs_server_ip: "172.20.20.5"  # Direct NAS IP address for backup target configuration

# Override NFS path for test environment to prevent mounting main share
nfs_path: "{{ nfs_share_root }}-test"

# Test Environment - App Deployment Control
# Enable all apps by default in test for comprehensive testing
deploy_bookstack: true
deploy_homepage: true
deploy_vaultwarden: true

# Test Environment - Force Redeploy Configuration
bookstack_force_redeploy: false
homepage_force_redeploy: false
vaultwarden_force_redeploy: false

# ================================================================================
# STORAGE CONFIGURATION - TEST ENVIRONMENT
# ================================================================================

# Global Storage Limits (conservative for test environment small nodes)
global_max_pvc_size: "5Gi"               # Global max per PVC
global_min_pvc_size: "10Mi"              # Global min per PVC  
global_max_pvcs: "5"                     # Max PVCs per namespace
default_initial_volume_size: "100Mi"     # Global initial size for all PVCs

# Database-specific initial sizes (databases need more space for initialization)
bookstack_database_initial_volume_size: "500Mi"

# Per-application storage limits (maximum each app can consume)
bookstack_max_namespace_storage: "8Gi"    # Total for BookStack namespace
bookstack_max_pvc_size: "5Gi"             # Max per individual PVC
bookstack_default_pvc_size: "500Mi"       # Default PVC size

vaultwarden_max_namespace_storage: "5Gi"
vaultwarden_max_pvc_size: "3Gi"
vaultwarden_default_pvc_size: "500Mi"

homepage_max_namespace_storage: "2Gi"
homepage_max_pvc_size: "1Gi"
homepage_default_pvc_size: "100Mi"

# Longhorn Configuration for Test Cluster
# Dynamic replica count based on available worker nodes
longhorn_replica_count: "{{ [groups[worker_group] | length, 3] | min }}"
longhorn_exclude_master_from_storage: true

# Longhorn UI Access Configuration
longhorn_ui_ingress_enabled: true
longhorn_ui_app_url: "http://longhorn.test"

# Longhorn Backup Configuration (Test environment)
enable_longhorn_backup: true  # Enable backups in test for validation
longhorn_backup_shared_across_clusters: true   # Use shared backup location for cross-cluster restore
longhorn_backup_schedule_daily: "0 1 * * *"    # Daily at 1 AM (offset from prod)
longhorn_backup_schedule_weekly: "0 2 * * 6"   # Weekly on Saturday at 2 AM
longhorn_backup_retain_daily: 3                # Keep 3 daily backups (less for test)
longhorn_backup_retain_weekly: 2               # Keep 2 weekly backups
