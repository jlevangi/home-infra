# Telegraf Vault Variables Template
# Add these variables to your existing vault file: ansible/group_vars/k3s_cluster_vault.yml
# Use: ansible-vault edit ansible/group_vars/k3s_cluster_vault.yml

# Required InfluxDB connection settings for Telegraf
vault_telegraf_influxdb_url: "http://192.168.1.11:8086"  # Update with your InfluxDB server URL
vault_telegraf_database: "telegraf"                      # InfluxDB database name
vault_telegraf_username: "telegraf"                      # InfluxDB username for Telegraf
vault_telegraf_password: "your_secure_password_here"     # InfluxDB password for Telegraf user

# Optional: InfluxDB retention policy (leave empty for default)
vault_telegraf_retention_policy: ""

# Optional: Kubernetes API monitoring token  
# Generate with: ./scripts/create-k3s-monitoring-token.sh
# Or leave empty to disable K8s API monitoring
vault_k3s_monitoring_token: ""
