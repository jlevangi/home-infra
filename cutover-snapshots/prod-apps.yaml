              grafana:
                enabled: true
                deploymentStrategy:
                  type: Recreate
                  rollingUpdate: null
                admin:
                  existingSecret: grafana-admin-credentials
                  userKey: admin-user
                  passwordKey: admin-password
                readinessProbe:
                  httpGet:
                    path: /api/health
                    port: 3000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
                ingress:
                  enabled: true
                  ingressClassName: traefik
                  annotations:
                    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
                    external-dns.alpha.kubernetes.io/target: k3s-prod.levangie.dev
                  hosts:
                    - grafana.levangie.dev
                persistence:
                  enabled: true
                  existingClaim: kube-prometheus-stack-grafana
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
                sidecar:
                  dashboards:
                    enabled: true
                    searchNamespace: ALL
                additionalDataSources:
                  - name: Loki
                    uid: loki
                    type: loki
                    access: proxy
                    url: http://loki.monitoring.svc.cluster.local:3100
                    jsonData:
                      maxLines: 1000

              prometheus:
                prometheusSpec:
                  retention: 15d
                  retentionSize: 20GiB
                  resources:
                    requests:
                      cpu: 250m
                      memory: 512Mi
                    limits:
                      cpu: 1000m
                      memory: 2Gi
                  storageSpec:
                    volumeClaimTemplate:
                      spec:
                        storageClassName: longhorn
                        accessModes: ["ReadWriteOnce"]
                        resources:
                          requests:
                            storage: 25Gi
                  serviceMonitorSelectorNilUsesHelmValues: false
                  podMonitorSelectorNilUsesHelmValues: false
                  ruleSelectorNilUsesHelmValues: false

              alertmanager:
                enabled: true
                config:
                  global:
                    resolve_timeout: 5m
                  route:
                    receiver: ntfy-prod
                    group_by:
                      - alertname
                      - severity
                      - namespace
                      - node
                      - instance
                      - group
                      - name
                      - volume
                    group_wait: 30s
                    group_interval: 5m
                    repeat_interval: 4h
                    routes:
                      - receiver: ntfy-null
                        matchers:
                          - severity="none"
                      - receiver: ntfy-null
                        matchers:
                          - severity="info"
                      - receiver: ntfy-null
                        matchers:
                          - alertname="InfoInhibitor"
                      - receiver: ntfy-prod-critical
                        matchers:
                          - severity="critical"
                  receivers:
                    - name: ntfy-null
                    - name: ntfy-prod
                      webhook_configs:
                        - url: http://alertmanager-ntfy-bridge.monitoring.svc.cluster.local/alerts/homelab-alerts
                          send_resolved: true
                          timeout: 10s
                    - name: ntfy-prod-critical
                      webhook_configs:
                        - url: http://alertmanager-ntfy-bridge.monitoring.svc.cluster.local/alerts/homelab-critical
                          send_resolved: true
                          timeout: 10s
                alertmanagerSpec:
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      cpu: 200m
                      memory: 256Mi
                  storage:
                    volumeClaimTemplate:
                      spec:
                        storageClassName: longhorn
                        accessModes: ["ReadWriteOnce"]
                        resources:
                          requests:
                            storage: 2Gi

              nodeExporter:
                enabled: true
              prometheus-node-exporter:
                tolerations:
                  - key: CriticalAddonsOnly
                    operator: Equal
                    value: "true"
                    effect: NoExecute
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 200m
                    memory: 128Mi

              kube-state-metrics:
                resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    cpu: 200m
                    memory: 256Mi

              kubeEtcd:
                enabled: false
              kubeScheduler:
                enabled: false
              kubeControllerManager:
                enabled: false
              kubeProxy:
                enabled: false
          repoURL: https://prometheus-community.github.io/helm-charts
          targetRevision: 83.6.0
      revision: 83.6.0
      status: Synced
