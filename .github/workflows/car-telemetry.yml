name: Car telemetry ingester image

on:
  push:
    branches: [main]
    paths:
      - services/car-telemetry/**
      - .github/workflows/car-telemetry.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and push
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/jlevangi/home-infra-car-telemetry:git-${{ github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --pull --tag "$IMAGE" --tag ghcr.io/jlevangi/home-infra-car-telemetry:latest services/car-telemetry
          docker push "$IMAGE"
          docker push ghcr.io/jlevangi/home-infra-car-telemetry:latest
