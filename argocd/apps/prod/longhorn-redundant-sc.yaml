apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-redundant-sc
  namespace: argocd
  annotations:
    # Sync before any app that might bind a PVC to this class. Same
    # priority tier as the vault-storageclass.
    argocd.argoproj.io/sync-wave: "-4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/longhorn-redundant-sc/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
