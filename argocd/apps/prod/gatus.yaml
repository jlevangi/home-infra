apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/gatus/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: gatus
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
