apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://minicloudlabs.github.io/helm-charts
    chart: gatus
    targetRevision: 3.4.6
    helm:
      values: |
        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
          hosts:
            - status.levangie.dev

        persistence:
          enabled: true
          storageClassName: longhorn
          size: 1Gi

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

        config:
          storage:
            type: sqlite
            path: /data/data.db

          endpoints:
            - name: ArgoCD
              group: Infrastructure
              url: https://argocd.levangie.dev
              interval: 5m
              conditions:
                - "[STATUS] == 200"
                - "[RESPONSE_TIME] < 5000"

            - name: Longhorn
              group: Infrastructure
              url: https://longhorn.levangie.dev
              interval: 5m
              conditions:
                - "[STATUS] == 200"

            - name: Grafana
              group: Monitoring
              url: https://grafana.levangie.dev
              interval: 5m
              conditions:
                - "[STATUS] == 200"
                - "[RESPONSE_TIME] < 5000"

            - name: Prometheus
              group: Monitoring
              url: http://prometheus-prometheus.monitoring.svc.cluster.local:9090/-/healthy
              interval: 2m
              conditions:
                - "[STATUS] == 200"

            - name: Bookstack
              group: Applications
              url: https://bookstack.levangie.dev
              interval: 5m
              conditions:
                - "[STATUS] == 200"
                - "[RESPONSE_TIME] < 5000"

            - name: Vaultwarden
              group: Applications
              url: https://vw.levangie.dev
              interval: 5m
              conditions:
                - "[STATUS] == 200"
                - "[RESPONSE_TIME] < 5000"

            - name: PocketID
              group: Applications
              url: https://pocketid.levangie.dev
              interval: 5m
              conditions:
                - "[STATUS] == 200"
                - "[RESPONSE_TIME] < 5000"

            - name: Microbin
              group: Applications
              url: https://bin.levangie.dev
              interval: 5m
              conditions:
                - "[STATUS] == 200"
                - "[RESPONSE_TIME] < 5000"

            - name: Paperless
              group: Applications
              url: https://paperless.levangie.dev
              interval: 5m
              conditions:
                - "[STATUS] == 200"
                - "[RESPONSE_TIME] < 5000"

            - name: Factorio
              group: Applications
              url: tcp://factorio.levangie.dev:27015
              interval: 5m
              conditions:
                - "[CONNECTED] == true"
  destination:
    server: https://kubernetes.default.svc
    namespace: gatus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
