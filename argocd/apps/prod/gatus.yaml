apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://minicloudlabs.github.io/helm-charts
    chart: gatus
    targetRevision: 3.4.6
    helm:
      values: |
        image:
          tag: v5.35.0

        deployment:
          strategy: Recreate

        ingress:
          enabled: true
          ingressClassName: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
            external-dns.alpha.kubernetes.io/target: k3s-prod.levangie.dev
          hosts:
            - status.levangie.dev

        persistence:
          enabled: true
          existingClaim: gatus

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

        config:
          metrics: true

          storage:
            type: sqlite
            path: /data/data.db

          endpoints:
            - name: ArgoCD
              group: Infrastructure
              url: https://argocd.levangie.dev
              interval: 5m
              conditions:
                - "[STATUS] == 200"
                - "[RESPONSE_TIME] < 5000"

            - name: Longhorn
              group: Infrastructure
              url: https://longhorn.levangie.dev
              interval: 5m
              conditions:
                - "[STATUS] == 200"

            - name: Keycloak
              group: Infrastructure
              url: https://auth.levangie.org/realms/master/.well-known/openid-configuration
              interval: 5m
              conditions:
                - "[STATUS] == 200"
                - "[RESPONSE_TIME] < 5000"
                - "[BODY].issuer == https://auth.levangie.org/realms/master"

            - name: Vault
              group: Infrastructure
              url: https://vault.levangie.dev
              interval: 5m
              conditions:
                - "[STATUS] == 200"
                - "[RESPONSE_TIME] < 5000"

            - name: MeshCentral
              group: Infrastructure
              url: https://mesh.levangie.dev
              interval: 5m
              conditions:
                - "[STATUS] == 200"
                - "[RESPONSE_TIME] < 5000"

            - name: CrowdSec LAPI
              group: Infrastructure
              url: http://crowdsec-lapi.crowdsec.svc.cluster.local:8080/health
              interval: 2m
              conditions:
                - "[STATUS] == 200"

            - name: Plausible
              group: Applications
              url: https://plausible.levangie.dev/api/health
              interval: 5m
              conditions:
                - "[STATUS] == 200"
                - "[RESPONSE_TIME] < 5000"
                - "[BODY].postgres == ok"
                - "[BODY].clickhouse == ok"

            - name: Kaylee Watkins
              group: Applications
              url: https://kayleewatkins.com
              interval: 5m
              conditions:
                - "[STATUS] == 200"
                - "[RESPONSE_TIME] < 5000"

            - name: Everly Era
              group: Business
              url: https://everlyera.com
              interval: 5m
              conditions:
                - "[STATUS] == 200"
                - "[RESPONSE_TIME] < 5000"

            - name: Grafana
              group: Monitoring
              url: https://grafana.levangie.dev
              interval: 5m
              conditions:
                - "[STATUS] == 200"
                - "[RESPONSE_TIME] < 5000"

            - name: Prometheus
              group: Monitoring
              url: http://prometheus-prometheus.monitoring.svc.cluster.local:9090/-/healthy
              interval: 2m
              conditions:
                - "[STATUS] == 200"

            - name: Bookstack
              group: Applications
              url: https://bookstack.levangie.dev
              interval: 5m
              conditions:
                - "[STATUS] == 200"
                - "[RESPONSE_TIME] < 5000"

            - name: Alist
