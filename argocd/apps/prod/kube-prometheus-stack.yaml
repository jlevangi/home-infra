apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.14.0
    helm:
      values: |
        fullnameOverride: prometheus

        defaultRules:
          disabled:
            # llama-cpp is intentionally non-HA: only the GPU worker can run it,
            # and its large memory request would otherwise make the upstream
            # cluster-wide HA overcommit alert permanently noisy.
            KubeMemoryOvercommit: true

        grafana:
          enabled: true
          deploymentStrategy:
            type: Recreate
            rollingUpdate: null
          admin:
            existingSecret: grafana-admin-credentials
            userKey: admin-user
            passwordKey: admin-password
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-admin-credentials
                key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
          grafana.ini:
            server:
              root_url: https://grafana.levangie.dev
            auth.generic_oauth:
              enabled: true
              name: Keycloak
              icon: signin
              allow_sign_up: true
              auto_login: false
              client_id: grafana
              client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
              scopes: openid profile email groups
              auth_url: https://auth.levangie.org/realms/master/protocol/openid-connect/auth
              token_url: https://auth.levangie.org/realms/master/protocol/openid-connect/token
              api_url: https://auth.levangie.org/realms/master/protocol/openid-connect/userinfo
              use_pkce: true
              role_attribute_path: contains(groups[*], 'grafana-admin') && 'GrafanaAdmin' || contains(groups[*], 'grafana-editor') && 'Editor' || 'Viewer'
              allow_assign_grafana_admin: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
              external-dns.alpha.kubernetes.io/target: k3s-prod.levangie.dev
            hosts:
              - grafana.levangie.dev
          persistence:
            enabled: true
            existingClaim: kube-prometheus-stack-grafana-rdn
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              jsonData:
                maxLines: 1000

        prometheus:
          prometheusSpec:
            retention: 15d
            retentionSize: 20GiB
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2Gi
            storageSpec:
              volumeClaimTemplate:
                metadata:
                  labels:
                    recurring-job-group.longhorn.io/hourly: "enabled"
                    recurring-job-group.longhorn.io/daily: "enabled"
                    recurring-job-group.longhorn.io/weekly: "enabled"
                spec:
                  # The Prometheus PVC has diskSelector=["tank"] patched at
                  # runtime (2026-05-31 incident — heavy TSDB writes were
                  # starving shared Atlas flash IOPS). The "right" value
                  # below is longhorn-tank, but StatefulSet
                  # volumeClaimTemplates is immutable post-creation and
                  # ArgoCD can't apply the change to the live object. The
                  # chart value stayed longhorn until the PVC was recreated
                  # under home-infra-wdy; the runtime patch carries the
                  # actual placement.
                  storageClassName: longhorn-tank
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 25Gi
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false

        alertmanager:
          enabled: true
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: ntfy-prod
              group_by:
                - alertname
                - severity
                - namespace
                - node
                - instance
                - group
                - name
                - volume
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - receiver: ntfy-null
                  matchers:
                    - severity="none"
                - receiver: ntfy-null
                  matchers:
                    - severity="info"
                - receiver: ntfy-null
                  matchers:
                    - alertname="InfoInhibitor"
                # Upstream node-exporter rule fires on load/core>2 for 15m, which is
                # too sensitive for a homelab where bursty IO-wait spikes are normal.
                # Drop notifications here; NodeSustainedSaturation (custom rule, load/core>4
                # for 30m) handles the cases we actually want to be paged for.
                - receiver: ntfy-null
                  matchers:
                    - alertname="NodeSystemSaturation"
                # Keep scraping the operator-started workstation llama-swap
                # target for Grafana usage/history, but do not notify when
                # Pierce intentionally leaves llama-swap stopped on the PC.
                - receiver: ntfy-null
                  matchers:
                    - alertname="TargetDown"
                    - job="llama-cpp-pc"
                - receiver: ntfy-prod-critical
                  matchers:
                    - severity="critical"
            inhibit_rules:
              - source_matchers:
                  - alertname="KubernetesNodeNotReady"
                  - severity="critical"
                target_matchers:
                  - alertname="LonghornVolumesDegraded"
            receivers:
              - name: ntfy-null
              - name: ntfy-prod
                webhook_configs:
                  - url: http://alertmanager-ntfy-bridge.monitoring.svc.cluster.local/alerts/homelab-alerts
                    send_resolved: true
                    timeout: 10s
              - name: ntfy-prod-critical
                webhook_configs:
                  - url: http://alertmanager-ntfy-bridge.monitoring.svc.cluster.local/alerts/homelab-critical
                    send_resolved: true
                    timeout: 10s
          alertmanagerSpec:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 200m
                memory: 256Mi
            storage:
              volumeClaimTemplate:
                metadata:
                  labels:
                    recurring-job-group.longhorn.io/daily: "enabled"
                    recurring-job-group.longhorn.io/weekly: "enabled"
                spec:
                  storageClassName: longhorn
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi

        nodeExporter:
          enabled: true
        prometheus-node-exporter:
          tolerations:
            - key: CriticalAddonsOnly
              operator: Equal
              value: "true"
              effect: NoExecute
            - key: accelerator
              operator: Equal
              value: nvidia
              effect: NoSchedule
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

        kube-state-metrics:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # Scrape VerticalPodAutoscaler CRs via the Custom Resource State
          # collector. KSM 2.9 deprecated built-in VPA metrics; the dashboard
          # consumes kube_customresource_vpa_containerrecommendations_target
          # (with resource={cpu,memory} label) produced by the config below.
          rbac:
            extraRules:
              - apiGroups: ["autoscaling.k8s.io"]
                resources: ["verticalpodautoscalers"]
                verbs: ["get", "list", "watch"]
          customResourceState:
            enabled: true
            config:
              kind: CustomResourceStateMetrics
              spec:
                resources:
                  - groupVersionKind:
                      group: autoscaling.k8s.io
                      kind: "VerticalPodAutoscaler"
                      version: "v1"
                    labelsFromPath:
                      verticalpodautoscaler: [metadata, name]
                      namespace: [metadata, namespace]
                      target_api_version: [spec, targetRef, apiVersion]
                      target_kind: [spec, targetRef, kind]
                      target_name: [spec, targetRef, name]
                    metricNamePrefix: "kube_customresource_vpa"
                    metrics:
                      - name: "containerrecommendations_target"
                        help: "VPA container recommendation: target."
                        commonLabels:
                          resource: "cpu"
                          unit: "core"
                        each:
                          type: Gauge
                          gauge:
                            path: [status, recommendation, containerRecommendations]
                            labelsFromPath:
                              container: [containerName]
                            valueFrom: [target, cpu]
                      - name: "containerrecommendations_target"
                        help: "VPA container recommendation: target."
                        commonLabels:
                          resource: "memory"
                          unit: "byte"
                        each:
                          type: Gauge
                          gauge:
                            path: [status, recommendation, containerRecommendations]
                            labelsFromPath:
                              container: [containerName]
                            valueFrom: [target, memory]
                      - name: "containerrecommendations_lowerbound"
                        help: "VPA container recommendation: lower bound."
                        commonLabels:
                          resource: "cpu"
                          unit: "core"
                        each:
                          type: Gauge
                          gauge:
                            path: [status, recommendation, containerRecommendations]
                            labelsFromPath:
                              container: [containerName]
                            valueFrom: [lowerBound, cpu]
                      - name: "containerrecommendations_lowerbound"
                        help: "VPA container recommendation: lower bound."
                        commonLabels:
                          resource: "memory"
                          unit: "byte"
                        each:
                          type: Gauge
                          gauge:
                            path: [status, recommendation, containerRecommendations]
                            labelsFromPath:
                              container: [containerName]
                            valueFrom: [lowerBound, memory]
                      - name: "containerrecommendations_upperbound"
                        help: "VPA container recommendation: upper bound."
                        commonLabels:
                          resource: "cpu"
                          unit: "core"
                        each:
                          type: Gauge
                          gauge:
                            path: [status, recommendation, containerRecommendations]
                            labelsFromPath:
                              container: [containerName]
                            valueFrom: [upperBound, cpu]
                      - name: "containerrecommendations_upperbound"
                        help: "VPA container recommendation: upper bound."
                        commonLabels:
                          resource: "memory"
                          unit: "byte"
                        each:
                          type: Gauge
                          gauge:
                            path: [status, recommendation, containerRecommendations]
                            labelsFromPath:
                              container: [containerName]
                            valueFrom: [upperBound, memory]
                      - name: "containerrecommendations_uncappedtarget"
                        help: "VPA container recommendation: uncapped target."
                        commonLabels:
                          resource: "cpu"
                          unit: "core"
                        each:
                          type: Gauge
                          gauge:
                            path: [status, recommendation, containerRecommendations]
                            labelsFromPath:
                              container: [containerName]
                            valueFrom: [uncappedTarget, cpu]
                      - name: "containerrecommendations_uncappedtarget"
                        help: "VPA container recommendation: uncapped target."
                        commonLabels:
                          resource: "memory"
                          unit: "byte"
                        each:
                          type: Gauge
                          gauge:
                            path: [status, recommendation, containerRecommendations]
                            labelsFromPath:
                              container: [containerName]
                            valueFrom: [uncappedTarget, memory]

        kubeEtcd:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeProxy:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
