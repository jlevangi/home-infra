# Dormant Everly Era k3s staging. Both Deployments are scaled to 0 in
# argocd/manifests/everlyera/overlays/stage; drop those two replica patches to
# bring it back. Active staging currently runs on Cloudflare Workers.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: everlyera-stage
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: everlyera
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: everlyera
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/everlyera/overlays/stage
  destination:
    server: https://kubernetes.default.svc
    namespace: everlyera-stage
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/name: everlyera-stage
        app.kubernetes.io/part-of: everlyera
        app.kubernetes.io/managed-by: argocd
        environment: stage
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
