apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: librechat
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: ghcr.io/danny-avila/librechat-chart
    chart: librechat
    targetRevision: 2.0.7
    helm:
      values: |
        replicaCount: 1

        global:
          librechat:
            existingSecretName: librechat-credentials-env
            existingSecretApiKey: OPENAI_API_KEY

        image:
          registry: ghcr.io
          repository: danny-avila/librechat
          tag: latest
          pullPolicy: IfNotPresent

        updateStrategy:
          type: Recreate

        librechat:
          existingSecretName: librechat-credentials-env
          imageVolume:
            enabled: true
            size: 10G
            accessModes: ReadWriteOnce
            storageClassName: longhorn
          configEnv:
            ALLOW_EMAIL_LOGIN: "true"
            ALLOW_REGISTRATION: "true"
            ALLOW_SOCIAL_LOGIN: "true"
            DEBUG_LOGGING: "false"
            DOMAIN_CLIENT: "https://librechat.levangie.dev"
            DOMAIN_SERVER: "https://librechat.levangie.dev"
            OPENID_ISSUER: "https://auth.levangie.org/realms/master"
            OPENID_CLIENT_ID: "librechat"
            OPENID_CALLBACK_URL: "/oauth/openid/callback"
            OPENID_SCOPE: "openid profile email"
            OPENID_BUTTON_LABEL: "Sign in with Keycloak"
          configYamlContent: |
            version: 1.2.1
            cache: true
            interface:
              endpointsMenu: true
              modelSelect: true
              parameters: true
              sidePanel: true
              presets: true
            endpoints:
              custom:
                - name: "9router"
                  apiKey: "${NINE_ROUTER_API_KEY}"
                  baseURL: "http://nine-router.9router.svc.cluster.local:20128/v1"
                  models:
                    default: []
                    fetch: true
                  titleConvo: true
                  modelDisplayLabel: "9Router"
                - name: "hermes-agent"
                  apiKey: "${HERMES_API_KEY}"
                  baseURL: "http://172.20.23.94:8642/v1"
                  models:
                    default:
                      - "hermes-agent"
                    fetch: true
                  titleConvo: true
                  modelDisplayLabel: "Hermes Agent"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        service:
          type: ClusterIP
          port: 3080
          targetPort: 3080
          containerPort: 3080

        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
            external-dns.alpha.kubernetes.io/target: k3s-prod.levangie.dev
          hosts:
            - host: librechat.levangie.dev
              paths:
                - path: /
                  pathType: Prefix

        mongodb:
          enabled: true
          image:
            registry: docker.io
            repository: bitnamilegacy/mongodb
          updateStrategy:
            type: Recreate
          auth:
            enabled: false
          databases:
            - LibreChat
          persistence:
            enabled: true
            storageClass: longhorn-tank
            size: 8Gi
            labels:
              recurring-job-group.longhorn.io/hourly: "enabled"
              recurring-job-group.longhorn.io/daily: "enabled"
              recurring-job-group.longhorn.io/weekly: "enabled"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi

        meilisearch:
          enabled: true
          customLabels:
            recurring-job-group.longhorn.io/daily: "enabled"
            recurring-job-group.longhorn.io/weekly: "enabled"
          persistence:
            enabled: true
            storageClass: longhorn
            size: 5Gi
          auth:
            existingMasterKeySecret: librechat-credentials-env
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

        redis:
          enabled: false

        librechat-rag-api:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: librechat
  # home-infra-wdy / home-infra-e8o: restored PVCs can bind through a concrete
  # spec.volumeName that ArgoCD should not fight. librechat-mongodb also carries
  # an accepted immutable storageClassName difference after the manual restore
  # onto the tank class. This is restore-side drift, not a live patch hiding a
  # storage-policy mismatch.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      name: librechat-librechat-images
      jsonPointers:
        - /spec/volumeName
    - group: ""
      kind: PersistentVolumeClaim
      name: librechat-meilisearch
      jsonPointers:
        - /spec/volumeName
    - group: ""
      kind: PersistentVolumeClaim
      name: librechat-mongodb
      jsonPointers:
        - /spec/storageClassName
    - group: ""
      kind: PersistentVolumeClaim
      name: librechat-mongodb
      jsonPointers:
        - /spec/volumeName
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
