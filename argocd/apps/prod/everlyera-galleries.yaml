apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: everlyera-galleries
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: everlyera
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: everlyera
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/everlyera-galleries/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: everlyera-galleries
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        app.kubernetes.io/name: everlyera-galleries
        app.kubernetes.io/part-of: everlyera
        app.kubernetes.io/managed-by: argocd
        environment: prod
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
