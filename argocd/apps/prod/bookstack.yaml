apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookstack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/bookstack/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: bookstack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # home-infra-e8o: bookstack-db-data-pvc was restored from backup onto a manually-created
  # PV/PVC with storageClassName=longhorn. The manifest now targets longhorn-steady
  # for future recreations, but the live PVC's storageClassName is immutable.
  # The volume has been patched with diskSelector=[tank] to match the policy intent.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      name: bookstack-db-data-pvc
      jsonPointers:
        - /spec/storageClassName
