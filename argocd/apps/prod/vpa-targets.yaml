apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vpa-targets
  namespace: argocd
  annotations:
    # Run after the vpa Application so the VerticalPodAutoscaler CRD exists.
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/vpa-targets/base
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
