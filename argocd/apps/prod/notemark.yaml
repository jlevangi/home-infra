apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notemark
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/notemark/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: notemark
  ignoreDifferences:
    # Storage size formatting: the manifest declares 500Mi but Kubernetes
    # normalises it to 524288k on the bound PVC.  The values are equal
    # (524 288 000 bytes) but ArgoCD may flag the string difference.
    - group: ""
      kind: PersistentVolumeClaim
      name: notemark-data-pvc
      jsonPointers:
        - /spec/resources/requests/storage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
