apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notemark
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/notemark/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: notemark
  ignoreDifferences:
    # Storage size formatting: the manifest declares 500Mi but Kubernetes
    # normalises it to 524288k on the bound PVC.  The values are equal
    # (524 288 000 bytes) but ArgoCD may flag the string difference.
    - group: ""
      kind: PersistentVolumeClaim
      name: notemark-data-pvc
      jsonPointers:
        - /spec/resources/requests/storage
    # ExternalSecret: ESO controller adds default sub-fields
    # (conversionStrategy, decodingStrategy, metadataPolicy, nullBytePolicy)
    # to spec.dataFrom[].extract that the manifest doesn't declare.
    - group: external-secrets.io
      kind: ExternalSecret
      name: notemark-secrets
      jsonPointers:
        - /spec/dataFrom
  syncPolicy:
    # automated sync temporarily disabled for v1.0.0 migration — see commit
    # message; re-enable in the immediate follow-up commit after PVC wipe
    # and clean V1 rollout.
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
