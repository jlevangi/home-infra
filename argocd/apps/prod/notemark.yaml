apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notemark
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/notemark/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: notemark
  ignoreDifferences:
    # The notemark PVC was restored from backup with a pre-bound volumeName
    # and has volumeMode: Filesystem set by Kubernetes default.  Both fields
    # are immutable after creation, so suppress the diff until the PVC is
    # recreated under a future storage-class migration.
    - group: ""
      kind: PersistentVolumeClaim
      name: notemark-data-pvc
      jsonPointers:
        - /spec/volumeName
        - /spec/resources/requests/storage
        - /spec/volumeMode
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
