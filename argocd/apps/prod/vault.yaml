apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.32.0
    helm:
      releaseName: vault-raft
      values: |
        global:
          enabled: true
          tlsDisable: true
        injector:
          enabled: false
        csi:
          enabled: false
        server:
          ha:
            enabled: true
            replicas: 3
            clusterAddr: "http://$(HOSTNAME).vault-raft-internal:8201"
            raft:
              enabled: true
              setNodeId: true
              config: |
                ui = true

                listener "tcp" {
                  tls_disable = 1
                  address = "[::]:8200"
                  cluster_address = "[::]:8201"
                }

                storage "raft" {
                  path = "/vault/data"

                  retry_join {
                    leader_api_addr = "http://vault-raft-0.vault-raft-internal:8200"
                  }
                  retry_join {
                    leader_api_addr = "http://vault-raft-1.vault-raft-internal:8200"
                  }
                  retry_join {
                    leader_api_addr = "http://vault-raft-2.vault-raft-internal:8200"
                  }
                }

                service_registration "kubernetes" {}
            disruptionBudget:
              enabled: true
          dataStorage:
            enabled: true
            size: 5Gi
            storageClass: longhorn-vault-raft
            labels:
              recurring-job.longhorn.io/source: "enabled"
              recurring-job-group.longhorn.io/hourly: "enabled"
              recurring-job-group.longhorn.io/daily: "enabled"
              recurring-job-group.longhorn.io/weekly: "enabled"
          affinity: |
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/instance: vault-raft
                      app.kubernetes.io/name: vault
                      component: server
                  topologyKey: kubernetes.io/hostname
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: vault-raft
                  app.kubernetes.io/name: vault
                  component: server
          livenessProbe:
            enabled: true
            execCommand:
              - /bin/sh
              - -ec
              - touch /vault/data/.liveness && rm /vault/data/.liveness
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          ui:
            enabled: true
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
              external-dns.alpha.kubernetes.io/target: k3s-prod.levangie.dev
            hosts:
              - host: vault.levangie.dev
                paths:
                  - /
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-raft
  # home-infra-8o5 / home-infra-wdy: StatefulSet volumeClaimTemplates are
  # immutable after creation. Keep this ignore until the vault raft PVC wave
  # recreates the claims and re-establishes the intended Longhorn backup labels
  # without a live template drift.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: vault-raft
      namespace: vault-raft
      jsonPointers:
        - /spec/volumeClaimTemplates/0/metadata/labels
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
