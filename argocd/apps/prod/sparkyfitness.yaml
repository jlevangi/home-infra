apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sparkyfitness
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/CodeWithCJ/SparkyFitness.git
    targetRevision: v0.16.6.3
    path: helm/chart
    helm:
      values: |
        fullnameOverride: sparkyfitness

        global:
          storageClass: longhorn

        config:
          logLevel: info
          timezone: Australia/Melbourne
          frontendUrl: https://fitness.levangie.dev
          disableSignup: false
          forceEmailLogin: true
          disableEmailLogin: false
          allowPrivateNetworkCors: false
          oidc:
            enabled: false
          garmin:
            enabled: false
          email:
            enabled: false

        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
            external-dns.alpha.kubernetes.io/target: k3s-prod.levangie.dev
          hosts:
            - host: fitness.levangie.dev
              paths:
                - path: /
                  pathType: Prefix
          tls:
            - hosts:
                - fitness.levangie.dev

        networkPolicy:
          enabled: false

        server:
          image:
            tag: v0.16.6.3
          secrets:
            generate: false
            existingSecret: sparkyfitness-app
          appDatabase:
            existingSecret: sparkyfitness-appdb
          persistence:
            backup:
              size: 5Gi
              # Tank-only: server-side backup data, write-rarely, durability over speed.
              # First trial of the longhorn-tank StorageClass (see plans/i-need-some-serious-ancient-adleman.md).
              storageClass: longhorn-tank
            uploads:
              size: 10Gi
              storageClass: longhorn
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi

        frontend:
          port: 8080
          image:
            tag: v0.16.6.3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

        postgresql:
          enabled: true
          image:
            tag: 18.3-trixie
          auth:
            database: sparkyfitness
            username: sparky_admin
            existingSecret: sparkyfitness-postgresql-auth
          persistence:
          standalone:
            persistence:
              enabled: true
              size: 10Gi
              storageClass: longhorn-tank
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
          backup:
            enabled: false

        databaseBackup:
          enabled: true
          schedule: "0 4 * * *"
          persistence:
            size: 10Gi
            # Tank-only: nightly pg_dumps go here. Cold, append-mostly, durability over speed.
            storageClass: longhorn-tank
          retention:
            days: 7
            weeks: 5
            months: 3
  destination:
    server: https://kubernetes.default.svc
    namespace: sparkyfitness
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # home-infra-kd3 / home-infra-e8o / home-infra-wdy: accepted immutable drift
  # remains in three places after the Wave 5 restores:
  #
  # 1. The upstream chart doesn't expose a values hook for PVC metadata.labels
  #    on the server-backup, server-uploads, or database-backup PVCs
  #    (verified against v0.16.6.3 templates). Labels added at runtime for
  #    backup inclusion are ignored here so ArgoCD doesn't strip them on sync.
  #
  # 2. The two backup PVCs were restored onto manually-created PVs, so their
  #    bound volumeName fields differ from the chart's unbound desired state.
  #
  # 3. The sparkyfitness-postgresql StatefulSet's volumeClaimTemplate still
  #    shows the old storageClassName because StatefulSet VCT storage fields are
  #    immutable post-creation, even though the live PVC has been recreated onto
  #    the correct tank-backed class.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jqPathExpressions:
        - '.metadata.labels["recurring-job-group.longhorn.io/daily"]'
        - '.metadata.labels["recurring-job-group.longhorn.io/hourly"]'
        - '.metadata.labels["recurring-job-group.longhorn.io/weekly"]'
        - '.metadata.labels["recurring-job.longhorn.io/source"]'
      jsonPointers:
        - /spec/volumeName
      name: sparkyfitness-server-backup
    - group: ""
      kind: PersistentVolumeClaim
      jqPathExpressions:
        - '.metadata.labels["recurring-job-group.longhorn.io/daily"]'
        - '.metadata.labels["recurring-job-group.longhorn.io/hourly"]'
        - '.metadata.labels["recurring-job-group.longhorn.io/weekly"]'
        - '.metadata.labels["recurring-job.longhorn.io/source"]'
      jsonPointers:
        - /spec/volumeName
      name: sparkyfitness-database-backup
    - group: apps
      kind: StatefulSet
      name: sparkyfitness-postgresql
      jsonPointers:
        - /spec/volumeClaimTemplates/0/spec/storageClassName
