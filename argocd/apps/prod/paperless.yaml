apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/paperless/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: paperless
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # home-infra-e8o / home-infra-wdy: PVC.spec.storageClassName is immutable on
  # bound claims. paperless-db-pvc was created on legacy `longhorn`; the
  # manifest now targets `longhorn-steady` for the eventual recreation wave.
  # Ignore the live claim's immutable field until that wave removes the drift.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      name: paperless-db-pvc
      jsonPointers:
        - /spec/storageClassName
