apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paperless
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/paperless/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: paperless
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # PVC.spec.storageClassName is immutable on bound claims. The
  # paperless-db-pvc was bound to `longhorn` and is now patched to use the
  # tank pool via the volume CR's diskSelector; the manifest declares
  # longhorn-tank for future PVC recreations. Ignore the drift on the live
  # object so ArgoCD stays Synced. Tracked under home-infra-wdy.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      name: paperless-db-pvc
      jsonPointers:
        - /spec/storageClassName
