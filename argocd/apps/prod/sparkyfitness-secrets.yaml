apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sparkyfitness-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/sparkyfitness-secrets/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: sparkyfitness
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
