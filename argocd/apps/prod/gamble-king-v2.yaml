# Every neighboring Application in this repo uses syncPolicy.automated
# (prune+selfHeal). This one deliberately does NOT: it's a brand-new
# Postgres+GoTrue+PostgREST stack with real (if placeholder-seeded)
# secrets, and blind auto-sync on merge is not a safe default for a first
# deploy. Pierce must review the rendered manifests and sync manually
# (ArgoCD UI or `argocd app sync gamble-king-v2`) before this namespace
# gets anything applied. Once the stack has been reviewed and is stable,
# flipping on automated sync like its neighbors is a reasonable follow-up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gamble-king-v2
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/gamble-king-v2/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: gamble-king-v2-dev
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
