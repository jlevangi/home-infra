apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 13.1.2
    helm:
      values: |
        fullnameOverride: loki

        deploymentMode: SingleBinary

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storage:
            type: filesystem
          limits_config:
            volume_enabled: true
            retention_period: 336h
          compactor:
            working_directory: /var/loki/compactor
            compaction_interval: 10m
            retention_enabled: true
            retention_delete_delay: 2h
            delete_request_store: filesystem

        singleBinary:
          replicas: 1
          persistence:
            # Loki is a continuous log writer; flash IOPS is shared across
            # all Atlas workers and got pegged during the 2026-05-31
            # incident. Volume CR also has diskSelector=["tank"] patched
            # at runtime.
            storageClass: longhorn-tank
            accessModes:
              - ReadWriteOnce
            size: 20Gi
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 3Gi

        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        ingester:
          replicas: 0
        querier:
          replicas: 0
        queryFrontend:
          replicas: 0
        queryScheduler:
          replicas: 0
        distributor:
          replicas: 0
        compactor:
          replicas: 0
        indexGateway:
          replicas: 0
        bloomPlanner:
          replicas: 0
        bloomBuilder:
          replicas: 0
        bloomGateway:
          replicas: 0

        gateway:
          enabled: false

        resultsCache:
          enabled: false

        chunksCache:
          enabled: false

        monitoring:
          dashboards:
            enabled: true
            labels:
              grafana_dashboard: "1"
          rules:
            enabled: true
          serviceMonitor:
            enabled: true

        lokiCanary:
          enabled: false

        test:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # StatefulSet.spec.volumeClaimTemplates is immutable after creation.
  # The loki chart values were updated to longhorn-tank (for future PVC
  # creation) but the live StatefulSet still references longhorn. Ignore
  # the drift so ArgoCD stays Synced. Tracked under home-infra-wdy.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: loki
      jsonPointers:
        - /spec/volumeClaimTemplates
