apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: loki
    targetRevision: 18.12.1
    helm:
      values: |
        fullnameOverride: loki

        deploymentMode: SingleBinary

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
          storage:
            type: filesystem
          limits_config:
            volume_enabled: true
            retention_period: 336h
          compactor:
            working_directory: /var/loki/compactor
            compaction_interval: 10m
            retention_enabled: true
            retention_delete_delay: 2h
            delete_request_store: filesystem

        singleBinary:
          replicas: 1
          persistence:
            # Flash since 2026-10-04. Was tank after the 2026-05-31 Atlas
            # flash IOPS incident, but tank exists only on Atlas, so both
            # replicas shared one host. Flash now spans 4 hosts. The live
            # PVC was relabelled in place; the StatefulSet template is
            # immutable (see ignoreDifferences below).
            storageClass: longhorn-flash
            accessModes:
              - ReadWriteOnce
            size: 20Gi
            # Logs are operational history, not canonical application state.
            # Per storage-policy.md, Loki may skip hourly if that loss window is acceptable.
            labels:
              recurring-job-group.longhorn.io/daily: "enabled"
              recurring-job-group.longhorn.io/weekly: "enabled"
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 3Gi

        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        ingester:
          replicas: 0
        querier:
          replicas: 0
        queryFrontend:
          replicas: 0
        queryScheduler:
          replicas: 0
        distributor:
          replicas: 0
        compactor:
          replicas: 0
        indexGateway:
          replicas: 0
        bloomPlanner:
          replicas: 0
        bloomBuilder:
          replicas: 0
        bloomGateway:
          replicas: 0

        gateway:
          enabled: false

        resultsCache:
          enabled: false

        chunksCache:
          enabled: false

        monitoring:
          dashboards:
            enabled: true
            labels:
              grafana_dashboard: "1"
          rules:
            enabled: true
          serviceMonitor:
            enabled: true

        lokiCanary:
          enabled: false

        test:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    # volumeClaimTemplates is immutable post-creation; live StatefulSet
    # still has storageClass: longhorn-steady from the original PVC
    # provisioner. The live PVC is longhorn-flash (relabelled in place).
    - group: apps
      kind: StatefulSet
      name: loki
      jsonPointers:
        - /spec/volumeClaimTemplates
    # persistentVolumeClaimRetentionPolicy is also immutable on existing
    # StatefulSets.  Live object retains {whenDeleted: Retain,
    # whenScaled: Retain} (the safe default); the chart defaults to
    # Delete.  Suppress the diff until we recreate the StatefulSet.
    - group: apps
      kind: StatefulSet
      name: loki
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
