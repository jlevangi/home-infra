apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-storage-classes
  namespace: argocd
  annotations:
    # Sync before any app that might bind a PVC to one of these classes.
    # Same priority tier as longhorn-redundant-sc and vault-storageclass.
    argocd.argoproj.io/sync-wave: "-4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/longhorn-storage-classes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # StorageClass.parameters are immutable, so ArgoCD must delete +
      # recreate the object when params change (kubectl apply errors with
      # "Forbidden: updates to parameters are forbidden"). Sub-second
      # downtime only affects new PVC binding; in-use PVCs and existing
      # volumes are unaffected. Required for home-infra-rd0's N=2→3 +
      # replicaDiskSoftAntiAffinity mutation.
      - Replace=true
