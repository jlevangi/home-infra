apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-storage-classes
  namespace: argocd
  annotations:
    # Sync before any app that might bind a PVC to one of these classes.
    # Includes the vault and redundant singleton classes in the same bundle.
    argocd.argoproj.io/sync-wave: "-4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/longhorn-storage-classes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # StorageClass.parameters are immutable, so ArgoCD must delete +
      # recreate the object when params change (kubectl apply errors with
      # "Forbidden: updates to parameters are forbidden"). Sub-second
      # downtime only affects new PVC binding; in-use PVCs and existing
      # volumes are unaffected. Required for home-infra-rd0's N=2→3 +
      # replicaDiskSoftAntiAffinity mutation.
      #
      # Replace=true on its own is NOT enough: it issues `kubectl replace`,
      # which hits the same immutability error. Force=true makes that
      # `kubectl replace --force`, i.e. an actual delete + recreate. Without
      # it the N=3→2 change on 2026-08-17 failed to sync with
      # "parameters: Forbidden: updates to parameters are forbidden".
      - Replace=true
      - Force=true
