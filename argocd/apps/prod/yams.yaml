apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yams
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/yams/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: yams
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # home-infra-qop: seerr-config-pvc and jellyseerr-config-pvc were restored from
  # backup onto manually-created PV/PVCs with storageClassName=longhorn. The
  # manifests now target longhorn-fast for future recreations, but the live PVCs'
  # storageClassName is immutable. The volumes have been patched with
  # diskSelector=[flash] to match the policy intent.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      name: seerr-config-pvc
      jsonPointers:
        - /spec/storageClassName
    - group: ""
      kind: PersistentVolumeClaim
      name: jellyseerr-config-pvc
      jsonPointers:
        - /spec/storageClassName
