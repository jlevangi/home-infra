              - type: dns-stats
                title: DNS Stats
                url: ${TECHNITIUM_URL}/api
                api-key: ${TECHNITIUM_API_KEY}
                cache: 5m
              - type: releases
                cache: 1d
                repositories:
                  - glanceapp/glance
                  - k3s-io/k3s
                  - argoproj/argo-cd
                  - longhorn/longhorn
          - size: small
            widgets:
              - type: change-detection
                title: Watched Sites
                instance-url: http://changedetection.changedetection.svc.cluster.local:5000
                token: ${CHANGEDETECTION_TOKEN}
                limit: 10
                collapse-after: 5
              - type: markets
                markets:
                  - symbol: GME
                    name: GameStop
                  - symbol: BTC-USD
                    name: Bitcoin
                  - symbol: NVDA
                    name: NVIDIA
                  - symbol: SPY
                    name: S&P 500
              - type: repository
                repository: jlevangi/home-infra
                pull-requests-limit: 5
                issues-limit: 5
      - name: Social
        columns:
          - size: full
            widgets:
              - type: reddit
                title: r/selfhosted
                subreddit: selfhosted
                show-thumbnails: true
                show-flairs: true
                sort-by: hot
                limit: 15
                collapse-after: 8
              - type: reddit
                title: r/LocalLLaMA
                subreddit: LocalLLaMA
                show-thumbnails: true
                show-flairs: true
