                      - title: 9Router
                        url: https://9router.levangie.dev
                        icon: mdi:router-wireless
                      - title: n8n
                        url: https://n8n.levangie.dev
                        icon: sh:n8n
                      - title: Changedetection
                        url: https://changedetection.levangie.dev
