                      - title: Paperless
                        url: https://paperless.levangie.dev
                        icon: sh:paperless-ngx
                      - title: Memos
                        url: https://memos.levangie.org
                        icon: di:memos
                      - title: Linkding
                        url: https://linkding.levangie.dev
                        icon: sh:linkding
                      - title: Notemark
                        url: https://notemark.levangie.dev
                        icon: mdi:notebook
                      - title: Open Notebook
                        url: https://notebook.levangie.dev
                        icon: mdi:notebook-edit
                      - title: Tasks.md
                        url: https://tasks.levangie.dev
                        icon: mdi:checkbox-marked-outline
                      - title: Wallos
                        url: https://wallos.levangie.dev
                        icon: sh:wallos
                      - title: Vaultwarden
                        url: https://vw.levangie.dev
                        icon: sh:vaultwarden
                      - title: Immich
                        url: https://photos.levangie.org
                        icon: sh:immich
                  - title: Media
                    color: 280 50 50
                    links:
                      - title: Jellyfin
                        url: https://jellyfin.levangie.org
                        icon: sh:jellyfin
                      - title: Jellyseerr
                        url: https://jellyseerr.levangie.dev
                        icon: sh:jellyseerr
                      - title: Sonarr
                        url: https://sonarr.levangie.dev
                        icon: sh:sonarr
                      - title: Radarr
                        url: https://radarr.levangie.dev
                        icon: sh:radarr
                      - title: Radarr 4K
                        url: https://radarr4k.levangie.dev
                        icon: sh:radarr
                      - title: Prowlarr
