                        icon: sh:bazarr
                      - title: qBittorrent
                        url: https://qbittorrent.levangie.dev
                        icon: sh:qbittorrent
                      - title: NZBGet
                        url: https://nzbget.levangie.dev
                        icon: sh:nzbget
                      - title: Tautulli
                        url: https://tautulli.levangie.dev
                        icon: sh:tautulli
                  - title: AI & Automation
                    color: 40 60 50
                    links:
                      - title: LibreChat
                        url: https://librechat.levangie.dev
