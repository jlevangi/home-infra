                  - title: Utilities & Remote Access
                    color: 0 50 50
                    links:
                      - title: IT Tools
                        url: https://ittools.levangie.dev
                        icon: sh:it-tools
                      - title: PairDrop
                        url: https://pairdrop.levangie.dev
                        icon: sh:pairdrop
                      - title: MicroBin
                        url: https://bin.levangie.dev
