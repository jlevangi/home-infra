apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
  namespace: glance
data:
  glance.yml: |
    server:
      port: 8080
    theme:
      background-color: 240 8 9
      primary-color: 43 50 70
      positive-color: 61 66 44
      negative-color: 6 96 59
    pages:
      - name: Home
        head-widgets:
          - type: split-column
            widgets:
              - type: search
                search-engine: google
                autofocus: true
              - type: custom-api
                title: Cluster Overview
                title-url: https://grafana.levangie.dev
                cache: 1m
                url: http://prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                parameters:
                  query: count(kube_node_info)
                subrequests:
                  running-pods:
                    url: http://prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                    parameters:
                      query: sum(kube_pod_status_phase{phase="Running"})
                  unavailable-deployments:
                    url: http://prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                    parameters:
                      query: sum(kube_deployment_status_replicas_unavailable)
                  firing-alerts:
                    url: http://prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                    parameters:
                      query: count(ALERTS{alertstate="firing"})
                  total-deployments:
                    url: http://prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                    parameters:
                      query: count(count(kube_deployment_status_replicas) by (namespace))
                  cpu-requests:
                    url: http://prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                    parameters:
                      query: sum(kube_pod_container_resource_requests{resource="cpu"})
                  memory-requests-gb:
                    url: http://prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                    parameters:
                      query: sum(kube_pod_container_resource_requests{resource="memory"}) / (1024*1024*1024)
                  pv-count:
                    url: http://prometheus-prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                    parameters:
                      query: count(kube_persistentvolume_status_phase{phase="Bound"})
                template: |
                  {{ $pods := .Subrequest "running-pods" }}
                  {{ $unavailable := .Subrequest "unavailable-deployments" }}
                  {{ $alerts := .Subrequest "firing-alerts" }}
                  {{ $deployments := .Subrequest "total-deployments" }}
                  {{ $cpu := .Subrequest "cpu-requests" }}
                  {{ $memory := .Subrequest "memory-requests-gb" }}
                  {{ $pv := .Subrequest "pv-count" }}
                  <div class="flex justify-between text-center">
                    <div><div class="color-highlight size-h3">{{ .JSON.String "data.result.0.value.1" }}</div><div class="size-h6">NODES</div></div>
                    <div><div class="color-highlight size-h3">{{ $pods.JSON.String "data.result.0.value.1" }}</div><div class="size-h6">PODS</div></div>
                    <div><div class="color-highlight size-h3">{{ $deployments.JSON.String "data.result.0.value.1" }}</div><div class="size-h6">APPS</div></div>
                    <div><div class="color-highlight size-h3">{{ $pv.JSON.String "data.result.0.value.1" }}</div><div class="size-h6">VOLUMES</div></div>
                    <div><div class="color-highlight size-h3">{{ $cpu.JSON.String "data.result.0.value.1" }}</div><div class="size-h6">CPU</div></div>
                    <div><div class="color-highlight size-h3">{{ $memory.JSON.String "data.result.0.value.1" }}</div><div class="size-h6">RAM GB</div></div>
                    <div><div class="color-highlight size-h3">{{ $unavailable.JSON.String "data.result.0.value.1" }}</div><div class="size-h6">DOWN</div></div>
                    <div><div class="color-highlight size-h3">{{ $alerts.JSON.String "data.result.0.value.1" }}</div><div class="size-h6">ALERTS</div></div>
                  </div>
        columns:
          - size: small
            widgets:
              - type: clock
                hour-format: 12h
                timezones:
                  - timezone: America/New_York
                    label: Home
              - type: calendar
                first-day-of-week: sunday
              - type: weather
                location: Orlando, Florida, United States
                units: imperial
                hour-format: 12h
          - size: full
            widgets:
              - type: monitor
                title: Service Status
                cache: 2m
                sites:
                  - title: ArgoCD
                    url: https://argocd.levangie.dev
                    icon: si:argo
                  - title: Grafana
                    url: https://grafana.levangie.dev
                    icon: si:grafana
                  - title: Longhorn
                    url: https://longhorn.levangie.dev
                    icon: di:longhorn
                  - title: Vault
                    url: https://vault.levangie.dev
                    icon: si:vault
                  - title: Semaphore
                    url: https://semaphore.levangie.dev
                    icon: si:ansible
                  - title: Healthchecks
                    url: https://healthchecks.levangie.dev
                    icon: sh:healthchecks
                  - title: Gatus
                    url: https://status.levangie.dev
                    icon: sh:gatus
                  - title: Ntfy
                    url: https://ntfy.levangie.dev
                    icon: sh:ntfy
                  - title: MeshCentral
                    url: https://mesh.levangie.dev
                    icon: di:meshcentral
                  - title: Netboot.xyz
                    url: https://netboot.levangie.dev
                    icon: sh:netboot-xyz
                  - title: BookStack
                    url: https://bookstack.levangie.dev
                    icon: sh:bookstack
                  - title: Paperless
                    url: https://paperless.levangie.dev
                    icon: sh:paperless-ngx
                  - title: Memos
                    url: https://memos.levangie.org
                    icon: di:memos
                  - title: Linkding
                    url: https://linkding.levangie.dev
                    icon: sh:linkding
                  - title: Wallos
                    url: https://wallos.levangie.dev
                    icon: sh:wallos
                  - title: Vaultwarden
                    url: https://vw.levangie.dev
                    icon: sh:vaultwarden
                  - title: Immich
                    url: https://photos.levangie.org
                    icon: sh:immich
                  - title: Jellyfin
                    url: https://jellyfin.levangie.org
                    icon: sh:jellyfin
                  - title: Jellyseerr
                    url: https://jellyseerr.levangie.dev
                    icon: sh:jellyseerr
                  - title: Sonarr
                    url: https://sonarr.levangie.dev
                    icon: sh:sonarr
                  - title: Radarr
                    url: https://radarr.levangie.dev
                    icon: sh:radarr
                  - title: Prowlarr
                    url: https://prowlarr.levangie.dev
                    icon: sh:prowlarr
                  - title: Bazarr
                    url: https://bazarr.levangie.dev
                    icon: sh:bazarr
                  - title: qBittorrent
                    url: https://qbittorrent.levangie.dev
                    icon: sh:qbittorrent
                  - title: Tautulli
                    url: https://tautulli.levangie.dev
                    icon: sh:tautulli
                  - title: LibreChat
                    url: https://librechat.levangie.dev
                    icon: sh:librechat
                  - title: n8n
                    url: https://n8n.levangie.dev
                    icon: sh:n8n
                  - title: Changedetection
                    url: https://changedetection.levangie.dev
                    icon: sh:changedetection
                  - title: IT Tools
                    url: https://ittools.levangie.dev
                    icon: sh:it-tools
                  - title: GeoPulse
                    url: https://geopulse.levangie.dev
                    icon: mdi:map-marker-radius
                  - title: Affine
                    url: https://affine.levangie.dev
                    icon: sh:affine
              - type: bookmarks
                groups:
                  - title: Infrastructure & Monitoring
                    color: 200 50 50
                    links:
                      - title: ArgoCD
                        url: https://argocd.levangie.dev
                        icon: si:argo
                      - title: Grafana
                        url: https://grafana.levangie.dev
