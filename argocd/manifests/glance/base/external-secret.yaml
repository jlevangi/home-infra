apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: glance-secrets
  namespace: glance
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: glance-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/glance
    - extract:
        key: prod/technitium
