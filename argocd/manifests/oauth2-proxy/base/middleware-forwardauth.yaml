apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-forwardauth
  namespace: oauth2-proxy
spec:
  forwardAuth:
# NOTE: Must use fixed ClusterIP (10.43.220.10) because Traefik pod uses
    # external upstream DNS (1.1.1.1/8.8.8.8) and cannot resolve internal cluster.local
    # or private .levangie.dev hostnames.
    address: http://10.43.220.10:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - X-Forwarded-User
      - X-Forwarded-Email
      - Authorization
