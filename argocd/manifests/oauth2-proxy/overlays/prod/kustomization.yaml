apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: quay.io/oauth2-proxy/oauth2-proxy
    newTag: v7.15.3
patches:
  - target:
      kind: Ingress
      name: oauth2-proxy-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
