apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: komga-secrets
  namespace: komga
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: komga-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/komga
