apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-ntfy-bridge
  namespace: monitoring
data:
  bridge.py: |
    import ipaddress
    import json
    import os
    import re
    import threading
    import time
    import urllib.error
    import urllib.parse
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer


    NTFY_URL = os.environ.get("NTFY_URL", "http://ntfy.ntfy.svc.cluster.local/")
    DEFAULT_TOPIC = os.environ.get("DEFAULT_TOPIC", "homelab-alerts")
    PUBLIC_CLICK_URL = os.environ.get("PUBLIC_CLICK_URL")
    PUBLIC_DOMAIN_SUFFIX = os.environ.get("PUBLIC_DOMAIN_SUFFIX", "levangie.dev")
    GATUS_CLICK_URL = os.environ.get("GATUS_CLICK_URL")
    PUBLIC_ACTION_URL = os.environ.get("PUBLIC_ACTION_URL")
    ACTION_TOKEN = os.environ.get("ACTION_TOKEN", "")
    QUIET_PRIORITY = int(os.environ.get("QUIET_PRIORITY", "1"))

    quiet_lock = threading.Lock()
    quiet_until = 0


    def parse_duration(value):
        match = re.fullmatch(r"([0-9]+)([mhd])", value or "")
        if not match:
            return None
        amount = int(match.group(1))
        unit = match.group(2)
        if unit == "m":
            return amount * 60
        if unit == "h":
            return amount * 60 * 60
        if unit == "d":
            return amount * 24 * 60 * 60
        return None


    def quiet_remaining_seconds():
        with quiet_lock:
            return max(0, int(quiet_until - time.time()))


    def quiet_remaining_text():
        remaining = quiet_remaining_seconds()
        if remaining <= 0:
            return None
        hours, remainder = divmod(remaining, 3600)
        minutes = max(1, (remainder + 59) // 60)
        if hours > 0:
            return f"{hours}h {minutes}m"
        return f"{minutes}m"


    def set_quiet(duration):
        global quiet_until
        seconds = parse_duration(duration)
        if seconds is None:
            return False
        with quiet_lock:
            quiet_until = int(time.time()) + seconds
        return True


    def clear_quiet():
        global quiet_until
        with quiet_lock:
            quiet_until = 0


    def maintenance_actions():
        if not PUBLIC_ACTION_URL or not ACTION_TOKEN:
            return []

        base_url = PUBLIC_ACTION_URL.rstrip("/")
        token = urllib.parse.quote(ACTION_TOKEN)
        if quiet_remaining_seconds() > 0:
            return [
                {
                    "action": "http",
                    "label": "End quiet mode",
                    "url": f"{base_url}/actions/quiet/off?token={token}",
                    "method": "POST",
                    "clear": True,
                }
            ]

        return [
            {
                "action": "http",
                "label": "Quiet 1h",
                "url": f"{base_url}/actions/quiet/1h?token={token}",
                "method": "POST",
                "clear": True,
            },
            {
                "action": "http",
                "label": "Quiet 4h",
                "url": f"{base_url}/actions/quiet/4h?token={token}",
                "method": "POST",
                "clear": True,
            },
            {
                "action": "http",
                "label": "Quiet 8h",
                "url": f"{base_url}/actions/quiet/8h?token={token}",
                "method": "POST",
                "clear": True,
            },
        ]


    def first_nonempty(*values):
        for value in values:
            if value:
                return value
        return None


    def is_internal_click_url(url):
        if not url:
            return False

        parsed = urllib.parse.urlparse(url)
        hostname = (parsed.hostname or "").lower()
        if not hostname:
            return False

        if hostname == "localhost":
            return True

        if hostname.endswith(".svc") or hostname.endswith(".svc.cluster.local") or hostname.endswith(".cluster.local") or hostname.endswith(".local"):
            return True

        try:
            address = ipaddress.ip_address(hostname)
        except ValueError:
            return False

        return (
            address.is_private
            or address.is_loopback
            or address.is_link_local
            or address.is_reserved
        )


    def normalize_click_url(url):
        if is_internal_click_url(url):
            return PUBLIC_CLICK_URL
        if url:
            parsed = urllib.parse.urlparse(url)
            hostname = (parsed.hostname or "").lower()
            if PUBLIC_DOMAIN_SUFFIX and not hostname.endswith(PUBLIC_DOMAIN_SUFFIX):
                return PUBLIC_CLICK_URL
        return url


    def override_click_url(alertname, common_labels, topic):
        if alertname == "GatusEndpointDown":
            return GATUS_CLICK_URL
        return None


    def build_details(alerts):
        lines = []
        for alert in alerts[:5]:
            labels = alert.get("labels") or {}
            annotations = alert.get("annotations") or {}
            target = first_nonempty(
                labels.get("name"),
                labels.get("node"),
                labels.get("instance"),
                labels.get("pod"),
                labels.get("volume"),
            )
            summary = first_nonempty(annotations.get("summary"), target, "alert")
            if target:
                lines.append(f"- `{target}`: {summary}")
            else:
                lines.append(f"- {summary}")
        if len(alerts) > 5:
            lines.append(f"- ... and {len(alerts) - 5} more")
        return lines


    def build_notification(payload, topic):
        alerts = payload.get("alerts") or []
        common_labels = payload.get("commonLabels") or {}
        common_annotations = payload.get("commonAnnotations") or {}

        alertname = common_labels.get("alertname") or "Alert"
        severity = (common_labels.get("severity") or "warning").lower()
        status = (payload.get("status") or "firing").lower()

        if severity in {"info", "none"} or alertname == "InfoInhibitor":
            return None

        target = first_nonempty(
            common_labels.get("name"),
            common_labels.get("node"),
            common_labels.get("instance"),
            common_labels.get("volume"),
            common_labels.get("namespace"),
            common_labels.get("group"),
            "n/a",
        )
        summary = common_annotations.get("summary") or alertname
        description = (
            common_annotations.get("description")
            or "No additional description provided."
        )
        raw_click = first_nonempty(
            alerts[0].get("generatorURL") if alerts else None,
            payload.get("externalURL"),
        )
        click = first_nonempty(
            override_click_url(alertname, common_labels, topic),
            normalize_click_url(raw_click),
        )

        message_lines = [
            f"# {alertname}",
            "",
            f"**Status:** {status.upper()}",
            f"**Severity:** {severity}",
            f"**Summary:** {summary}",
            f"**Description:** {description}",
            f"**Target:** {target}",
            f"**Alerts:** {len(alerts)}",
        ]

        details = build_details(alerts)
        if details:
            message_lines.extend(["", "**Instances:**", *details])

        if click:
            link_label = "Open alert"
            if click == GATUS_CLICK_URL:
                link_label = "Open in Gatus"
            elif click != raw_click:
                link_label = "Open in Grafana"
            message_lines.extend(["", f"[{link_label}]({click})"])

        is_critical = topic == "homelab-critical" or severity == "critical"
        quiet_text = quiet_remaining_text()
        if status == "resolved":
            # Resolved critical alerts arrive through the critical receiver, but
            # sending them back to the critical ntfy topic can still buzz phones
            # that have topic-level urgent notification settings. Keep all
            # resolution notices low-priority on the default alerts topic.
            topic = DEFAULT_TOPIC
            priority = 1
            tags = ["white_check_mark"]
        elif quiet_text:
            priority = QUIET_PRIORITY
            tags = ["mute", "warning"]
            message_lines.extend(["", f"**Quiet mode:** active for about {quiet_text}"])
        else:
            priority = 5 if is_critical else 4
            tags = (
                ["rotating_light", "warning"]
                if is_critical
                else ["warning", "chart_with_upwards_trend"]
            )

        title = f"Prod {status.upper()}: {alertname}"
        if len(alerts) > 1:
            title = f"{title} ({len(alerts)})"
        if quiet_text and status != "resolved":
            title = f"QUIET: {title}"

        notification = {
            "topic": topic,
            "title": title,
            "message": "\n".join(message_lines),
            "tags": tags,
            "priority": priority,
            "markdown": True,
            "click": click,
        }
        actions = maintenance_actions()
        if actions and status != "resolved":
            notification["actions"] = actions
        return notification


    class Handler(BaseHTTPRequestHandler):
        def _send(self, code, body):
            body_bytes = body.encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body_bytes)))
            self.end_headers()
            self.wfile.write(body_bytes)

        def do_GET(self):
            if self.path.startswith("/healthz"):
                self._send(200, json.dumps({"status": "ok"}))
                return
            if self.path.startswith("/actions/status"):
                self._send(200, json.dumps({"quiet_remaining_seconds": quiet_remaining_seconds()}))
                return
            self._send(404, json.dumps({"error": "not found"}))

        def handle_action(self):
            parsed = urllib.parse.urlparse(self.path)
            query = urllib.parse.parse_qs(parsed.query)
            token = (query.get("token") or [""])[0]
            if not ACTION_TOKEN or token != ACTION_TOKEN:
                self._send(403, json.dumps({"error": "forbidden"}))
                return

            path_parts = [part for part in parsed.path.split("/") if part]
            if len(path_parts) == 3 and path_parts[:2] == ["actions", "quiet"]:
                duration = path_parts[2]
                if duration == "off":
                    clear_quiet()
                    self._send(200, json.dumps({"status": "quiet-disabled"}))
                    return
                if set_quiet(duration):
                    self._send(200, json.dumps({"status": "quiet-enabled", "duration": duration}))
                    return

            self._send(400, json.dumps({"error": "invalid action"}))

        def do_POST(self):
            parsed = urllib.parse.urlparse(self.path)
            if parsed.path.startswith("/actions/"):
                self.handle_action()
                return

            path_parts = [part for part in parsed.path.split("/") if part]
            if len(path_parts) >= 2 and path_parts[0] == "alerts":
                topic = path_parts[1]
            else:
                topic = DEFAULT_TOPIC

            content_length = int(self.headers.get("Content-Length", "0"))
            raw_body = self.rfile.read(content_length)

            try:
                payload = json.loads(raw_body.decode("utf-8"))
                notification = build_notification(payload, topic)
                if notification is None:
                    self._send(204, json.dumps({"status": "ignored"}))
                    return

                request = urllib.request.Request(
                    NTFY_URL,
                    data=json.dumps(notification).encode("utf-8"),
                    headers={"Content-Type": "application/json"},
                    method="POST",
                )
                with urllib.request.urlopen(request, timeout=10) as response:
                    body = response.read().decode("utf-8")
                self._send(200, body)
            except urllib.error.HTTPError as exc:
                body = exc.read().decode("utf-8", errors="replace")
                self._send(502, json.dumps({"error": body}))
            except Exception as exc:
                self._send(500, json.dumps({"error": str(exc)}))

        def log_message(self, format, *args):
            return


    if __name__ == "__main__":
        server = ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
        server.serve_forever()
