apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-vault-raft
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  backupTargetName: default
  dataEngine: v1
  dataLocality: disabled
  disableRevisionCounter: "true"
  fromBackup: ""
  fsType: ext4
  # Vault runs 3 Raft voters with application-level replication. Keep each
  # pod's Longhorn PV single-replica to avoid Longhorn rebuild storms causing
  # Vault engine timeouts/reseals during node maintenance or disk churn.
  numberOfReplicas: "1"
  replicaAutoBalance: best-effort
  recurringJobSelector: '[{"name":"daily","isGroup":true},{"name":"weekly","isGroup":true}]'
  staleReplicaTimeout: "30"
  unmapMarkSnapChainRemoved: ignored
