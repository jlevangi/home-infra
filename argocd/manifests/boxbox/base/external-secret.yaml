apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: boxbox-secrets
  namespace: boxbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: boxbox-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/boxbox
