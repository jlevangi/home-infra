apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boxbox
  namespace: boxbox
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: boxbox-boxbox-oauth2-errors@kubernetescrd,boxbox-boxbox-oauth2-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: box.levangie.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boxbox
                port:
                  number: 80
