apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - rbac.yaml
  - cronjob.yaml
  - cronjob-restore-test.yaml
configMapGenerator:
  - name: db-dump-script
    namespace: db-backup
    files:
      - db-dump.sh
  - name: db-restore-test-script
    namespace: db-backup
    files:
      - restore-test.sh
