# Weekly restore test (Sunday 04:00 UTC, after the 02:00 dump). One Job tests
# every labelled database: each gets its own throwaway namespace
# restore-test-<ns>, running the source's own image. See restore-test.sh.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-restore-test
  namespace: db-backup
  labels:
    app.kubernetes.io/name: db-backup
spec:
  schedule: "0 4 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: db-backup
        spec:
          serviceAccountName: db-restore-test
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 0
            seccompProfile:
              type: RuntimeDefault
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          containers:
            - name: test
              image: bitnami/kubectl@sha256:9e369df7ab3386b736d162348f167bcc02cb4ba3f5203e9151be854437d6e0af
              command: [/bin/sh, /scripts/restore-test.sh]
              env:
                - name: SRC
                  value: /dumps
                - name: HC_URL
                  value: https://healthchecks.levangie.dev/ping/8067efeb-bd57-4c0c-a699-fff31a64ec0b
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: dumps
                  mountPath: /dumps
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: db-restore-test-script
            - name: dumps
              nfs:
                server: 172.20.20.5
                path: /volume1/k3s-storage/db-dumps
                readOnly: true
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
