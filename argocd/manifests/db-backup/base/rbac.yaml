apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-dump
  namespace: db-backup
---
# Cluster-wide pod exec is required to run each database's own dump tool with
# its own in-pod credentials. RBAC cannot scope exec by label; the script only
# targets workloads labelled backup.levangie.dev/engine.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: db-dump
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: db-dump
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: db-dump
subjects:
  - kind: ServiceAccount
    name: db-dump
    namespace: db-backup
