# Static local PV backed by the 800 GiB HDD-backed tank zvol attached to the
# prod GPU worker VM (scsi2, /dev/sdb1, ext4 mounted at /mnt/llm-tank). The
# pod mounts model files read-only; this is not SSD-backed flash storage.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: llama-cpp-models-pv
  labels:
    app: llama-cpp
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/llm-tank
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-prod-worker-gpu-1
