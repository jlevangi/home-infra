# Static local PV backed by the 600 GiB tank zvol attached to the prod GPU
# worker VM (scsi2, /dev/sdc1, ext4 mounted at /mnt/llm-tank). The user
# downloads GGUF files into this path directly; the pod mounts it read-only.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: llama-cpp-models-pv
  labels:
    app: llama-cpp
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/llm-tank
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-prod-worker-gpu-1
