# Static local PV backed by the dedicated scsi2 disk on the prod GPU worker.
# Provisioned via Terraform on the ssd3 LVM pool (500G) and mounted by
# Ansible at /mnt/llm-models. Read-only mount inside the pod; the user
# pre-stages GGUF files onto the host disk via scp.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: llama-cpp-models-pv
  labels:
    app: llama-cpp
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/llm-models
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-prod-worker-gpu-1
