# llama-swap config — defines every model alias exposed by the proxy.
# Each model spawns a /usr/local/bin/llama-server child on first request and
# is evicted after `ttl` seconds of idle. Only one model is loaded at a time
# (single GPU); --parallel allows multiple concurrent sessions on the active
# model.
#
# Hardware ceiling: ~12 tok/s per slot on Pascal sm_61 (Quadro P4000, 8 GiB
# VRAM, ~5 GiB usable after Plex/Jellyfin headroom). Dense models > 12B
# parameters drop to 2-3 tok/s and are not viable for parallel agents.
# MoE models with 3-4B active params keep generation throughput high
# while only a fraction of layers fit on GPU.
#
# Per-request thinking toggle (--reasoning auto): frontends like opencode
# can set chat_template_kwargs.enable_thinking={true|false} per call.
#
# Threads pinned to 22 to match the pod's cpu limit. ttl bumped to 1200s
# (vs the upstream default 300s) so the currently loaded model stays warm
# across bursts of agent activity instead of being evicted between runs.
#
# ctx-size + --parallel strategy: the pod has 80–130 GiB RAM headroom and
# Q4-quantized KV keeps the per-token cost ~64 KB for the 35B Qwen MoEs.
# Most models target ~64 k per-slot effective context (ctx-size /
# --parallel), with the Qwen 35B coders configured at parallel=4 to chase
# the empirically observed ~22 t/s aggregate ceiling on Pascal P4000.
# Gemma4-26B-A4B is the deliberate exception: it stays at 128 k total ctx
# and runs parallel=4 because the 2026-05-24 sweep showed a clear aggregate
# throughput win (~27 tok/s) for 4 concurrent agents even at 32 k/slot.
# Dense models stay at parallel=1 unless a specific experiment justifies
# more slots — they're CPU-bound enough that extra concurrency usually just
# splits the floor.
startPort: 5800
# Heavy CPU-resident MoEs live on the tank zvol (spinning rust). MiniMax
# with --mlock can need 25+ minutes from a cold page cache, and MiMo's
# larger shard set exceeded the old 45 minute window during initial
# testing, so allow two hours before llama-swap gives up on a load.
healthCheckTimeout: 7200
logLevel: info

# Never auto-unload an idle model. The default 3600s TTL was causing
# MiniMax to evict after an hour of silence, forcing a ~15 minute mlock
# cold-load on the next request. With globalTTL: 0 any model without
# an explicit ttl stays resident until llama-swap is asked to load a
# different one or the process restarts.
globalTTL: 0

# Preload the default model at proxy startup so the cold mlock pass happens during
# pod rollout, not on the first user request. The preload itself blocks
# behind healthCheckTimeout, so give it the full window on HDDs.
hooks:
  on_startup:
    preload:
      - MiMo-V2.5-MXFP4_MOE

models:
  # =================================================================
  # Qwen3-Coder-Next-UD-Q4_K_M — EXPERIMENTAL CODING MODEL
  # =================================================================
  # New trial model mounted from /mnt/llm-tank/qwen3 on the GPU node.
  # Direct load test on 2026-05-27 showed ngl=10 tries to allocate ~8.9 GiB
  # on the 8 GiB P4000. Use a single-slot ngl=6 profile until benchmarked.
  Qwen3-Coder-Next-UD-Q4_K_M:
    cmd: |
      /usr/local/bin/llama-server
      --model /models/qwen3/Qwen3-Coder-Next-UD-Q4_K_M.gguf
      --alias Qwen3-Coder-Next-UD-Q4_K_M
      --host 0.0.0.0
      --port ${PORT}
      --gpu-layers 4
      --threads 22
      --ctx-size 131072
      --batch-size 512
      --ubatch-size 128
      --parallel 1
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --reasoning auto
      --metrics
      --no-webui
      --no-kv-offload
      --mlock
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    ttl: 3600

  # =================================================================
  # Qwen3-Coder-Next-UD-Q4_K_M-hermes — HERMES-OPTIMIZED SINGLE-AGENT
  # =================================================================
  # Tuned for Hermes-style agent prompts: long system prompt, skill text,
  # tool schemas, and large working transcripts. Keep the proven ngl=6
  # profile, but trim maximum context enough to reduce KV pressure while still
  # leaving headroom above the ~57-59k-token Hermes requests already observed.
  # 96 k total ctx is a better compromise than 64 k on this 8 GiB Pascal GPU:
  # still leaner than the generic 128 k chat alias, but less likely to clip
  # larger tool-heavy turns or long assistant completions.
  Qwen3-Coder-Next-UD-Q4_K_M-hermes:
    cmd: |
      /usr/local/bin/llama-server
      --model /models/qwen3/Qwen3-Coder-Next-UD-Q4_K_M.gguf
      --alias Qwen3-Coder-Next-UD-Q4_K_M-hermes
      --host 0.0.0.0
      --port ${PORT}
      --gpu-layers 6
      --threads 22
      --ctx-size 98304
      --batch-size 1024
      --ubatch-size 256
      --parallel 1
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --reasoning auto
      --metrics
      --no-webui
      --no-kv-offload
      --mlock
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    ttl: 14400

  # =================================================================
  # Qwen3-Coder-Next-UD-Q4_K_M-hermes-fast — HERMES PREFILL / FIRST-TOKEN BIAS
  # =================================================================
  # Same ctx/ngl envelope as the safe Hermes alias, but with more aggressive
  # prefill settings and reasoning disabled to improve first-token latency on
  # long tool-heavy turns. This is the alias to benchmark when the safe alias
  # is stable but too slow.
  Qwen3-Coder-Next-UD-Q4_K_M-hermes-fast:
    cmd: |
      /usr/local/bin/llama-server
      --model /models/qwen3/Qwen3-Coder-Next-UD-Q4_K_M.gguf
      --alias Qwen3-Coder-Next-UD-Q4_K_M-hermes-fast
      --host 0.0.0.0
      --port ${PORT}
      --gpu-layers 6
      --threads 22
      --ctx-size 98304
      --batch-size 2048
      --ubatch-size 512
      --parallel 1
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --reasoning off
      --reasoning-budget 0
      --metrics
      --no-webui
      --no-kv-offload
      --mlock
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    ttl: 14400

  # =================================================================
  # Qwen3.6-35B-A3B-UD-Q4_K_M — Q4_K_M BALANCED (128K PER SLOT)
  # =================================================================
  # Same as Q4_K_S but the slightly larger Q4_K_M quant. With
  # no-kv-offload the VRAM delta is negligible.
  Qwen3.6-35B-A3B-UD-Q4_K_M:
    cmd: |
      /usr/local/bin/llama-server
      --model /models/qwen3.6/35b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      --alias Qwen3.6-35B-A3B-UD-Q4_K_M
      --host 0.0.0.0
      --port ${PORT}
      --gpu-layers 10
      --threads 22
      --ctx-size 524288
      --batch-size 1024
      --ubatch-size 256
      --parallel 4
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --reasoning auto
      --metrics
      --no-webui
      --no-kv-offload
      --mlock
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    ttl: 3600

  # =================================================================
  # Qwen3.6-35B-A3B-UD-Q4_K_M-worker — OPTIMIZED MULTI-AGENT
  # =================================================================
  # Same MoE architecture as Q4_K_S, but the slightly larger Q4_K_M
  # quant + --no-kv-offload and --mlock from the 2026-05-24 optimization
  # sweep. The VRAM saving from no-kv-offload offsets the slightly larger
  # model file, and mlock prevents any swap under memory pressure.
  Qwen3.6-35B-A3B-UD-Q4_K_M-worker:
    cmd: |
      /usr/local/bin/llama-server
      --model /models/qwen3.6/35b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      --alias Qwen3.6-35B-A3B-UD-Q4_K_M-worker
      --host 0.0.0.0
      --port ${PORT}
      --gpu-layers 10
      --threads 22
      --ctx-size 131072
      --batch-size 2048
      --ubatch-size 512
      --parallel 4
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --reasoning auto
      --metrics
      --no-webui
      --no-kv-offload
      --mlock
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    ttl: 1800

  # =================================================================
  # Qwen3.6-35B-A3B-UD-Q4_K_M-worker-hermes — HERMES-OPTIMIZED WORKER
  # =================================================================
  # Dedicated Hermes worker profile based on the proven Q4_K_M worker alias.
  # Hermes agent turns pay extra prefill and transcript cost (system prompt,
  # skill docs, tool schemas, long histories), so the slot budget matters more
  # than the raw total ctx. Bump the total window to 524288 while keeping
  # parallel=4 so llama.cpp exposes 4 x 128 k effective slots — the "saner
  # live default" documented in BENCHMARKING.md. This avoids the old 24,576
  # token slot cap that came from 98,304 / 4 while preserving the tuned worker
  # alias's throughput-oriented prefill settings.
  Qwen3.6-35B-A3B-UD-Q4_K_M-worker-hermes:
    cmd: |
      /usr/local/bin/llama-server
      --model /models/qwen3.6/35b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      --alias Qwen3.6-35B-A3B-UD-Q4_K_M-worker-hermes
      --host 0.0.0.0
      --port ${PORT}
      --gpu-layers 10
      --threads 22
      --ctx-size 524288
      --batch-size 2048
      --ubatch-size 512
      --parallel 4
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --reasoning auto
      --metrics
      --no-webui
      --no-kv-offload
      --mlock
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    ttl: 14400

  # =================================================================
  # Qwen3.6-35B-A3B-UD-Q4_K_M-planner — OPTIMIZED PLANNER
  # =================================================================
  # Larger Q4_K_M quant + no-kv-offload for single-slot deep context.
  Qwen3.6-35B-A3B-UD-Q4_K_M-planner:
    cmd: |
      /usr/local/bin/llama-server
      --model /models/qwen3.6/35b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      --alias Qwen3.6-35B-A3B-UD-Q4_K_M-planner
      --host 0.0.0.0
      --port ${PORT}
      --gpu-layers 10
      --threads 22
      --ctx-size 262144
      --batch-size 1024
      --ubatch-size 256
      --parallel 1
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --reasoning auto
      --metrics
      --no-webui
      --no-kv-offload
      --mlock
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    ttl: 3600

  # =================================================================
  # Qwen3.6-27B-UD-Q8_K_XL — HEAVY DENSE TEST BENCH
  # =================================================================
  # Dense 27B at Q8_K_XL (34 GiB). All params active per token, so
  # CPU-bound on Pascal: expect ~1 tok/s at a 128 k window. ngl stays
  # conservative — only a handful of layers fit alongside the KV cache
  # in 5 GiB usable VRAM. Keep around for accuracy comparison against
  # the MoE quants, not for interactive use.
  Qwen3.6-27B-UD-Q8_K_XL:
    cmd: |
      /usr/local/bin/llama-server
      --model /models/qwen3.6/27b/Qwen3.6-27B-UD-Q8_K_XL.gguf
      --alias Qwen3.6-27B-UD-Q8_K_XL
      --host 0.0.0.0
      --port ${PORT}
      --gpu-layers 3
      --threads 22
      --ctx-size 131072
      --batch-size 512
      --ubatch-size 128
      --parallel 1
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --reasoning off
      --metrics
      --no-webui
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    ttl: 3600

  # =================================================================
  # Gemma4-26B-A4B — FAST GENERAL-PURPOSE / NON-CODING
  # =================================================================
  # MoE 26B/4B-active (16 GiB). Fastest model on this hardware.
  # Tuned for raw concurrent throughput: ctx-size=131072 keeps a 128 k
  # total window while parallel=4 delivered ~27 tok/s aggregate in the
  # 2026-05-24 unload-between-model sweep. Use for chat, summarization,
  # and other non-code workloads where speed beats coding accuracy.
  # --reasoning off because Gemma's template doesn't model thinking like
  # Qwen/GLM.
  Gemma4-26B-A4B:
    cmd: |
      /usr/local/bin/llama-server
      --model /models/gemma4/26B-A4B/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
      --alias Gemma4-26B-A4B
      --host 0.0.0.0
      --port ${PORT}
      --gpu-layers 10
      --threads 22
      --ctx-size 131072
      --batch-size 1024
      --ubatch-size 256
      --parallel 4
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --reasoning off
      --reasoning-budget 0
      --metrics
      --no-webui
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    ttl: 1800

  # =================================================================
  # Gemma4-31B — LARGER DENSE GEMMA
  # =================================================================
  # Dense 31B Q4_K_M (18 GiB). All params active, so CPU-bound at
  # ngl=6. Expect ~2 tok/s at a 128 k window. Kept as a quality/style
  # reference only when 26B-A4B feels too lossy.
  Gemma4-31B:
    cmd: |
      /usr/local/bin/llama-server
      --model /models/gemma4/31b/gemma-4-31B-it-Q4_K_M.gguf
      --alias Gemma4-31B
      --host 0.0.0.0
      --port ${PORT}
      --gpu-layers 6
      --threads 22
      --ctx-size 131072
      --batch-size 1024
      --ubatch-size 256
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --reasoning off
      --reasoning-budget 0
      --metrics
      --no-webui
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    ttl: 3600

  # =================================================================
  # Qwopus3.5-9B-Coder-MTP — FAST DENSE CODING AGENT
  # =================================================================
  # Dense 9B Q8_0 with MTP. 34+ t/s on comparable hardware, ~50+ t/s
  # effective with MTP drafts. 9B is small enough that most layers
  # fit on 8GB VRAM. Best for fast interactive coding and tool use.
  # Uses the fixed Qwen chat template to avoid looping.
  Qwopus3.5-9B-Coder-MTP:
    cmd: |
      /usr/local/bin/llama-server
      --model /models/qwopus/Qwopus3.5-9B-Coder-MTP-Q8_0.gguf
      --alias Qwopus3.5-9B-Coder-MTP
      --host 0.0.0.0
      --port ${PORT}
      --gpu-layers 24
      --threads 22
      --ctx-size 131072
      --batch-size 2048
      --ubatch-size 512
      --parallel 1
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --spec-type draft-mtp
      --spec-draft-n-max 3
      --no-kv-offload
      --mlock
      --reasoning auto
      --metrics
      --no-webui
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    ttl: 1800

  # =================================================================
  # MiniMax-M2.7-UD-Q4_K_M — HEAVY CPU-RESIDENT MoE (NUMA-CRITICAL)
  # =================================================================
  # 138 GiB Unsloth Dynamic Q4_K_M, sharded into 4 GGUFs under
  # /models/minimax/UD-Q4_K_M/. Weights vastly exceed the 8 GiB P4000,
  # so all but a handful of layers live in system RAM and inference is
  # CPU-bound on the dual Xeon E5-2690 v4 (2 NUMA nodes x 24 physical
  # cores, no SMT, ~85 GiB per node).
  #
  # NUMA is mandatory: `--numa distribute` lets libnuma interleave both
  # the mmap'd weight pages and KV cache across both memory controllers
  # so each socket reads mostly-local pages. Without it, every other
  # token round-trips across the QPI link and throughput collapses.
  # mmap is left enabled (no --no-mmap, no --mlock) because the model
  # is larger than the pod's memory limit headroom — the kernel page
  # cache evicts cold layers under pressure instead of OOM-killing.
  #
  # -t 24 matches the per-NUMA-node physical core count, which keeps
  # llama.cpp's worker threads from bouncing between sockets. The pod
  # CPU limit (42) fits this comfortably; if benchmarks justify it,
  # try -t 48 + bumping the deployment cpu limit before going wider.
  #
  # -ngl 4 is intentionally tiny: the P4000 shares VRAM with Plex /
  # Jellyfin (~5 GiB usable) and the dynamic quant routing already
  # offloads the most expensive expert layers selectively.
  #
  # --mlock forces all 138 GiB into RAM at load time, eliminating the
  # 5k+ major page faults/sec that lazy mmap was producing during
  # inference on this HDD-backed model store (observed 2026-06-03: only
  # 17 % faulted in after 29 min of generation). The pod's 170 GiB cgroup
  # limit + IPC_LOCK capability are sized for this; ctx-size held at 32k
  # so the KV cache fits the remaining ~30 GiB headroom.
  MiniMax-M2.7-UD-Q4_K_M:
    cmd: |
      /usr/local/bin/llama-server
      --model /models/minimax/UD-Q4_K_M/MiniMax-M2.7-UD-Q4_K_M-00001-of-00004.gguf
      --alias MiniMax-M2.7-UD-Q4_K_M
      --host 0.0.0.0
      --port ${PORT}
      --numa distribute
      --threads 24
      --gpu-layers 4
      --ctx-size 32768
      --batch-size 512
      --ubatch-size 128
      --parallel 1
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --no-kv-offload
      --mlock
      --reasoning auto
      --metrics
      --no-webui
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    ttl: 3600

  # =================================================================
  # MiMo-V2.5-MXFP4_MOE — DEFAULT HOT-LOADED MODEL
  # =================================================================
  # 5-shard MiMo MXFP4 MoE under /models/mimo/2.5/MXFP4_MOE/. Live testing
  # on the prod GPU worker showed ngl=4 is stable (~2.6 tok/s); ngl=6 and
  # ngl=8 exit during startup before sustained VRAM allocation. Automation
  # clients should read their default model from LLM_DEFAULT_MODEL instead of
  # hardcoding this value.
  MiMo-V2.5-MXFP4_MOE:
    cmd: |
      /usr/local/bin/llama-server
      --model /models/mimo/2.5/MXFP4_MOE/MiMo-V2.5-MXFP4_MOE-00001-of-00005.gguf
      --alias MiMo-V2.5-MXFP4_MOE
      --host 0.0.0.0
      --port ${PORT}
      --numa distribute
      --threads 24
      --gpu-layers 4
      --ctx-size 32768
      --batch-size 512
      --ubatch-size 128
      --parallel 1
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --no-kv-offload
      --reasoning auto
      --metrics
      --mlock
      --no-webui
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    # No ttl: MiMo is preloaded via hooks.on_startup and should stay
    # resident once the long mlock pass completes. Inherits the top-level
    # globalTTL: 0.

  # =================================================================
  # Dense 27B Q5_K_S with MTP speculative decoding + no-kv-offload.
  # +42% single-request gen vs non-MTP (2.03 -> 2.89 t/s). VRAM ~6160 MiB.
  # Thinking MUST be disabled per-request for MTP to work.
  Qwen3.6-27B-Q5_K_S-MTP:
    cmd: |
      /usr/local/bin/llama-server
      --model /models/qwen3.6/27b/Qwen3.6-27B-Q5_K_S.gguf
      --alias Qwen3.6-27B-Q5_K_S-MTP
      --host 0.0.0.0
      --port ${PORT}
      --gpu-layers 16
      --threads 22
      --ctx-size 262144
      --batch-size 2048
      --ubatch-size 512
      --parallel 1
      --flash-attn on
      --cache-type-k q5_1
      --cache-type-v q5_1
      --spec-type draft-mtp
      --spec-draft-n-max 3
      --no-kv-offload
      --mlock
      --reasoning auto
      --metrics
      --no-webui
    env:
      - "CUDA_VISIBLE_DEVICES=0"
    ttl: 3600
