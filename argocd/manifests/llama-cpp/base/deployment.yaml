apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  namespace: llama-cpp
  labels:
    app: llama-cpp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-cpp
  template:
    metadata:
      labels:
        app: llama-cpp
    spec:
      containers:
        - name: llama-swap
          # llama-swap unified image — bundles both the llama-swap proxy
          # (entrypoint) and the /app/llama-server binary it spawns per
          # model. TODO: pin to a digest (`@sha256:...`) before this
          # becomes load-bearing.
          image: ghcr.io/mostlygeek/llama-swap:unified-cuda
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/llama-swap/config/config.yaml
            - --listen
            - ":8080"
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "4"
              memory: 140Gi
            limits:
              cpu: "42"
              memory: 140Gi
          # IPC_LOCK lifts the container's default RLIMIT_MEMLOCK (8 MiB) so
          # llama-server can mlock the full 138 GiB MiniMax weights into RAM
          # and avoid HDD-bound major page faults during inference. The 200
          # GiB VM now has less non-llama headroom because other host VMs also
          # need RAM, so keep the cgroup limit bounded below total host memory.
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            # llama-swap proxy answers /health immediately. Child model
            # loads happen on first request (not at pod startup), so we
            # don't need a long warmup grace period here.
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: config
              mountPath: /etc/llama-swap/config
              readOnly: true
        # Tiny stdlib-only Python sidecar that polls llama-swap's /running
        # to know which model is loaded, then aggregates host metrics
        # (llamaswap_*) with per-model llama.cpp metrics into one /metrics
        # endpoint Prometheus can scrape. Inactive-model scrapes are
        # skipped because llama-swap's upstream proxy hangs on them.
        - name: metrics-sidecar
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/sidecar-exporter.py"]
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: sidecar-script
              mountPath: /app
              readOnly: true
        # Permanent embedding model sidecar. The 0.6B Q8 model runs
        # CPU-only (--gpu-layers 0, ~610 MB RAM) so it never competes
        # for VRAM with chat models loaded by llama-swap. It stays
        # loaded forever on port 8081. CPU inference is fast enough
        # for the short prompts Mem0 uses for embeddings.
        - name: llama-embeddings
          image: ghcr.io/mostlygeek/llama-swap:unified-cuda
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/llama-server"]
          args:
            - --model
            - /models/qwen3/embedding-0.6b/Qwen3-Embedding-0.6B-Q8_0.gguf
            - --alias
            - Qwen3-Embedding-0.6B-Q8_0
            - --host
            - 0.0.0.0
            - --port
            - "8081"
            - --gpu-layers
            - "0"
            - --threads
            - "8"
            - --ctx-size
            - "32768"
            - --batch-size
            - "1024"
            - --ubatch-size
            - "512"
            - --parallel
            - "1"
            - --embedding
            - --pooling
            - last
            - --metrics
            - --no-webui
          ports:
            - name: embeddings
              containerPort: 8081
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: embeddings
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models-pvc
        - name: config
          configMap:
            name: llama-swap-config
        - name: sidecar-script
          configMap:
            name: llama-metrics-sidecar
            defaultMode: 0o555