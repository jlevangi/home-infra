apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  namespace: llama-cpp
  labels:
    app: llama-cpp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-cpp
  template:
    metadata:
      labels:
        app: llama-cpp
    spec:
      containers:
        - name: llama-swap
          # llama-swap unified image — bundles both the llama-swap proxy
          # (entrypoint) and the /app/llama-server binary it spawns per
          # model. TODO: pin to a digest (`@sha256:...`) before this
          # becomes load-bearing.
          image: ghcr.io/mostlygeek/llama-swap:unified-cuda
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/llama-swap/config/config.yaml
            - --listen
            - ":8080"
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "4"
              memory: 80Gi
            limits:
              cpu: "22"
              memory: 130Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            # llama-swap proxy answers /health immediately. Child model
            # loads happen on first request (not at pod startup), so we
            # don't need a long warmup grace period here.
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: config
              mountPath: /etc/llama-swap/config
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models-pvc
        - name: config
          configMap:
            name: llama-swap-config
