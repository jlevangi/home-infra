apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  namespace: llama-cpp
  labels:
    app: llama-cpp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-cpp
  template:
    metadata:
      labels:
        app: llama-cpp
    spec:
      containers:
        - name: llama-swap
          # llama-swap unified image — bundles both the llama-swap proxy
          # (entrypoint) and the /app/llama-server binary it spawns per
          # model. TODO: pin to a digest (`@sha256:...`) before this
          # becomes load-bearing.
          image: ghcr.io/mostlygeek/llama-swap:unified-cuda
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/llama-swap/config/config.yaml
            - --listen
            - ":8080"
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "4"
              memory: 150Gi
            limits:
              cpu: "42"
              memory: 170Gi
          # IPC_LOCK lifts the container's default RLIMIT_MEMLOCK (8 MiB) so
          # llama-server can mlock the full 138 GiB MiniMax weights into RAM
          # and avoid HDD-bound major page faults during inference. The 200
          # GiB VM only has ~30 GiB of non-llama headroom (jellyfin + plex
          # worst-case limits), so the cgroup limit must stay below that.
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          readinessProbe:
            httpGet:
              path: /health
              port: http
            # llama-swap proxy answers /health immediately. Child model
            # loads happen on first request (not at pod startup), so we
            # don't need a long warmup grace period here.
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: config
              mountPath: /etc/llama-swap/config
              readOnly: true
        # Tiny stdlib-only Python sidecar that polls llama-swap's /running
        # to know which model is loaded, then aggregates host metrics
        # (llamaswap_*) with per-model llama.cpp metrics into one /metrics
        # endpoint Prometheus can scrape. Inactive-model scrapes are
        # skipped because llama-swap's upstream proxy hangs on them.
        - name: metrics-sidecar
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/sidecar-exporter.py"]
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: sidecar-script
              mountPath: /app
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models-pvc
        - name: config
          configMap:
            name: llama-swap-config
        - name: sidecar-script
          configMap:
            name: llama-metrics-sidecar
            defaultMode: 0o555
