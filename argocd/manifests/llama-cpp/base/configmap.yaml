# llama-swap config — defines every model alias exposed by the proxy.
# Each model spawns an /app/llama-server child on first request and is
# evicted after `ttl` seconds of idle. Only one model is loaded at a time
# (single GPU); `ttl: 300` matches the user's local setup.
#
# Args were translated from /mnt/c/Users/pierc/llama-cpp/config.yaml:
#   - Dropped `--device ROCm0` (llama-server auto-detects CUDA)
#   - Dropped `--gpu-layers all` -> per-model integer that fits ~5 GiB
#     of usable VRAM on the Quadro P4000 (8 GiB total minus Plex/Jellyfin)
#   - HIP_VISIBLE_DEVICES -> CUDA_VISIBLE_DEVICES
#   - --ctx-size lowered substantially from local 131k-262k because the
#     KV cache would dwarf the available VRAM; tune up per model after
#     observing actual usage with nvidia-smi.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-config
  namespace: llama-cpp
  labels:
    app: llama-cpp
data:
  config.yaml: |
    startPort: 5800
    healthCheckTimeout: 600
    logLevel: info

    models:
      # =================================================================
      # GLM family
      # =================================================================

      GLM-4.7-Flash-Q6_K:
        # Benchmarked on Quadro P4000 (sm_61, 8 GiB) + 20 vCPU pod:
        #   ngl=3:  1540 MiB VRAM, 9.0 tok/s gen
        #   ngl=10: 5034 MiB VRAM, 9.9 tok/s gen  <-- chosen
        #   ngl=14: 7042 MiB VRAM, 10.3 tok/s gen (no Plex headroom)
        #   ngl>=24: OOM
        # ngl=10 leaves ~3 GiB VRAM for Plex/Jellyfin transcoder.
        # gen tok/s is bottlenecked by Pascal FP16 throughput, not CPU.
        cmd: |
          /usr/local/bin/llama-server
          --model /models/GLM/GLM-4.7-Flash-Q6_K.gguf
          --alias GLM-4.7-Flash-Q6_K
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 10
          --threads 22
          --ctx-size 8192
          --batch-size 256
          --ubatch-size 128
          --parallel 1
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning auto
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 300

      # NOTE: GLM-4.7-Flash-BF16 was tried here but removed. The Quadro
      # P4000 is Pascal (sm_61) with no native BF16 support; llama.cpp
      # must convert every BF16 tensor to FP16/FP32 at load time, forcing
      # a full sequential read+repack of all 56 GB. Measured load rate
      # through llama.cpp was ~4 MB/s -> ~4 hours cold start. Q6_K is
      # the practical "big GLM" target on this hardware. Re-introduce
      # BF16 only if the GPU is upgraded to Ampere/Hopper (sm_80+).

      # =================================================================
      # Qwopus
      # =================================================================

      Qwopus3.5-9B-coder:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/Qwopus3.5-9B-coder/Qwopus3.5-9B-coder-Exp-BF16.gguf
          --alias Qwopus3.5-9B-coder
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 8
          --threads 20
          --ctx-size 16384
          --batch-size 512
          --ubatch-size 128
          --parallel 1
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning auto
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 300

      # =================================================================
      # Gemma 4 family
      # =================================================================

      Gemma4-26B-A4B:
        # MoE; local benchmark prefers 2048/512 batches and 131k ctx —
        # cut ctx to 16k for the tighter VRAM budget.
        cmd: |
          /usr/local/bin/llama-server
          --model /models/gemma4/26B-A4B/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
          --alias Gemma4-26B-A4B
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 10
          --threads 20
          --ctx-size 16384
          --batch-size 2048
          --ubatch-size 512
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning off
          --reasoning-budget 0
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 300

      Gemma4-31B:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/gemma4/31b/gemma-4-31B-it-Q4_K_M.gguf
          --alias Gemma4-31B
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 6
          --threads 20
          --ctx-size 8192
          --batch-size 1024
          --ubatch-size 256
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning off
          --reasoning-budget 0
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 300

      # =================================================================
      # Qwen 3.6 family
      # =================================================================

      Qwen3.6-27B-Q4_K_S:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/qwen3.6/27b/Qwen_Qwen3.6-27B-Q4_K_S.gguf
          --alias Qwen3.6-27B-Q4_K_S
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 8
          --threads 20
          --ctx-size 16384
          --batch-size 2048
          --ubatch-size 512
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning auto
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 300

      Qwen3.6-35B-A3B-UD-Q4_K_S:
        # User's local-benchmark champion of the three 35B quants.
        cmd: |
          /usr/local/bin/llama-server
          --model /models/qwen3.6/35b/Qwen3.6-35B-A3B-UD-Q4_K_S.gguf
          --alias Qwen3.6-35B-A3B-UD-Q4_K_S
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 6
          --threads 20
          --ctx-size 8192
          --batch-size 1024
          --ubatch-size 256
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning auto
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 300

      Qwen3.6-35B-A3B-UD-Q4_K_M:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/qwen3.6/35b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
          --alias Qwen3.6-35B-A3B-UD-Q4_K_M
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 6
          --threads 20
          --ctx-size 8192
          --batch-size 1024
          --ubatch-size 256
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning auto
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 300

      Qwen3.6-35B-A3B-MXFP4-MOE:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/qwen3.6/35b/Qwen3.6-35B-A3B-MXFP4_MOE.gguf
          --alias Qwen3.6-35B-A3B-MXFP4-MOE
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 6
          --threads 20
          --ctx-size 8192
          --batch-size 1024
          --ubatch-size 256
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning auto
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 300

      Qwen3.6-35B-A3B-UD-Q8_K_XL:
        # Benchmarked on Quadro P4000 (sm_61, 8 GiB) + 20 vCPU pod:
        #   ngl=3: 3646 MiB VRAM, 8.5 tok/s gen
        #   ngl=4: 4746 MiB VRAM, 8.8 tok/s gen
        #   ngl=5: 5604 MiB VRAM, 9.1 tok/s gen  <-- chosen
        #   ngl=6: 6462 MiB VRAM, 8.7 tok/s gen (regression — GPU sat)
        # ngl=5 maxes generation throughput and leaves ~2.5 GiB VRAM
        # for Plex/Jellyfin transcoder. Adding more layers actually
        # slowed inference — likely PCIe/L2 contention at saturation.
        cmd: |
          /usr/local/bin/llama-server
          --model /models/qwen3.6/35b/Qwen3.6-35B-A3B-UD-Q8_K_XL.gguf
          --alias Qwen3.6-35B-A3B-UD-Q8_K_XL
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 5
          --threads 20
          --ctx-size 8192
          --batch-size 1024
          --ubatch-size 256
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning auto
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 300
