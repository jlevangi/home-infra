# llama-swap config — defines every model alias exposed by the proxy.
# Each model spawns a /usr/local/bin/llama-server child on first request and
# is evicted after `ttl` seconds of idle. Only one model is loaded at a time
# (single GPU); --parallel allows multiple concurrent sessions on the active
# model.
#
# Hardware ceiling: ~12 tok/s per slot on Pascal sm_61 (Quadro P4000, 8 GiB
# VRAM, ~5 GiB usable after Plex/Jellyfin headroom). Dense models > 12B
# parameters drop to 2-3 tok/s and are not viable for parallel agents.
# MoE models with 3-4B active params keep generation throughput high
# while only a fraction of layers fit on GPU.
#
# Per-request thinking toggle (--reasoning auto): frontends like opencode
# can set chat_template_kwargs.enable_thinking={true|false} per call.
#
# Threads pinned to 22 to match the pod's cpu limit. ttl bumped to 1200s
# (vs the upstream default 300s) so the currently loaded model stays warm
# across bursts of agent activity instead of being evicted between runs.
#
# ctx-size + --parallel strategy: the pod has 80–130 GiB RAM headroom and
# Q4-quantized KV keeps the per-token cost ~64 KB for the 35B Qwen MoEs.
# Most models target ~64 k per-slot effective context (ctx-size /
# --parallel), with the Qwen 35B coders configured at parallel=4 to chase
# the empirically observed ~22 t/s aggregate ceiling on Pascal P4000.
# Gemma4-26B-A4B is the deliberate exception: it stays at 128 k total ctx
# and runs parallel=4 because the 2026-05-24 sweep showed a clear aggregate
# throughput win (~27 tok/s) for 4 concurrent agents even at 32 k/slot.
# Dense models stay at parallel=1 unless a specific experiment justifies
# more slots — they're CPU-bound enough that extra concurrency usually just
# splits the floor.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-config
  namespace: llama-cpp
  labels:
    app: llama-cpp
data:
  config.yaml: |
    startPort: 5800
    # Remaining models load in seconds to a couple of minutes, so the
    # upstream 600 s timeout is ample again after removing MiniMax.
    healthCheckTimeout: 600
    logLevel: info

    models:
      # =================================================================
      # Qwen3.6-35B-A3B-UD-Q4_K_M — Q4_K_M BALANCED (128K PER SLOT)
      # =================================================================
      # Same as Q4_K_S but the slightly larger Q4_K_M quant. With
      # no-kv-offload the VRAM delta is negligible.
      Qwen3.6-35B-A3B-UD-Q4_K_M:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/qwen3.6/35b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
          --alias Qwen3.6-35B-A3B-UD-Q4_K_M
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 10
          --threads 22
          --ctx-size 524288
          --batch-size 1024
          --ubatch-size 256
          --parallel 4
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning auto
          --no-webui
          --no-kv-offload
          --mlock
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 1200

      # =================================================================
      # Qwen3.6-35B-A3B-UD-Q4_K_M-worker — OPTIMIZED MULTI-AGENT
      # =================================================================
      # Same MoE architecture as Q4_K_S, but the slightly larger Q4_K_M
      # quant + --no-kv-offload and --mlock from the 2026-05-24 optimization
      # sweep. The VRAM saving from no-kv-offload offsets the slightly larger
      # model file, and mlock prevents any swap under memory pressure.
      Qwen3.6-35B-A3B-UD-Q4_K_M-worker:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/qwen3.6/35b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
          --alias Qwen3.6-35B-A3B-UD-Q4_K_M-worker
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 10
          --threads 22
          --ctx-size 131072
          --batch-size 2048
          --ubatch-size 512
          --parallel 4
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning auto
          --no-webui
          --no-kv-offload
          --mlock
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 1200

      # =================================================================
      # Qwen3.6-35B-A3B-UD-Q4_K_M-planner — OPTIMIZED PLANNER
      # =================================================================
      # Larger Q4_K_M quant + no-kv-offload for single-slot deep context.
      Qwen3.6-35B-A3B-UD-Q4_K_M-planner:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/qwen3.6/35b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
          --alias Qwen3.6-35B-A3B-UD-Q4_K_M-planner
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 10
          --threads 22
          --ctx-size 262144
          --batch-size 1024
          --ubatch-size 256
          --parallel 1
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning auto
          --no-webui
          --no-kv-offload
          --mlock
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 1200

      # =================================================================
      # =================================================================
      # Qwen3.6-27B-UD-Q8_K_XL — HEAVY DENSE TEST BENCH
      # =================================================================
      # Dense 27B at Q8_K_XL (34 GiB). All params active per token, so
      # CPU-bound on Pascal: expect ~1 tok/s at a 128 k window. ngl stays
      # conservative — only a handful of layers fit alongside the KV cache
      # in 5 GiB usable VRAM. Keep around for accuracy comparison against
      # the MoE quants, not for interactive use.
      Qwen3.6-27B-UD-Q8_K_XL:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/qwen3.6/27b/Qwen3.6-27B-UD-Q8_K_XL.gguf
          --alias Qwen3.6-27B-UD-Q8_K_XL
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 3
          --threads 22
          --ctx-size 131072
          --batch-size 512
          --ubatch-size 128
          --parallel 1
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning off
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 1200

      # =================================================================
      # Gemma4-26B-A4B — FAST GENERAL-PURPOSE / NON-CODING
      # =================================================================
      # MoE 26B/4B-active (16 GiB). Fastest model on this hardware.
      # Tuned for raw concurrent throughput: ctx-size=131072 keeps a 128 k
      # total window while parallel=4 delivered ~27 tok/s aggregate in the
      # 2026-05-24 unload-between-model sweep. Use for chat, summarization,
      # and other non-code workloads where speed beats coding accuracy.
      # --reasoning off because Gemma's template doesn't model thinking like
      # Qwen/GLM.
      Gemma4-26B-A4B:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/gemma4/26B-A4B/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
          --alias Gemma4-26B-A4B
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 10
          --threads 22
          --ctx-size 131072
          --batch-size 1024
          --ubatch-size 256
          --parallel 4
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning off
          --reasoning-budget 0
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 1200

      # =================================================================
      # Gemma4-31B — LARGER DENSE GEMMA
      # =================================================================
      # Dense 31B Q4_K_M (18 GiB). All params active, so CPU-bound at
      # ngl=6. Expect ~2 tok/s at a 128 k window. Kept as a quality/style
      # reference only when 26B-A4B feels too lossy.
      Gemma4-31B:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/gemma4/31b/gemma-4-31B-it-Q4_K_M.gguf
          --alias Gemma4-31B
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 6
          --threads 22
          --ctx-size 131072
          --batch-size 1024
          --ubatch-size 256
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning off
          --reasoning-budget 0
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 1200

      # =================================================================
      # Qwen3.6-27B-Q5_K_S-MTP — DENSE MTP SINGLE-USER
      # =================================================================
      # Dense 27B Q5_K_S with MTP speculative decoding + no-kv-offload.
      # +42% single-request gen vs non-MTP (2.03 -> 2.89 t/s). VRAM ~6160 MiB.
      # Thinking MUST be disabled per-request for MTP to work.
      Qwen3.6-27B-Q5_K_S-MTP:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/qwen3.6/27b/Qwen3.6-27B-Q5_K_S.gguf
          --alias Qwen3.6-27B-Q5_K_S-MTP
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 16
          --threads 22
          --ctx-size 262144
          --batch-size 2048
          --ubatch-size 512
          --parallel 1
          --flash-attn on
          --cache-type-k q5_1
          --cache-type-v q5_1
          --spec-type draft-mtp
          --spec-draft-n-max 3
          --no-kv-offload
          --mlock
          --reasoning auto
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 1200
