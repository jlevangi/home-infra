# llama-swap config — defines every model alias exposed by the proxy.
# Each model spawns a /usr/local/bin/llama-server child on first request and
# is evicted after `ttl` seconds of idle. Only one model is loaded at a time
# (single GPU); --parallel allows multiple concurrent sessions on the active
# model.
#
# Trimmed to 3 production aliases on 2026-05-20 based on a benchmark sweep
# against the Quadro P4000 (Pascal sm_61, 8 GiB VRAM). See sibling
# BENCHMARKING.md for the data and rationale.
#
# Hardware ceiling: ~12 tok/s per slot on Pascal. Dense models > 12B
# parameters drop to 2-3 tok/s and are not viable for parallel agents.
# All three kept models are MoE with 3-4B active params, which keeps
# generation throughput high while only a fraction of layers fit on GPU.
#
# Per-request thinking toggle (--reasoning auto): frontends like opencode
# can set chat_template_kwargs.enable_thinking={true|false} per call.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-config
  namespace: llama-cpp
  labels:
    app: llama-cpp
data:
  config.yaml: |
    startPort: 5800
    healthCheckTimeout: 600
    logLevel: info

    models:
      # =================================================================
      # Qwen3.6-35B-A3B-UD-Q4_K_M — PRIMARY CODING AGENT
      # =================================================================
      # MoE 35B/3B-active. Highest HumanEval+ (93.3%) and SWE-Bench (73.4%)
      # among models we can run. Measured 12.1 tok/s per slot (parallel=1),
      # 5394 MiB VRAM at ngl=10, ~45s cold load on defragmented disk.
      # Released by Alibaba April 2026, native 262k context (capped to 8k
      # here; bump to 32k for parallel=4 agentic use).
      Qwen3.6-35B-A3B-UD-Q4_K_M:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/qwen3.6/35b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
          --alias Qwen3.6-35B-A3B-UD-Q4_K_M
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 10
          --threads 22
          --ctx-size 8192
          --batch-size 1024
          --ubatch-size 256
          --parallel 1
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning auto
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 300

      # =================================================================
      # GLM-4.7-Flash-Q6_K — ALTERNATIVE CODER, FASTEST COLD LOAD
      # =================================================================
      # MoE 30B/3B-active. HumanEval ~92%, SWE-Bench 73.8% (highest SWE
      # score on this machine). Measured 11.3 tok/s per slot, 5034 MiB
      # VRAM at ngl=10, ~20s cold load (less fragmented than the Qwen
      # files). Use this when you want the snappiest first response after
      # a model swap.
      GLM-4.7-Flash-Q6_K:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/GLM/GLM-4.7-Flash-Q6_K.gguf
          --alias GLM-4.7-Flash-Q6_K
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 10
          --threads 22
          --ctx-size 8192
          --batch-size 256
          --ubatch-size 128
          --parallel 1
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning auto
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 300

      # =================================================================
      # Gemma4-26B-A4B — FAST GENERAL-PURPOSE / NON-CODING
      # =================================================================
      # MoE 26B/4B-active. HumanEval ~78.5% (weakest coder of the three)
      # but the FASTEST model on this hardware at 14.1 tok/s per slot.
      # Use for chat, summarization, anything not strictly code.
      # 6108 MiB VRAM at ngl=10. --reasoning off because Gemma's
      # template doesn't model thinking the same way as Qwen/GLM.
      Gemma4-26B-A4B:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/gemma4/26B-A4B/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
          --alias Gemma4-26B-A4B
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 10
          --threads 22
          --ctx-size 8192
          --batch-size 2048
          --ubatch-size 512
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning off
          --reasoning-budget 0
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 300

      # =================================================================
      # MiniMax-M2.7-MXFP4_MOE — XL AGENTIC MODEL (experimental)
      # =================================================================
      # Sparse MoE: 230B total / 10B active params, 256 experts (8 active
      # per token), 62 layers. Designed by MiniMax AI for agentic coding
      # workflows; ELO 1495 on GDPval-AA (highest open-weight), 46.3% on
      # Toolathon, 62.7% on MM Claw e2e.
      #
      # MXFP4_MOE is the OCP Microscaling FP4 standard. On Pascal sm_61
      # we get the memory savings but no FP4 tensor-core acceleration
      # (that lands on Blackwell sm_100+). With 10B active params per
      # token vs ~3B for our other MoEs, expect ~4-6 tok/s gen.
      #
      # Multi-shard: llama-server reads shard 1 (header) and auto-loads
      # the other 3 (~135 GB total on disk). Cold load will be slow on
      # first request; mmap minimizes resident pages thereafter.
      # Conservative ctx-size and ngl to start; tune after first benchmark.
      MiniMax-M2.7-MXFP4_MOE:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/MiniMax/MXFP4_MOE/MiniMax-M2.7-MXFP4_MOE-00001-of-00004.gguf
          --alias MiniMax-M2.7-MXFP4_MOE
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 3
          --threads 22
          --ctx-size 4096
          --batch-size 512
          --ubatch-size 128
          --parallel 1
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning auto
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 300
