# llama-swap config — defines every model alias exposed by the proxy.
# Each model spawns a /usr/local/bin/llama-server child on first request and
# is evicted after `ttl` seconds of idle. Only one model is loaded at a time
# (single GPU); --parallel allows multiple concurrent sessions on the active
# model.
#
# Hardware ceiling: ~12 tok/s per slot on Pascal sm_61 (Quadro P4000, 8 GiB
# VRAM, ~5 GiB usable after Plex/Jellyfin headroom). Dense models > 12B
# parameters drop to 2-3 tok/s and are not viable for parallel agents.
# MoE models with 3-4B active params keep generation throughput high
# while only a fraction of layers fit on GPU.
#
# Per-request thinking toggle (--reasoning auto): frontends like opencode
# can set chat_template_kwargs.enable_thinking={true|false} per call.
#
# Threads pinned to 22 to match the pod's cpu limit. ttl bumped to 1200s
# (vs the upstream default 300s) — cold loads run 30 s for Q4 MoEs to
# minutes for MiniMax's 130 GiB split, so we tolerate a longer idle window
# to avoid swap thrash during agent sessions.
#
# ctx-size + --parallel strategy: the pod has 80–130 GiB RAM headroom and
# Q4-quantized KV keeps the per-token cost ~64 KB for the 35B Qwen MoEs.
# Each model targets ~64 k per-slot effective context (ctx-size /
# --parallel), with the Qwen 35B coders configured at parallel=4 to chase
# the empirically observed ~22 t/s aggregate ceiling on Pascal P4000.
# Dense models stay at parallel=1 — they're already CPU-bound; parallel
# slots wouldn't beat the GPU ceiling and would just split the floor.
# MiniMax is single-slot until we have a feel for its 10B-active behavior
# under load.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-config
  namespace: llama-cpp
  labels:
    app: llama-cpp
data:
  config.yaml: |
    startPort: 5800
    healthCheckTimeout: 600
    logLevel: info

    models:
      # =================================================================
      # Qwen3.6-35B-A3B-UD-Q4_K_S — PRIMARY CODING AGENT
      # =================================================================
      # MoE 35B/3B-active, Unsloth Dynamic Q4_K_S (20 GiB). Drop-in for
      # the prior Q4_K_M slot — same architecture, slightly tighter quant.
      # Native 262k ctx capped to 8k here; bump for long-context coding.
      Qwen3.6-35B-A3B-UD-Q4_K_S:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/qwen3.6/35b/Qwen3.6-35B-A3B-UD-Q4_K_S.gguf
          --alias Qwen3.6-35B-A3B-UD-Q4_K_S
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 10
          --threads 22
          --ctx-size 262144
          --batch-size 1024
          --ubatch-size 256
          --parallel 4
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning auto
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 1200

      # =================================================================
      # Qwen3.6-35B-A3B-MXFP4_MOE — ALTERNATIVE QUANT
      # =================================================================
      # Same architecture as Q4_K_S, 21 GiB at MXFP4 (OCP Microscaling FP4).
      # Pascal sm_61 gets the memory savings but no FP4 tensor-core
      # acceleration (FP4 lands on Blackwell sm_100+), so expect similar
      # throughput to Q4_K_S with marginally different accuracy.
      Qwen3.6-35B-A3B-MXFP4_MOE:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/qwen3.6/35b/Qwen3.6-35B-A3B-MXFP4_MOE.gguf
          --alias Qwen3.6-35B-A3B-MXFP4_MOE
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 10
          --threads 22
          --ctx-size 262144
          --batch-size 512
          --ubatch-size 128
          --parallel 4
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning auto
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 1200

      # =================================================================
      # Qwen3.6-27B-UD-Q8_K_XL — HEAVY DENSE TEST BENCH
      # =================================================================
      # Dense 27B at Q8_K_XL (34 GiB). All params active per token, so
      # CPU-bound on Pascal: expect 1-3 tok/s. ngl conservative — only a
      # handful of layers fit alongside the KV cache in 5 GiB usable VRAM.
      # Keep around for accuracy/quality comparison against the MoE quants.
      Qwen3.6-27B-UD-Q8_K_XL:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/qwen3.6/27b/Qwen3.6-27B-UD-Q8_K_XL.gguf
          --alias Qwen3.6-27B-UD-Q8_K_XL
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 3
          --threads 22
          --ctx-size 65536
          --batch-size 512
          --ubatch-size 128
          --parallel 1
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning off
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 1200

      # =================================================================
      # Gemma4-26B-A4B — FAST GENERAL-PURPOSE / NON-CODING
      # =================================================================
      # MoE 26B/4B-active (16 GiB). Fastest model on this hardware
      # (~14 tok/s per slot at ngl=10). Use for chat, summarization,
      # anything not strictly code. --reasoning off because Gemma's
      # template doesn't model thinking like Qwen/GLM.
      Gemma4-26B-A4B:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/gemma4/26B-A4B/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
          --alias Gemma4-26B-A4B
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 10
          --threads 22
          --ctx-size 131072
          --batch-size 2048
          --ubatch-size 512
          --parallel 2
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning off
          --reasoning-budget 0
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 1200

      # =================================================================
      # Gemma4-31B — LARGER DENSE GEMMA
      # =================================================================
      # Dense 31B Q4_K_M (18 GiB). All params active, so CPU-bound at
      # ngl=6. Expect 3-5 tok/s. Use for non-coding tasks where Gemma's
      # style is preferred over Qwen's, when 26B-A4B feels too lossy.
      Gemma4-31B:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/gemma4/31b/gemma-4-31B-it-Q4_K_M.gguf
          --alias Gemma4-31B
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 6
          --threads 22
          --ctx-size 65536
          --batch-size 1024
          --ubatch-size 256
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning off
          --reasoning-budget 0
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 1200

      # =================================================================
      # MiniMax-M2.7-MXFP4_MOE — XL AGENTIC MODEL (experimental)
      # =================================================================
      # Sparse MoE: 230B total / 10B active params, 256 experts (8 active
      # per token), 62 layers. Designed by MiniMax AI for agentic coding;
      # ELO 1495 on GDPval-AA (highest open-weight at time of download).
      #
      # MXFP4_MOE on Pascal sm_61: memory savings yes, FP4 tensor-core
      # acceleration no. With 10B active params (vs ~3B for our other
      # MoEs), expect 4-6 tok/s gen.
      #
      # Multi-shard (~130 GiB on disk: 7.9M header + 47G + 47G + 35G).
      # llama-server reads shard 1 and auto-loads the rest. Cold load is
      # slow on first request from spinning tank; mmap minimizes resident
      # pages after that. Conservative ctx-size and ngl until we benchmark.
      MiniMax-M2.7-MXFP4_MOE:
        cmd: |
          /usr/local/bin/llama-server
          --model /models/MiniMax/MXFP4_MOE/MiniMax-M2.7-MXFP4_MOE-00001-of-00004.gguf
          --alias MiniMax-M2.7-MXFP4_MOE
          --host 0.0.0.0
          --port ${PORT}
          --gpu-layers 3
          --threads 22
          --ctx-size 131072
          --batch-size 512
          --ubatch-size 128
          --parallel 1
          --flash-attn on
          --cache-type-k q4_0
          --cache-type-v q4_0
          --reasoning auto
          --no-webui
        env:
          - "CUDA_VISIBLE_DEVICES=0"
        ttl: 1200
