apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-cpp-models-pvc
  namespace: llama-cpp
spec:
  accessModes:
    - ReadWriteOnce
  # Empty storageClassName is intentional: this PVC binds to the static
  # llama-cpp-models-pv host-backed volume and must not be provisioned through
  # Longhorn.
  storageClassName: ""
  volumeName: llama-cpp-models-pv
  resources:
    requests:
      storage: 500Gi
