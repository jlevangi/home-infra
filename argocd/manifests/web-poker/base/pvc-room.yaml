apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-poker-room-pvc
  namespace: web-poker
  labels:
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  # Be explicit instead of relying on the cluster default. This room-state PVC
  # follows the general-purpose policy unless later measurements justify a more
  # specialized class.
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
