apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-poker-secrets
  namespace: web-poker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: web-poker-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/web-poker
