apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-poker-api
  namespace: web-poker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web-poker-api
  template:
    metadata:
      labels:
        app: web-poker-api
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              until nc -z web-poker-mysql 3306; do
                echo "Waiting for MySQL..."
                sleep 5
              done
      containers:
        - name: api
          image: jlevangie/gamble-king:api-20260429-1
          imagePullPolicy: IfNotPresent
          env:
            - name: SIGNUP_CHIPS
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: API_SIGNUP_CHIPS
            - name: MAX_BAD_LOGINS
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: API_MAX_BAD_LOGINS
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: API_SERVER_PORT
            - name: LOGGING_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: API_LOGGING_LEVEL
            - name: FLYWAY
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: API_FLYWAY
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: web-poker-secrets
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: web-poker-secrets
                  key: SMTP_PORT
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: web-poker-secrets
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-poker-secrets
                  key: SMTP_PASSWORD
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: web-poker-secrets
                  key: SMTP_FROM
            - name: SMTP_STARTTLS
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: API_SMTP_STARTTLS
            - name: SMTP_TRANSPORT
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: API_SMTP_TRANSPORT
            - name: EMAIL_VALIDATION
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: API_EMAIL_VALIDATION
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: API_DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: web-poker-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-poker-secrets
                  key: DB_PASSWORD
            - name: CORS
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: API_CORS_ORIGIN
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: TZ
          ports:
            - name: http
              containerPort: 8083
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
