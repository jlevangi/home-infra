apiVersion: v1
kind: LimitRange
metadata:
  name: web-poker-storage-limits
  namespace: web-poker
spec:
  limits:
    - type: PersistentVolumeClaim
      max:
        storage: "10Gi"
      min:
        storage: "100Mi"
      default:
        storage: "1Gi"
      defaultRequest:
        storage: "1Gi"
