apiVersion: v1
kind: ConfigMap
metadata:
  name: web-poker-config
  namespace: web-poker
data:
  APP_URL: "https://poker.levangie.dev"
  TZ: "America/New_York"
  MYSQL_DATABASE: "poker"
  MYSQL_HOST: "web-poker-mysql"
  MYSQL_PORT: "3306"
  API_SERVER_PORT: "8083"
  API_DB_URL: "jdbc:mysql://web-poker-mysql:3306/poker?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true"
  API_CORS_ORIGIN: "https://poker.levangie.dev"
  API_LOGGING_LEVEL: "WARN"
  API_FLYWAY: "true"
  API_SIGNUP_CHIPS: "2500"
  API_MAX_BAD_LOGINS: "5"
  API_EMAIL_VALIDATION: "true"
  API_SMTP_STARTTLS: "true"
  API_SMTP_TRANSPORT: "smtp"
  ORCHESTRATOR_SERVER_PORT: "8082"
  ORCHESTRATOR_LISTEN_PORT: "8045"
  ORCHESTRATOR_DB_URL: "jdbc:mysql://web-poker-mysql:3306/poker?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true"
  ORCHESTRATOR_LOGGING_LEVEL: "WARN"
  ORCHESTRATOR_CORE_POOL_SIZE: "4"
  ORCHESTRATOR_MAX_POOL_SIZE: "10"
  ROOM_SERVER_PORT: "8081"
  ROOM_LOGGING_LEVEL: "WARN"
  ROOM_CONFIG_DIR: "/home/web-poker-room/dataSave"
  ROOM_NAME: "Levangie Poker"
  ROOM_DESCRIPTION: "Private Texas Hold'em room"
  ROOM_MAX_PLAYERS: "10"
  ROOM_MIN_CHIPS_FOR_ACCESS: "250"
  ROOM_PUBLIC_HOST: "poker.levangie.dev"
  ROOM_PUBLIC_PORT: "443"
  ROOM_ORCHESTRATOR_HOST: "web-poker-orchestrator"
  ROOM_ORCHESTRATOR_PORT: "8045"
