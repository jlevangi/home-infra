apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-poker-orchestrator
  namespace: web-poker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web-poker-orchestrator
  template:
    metadata:
      labels:
        app: web-poker-orchestrator
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              until nc -z web-poker-mysql 3306; do
                echo "Waiting for MySQL..."
                sleep 5
              done
      containers:
        - name: orchestrator
          image: jlevangie/gamble-king:orchestrator-20260429-2
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ORCHESTRATOR_SERVER_PORT
            - name: LOGGING_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ORCHESTRATOR_LOGGING_LEVEL
            - name: CORE_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ORCHESTRATOR_CORE_POOL_SIZE
            - name: MAX_POOL_SIZE
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ORCHESTRATOR_MAX_POOL_SIZE
            - name: ORCHESTRATOR_LISTEN_PORT
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ORCHESTRATOR_LISTEN_PORT
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ORCHESTRATOR_DB_URL
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: web-poker-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-poker-secrets
                  key: DB_PASSWORD
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: TZ
          ports:
            - name: http
              containerPort: 8082
            - name: register
              containerPort: 8045
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
