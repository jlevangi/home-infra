apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-poker-room
  namespace: web-poker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web-poker-room
  template:
    metadata:
      labels:
        app: web-poker-room
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      initContainers:
        - name: wait-for-orchestrator
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              until nc -z web-poker-orchestrator 8045; do
                echo "Waiting for orchestrator..."
                sleep 5
              done
      containers:
        - name: room
          image: jlevangie/gamble-king:room-20260429-1
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ROOM_SERVER_PORT
            - name: CONFIG_FILE
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ROOM_CONFIG_DIR
            - name: LOGGING_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ROOM_LOGGING_LEVEL
            - name: ROOM_NAME
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ROOM_NAME
            - name: ACCESS_PASSWORD
              value: ""
            - name: SECURITY_TOKEN
              value: ""
            - name: MAX_PLAYERS
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ROOM_MAX_PLAYERS
            - name: DESCRIPTION
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ROOM_DESCRIPTION
            - name: MIN_CHIPS_FOR_ACCESS
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ROOM_MIN_CHIPS_FOR_ACCESS
            - name: SERVER_PUBLIC_HOST
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ROOM_PUBLIC_HOST
            - name: SERVER_PUBLIC_PORT
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ROOM_PUBLIC_PORT
            - name: RECOVERY_EMAIL
              valueFrom:
                secretKeyRef:
                  name: web-poker-secrets
                  key: SMTP_FROM
            - name: ORCHESTRATOR_LISTEN_PORT
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ROOM_ORCHESTRATOR_PORT
            - name: ORCHESTRATOR_IP
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: ROOM_ORCHESTRATOR_HOST
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: web-poker-config
                  key: TZ
          ports:
            - name: websocket
              containerPort: 8081
          volumeMounts:
            - name: room-data
              mountPath: /home/web-poker-room/dataSave
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: room-data
          persistentVolumeClaim:
            claimName: web-poker-room-pvc
