apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: jlevangie/web-poker-frontend
    newTag: "latest"
  - name: jlevangie/web-poker-api
    newTag: "latest"
  - name: jlevangie/web-poker-orchestrator
    newTag: "latest"
  - name: jlevangie/web-poker-room
    newTag: "latest"
patches:
  - target:
      kind: Ingress
      name: web-poker-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
