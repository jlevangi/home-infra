apiVersion: apps/v1
kind: Deployment
metadata:
  name: gamble-king
  namespace: gamble-king
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gamble-king
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gamble-king
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: gamble-king
          image: ghcr.io/jlevangi/poker-night:2.5.4@sha256:eea16d843cdc455791a2551317ab7e63c1da37231f4bad01a9177a195115f5ca
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: gamble-king-secrets
          ports:
            - name: http
              containerPort: 5000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/config
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/config
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /app/poker_data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gamble-king-data
