apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gamble-king-secrets
  namespace: gamble-king
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: gamble-king-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/gamble-king
