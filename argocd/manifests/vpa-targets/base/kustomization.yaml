apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 3dprintcalc.yaml
  - firefox.yaml
  - ittools.yaml
  - linkding.yaml
  - memos.yaml
  - microbin.yaml
  - netbootxyz.yaml
  - notemark.yaml
  - ntfy.yaml
  - pairdrop.yaml
  - pocketid.yaml
  - plex.yaml
  - jellyfin.yaml
  - factorio.yaml
  - immich.yaml
  - paperless.yaml
  - bookstack.yaml
  - vault.yaml
  - changedetection.yaml
  - librechat.yaml
  - kioto.yaml
  - searxng.yaml
  - vaultwarden.yaml
  - wallos.yaml
  - yams.yaml

patches:
  # Let VPA right-size scheduling requests without creating CPU throttling or
  # ratio-scaled limits after a transient workload spike.
  - target:
      group: autoscaling.k8s.io
      version: v1
      kind: VerticalPodAutoscaler
    patch: |-
      - op: add
        path: /spec/resourcePolicy
        value:
          containerPolicies:
            - containerName: "*"
              controlledValues: RequestsOnly
