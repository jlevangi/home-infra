apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: paperless
  namespace: paperless
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paperless
  updatePolicy:
    updateMode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: paperless-mariadb
  namespace: paperless
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paperless-mariadb
  updatePolicy:
    updateMode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: paperless-redis
  namespace: paperless
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paperless-redis
  updatePolicy:
    updateMode: "Off"
