apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: bookstack
  namespace: bookstack
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bookstack
  updatePolicy:
    updateMode: "Initial"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: bookstack-mariadb
  namespace: bookstack
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bookstack-mariadb
  updatePolicy:
    updateMode: "Initial"
