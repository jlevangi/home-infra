apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: librechat-credentials-env
  namespace: librechat
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: librechat-credentials-env
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/librechat
