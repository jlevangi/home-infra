apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kioto-secrets
  namespace: kioto
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: kioto-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/kioto
