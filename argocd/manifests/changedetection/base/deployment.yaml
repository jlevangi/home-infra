apiVersion: apps/v1
kind: Deployment
metadata:
  name: changedetection
  namespace: changedetection
  labels:
    app: changedetection
    app.kubernetes.io/name: changedetection
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: changedetection
  template:
    metadata:
      labels:
        app: changedetection
        app.kubernetes.io/name: changedetection
    spec:
      containers:
        - name: changedetection
          image: ghcr.io/dgtlmoon/changedetection.io
          env:
            - name: PORT
              value: "5000"
            - name: WEBDRIVER_URL
              value: "http://browser-chrome:4444/wd/hub"
            - name: WEBDRIVER_CONNECTION_TIMEOUT
              value: "180"
            - name: WEBDRIVER_PAGELOAD_TIMEOUT
              value: "180"
            - name: WEBDRIVER_DELAY_BEFORE_CONTENT_READY
              value: "5"
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: changedetection-data
              mountPath: /datastore
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: changedetection-data
          persistentVolumeClaim:
            claimName: changedetection-data-pvc
