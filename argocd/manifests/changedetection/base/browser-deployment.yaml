apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser-chrome
  namespace: changedetection
  labels:
    app: browser-chrome
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: browser-chrome
  template:
    metadata:
      labels:
        app: browser-chrome
    spec:
      containers:
        - name: browser-chrome
          image: selenium/standalone-chrome:4.43.0-20260404
          ports:
            - containerPort: 4444
          env:
            - name: SE_VNC_NO_PASSWORD
              value: "1"
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "1"
              # Headroom for the 1Gi /dev/shm + 2Gi /tmp tmpfs which count against pod memory.
              memory: 5Gi
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /status
              port: 4444
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: 4444
            initialDelaySeconds: 45
            periodSeconds: 20
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        # tmpfs for Chrome's user-data-dir, cache, and downloads — keeps Selenium's
        # bursty session writes (multi-GB during crawls) off the node's overlayfs/SSD.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
