apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: changedetection-data-pvc
  namespace: changedetection
  labels:
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
    app: changedetection
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
  storageClassName: longhorn
