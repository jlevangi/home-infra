apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: quay.io/keycloak/keycloak
    newTag: "26.7.3"
  - name: postgres
    newTag: "16"
patches:
  - target:
      kind: PersistentVolumeClaim
      name: keycloak-db-pvc
    patch: |
      - op: add
        path: /spec/volumeName
        value: pvc-4a4c60e9-8291-4ef0-a1e6-3a7207fc869e
      - op: replace
        path: /spec/storageClassName
        value: longhorn-flash
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
  - target:
      kind: Ingress
      name: keycloak-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
