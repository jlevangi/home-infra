apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hoarder-data-pvc
  namespace: hoarder
  labels:
    app: hoarder
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hoarder-redis-pvc
  namespace: hoarder
  labels:
    app: hoarder-redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
  storageClassName: longhorn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hoarder-meilisearch-pvc
  namespace: hoarder
  labels:
    app: hoarder-meilisearch
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
