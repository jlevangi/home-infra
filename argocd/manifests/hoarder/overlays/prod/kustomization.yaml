apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: PersistentVolumeClaim
      name: hoarder-data-pvc
    patch: |
      - op: replace
        path: /spec/storageClassName
        value: longhorn-one-replica-tank
      - op: replace
        path: /spec/volumeName
        value: hoarder-data-prod-pv
  - target:
      kind: PersistentVolumeClaim
      name: hoarder-meilisearch-pvc
    patch: |
      - op: replace
        path: /spec/storageClassName
        value: longhorn-one-replica-tank
      - op: add
        path: /spec/volumeName
        value: hoarder-meilisearch-pv
  - target:
      kind: PersistentVolumeClaim
      name: hoarder-redis-pvc
    patch: |
      - op: replace
        path: /spec/storageClassName
        value: longhorn-one-replica-tank
      - op: replace
        path: /spec/volumeName
        value: hoarder-redis-prod-pv
  - target:
      kind: Ingress
      name: hoarder-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
