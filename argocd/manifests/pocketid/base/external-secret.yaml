apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocketid-secret
  namespace: pocketid
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: pocketid-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/pocketid
