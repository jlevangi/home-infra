apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: pocketid-config
    patch: |
      - op: replace
        path: /data/APP_URL
        value: "https://pocketid.test.levangie.dev"
  - target:
      kind: Ingress
      name: pocketid-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "pocketid.test.levangie.dev"
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-test.levangie.dev"
  - target:
      kind: ExternalSecret
      name: pocketid-secret
    patch: |
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: "test/pocketid"
commonLabels:
  environment: test
