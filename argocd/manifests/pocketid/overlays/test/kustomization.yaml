apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: pocketid-config
    patch: |
      - op: replace
        path: /data/APP_URL
        value: "https://pocketid.test.levangie.dev"
  - target:
      kind: Ingress
      name: pocketid-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "pocketid.test.levangie.dev"
commonLabels:
  environment: test
