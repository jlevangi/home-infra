apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/pocket-id/pocket-id
    newTag: "v1.16.0"
patches:
  - target:
      kind: PersistentVolumeClaim
      name: pocketid-data-pvc
    patch: |
      - op: replace
        path: /spec/volumeName
        value: pocketid-data-pv
  - target:
      kind: Ingress
      name: pocketid-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
commonLabels:
  environment: prod
