apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notemark-secrets
  namespace: notemark
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: notemark-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/notemark
