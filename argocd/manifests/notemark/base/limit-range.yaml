apiVersion: v1
kind: LimitRange
metadata:
  name: notemark-storage-limits
  namespace: notemark
spec:
  limits:
    - type: PersistentVolumeClaim
      max:
        storage: "500Mi"
      min:
        storage: "100Mi"
      default:
        storage: "500Mi"
      defaultRequest:
        storage: "500Mi"
