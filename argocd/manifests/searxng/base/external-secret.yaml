apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-secrets
  namespace: searxng
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: searxng-secrets
    creationPolicy: Owner
  # Reuses the same Surfshark OpenVPN credentials as yams/firefox.
  dataFrom:
    - extract:
        key: prod/yams
