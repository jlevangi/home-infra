apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: searxng
  labels:
    app: searxng
    app.kubernetes.io/name: searxng
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
        app.kubernetes.io/name: searxng
      annotations:
        # Restart pod when settings.yml changes.
        checksum/config: "23cd2c05"
    spec:
      containers:
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: surfshark
            - name: VPN_TYPE
              value: openvpn
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: searxng-secrets
                  key: OPENVPN_USER
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: searxng-secrets
                  key: OPENVPN_PASSWORD
            - name: SERVER_CITIES
              value: New York
            # Allow inbound to the SearXNG web UI through gluetun's firewall.
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: searxng
          image: docker.io/searxng/searxng:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SEARXNG_BASE_URL
              value: https://search.levangie.dev/
            - name: INSTANCE_NAME
              value: search.levangie.dev
            # Override K8s-injected SEARXNG_PORT (set by the Service named
            # "searxng" to a tcp://... URL, which the entrypoint can't parse).
            - name: SEARXNG_PORT
              value: "8080"
            - name: SEARXNG_BIND_ADDRESS
              value: "0.0.0.0"
          ports:
            - name: searxng-http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: searxng-config
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: searxng-config
          configMap:
            name: searxng-config
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
