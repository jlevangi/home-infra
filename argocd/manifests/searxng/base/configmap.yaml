apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
data:
  settings.yml: |
    use_default_settings: true

    general:
      instance_name: "search.levangie.dev"
      contact_url: false
      enable_metrics: true

    search:
      safe_search: 0
      autocomplete: "duckduckgo"
      default_lang: "en"
      formats:
        - html
        - json

    server:
      # secret_key is injected via SEARXNG_SECRET environment variable from Vault kv/prod/searxng.
      secret_key: "ultrasecretkey"
      base_url: "https://search.levangie.dev/"
      image_proxy: true
      limiter: false
      method: "GET"

    ui:
      static_use_hash: true
      default_theme: simple
      theme_args:
        simple_style: auto
