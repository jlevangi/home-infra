apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: searxng
data:
  settings.yml: |
    use_default_settings: true

    general:
      instance_name: "search.levangie.dev"
      contact_url: false
      enable_metrics: true

    search:
      safe_search: 0
      autocomplete: "duckduckgo"
      default_lang: "en"
      formats:
        - html
        - json

    server:
      # secret_key signs image-proxy URLs and rate-limit cookies. Random per
      # deployment; rotate by replacing the value below and restarting the pod.
      secret_key: "23cd2c05c85ea6e9cba7cde688c74f457d6bd554bd7bb65ceead673bcf23c437"
      base_url: "https://search.levangie.dev/"
      image_proxy: true
      limiter: false
      method: "GET"

    ui:
      static_use_hash: true
      default_theme: simple
      theme_args:
        simple_style: auto
