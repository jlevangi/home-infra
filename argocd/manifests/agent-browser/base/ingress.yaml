apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-browser-ingress
  namespace: agent-browser
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: agent-browser-agent-browser-redirect-root@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: browser.levangie.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent-browser
                port:
                  number: 6080
