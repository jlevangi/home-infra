apiVersion: v1
kind: Service
metadata:
  name: agent-browser
  namespace: agent-browser
  labels:
    app: agent-browser
spec:
  type: ClusterIP
  selector:
    app: agent-browser
  ports:
    - name: cdp
      port: 9222
      targetPort: 9222
      protocol: TCP
    - name: novnc
      port: 6080
      targetPort: 6080
      protocol: TCP
