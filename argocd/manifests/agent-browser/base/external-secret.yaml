apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-browser-secrets
  namespace: agent-browser
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: agent-browser-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/agent-browser
