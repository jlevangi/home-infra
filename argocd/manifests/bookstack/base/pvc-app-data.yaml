apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bookstack-app-data-pvc
  namespace: bookstack
  labels:
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
    app: bookstack
    component: app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
  storageClassName: longhorn
