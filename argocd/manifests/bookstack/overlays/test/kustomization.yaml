apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # Patch ConfigMap APP_URL for test environment
  - target:
      kind: ConfigMap
      name: bookstack-config
    patch: |
      - op: replace
        path: /data/APP_URL
        value: "https://bookstack.test.levangie.dev"
  # Patch Ingress host for test environment
  - target:
      kind: Ingress
      name: bookstack-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "bookstack.test.levangie.dev"
commonLabels:
  environment: test
