apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # Patch ConfigMap APP_URL for test environment
  - target:
      kind: ConfigMap
      name: bookstack-config
    patch: |
      - op: replace
        path: /data/APP_URL
        value: "https://bookstack.test.levangie.dev"
  # Patch Ingress host for test environment
  - target:
      kind: Ingress
      name: bookstack-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "bookstack.test.levangie.dev"
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-test.levangie.dev"
  - target:
      kind: ExternalSecret
      name: bookstack-secrets
    patch: |
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: "test/bookstack"
labels:
  - pairs:
      environment: test
    includeSelectors: true
