apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: linuxserver/bookstack
    newTag: "26.05.20260608"
  - name: linuxserver/mariadb
    newTag: "11.8.8"
# Prod uses base values (bookstack.levangie.dev) - no patches needed
patches:
  - target:
      kind: PersistentVolumeClaim
      name: bookstack-app-data-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
      - op: replace
        path: /spec/volumeName
        value: bookstack-app-data-pv
  - target:
      kind: Ingress
      name: bookstack-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
