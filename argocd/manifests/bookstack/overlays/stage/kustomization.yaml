apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: linuxserver/bookstack
    newTag: "26.03.20260315"
  - name: linuxserver/mariadb
    newTag: "11.4.10"
patches:
  # Patch ConfigMap APP_URL for stage environment
  - target:
      kind: ConfigMap
      name: bookstack-config
    patch: |
      - op: replace
        path: /data/APP_URL
        value: "https://bookstack.stage.levangie.dev"
  # Patch Ingress host for stage environment
  - target:
      kind: Ingress
      name: bookstack-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "bookstack.stage.levangie.dev"
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-stage.levangie.dev"
labels:
  - pairs:
      environment: stage
    includeSelectors: true
