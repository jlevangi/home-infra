apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflare-ddns
  namespace: cloudflare-ddns
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ddns
              image: alpine:3.20
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: cloudflare-ddns-secrets
              command:
                - sh
                - -ec
                - |
                  set -eu

                  log() { printf '[%s] %s\n' "$(date -u +%FT%TZ)" "$*"; }

                  apk add --no-cache curl jq >/dev/null 2>&1

                  : "${CF_API_TOKEN:?CF_API_TOKEN is required}"
                  : "${ZONE_LEVANGIE_ORG:?ZONE_LEVANGIE_ORG is required}"
                  : "${RECORD_LEVANGIE_ORG:?RECORD_LEVANGIE_ORG is required}"
                  : "${LEVANGIE_ORG_RECORD_NAME:?LEVANGIE_ORG_RECORD_NAME is required}"

                  ZONE_ID="$ZONE_LEVANGIE_ORG"
                  RECORD_ID="$RECORD_LEVANGIE_ORG"
                  RECORD_NAME="$LEVANGIE_ORG_RECORD_NAME"

                  log "Checking external IP"
                  EXTERNAL_IP=$(curl -s -f -X GET https://checkip.amazonaws.com)
                  if [ -z "$EXTERNAL_IP" ]; then
                    log "ERROR: Could not determine external IP"
                    [ -n "${HC_PING_URL:-}" ] && curl -sf -m 5 "${HC_PING_URL}/fail" >/dev/null 2>&1 || true
                    exit 1
                  fi
                  log "External IP: $EXTERNAL_IP"

                  STATUS="skipped"

                  CURRENT_CF=$(curl -s -f -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
                    -H "Authorization: Bearer $CF_API_TOKEN" \
                    -H "Content-Type: application/json" | jq -r '.result.content // empty')

                  if [ -z "$CURRENT_CF" ]; then
                    log "WARNING: Could not fetch current record, skipping"
                    STATUS="failed"
                  elif [ "$CURRENT_CF" = "$EXTERNAL_IP" ]; then
                    log "$RECORD_NAME already set to $EXTERNAL_IP, no change needed"
                  else
                    log "Updating $RECORD_NAME from $CURRENT_CF to $EXTERNAL_IP"
                    RESPONSE=$(curl -s -f -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$RECORD_ID" \
                      -H "Authorization: Bearer $CF_API_TOKEN" \
                      -H "Content-Type: application/json" \
                      --data "$(jq -n --arg ip "$EXTERNAL_IP" --arg name "$RECORD_NAME" \
                        '{type: "A", name: $name, content: $ip, ttl: 1, proxied: false}')" 2>&1 || true)

                    SUCCESS=$(echo "$RESPONSE" | jq -r '.success // false')
                    if [ "$SUCCESS" = "true" ]; then
                      log "$RECORD_NAME updated successfully"
                      STATUS="updated"
                    else
                      ERROR_MSG=$(echo "$RESPONSE" | jq -r '.errors[0].message // "unknown error"')
                      log "ERROR: Failed to update $RECORD_NAME: $ERROR_MSG"
                      STATUS="failed"
                    fi
                  fi

                  SUMMARY="$RECORD_NAME status=$STATUS ip=$EXTERNAL_IP"
                  log "Done: $SUMMARY"
                  if [ -n "${HC_PING_URL:-}" ]; then
                    if [ "$STATUS" = "failed" ]; then
                      curl -sf -m 5 "${HC_PING_URL}/fail" -d "$SUMMARY" >/dev/null 2>&1 || true
                    else
                      curl -sf -m 5 "$HC_PING_URL" -d "$SUMMARY" >/dev/null 2>&1 || true
                    fi
                  fi

                  [ "$STATUS" = "failed" ] && exit 1 || exit 0
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: false
