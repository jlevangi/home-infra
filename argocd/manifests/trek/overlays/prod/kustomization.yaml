apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      environment: prod
patches:
  - target:
      kind: PersistentVolumeClaim
      name: trek-uploads
    patch: |
      - op: add
        path: /spec/volumeName
        value: pvc-ae8e155f-80ff-42cf-a1f5-4bd14c8ccbb5
      - op: replace
        path: /spec/storageClassName
        value: longhorn-flash
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
