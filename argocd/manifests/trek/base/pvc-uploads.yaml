apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trek-uploads
  namespace: trek
  labels:
    app: trek
    volume-type: uploads
    recurring-job.longhorn.io/source: "enabled"
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-tank
  resources:
    requests:
      storage: 10Gi
