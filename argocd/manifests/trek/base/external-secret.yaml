apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trek-secrets
  namespace: trek
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: trek-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/trek
