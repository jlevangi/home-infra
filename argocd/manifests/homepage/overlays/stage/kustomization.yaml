apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/gethomepage/homepage
    newTag: "v1.12.3"
patches:
  - target:
      kind: ConfigMap
      name: homepage-config
    patch: |
      - op: replace
        path: /data/HOMEPAGE_ALLOWED_HOSTS
        value: "homepage.stage.levangie.dev"
  - target:
      kind: Ingress
      name: homepage-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "homepage.stage.levangie.dev"
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-stage.levangie.dev"
labels:
  - pairs:
      environment: stage
    includeSelectors: true
