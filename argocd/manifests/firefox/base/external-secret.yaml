apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firefox-secrets
  namespace: firefox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: firefox-secrets
    creationPolicy: Owner
  # Reuses the same Surfshark OpenVPN credentials as yams.
  dataFrom:
    - extract:
        key: prod/yams
