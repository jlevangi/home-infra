apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firefox-ingress
  namespace: firefox
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: firefox.levangie.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: firefox
                port:
                  number: 3000
