apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: outline-redis-pvc
  namespace: outline
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app: outline
    component: redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-tank
