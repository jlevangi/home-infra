apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: tess1o/geopulse-backend
    newTag: "1.33.0-native"
  - name: tess1o/geopulse-ui
    newTag: "1.33.0"
  - name: postgis/postgis
    newTag: "17-3.5"
patches:
  - target:
      kind: Ingress
      name: geopulse-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
