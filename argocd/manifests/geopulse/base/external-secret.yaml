apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: geopulse-secrets
  namespace: geopulse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: geopulse-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/geopulse
