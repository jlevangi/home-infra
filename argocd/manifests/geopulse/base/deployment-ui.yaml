apiVersion: apps/v1
kind: Deployment
metadata:
  name: geopulse-ui
  namespace: geopulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geopulse-ui
  template:
    metadata:
      labels:
        app: geopulse-ui
    spec:
      containers:
        - name: ui
          image: tess1o/geopulse-ui:1.36.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: geopulse-config
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
