apiVersion: apps/v1
kind: Deployment
metadata:
  name: geopulse-postgres
  namespace: geopulse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: geopulse-postgres
  template:
    metadata:
      labels:
        app: geopulse-postgres
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        - name: prepare-data
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /mnt/db/pgdata && chown -R 999:999 /mnt/db/pgdata
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: postgres-data
              mountPath: /mnt/db
      containers:
        - name: postgres
          image: postgis/postgis:17-3.5
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - -c
            - timezone=UTC
            - -c
            - shared_buffers=$(GEOPULSE_POSTGRES_SHARED_BUFFERS)
            - -c
            - work_mem=$(GEOPULSE_POSTGRES_WORK_MEM)
            - -c
            - maintenance_work_mem=$(GEOPULSE_POSTGRES_MAINTENANCE_WORK_MEM)
            - -c
            - effective_cache_size=$(GEOPULSE_POSTGRES_EFFECTIVE_CACHE_SIZE)
            - -c
            - max_wal_size=$(GEOPULSE_POSTGRES_MAX_WAL_SIZE)
            - -c
            - checkpoint_completion_target=$(GEOPULSE_POSTGRES_CHECKPOINT_TARGET)
            - -c
            - wal_buffers=$(GEOPULSE_POSTGRES_WAL_BUFFERS)
            - -c
            - random_page_cost=$(GEOPULSE_POSTGRES_RANDOM_PAGE_COST)
            - -c
            - effective_io_concurrency=$(GEOPULSE_POSTGRES_IO_CONCURRENCY)
            - -c
            - autovacuum_naptime=$(GEOPULSE_POSTGRES_AUTOVACUUM_NAPTIME)
            - -c
            - autovacuum_vacuum_scale_factor=$(GEOPULSE_POSTGRES_VACUUM_SCALE_FACTOR)
            - -c
            - log_min_duration_statement=$(GEOPULSE_POSTGRES_LOG_SLOW_QUERIES)
            - -c
            - track_io_timing=on
          envFrom:
            - configMapRef:
                name: geopulse-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: geopulse-config
                  key: GEOPULSE_POSTGRES_USERNAME
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: geopulse-config
                  key: GEOPULSE_POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: geopulse-secrets
                  key: GEOPULSE_POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: geopulse-postgres-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
