apiVersion: apps/v1
kind: Deployment
metadata:
  name: geopulse-backend
  namespace: geopulse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: geopulse-backend
  template:
    metadata:
      labels:
        app: geopulse-backend
    spec:
      initContainers:
        - name: keygen
          image: alpine:3.20
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              set -e
              mkdir -p /app-data/keys /app-data/import-drop
              if [ ! -f /app-data/keys/jwt-private-key.pem ] || [ ! -f /app-data/keys/jwt-public-key.pem ]; then
                command -v openssl >/dev/null 2>&1 || apk add --no-cache openssl
                openssl genpkey -algorithm RSA -out /app-data/keys/jwt-private-key.pem
                openssl rsa -pubout -in /app-data/keys/jwt-private-key.pem -out /app-data/keys/jwt-public-key.pem
                chmod 644 /app-data/keys/jwt-private-key.pem /app-data/keys/jwt-public-key.pem
              fi
              if [ ! -f /app-data/keys/ai-encryption-key.txt ]; then
                command -v openssl >/dev/null 2>&1 || apk add --no-cache openssl
                openssl rand -base64 32 > /app-data/keys/ai-encryption-key.txt
                chmod 644 /app-data/keys/ai-encryption-key.txt
              fi
          volumeMounts:
            - name: app-data
              mountPath: /app-data
      containers:
        - name: backend
          image: tess1o/geopulse-backend:1.33.0-native
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: geopulse-config
            - secretRef:
                name: geopulse-secrets
          env:
            - name: GEOPULSE_POSTGRES_URL
              value: jdbc:postgresql://geopulse-postgres:5432/geopulse
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: app-data
              mountPath: /app/keys
              subPath: keys
            - name: app-data
              mountPath: /data/geopulse-import
              subPath: import-drop
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: geopulse-app-data-pvc
