apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: health-collector-secret
  namespace: health-archive
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: health-collector-secret
    creationPolicy: Owner
  data:
    - secretKey: collector-token
      remoteRef:
        key: prod/health-archive
        property: HEALTH_COLLECTOR_TOKEN
