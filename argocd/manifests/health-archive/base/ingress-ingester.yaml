apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: health-ingester
  namespace: health-archive
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: health-ingester.levangie.dev
      http:
        paths:
          - path: /api/v1/health-connect
            pathType: Prefix
            backend:
              service:
                name: health-ingester
                port:
                  number: 80