apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-postgres
  namespace: health-archive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-postgres
  template:
    metadata:
      labels:
        app: health-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: health_archive
            - name: POSTGRES_USER
              value: health_archive
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: health-postgres-secret
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - health_archive
                - -d
                - health_archive
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - health_archive
                - -d
                - health_archive
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: health-postgres-pvc
