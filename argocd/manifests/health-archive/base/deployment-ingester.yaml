apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-ingester
  namespace: health-archive
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-ingester
  template:
    metadata:
      labels:
        app: health-ingester
    spec:
      imagePullSecrets:
        - name: health-archive-ghcr
      containers:
        - name: ingester
          image: ghcr.io/jlevangi/home-infra-health-ingester:git-08e0ddaa22e72f6816b1b8cfb34516c25db627d0@sha256:5f9c9fcac208e393fa033f13b47ba5b785f2bcce98d089bae20088f384690f1a
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: health-postgres
            - name: PGDATABASE
              value: health_archive
            - name: PGUSER
              value: health_archive
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: health-postgres-secret
                  key: postgres-password
            - name: HEALTH_COLLECTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: health-collector-secret
                  key: collector-token
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # waitress spills large request bodies to a temp file; with a
            # read-only root filesystem it has nowhere to write and drops the
            # connection mid-upload. Uploads here are whole export files, so
            # this path is hit by ordinary traffic, not just edge cases.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
