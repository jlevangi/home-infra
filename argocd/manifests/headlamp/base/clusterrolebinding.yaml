apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: headlamp
  - kind: Group
    name: "admins"
    apiGroup: rbac.authorization.k8s.io
  - kind: User
    name: "pierce"
    apiGroup: rbac.authorization.k8s.io
