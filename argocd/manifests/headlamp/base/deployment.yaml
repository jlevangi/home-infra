apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app: headlamp
    app.kubernetes.io/name: headlamp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
        app.kubernetes.io/name: headlamp
    spec:
      serviceAccountName: headlamp
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.45.0
          imagePullPolicy: IfNotPresent
          args:
            - -in-cluster
            - -oidc-idp-issuer-url=https://auth.levangie.org/realms/master
            - -oidc-client-id=headlamp
            - -oidc-client-secret=$(HEADLAMP_OIDC_CLIENT_SECRET)
            - -oidc-scopes=openid,profile,email,groups
            - -oidc-callback-url=https://headlamp.levangie.dev/oidc-callback
          env:
            - name: HEADLAMP_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: headlamp-secrets
                  key: HEADLAMP_OIDC_CLIENT_SECRET
          ports:
            - name: http
              containerPort: 4466
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
