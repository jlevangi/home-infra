apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrolebinding.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - resource-quota.yaml
  - limit-range.yaml
  - external-secret.yaml

configMapGenerator:
  - name: headlamp-plugin-argocd
    namespace: headlamp
    files:
      - plugins/argocd/main.js
      - plugins/argocd/package.json
