apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-secrets
  namespace: headlamp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: headlamp-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/headlamp
