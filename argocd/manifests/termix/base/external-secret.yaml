apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: termix-secrets
  namespace: termix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: termix-secrets
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: prod/termix
        property: OIDC_CLIENT_SECRET
