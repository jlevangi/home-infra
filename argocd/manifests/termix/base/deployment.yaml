apiVersion: apps/v1
kind: Deployment
metadata:
  name: termix
  namespace: termix
  labels:
    app: termix
    app.kubernetes.io/name: termix
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: termix
  template:
    metadata:
      labels:
        app: termix
        app.kubernetes.io/name: termix
    spec:
      containers:
        - name: termix
          image: ghcr.io/lukegus/termix:2.6.1
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /app/data
            - name: ENABLE_GUACAMOLE
              value: "true"
            - name: GUACD_HOST
              value: localhost
            - name: GUACD_PORT
              value: "4822"
            - name: OIDC_CLIENT_ID
              value: termix
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: termix-secrets
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_ISSUER_URL
              value: https://auth.levangie.org/realms/master
            - name: OIDC_AUTHORIZATION_URL
              value: https://auth.levangie.org/realms/master/protocol/openid-connect/auth
            - name: OIDC_TOKEN_URL
              value: https://auth.levangie.org/realms/master/protocol/openid-connect/token
            - name: OIDC_USERINFO_URL
              value: https://auth.levangie.org/realms/master/protocol/openid-connect/userinfo
            - name: OIDC_IDENTIFIER_PATH
              value: sub
            - name: OIDC_NAME_PATH
              value: preferred_username
            - name: OIDC_SCOPES
              value: openid email profile groups
            - name: OIDC_GROUP_CLAIM
              value: groups
            - name: OIDC_ADMIN_GROUP
              value: termix-admins
            - name: OIDC_ALLOWED_USERS
              value: pierce@levangie.org
            - name: OIDC_ALLOW_REGISTRATION
              value: "true"
            - name: OIDC_FORCE_HTTPS
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: termix-data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 30001
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 30001
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
        - name: guacd
          image: guacamole/guacd:1.6.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: guacd
              containerPort: 4822
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: termix-data
          persistentVolumeClaim:
            claimName: termix-data-pvc
