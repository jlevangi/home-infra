apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: termix-ingress
  namespace: termix
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: termix.levangie.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: termix
                port:
                  number: 8080
