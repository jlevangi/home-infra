apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shelfmark-config-pvc
  labels:
    app.kubernetes.io/name: shelfmark
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-flash
  resources:
    requests:
      storage: 2Gi