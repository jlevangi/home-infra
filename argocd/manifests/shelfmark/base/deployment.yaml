apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfmark
  labels:
    app.kubernetes.io/name: shelfmark
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shelfmark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shelfmark
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1024
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: shelfmark
          image: ghcr.io/calibrain/shelfmark:1.4.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: shelfmark-credentials
          env:
            - name: AUTH_METHOD
              value: builtin
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /config
            - name: calibre-library
              mountPath: /calibre-library
              readOnly: true
            - name: cwa-book-ingest
              mountPath: /books
            - name: media
              mountPath: /downloads
              subPath: downloads/qbit
            - name: media
              mountPath: /nzb-downloads
              subPath: downloads
            - name: media
              mountPath: /audiobooks
              subPath: audiobooks
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          persistentVolumeClaim:
            claimName: shelfmark-config-pvc
        - name: calibre-library
          nfs:
            server: 172.20.20.5
            path: /volume1/media/calibre/library
        - name: cwa-book-ingest
          nfs:
            server: 172.20.20.5
            path: /volume1/media/calibre/ingest
        - name: media
          nfs:
            server: 172.20.20.5
            path: /volume1/media