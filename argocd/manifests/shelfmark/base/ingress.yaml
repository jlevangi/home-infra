apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shelfmark-ingress
  labels:
    app.kubernetes.io/name: shelfmark
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: shelfmark.levangie.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shelfmark
                port:
                  number: 80