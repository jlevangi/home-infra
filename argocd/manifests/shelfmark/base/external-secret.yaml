apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shelfmark-credentials
  labels:
    app.kubernetes.io/name: shelfmark
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: shelfmark-credentials
    creationPolicy: Owner
  data:
    - secretKey: SHELFMARK_API_KEY
      remoteRef:
        key: prod/shelfmark
        property: SHELFMARK_API_KEY
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: prod/shelfmark
        property: OIDC_CLIENT_SECRET