apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: car-telemetry-secrets
  namespace: car-telemetry
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: car-telemetry-secrets
    creationPolicy: Owner
  data:
    - secretKey: MQTT_HOST
      remoteRef:
        key: hermes/shared
        property: MQTT_HOST
    - secretKey: MQTT_PORT
      remoteRef:
        key: hermes/shared
        property: MQTT_PORT
    - secretKey: MQTT_USERNAME
      remoteRef:
        key: hermes/shared
        property: MQTT_USERNAME
    - secretKey: MQTT_PASSWORD
      remoteRef:
        key: hermes/shared
        property: MQTT_PASSWORD
    - secretKey: INGEST_TOKEN
      remoteRef:
        key: prod/car-telemetry
        property: INGEST_TOKEN
