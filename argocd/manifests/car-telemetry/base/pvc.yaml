apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: car-telemetry-data
  namespace: car-telemetry
  labels:
    app: car-telemetry
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-one-replica-flash
  resources:
    requests:
      storage: 5Gi
