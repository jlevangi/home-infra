apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-telemetry
  namespace: car-telemetry
  labels:
    app: car-telemetry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: car-telemetry
  template:
    metadata:
      labels:
        app: car-telemetry
    spec:
      imagePullSecrets:
        - name: car-telemetry-ghcr
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: car-telemetry
          image: ghcr.io/jlevangi/home-infra-car-telemetry:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CAR_TELEMETRY_DB
              value: /data/telemetry.db
            - name: CAR_TELEMETRY_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: car-telemetry-secrets
                  key: INGEST_TOKEN
          envFrom:
            - secretRef:
                name: car-telemetry-secrets
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: car-telemetry-data
