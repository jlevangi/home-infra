apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-notebook-secrets
  namespace: open-notebook
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: open-notebook-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/open-notebook
