apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: open-notebook-oauth2-forwardauth
  namespace: open-notebook
spec:
  forwardAuth:
    address: http://oauth2-proxy.open-notebook.svc.cluster.local:4180/
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - Authorization
