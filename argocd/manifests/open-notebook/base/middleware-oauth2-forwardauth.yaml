apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: open-notebook-oauth2-forwardauth
  namespace: open-notebook
spec:
  forwardAuth:
    address: https://notebook.levangie.dev/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - Authorization
