# Shared object-storage / signing material.
#
# Deliberately read straight out of `prod/everlyera` rather than duplicated into
# `prod/everlyera-media`. IMGPROXY_KEY/IMGPROXY_SALT and S3_ACCESS_KEY_ID/
# S3_SECRET_ACCESS_KEY are also consumed by the everlyera and everlyera-stage web
# pods, which sign /img/* URLs and upload to S3 with them. A duplicated copy that
# drifted by one byte would invalidate every signed URL already published, with no
# error anywhere until a browser got a 403. One source of truth removes that class
# of bug and keeps rotation a single write.
#
# Explicit `data:` entries rather than `dataFrom: extract` so that PAYLOAD_SECRET,
# DATABASE_URI, POSTGRES_PASSWORD and GHCR_DOCKER_CONFIG_JSON do not get copied
# into this namespace, which has no use for them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: everlyera-media-secrets
  namespace: everlyera-media
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-kv, kind: ClusterSecretStore }
  target: { name: everlyera-media-secrets, creationPolicy: Owner }
  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef: { key: prod/everlyera, property: MINIO_ROOT_USER }
    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef: { key: prod/everlyera, property: MINIO_ROOT_PASSWORD }
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef: { key: prod/everlyera, property: S3_ACCESS_KEY_ID }
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef: { key: prod/everlyera, property: S3_SECRET_ACCESS_KEY }
    - secretKey: IMGPROXY_KEY
      remoteRef: { key: prod/everlyera, property: IMGPROXY_KEY }
    - secretKey: IMGPROXY_SALT
      remoteRef: { key: prod/everlyera, property: IMGPROXY_SALT }
---
# FileBrowser-only credentials. New Vault path, nothing shared with the web app.
# Expected keys at kv/prod/everlyera-media:
#   FILEBROWSER_ADMIN_PASSWORD  - initial password for the `mariah` admin account
#   FILEBROWSER_JWT_TOKEN_SECRET - session signing key; pinning it keeps logins
#                                  alive across pod restarts
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: everlyera-filebrowser-secrets
  namespace: everlyera-media
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-kv, kind: ClusterSecretStore }
  target: { name: everlyera-filebrowser-secrets, creationPolicy: Owner }
  dataFrom:
    - extract: { key: prod/everlyera-media }
