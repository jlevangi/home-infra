apiVersion: v1
kind: ConfigMap
metadata:
  name: everlyera-filebrowser-config
  namespace: everlyera-media
data:
  # FileBrowser Quantum v1.5.0 config. This instance is Mariah's bulk-upload drop
  # for raw photography. It is NOT connected to Payload and shares nothing with the
  # homelab FileBrowser at cloud.levangie.dev: separate namespace, separate database,
  # separate storage, local password auth instead of Keycloak OIDC (Mariah has no
  # homelab identity).
  config.yaml: |
    server:
      port: 8080
      database: /home/filebrowser/data/database.db
      cacheDir: /cache
      externalUrl: https://files.everlyera.com
      sources:
        - path: /srv
          name: Everly Era
          config:
            defaultEnabled: true
            defaultUserScope: /
    auth:
      adminUsername: mariah
      methods:
        password:
          enabled: true
        oidc:
          enabled: false
