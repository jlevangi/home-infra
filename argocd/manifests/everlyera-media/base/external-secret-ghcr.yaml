apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: everlyera-media-ghcr
  namespace: everlyera-media
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-kv, kind: ClusterSecretStore }
  target:
    name: everlyera-media-ghcr
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef: { key: prod/everlyera, property: GHCR_DOCKER_CONFIG_JSON }
