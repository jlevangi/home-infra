apiVersion: apps/v1
kind: Deployment
metadata:
  name: everlyera-minio
  namespace: everlyera-media
  labels: { app: everlyera-minio, component: object-storage }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: everlyera-minio }
  template:
    metadata:
      labels: { app: everlyera-minio, component: object-storage }
    spec:
      imagePullSecrets:
        - name: everlyera-media-ghcr
      containers:
        - name: minio
          image: ghcr.io/jlevangi/home-infra-minio:RELEASE.2025-10-15T17-29-55Z@sha256:0983e92f97f1cbd338bbaffcb96fab24fe85b9d6dc9f3ff50e09ebc4f6821664
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - { name: s3, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          env:
            - { name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: everlyera-media-secrets, key: MINIO_ROOT_USER } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: everlyera-media-secrets, key: MINIO_ROOT_PASSWORD } } }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 2000m, memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: everlyera-minio-pvc }
