# HELD BACK ON PURPOSE — this file is inert where it sits.
#
# root-prod syncs the directory `argocd/apps/prod` only; nothing under
# `argocd/manifests/**` is scanned. Two prerequisites must clear before this
# becomes a live Application (see ./README.md):
#
#   1. `kv/prod/everlyera-media` must exist in Vault, or the
#      everlyera-filebrowser-secrets ExternalSecret fails and the FileBrowser pod
#      never starts.
#   2. `files.everlyera.com` must resolve publicly, or Traefik's letsencrypt
#      certresolver burns ACME validation attempts on a name it cannot prove.
#
# To activate:
#   git mv argocd/manifests/everlyera-media/argocd-application.yaml \
#          argocd/apps/prod/everlyera-media.yaml
#   git commit && git push
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: everlyera-media
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:jlevangi/home-infra.git
    targetRevision: main
    path: argocd/manifests/everlyera-media/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: everlyera-media
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
