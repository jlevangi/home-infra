apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/immich-power-tools/immich-power-tools
    newTag: "0.21.2"
patches:
  - target:
      kind: PersistentVolumeClaim
      name: immich-db-pvc
    patch: |
      - op: replace
        path: /spec/volumeName
        value: immich-db-pv
  - target:
      kind: Ingress
      name: immich-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
  - target:
      kind: Ingress
      name: immich-power-tools-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod