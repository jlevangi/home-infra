apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: swiparr-secrets
  namespace: swiparr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: swiparr-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/swiparr
