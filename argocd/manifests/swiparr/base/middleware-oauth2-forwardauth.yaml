apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: swiparr-oauth2-forwardauth
  namespace: swiparr
spec:
  forwardAuth:
    # Traefik cannot reliably resolve cluster-local DNS for ForwardAuth.
    # Keep this aligned with service-oauth2-proxy.yaml spec.clusterIP.
    address: http://10.43.242.231:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - Authorization
