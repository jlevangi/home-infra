apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallos
  namespace: wallos
  labels:
    app: wallos
    app.kubernetes.io/name: wallos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wallos
  template:
    metadata:
      labels:
        app: wallos
        app.kubernetes.io/name: wallos
    spec:
      initContainers:
        - name: init-data
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - mkdir -p /data/db /data/logos && chown -R 82:82 /data
          volumeMounts:
            - name: wallos-data
              mountPath: /data
      containers:
        - name: wallos
          image: bellamy/wallos:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: wallos-config
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: wallos-data
              mountPath: /var/www/html/db
              subPath: db
            - name: wallos-data
              mountPath: /var/www/html/images/uploads/logos
              subPath: logos
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: wallos-data
          persistentVolumeClaim:
            claimName: wallos-data-pvc
