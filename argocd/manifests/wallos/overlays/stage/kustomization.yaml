apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: bellamy/wallos
    newTag: "4.8.2"
patches:
  - target:
      kind: Ingress
      name: wallos-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "wallos.stage.levangie.dev"
  - target:
      kind: Job
      name: wallos-dns-record
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "wallos.stage"
      - op: replace
        path: /spec/template/spec/containers/0/env/4/value
        value: "k3s-stage.levangie.dev"
commonLabels:
  environment: stage
