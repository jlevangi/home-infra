apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: bellamy/wallos
    newTag: "4.8.2"
patches:
  - target:
      kind: Ingress
      name: wallos-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "wallos.stage.levangie.dev"
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-stage.levangie.dev"

commonLabels:
  environment: stage
