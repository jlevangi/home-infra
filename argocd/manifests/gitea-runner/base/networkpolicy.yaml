apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitea-runner-egress
  namespace: gitea-runner
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gitea
      podSelector:
        matchLabels:
          app: gitea
    ports:
    - protocol: TCP
      port: 3000
  - to:
    - ipBlock:
        cidr: 172.20.20.200/32
    ports:
    - protocol: TCP
      port: 443
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - protocol: TCP
      port: 8443
  - to:
    - ipBlock:
        cidr: 172.20.20.104/32
    - ipBlock:
        cidr: 172.20.20.106/32
    - ipBlock:
        cidr: 172.20.20.111/32
    ports:
    - protocol: TCP
      port: 6443
  - to:
    - ipBlock:
        cidr: 140.82.112.0/20
    - ipBlock:
        cidr: 185.199.108.0/22
    - ipBlock:
        cidr: 185.199.108.0/24
    - ipBlock:
        cidr: 185.199.109.0/24
    - ipBlock:
        cidr: 185.199.110.0/24
    - ipBlock:
        cidr: 185.199.111.0/24
    ports:
    - protocol: TCP
      port: 443
  - to:
    - podSelector:
        matchLabels:
          app: gitea-runner
    ports:
    - protocol: TCP
      port: 8088
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: gitea-runner
    ports:
    - protocol: TCP
      port: 8088
