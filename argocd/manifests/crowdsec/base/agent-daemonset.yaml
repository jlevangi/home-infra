apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: crowdsec-agent
  namespace: crowdsec
  labels:
    app: crowdsec-agent
    app.kubernetes.io/name: crowdsec-agent
spec:
  selector:
    matchLabels:
      app: crowdsec-agent
  template:
    metadata:
      labels:
        app: crowdsec-agent
    spec:
      serviceAccountName: crowdsec-agent
      initContainers:
        - name: init-hub
          image: crowdsecurity/crowdsec:latest
          imagePullPolicy: IfNotPresent
          command:
            - cscli
          args:
            - hub
            - update
          volumeMounts:
            - name: hub
              mountPath: /var/lib/crowdsec/data
            - name: config
              mountPath: /custom/crowdsec/config.yaml
              subPath: config.yaml
        - name: init-creds
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "url: http://crowdsec-lapi.crowdsec.svc.cluster.local:8080" > /etc/crowdsec/local_api_credentials.yaml
              echo "login: k3s-agent" >> /etc/crowdsec/local_api_credentials.yaml
              echo "password: auto-register" >> /etc/crowdsec/local_api_credentials.yaml
          volumeMounts:
            - name: creds
              mountPath: /etc/crowdsec
      containers:
        - name: crowdsec
          image: crowdsecurity/crowdsec:latest
          imagePullPolicy: IfNotPresent
          command:
            - crowdsec
          args:
            - -c
            - /custom/crowdsec/config.yaml
            - -type
            - agent
          env:
            - name: LOCAL_API_URL
              value: "http://crowdsec-lapi.crowdsec.svc.cluster.local:8080"
            - name: CUSTOM_HOSTNAME
              value: "k3s-agent"
          volumeMounts:
            - name: config
              mountPath: /custom/crowdsec/config.yaml
              subPath: config.yaml
            - name: data
              mountPath: /var/lib/crowdsec/data
            - name: creds
              mountPath: /etc/crowdsec
          livenessProbe:
            httpGet:
              path: /health
              port: 6060
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: config
          configMap:
            name: crowdsec-agent-config
        - name: data
          emptyDir: {}
        - name: creds
          emptyDir: {}
        - name: hub
          emptyDir: {}
