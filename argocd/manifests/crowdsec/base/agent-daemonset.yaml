apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: crowdsec-agent
  namespace: crowdsec
  labels:
    app: crowdsec-agent
    app.kubernetes.io/name: crowdsec-agent
spec:
  selector:
    matchLabels:
      app: crowdsec-agent
  template:
    metadata:
      labels:
        app: crowdsec-agent
    spec:
      serviceAccountName: crowdsec-agent
      initContainers:
        - name: init-config
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              cp /tmp/config/config.yaml /etc/crowdsec/config.yaml
              cp /tmp/config/acquis.yaml /etc/crowdsec/acquis.yaml
              chmod 644 /etc/crowdsec/config.yaml /etc/crowdsec/acquis.yaml
          volumeMounts:
            - name: configmap
              mountPath: /tmp/config
            - name: config
              mountPath: /etc/crowdsec
      containers:
        - name: crowdsec
          image: crowdsecurity/crowdsec:latest
          imagePullPolicy: IfNotPresent
          command:
            - crowdsec
          args:
            - -type
            - agent
          env:
            - name: CONFIG_PATH
              value: /etc/crowdsec/config.yaml
            - name: DATA_PATH
              value: /var/lib/crowdsec/data
            - name: COLLECTIONS
              value: crowdsecurity/traefik
            - name: LOCAL_API_URL
              value: "http://crowdsec-lapi.crowdsec.svc.cluster.local:8080"
            - name: CUSTOM_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/crowdsec
            - name: data
              mountPath: /var/lib/crowdsec/data
          livenessProbe:
            httpGet:
              path: /health
              port: 6060
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: configmap
          configMap:
            name: crowdsec-agent-config
        - name: config
          emptyDir: {}
        - name: data
          emptyDir: {}
