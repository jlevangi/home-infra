apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: crowdsec-agent
  namespace: crowdsec
  labels:
    app: crowdsec-agent
    app.kubernetes.io/name: crowdsec-agent
spec:
  selector:
    matchLabels:
      app: crowdsec-agent
  template:
    metadata:
      labels:
        app: crowdsec-agent
    spec:
      serviceAccountName: crowdsec-agent
      initContainers:
        - name: init-credentials
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              cat > /etc/crowdsec/local_api_credentials.yaml <<'EOF'
              url: http://crowdsec-lapi.crowdsec.svc.cluster.local:8080
              login: agent-auto
              password: agent-auto
              EOF
          volumeMounts:
            - name: config
              mountPath: /etc/crowdsec
      containers:
        - name: crowdsec
          image: crowdsecurity/crowdsec:latest
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - /etc/crowdsec/config.yaml
            - -type
            - agent
          env:
            - name: COLLECTIONS
              value: "crowdsecurity/traefik"
            - name: LOCAL_API_URL
              value: "http://crowdsec-lapi.crowdsec.svc.cluster.local:8080"
            - name: CUSTOM_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /etc/crowdsec
            - name: data
              mountPath: /var/lib/crowdsec/data
          livenessProbe:
            httpGet:
              path: /health
              port: 6060
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: config
          configMap:
            name: crowdsec-agent-config
        - name: data
          emptyDir: {}
