apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: crowdsec-agent
  namespace: crowdsec
  labels:
    app: crowdsec-agent
    app.kubernetes.io/name: crowdsec-agent
spec:
  selector:
    matchLabels:
      app: crowdsec-agent
  template:
    metadata:
      labels:
        app: crowdsec-agent
    spec:
      serviceAccountName: crowdsec-agent
      containers:
        - name: crowdsec
          image: crowdsecurity/crowdsec:latest
          imagePullPolicy: IfNotPresent
          command:
            - crowdsec
          args:
            - -c
            - /custom-config/config.yaml
            - -type
            - agent
          env:
            - name: LOCAL_API_URL
              value: "http://crowdsec-lapi.crowdsec.svc.cluster.local:8080"
            - name: CUSTOM_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: config
              mountPath: /custom-config/config.yaml
              subPath: config.yaml
            - name: data
              mountPath: /var/lib/crowdsec/data
          livenessProbe:
            httpGet:
              path: /health
              port: 6060
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: config
          configMap:
            name: crowdsec-agent-config
        - name: data
          emptyDir: {}
