apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-lapi
  namespace: crowdsec
  labels:
    app: crowdsec-lapi
    app.kubernetes.io/name: crowdsec-lapi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crowdsec-lapi
  template:
    metadata:
      labels:
        app: crowdsec-lapi
    spec:
      serviceAccountName: crowdsec-lapi
      initContainers:
        - name: init-config
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /etc/crowdsec
              cp /cfgdir/config.yaml /etc/crowdsec/config.yaml
              chmod 644 /etc/crowdsec/config.yaml
          volumeMounts:
            - name: cfgdir
              mountPath: /cfgdir
            - name: config
              mountPath: /etc/crowdsec
      containers:
        - name: crowdsec-lapi
          image: crowdsecurity/crowdsec:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: lapi
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/crowdsec
            - name: data
              mountPath: /var/lib/crowdsec/data
          livenessProbe:
            httpGet:
              path: /health
              port: lapi
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: lapi
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: cfgdir
          configMap:
            name: crowdsec-lapi-config
        - name: config
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: crowdsec-lapi-data
