apiVersion: v1
kind: Service
metadata:
  name: crowdsec-agent
  namespace: crowdsec
  labels:
    app: crowdsec-agent
    app.kubernetes.io/name: crowdsec-agent
spec:
  type: ClusterIP
  selector:
    app: crowdsec-agent
  ports:
    - name: metrics
      port: 6060
      targetPort: 6060
      protocol: TCP
