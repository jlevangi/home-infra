apiVersion: v1
kind: Service
metadata:
  name: crowdsec-lapi
  namespace: crowdsec
  labels:
    app: crowdsec-lapi
    app.kubernetes.io/name: crowdsec-lapi
spec:
  type: ClusterIP
  selector:
    app: crowdsec-lapi
  ports:
    - name: lapi
      port: 8080
      targetPort: 8080
      protocol: TCP
