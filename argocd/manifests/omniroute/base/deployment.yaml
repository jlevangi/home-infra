apiVersion: apps/v1
kind: Deployment
metadata:
  name: omniroute
  namespace: omniroute
  labels:
    app: omniroute
    app.kubernetes.io/name: omniroute
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: omniroute
  template:
    metadata:
      labels:
        app: omniroute
        app.kubernetes.io/name: omniroute
    spec:
      initContainers:
        - name: init-data
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - chown -R 1000:1000 /app/data
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: omniroute
          image: diegosouzapw/omniroute:3.8.50
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_DIR
              value: /app/data
            - name: PORT
              value: "20128"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: NODE_ENV
              value: production
            - name: OMNIROUTE_MEMORY_MB
              value: "2048"
            # Admission-control tuning: raise the structural heavy-in-flight cap
            # from the default 1 to 4 so 3-4 concurrent chat completions don't
            # all hit the same shed gate; widen the healthy-heap fast path and
            # the bounded wait so bursts serialize instead of immediately 503-ing;
            # and tighten the heap-pressure gate to match the higher cap.
            - name: OMNIROUTE_CHAT_MAX_HEAVY_IN_FLIGHT
              value: "4"
            - name: OMNIROUTE_CHAT_ADMISSION_HEALTHY_HEADROOM
              value: "4"
            - name: OMNIROUTE_CHAT_ADMISSION_QUEUE_MS
              value: "5000"
            - name: OMNIROUTE_CHAT_ADMISSION_HEAP_SHED_RATIO
              value: "0.9"
            - name: NEXT_PUBLIC_BASE_URL
              value: https://omniroute.levangie.dev
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: omniroute-secrets
                  key: JWT_SECRET
            - name: OMNIROUTE_WS_BRIDGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: omniroute-secrets
                  key: OMNIROUTE_WS_BRIDGE_SECRET
            - name: INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omniroute-secrets
                  key: INITIAL_PASSWORD
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: omniroute-secrets
                  key: OIDC_CLIENT_SECRET
          ports:
            - name: http
              containerPort: 20128
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 3072Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: omniroute-data-pvc
