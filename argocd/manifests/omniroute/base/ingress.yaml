apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omniroute-ingress
  namespace: omniroute
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  rules:
    - host: omniroute.levangie.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omniroute
                port:
                  number: 20128
  tls:
    - hosts:
        - omniroute.levangie.dev
      secretName: omniroute-tls
