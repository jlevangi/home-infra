apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: omniroute-secrets
  namespace: omniroute
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: omniroute-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/omniroute
