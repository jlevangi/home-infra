apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omniroute-data-pvc
  namespace: omniroute
  labels:
    app: omniroute
    app.kubernetes.io/name: omniroute
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn
