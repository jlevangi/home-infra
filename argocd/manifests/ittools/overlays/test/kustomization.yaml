apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Ingress
      name: ittools-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "ittools.test.levangie.dev"
  - target:
      kind: Job
      name: ittools-dns-record
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "ittools.test"
      - op: replace
        path: /spec/template/spec/containers/0/env/4/value
        value: "k3s-test.levangie.dev"
      - op: replace
        path: /spec/template/spec/containers/0/env/5/value
        value: "300"
commonLabels:
  environment: test
