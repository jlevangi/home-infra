apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: corentinth/it-tools
    newTag: "2024.10.22-7ca5933"
patches:
  - target:
      kind: Ingress
      name: ittools-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "ittools.stage.levangie.dev"
  - target:
      kind: Job
      name: ittools-dns-record
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "ittools.stage"
      - op: replace
        path: /spec/template/spec/containers/0/env/4/value
        value: "k3s-stage.levangie.dev"
commonLabels:
  environment: stage
