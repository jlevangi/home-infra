apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/firecrawl/firecrawl
    newTag: "2.10.19"
  - name: ghcr.io/firecrawl/playwright-service
    digest: sha256:df1a393ce8bfc3801570a826a9b0dcc400ae48789adb4a0ad9d6cbf0229b059b
  - name: redis
    newTag: alpine
  - name: postgres
    newTag: "16"
patches:
  - target:
      kind: Ingress
      name: firecrawl-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true