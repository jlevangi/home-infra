apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/firecrawl/firecrawl
    newTag: "2.10.19"
  - name: ghcr.io/firecrawl/playwright-service
    digest: sha256:0f462e0915631c77f9eb8117bbfa75dcce48ac999a6358ba97a262869ae9ace9
  - name: redis
    newTag: alpine
  - name: postgres
    newTag: "16"
patches:
  - target:
      kind: Ingress
      name: firecrawl-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true