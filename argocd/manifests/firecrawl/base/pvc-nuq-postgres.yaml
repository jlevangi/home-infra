apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nuq-postgres-pvc-v3
  namespace: firecrawl
  labels:
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
    app: nuq-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
  volumeMode: Filesystem
