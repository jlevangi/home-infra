apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: snippetbox-data-pvc
  namespace: snippetbox
  labels:
    app: snippetbox
    recurringjob.group.longhorn.io/hourly: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
  storageClassName: longhorn
