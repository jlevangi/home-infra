apiVersion: v1
kind: Service
metadata:
  name: karakeep
  namespace: karakeep
spec:
  selector:
    app: karakeep
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep-meilisearch
  namespace: karakeep
spec:
  selector:
    app: karakeep-meilisearch
  ports:
    - name: http
      port: 7700
      targetPort: 7700
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep-chrome
  namespace: karakeep
spec:
  selector:
    app: karakeep-chrome
  ports:
    - name: debug
      port: 9222
      targetPort: 9222
