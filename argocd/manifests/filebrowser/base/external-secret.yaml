apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: filebrowser-secrets
  namespace: filebrowser
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: filebrowser-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/filebrowser
