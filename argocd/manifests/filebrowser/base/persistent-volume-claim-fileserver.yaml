apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filebrowser-fileserver
  namespace: filebrowser
  labels:
    app.kubernetes.io/name: filebrowser
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
  storageClassName: filebrowser-nfs
  volumeName: filebrowser-fileserver
