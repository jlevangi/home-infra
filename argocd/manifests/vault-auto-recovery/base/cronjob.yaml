apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-auto-recovery
  namespace: vault-raft
  labels:
    app.kubernetes.io/name: vault-auto-recovery
    app.kubernetes.io/component: maintenance
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: vault-auto-recovery
        app.kubernetes.io/component: maintenance
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-auto-recovery
            app.kubernetes.io/component: maintenance
        spec:
          serviceAccountName: vault-auto-recovery
          restartPolicy: Never
          containers:
            - name: recover
              image: bitnami/kubectl:1.32.4
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - /scripts/recover.sh
              env:
                - name: VAULT_NAMESPACE
                  value: vault-raft
                - name: VAULT_ACTIVE_ADDR
                  value: http://vault-raft-active.vault-raft.svc:8200
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: vault-auto-recovery
                defaultMode: 0555
