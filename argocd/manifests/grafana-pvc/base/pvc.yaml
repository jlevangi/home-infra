---
# See sibling jellyfin/base/pvc.yaml header. Desired SC: longhorn-redundant.
# Currently: longhorn + live patch:
#
#   kubectl patch volume.longhorn.io kube-prometheus-stack-grafana \
#     -n longhorn-system --type=merge \
#     -p '{"spec":{"numberOfReplicas":3,"nodeSelector":["general-storage"]}}'
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kube-prometheus-stack-grafana
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
