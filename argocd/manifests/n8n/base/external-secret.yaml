apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-secrets
  namespace: n8n
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: n8n-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: prod/n8n
        property: POSTGRES_PASSWORD
    - secretKey: N8N_ENCRYPTION_KEY
      remoteRef:
        key: prod/n8n
        property: N8N_ENCRYPTION_KEY
    - secretKey: PAPERLESS_API_TOKEN
      remoteRef:
        key: prod/paperless
        property: API_TOKEN
