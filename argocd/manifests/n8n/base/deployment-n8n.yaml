apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
    app.kubernetes.io/name: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
        app.kubernetes.io/name: n8n
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres..."
              until nc -z n8n-postgres 5432; do sleep 5; done
              echo "Postgres ready."
      containers:
        - name: n8n
          image: n8nio/n8n:2.34.4
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: n8n-config
          env:
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: POSTGRES_PASSWORD
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: N8N_ENCRYPTION_KEY
            - name: PAPERLESS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: PAPERLESS_API_TOKEN
            - name: KEYCLOAK_INVITE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: KEYCLOAK_INVITE_CLIENT_ID
            - name: KEYCLOAK_INVITE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: KEYCLOAK_INVITE_CLIENT_SECRET
            - name: KEYCLOAK_INVITE_GROUP_ID
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: KEYCLOAK_INVITE_GROUP_ID
            - name: WIZARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: WIZARR_API_KEY
            - name: N8N_API_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: N8N_API_KEY
          ports:
            - name: http
              containerPort: 5678
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data-pvc
