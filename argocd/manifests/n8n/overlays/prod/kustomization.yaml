apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: n8nio/n8n
    newTag: "2.34.4"
  - name: postgres
    newTag: "16.14"
patches:
  - target:
      kind: PersistentVolumeClaim
      name: n8n-postgres-pvc
    patch: |
      - op: add
        path: /spec/volumeName
        value: pvc-9594b81f-65a2-4563-98c4-42fea26e698e
      - op: replace
        path: /spec/storageClassName
        value: longhorn-flash
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
  - target:
      kind: Ingress
      name: n8n-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
