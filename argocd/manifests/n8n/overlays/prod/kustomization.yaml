apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: n8nio/n8n
    newTag: "2.32.2"
  - name: postgres
    newTag: "16.14"
patches:
  - target:
      kind: Ingress
      name: n8n-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
