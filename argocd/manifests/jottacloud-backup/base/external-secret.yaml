apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jottacloud-backup-config
  namespace: jottacloud-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: jottacloud-backup-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        rclone.conf: "{{ .rclone_config }}"
        healthchecks_url: "{{ .healthchecks_url }}"
  data:
    - secretKey: rclone_config
      remoteRef:
        key: prod/jottacloud-backup
        property: rclone_config
    - secretKey: healthchecks_url
      remoteRef:
        key: prod/jottacloud-backup
        property: healthchecks_url
