apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jottacloud-backup-state
  namespace: jottacloud-backup
  labels:
    app.kubernetes.io/name: jottacloud-backup
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-redundant
  resources:
    requests:
      storage: 100Mi
