apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jottacloud-backup-state
  namespace: jottacloud-backup
  labels:
    app.kubernetes.io/name: jottacloud-backup
    # Scratch state only; no Longhorn backups. Source=PVC so the SC's daily/weekly selector is not synced.
    recurring-job.longhorn.io/source: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-redundant
  resources:
    requests:
      storage: 100Mi
