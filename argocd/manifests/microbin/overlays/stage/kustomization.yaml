apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: danielszabo99/microbin
    newTag: "2.1.4"
patches:
  # Patch ConfigMap public path for stage environment
  - target:
      kind: ConfigMap
      name: microbin-config
    patch: |
      - op: replace
        path: /data/MICROBIN_PUBLIC_PATH
        value: "https://bin.stage.levangie.dev"
  # Patch Ingress host for stage environment
  - target:
      kind: Ingress
      name: microbin-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "bin.stage.levangie.dev"
  # Patch ExternalSecret vault path for stage environment
  - target:
      kind: ExternalSecret
      name: microbin-secrets
    patch: |
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: "stage/microbin"
commonLabels:
  environment: stage
