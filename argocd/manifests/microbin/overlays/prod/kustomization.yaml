apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: danielszabo99/microbin
    newTag: "2.1.4"
# Prod uses base values (bin.levangie.dev) - no patches needed
patches:
  - target:
      kind: PersistentVolumeClaim
      name: microbin-data-pvc
    patch: |
      - op: replace
        path: /spec/volumeName
        value: microbin-data-pv
  - target:
      kind: Ingress
      name: microbin-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
