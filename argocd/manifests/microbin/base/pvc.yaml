apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: microbin-data-pvc
  namespace: microbin
  labels:
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
    app: microbin
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
