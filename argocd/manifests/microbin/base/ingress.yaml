apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microbin-ingress
  namespace: microbin
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: bin.levangie.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: microbin
                port:
                  number: 8080
