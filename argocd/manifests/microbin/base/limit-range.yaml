apiVersion: v1
kind: LimitRange
metadata:
  name: microbin-storage-limits
  namespace: microbin
spec:
  limits:
    - type: PersistentVolumeClaim
      max:
        storage: "10Gi"
      min:
        storage: "100Mi"
      default:
        storage: "5Gi"
      defaultRequest:
        storage: "5Gi"
