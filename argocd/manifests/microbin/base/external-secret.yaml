apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: microbin-secrets
  namespace: microbin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: microbin-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/microbin
