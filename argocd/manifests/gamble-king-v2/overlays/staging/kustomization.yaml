apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gamble-king-v2-staging
resources:
- ../../base
- configmap-gk-gotrue-config.yaml
- configmap-gk-postgrest-config.yaml
- external-secret-gamble-king-v2-ghcr.yaml
- external-secret-gamble-king-v2-secrets.yaml
- ingress-gamble-king-v2.yaml
- ingress-gk-studio-oauth2.yaml
- ingress-gk-studio.yaml
patches:
- path: patch-web-app-env.yaml
- target:
    kind: PersistentVolumeClaim
    name: gk-postgres-pvc
  patch: |
    - op: add
      path: /spec/volumeName
      value: pvc-4e28daa2-f7ff-4073-8914-bc37bde5919e
    - op: replace
      path: /spec/storageClassName
      value: longhorn-flash
    - op: replace
      path: /spec/resources/requests/storage
      value: 1Gi
