apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: gamble-king-v2-staging-gk-strip-auth-prefix@kubernetescrd,
      gamble-king-v2-staging-gk-strip-rest-prefix@kubernetescrd,
      gamble-king-v2-staging-gk-strip-functions-prefix@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
  labels:
    environment: staging
  name: gamble-king-v2
spec:
  ingressClassName: traefik
  rules:
  - host: staging.gambleking.app
    http:
      paths:
      - backend:
          service:
            name: gamble-king-v2-web
            port:
              name: http
        path: /
        pathType: Prefix
      - backend:
          service:
            name: gk-gotrue
            port:
              name: http
        path: /auth/v1
        pathType: Prefix
      - backend:
          service:
            name: gk-postgrest
            port:
              name: http
        path: /rest/v1
        pathType: Prefix
      - backend:
          service:
            name: gk-functions
            port:
              name: http
        path: /functions/v1
        pathType: Prefix
  - host: gambleking-staging.levangie.dev
    http:
      paths:
      - backend:
          service:
            name: gamble-king-v2-web
            port:
              name: http
        path: /
        pathType: Prefix
      - backend:
          service:
            name: gk-gotrue
            port:
              name: http
        path: /auth/v1
        pathType: Prefix
      - backend:
          service:
            name: gk-postgrest
            port:
              name: http
        path: /rest/v1
        pathType: Prefix
      - backend:
          service:
            name: gk-functions
            port:
              name: http
        path: /functions/v1
        pathType: Prefix
  tls:
  - hosts:
    - staging.gambleking.app
    - gambleking-staging.levangie.dev
