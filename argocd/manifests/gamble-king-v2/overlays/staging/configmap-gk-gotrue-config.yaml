apiVersion: v1
data:
  API_EXTERNAL_URL: https://staging.gambleking.app/auth/v1
  GOTRUE_API_HOST: 0.0.0.0
  GOTRUE_API_PORT: '9999'
  GOTRUE_DB_DRIVER: postgres
  GOTRUE_DISABLE_SIGNUP: 'false'
  GOTRUE_JWT_AUD: authenticated
  GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
  GOTRUE_JWT_EXP: '3600'
  GOTRUE_MAILER_AUTOCONFIRM: 'true'
  GOTRUE_SITE_URL: https://staging.gambleking.app
  GOTRUE_URI_ALLOW_LIST: https://staging.gambleking.app/**,https://gambleking-staging.levangie.dev/**
kind: ConfigMap
metadata:
  labels:
    environment: staging
  name: gk-gotrue-config
