apiVersion: v1
kind: ConfigMap
metadata:
  name: gk-gotrue-config
  namespace: gamble-king-v2-dev
data:
  API_EXTERNAL_URL: "https://gambleking-dev.levangie.dev/auth/v1"
  GOTRUE_API_HOST: "0.0.0.0"
  GOTRUE_API_PORT: "9999"
  GOTRUE_DB_DRIVER: "postgres"
  GOTRUE_SITE_URL: "https://gambleking-dev.levangie.dev"
  GOTRUE_URI_ALLOW_LIST: "https://gambleking-dev.levangie.dev/**"
  GOTRUE_DISABLE_SIGNUP: "false"
  GOTRUE_JWT_EXP: "3600"
  GOTRUE_JWT_AUD: "authenticated"
  GOTRUE_JWT_DEFAULT_GROUP_NAME: "authenticated"
  # Matches supabase/config.toml's local dev setting (docs/05-dev-environment.md)
  # -- this is a greenfield sandbox namespace, not exposed publicly, so
  # skipping email confirmation avoids needing an SMTP provider to stand
  # this up. Revisit before any production consideration.
  GOTRUE_MAILER_AUTOCONFIRM: "true"
