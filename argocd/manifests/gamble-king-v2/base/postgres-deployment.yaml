apiVersion: apps/v1
kind: Deployment
metadata:
  name: gk-postgres
  namespace: gamble-king-v2-dev
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gk-postgres
  template:
    metadata:
      labels:
        app: gk-postgres
    spec:
      securityContext:
        fsGroup: 106
      initContainers:
        - name: prepare-data
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - chown -R 105:106 /mnt/db && chmod 700 /mnt/db
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: db-data
              mountPath: /mnt/db
      containers:
        # supabase/postgres bundles the auth/storage/realtime schemas,
        # default roles (anon, authenticated, service_role, ...), and
        # extensions the platform expects out of the box -- vanilla
        # postgres does not. App-specific schema (supabase/migrations/ in
        # the gamble-king repo) is applied separately (e.g. `supabase db
        # push` against this instance) rather than baked into this image,
        # since that repo's migration files aren't available to this
        # GitOps repo's kustomize build (docs/05-dev-environment.md).
        - name: postgres
          image: supabase/postgres:15.6.1.146
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 105
            runAsGroup: 106
          env:
            - name: POSTGRES_DB
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gamble-king-v2-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gamble-king-v2-secrets
                  key: JWT_SECRET
            - name: PGDATA
              value: "/var/lib/postgresql/data"
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: gk-postgres-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
