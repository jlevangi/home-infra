apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    environment: dev
  name: gamble-king-v2-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gamble-king-v2-web
      environment: dev
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gamble-king-v2-web
        environment: dev
    spec:
      containers:
      - env:
        - name: PUBLIC_SUPABASE_URL
          value: https://dev.gambleking.app
        - name: PUBLIC_SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              key: ANON_KEY
              name: gamble-king-v2-secrets
        image: ghcr.io/jlevangi/gamble-king:app-9e535b4acff0bea2c622ce37027a78ff4bf51e24@sha256:6a5ccc5bd857a0c7d87fc5ddfba776618b155b059b902af2b8f2c8ea2f156cd2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        name: web
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
      imagePullSecrets:
      - name: gamble-king-v2-ghcr
