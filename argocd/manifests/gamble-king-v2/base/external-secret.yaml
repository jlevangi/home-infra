apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gamble-king-v2-secrets
  namespace: gamble-king-v2-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: gamble-king-v2-secrets
    creationPolicy: Owner
  # Placeholder keys only -- Vault path kv/dev/gamble-king-v2 must be
  # populated out of band by Pierce before first sync (docs/05-dev-environment.md).
  # This PR does not write to Vault. Required keys, consumed across
  # postgres/gotrue/postgrest-deployment.yaml:
  #   POSTGRES_PASSWORD        -- gk-postgres's superuser password
  #   JWT_SECRET               -- shared by GoTrue (signs) and PostgREST (verifies)
  #   GOTRUE_DB_DATABASE_URL   -- postgres://supabase_auth_admin:<POSTGRES_PASSWORD>@gk-postgres:5432/postgres
  #   PGRST_DB_URI             -- postgres://authenticator:<POSTGRES_PASSWORD>@gk-postgres:5432/postgres
  dataFrom:
    - extract:
        key: dev/gamble-king-v2
