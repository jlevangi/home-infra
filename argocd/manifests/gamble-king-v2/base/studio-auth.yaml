apiVersion: apps/v1
kind: Deployment
metadata:
  name: gk-studio-oauth2-proxy
  namespace: gamble-king-v2-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gk-studio-oauth2-proxy
  template:
    metadata:
      labels:
        app: gk-studio-oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.2
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://auth.levangie.org/realms/master
            - --redirect-url=https://supabase-gambleking-dev.levangie.dev/oauth2/callback
            - --http-address=0.0.0.0:4180
            - --upstream=static://202
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-domain=supabase-gambleking-dev.levangie.dev
            - --whitelist-domain=supabase-gambleking-dev.levangie.dev
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              value: gamble-king-v2-studio
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gamble-king-v2-secrets
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: gamble-king-v2-secrets
                  key: OAUTH2_PROXY_COOKIE_SECRET
          ports:
            - name: http
              containerPort: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gk-studio-oauth2-proxy
  namespace: gamble-king-v2-dev
spec:
  clusterIP: 10.43.182.249
  selector:
    app: gk-studio-oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gk-studio-forwardauth
  namespace: gamble-king-v2-dev
spec:
  forwardAuth:
    address: http://10.43.182.249:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: gk-studio-errors
  namespace: gamble-king-v2-dev
spec:
  errors:
    status:
      - "401-403"
    service:
      name: gk-studio-oauth2-proxy
      port: 4180
    query: /oauth2/sign_in?rd={url}
    statusRewrites:
      "401": 302
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gk-studio
  namespace: gamble-king-v2-dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: >-
      gamble-king-v2-dev-gk-studio-errors@kubernetescrd,
      gamble-king-v2-dev-gk-studio-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [supabase-gambleking-dev.levangie.dev]
  rules:
    - host: supabase-gambleking-dev.levangie.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gk-studio
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gk-studio-oauth2
  namespace: gamble-king-v2-dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [supabase-gambleking-dev.levangie.dev]
  rules:
    - host: supabase-gambleking-dev.levangie.dev
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: gk-studio-oauth2-proxy
                port:
                  name: http
