apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: '1'
  labels:
    environment: dev
  name: gk-studio-oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gk-studio-oauth2-proxy
      environment: dev
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: gk-studio-oauth2-proxy
        environment: dev
    spec:
      containers:
      - args:
        - --provider=keycloak-oidc
        - --oidc-issuer-url=https://auth.levangie.org/realms/master
        - --redirect-url=https://supabase-gambleking-dev.levangie.dev/oauth2/callback
        - --http-address=0.0.0.0:4180
        - --upstream=static://202
        - --email-domain=*
        - --cookie-secure=true
        - --cookie-samesite=lax
        - --cookie-domain=supabase-gambleking-dev.levangie.dev
        - --whitelist-domain=supabase-gambleking-dev.levangie.dev
        - --reverse-proxy=true
        - --set-xauthrequest=true
        - --skip-provider-button=true
        env:
        - name: OAUTH2_PROXY_CLIENT_ID
          value: gamble-king-v2-studio
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: OAUTH2_PROXY_CLIENT_SECRET
              name: gamble-king-v2-secrets
        - name: OAUTH2_PROXY_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              key: OAUTH2_PROXY_COOKIE_SECRET
              name: gamble-king-v2-secrets
        image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.2
        imagePullPolicy: IfNotPresent
        name: oauth2-proxy
        ports:
        - containerPort: 4180
          name: http
        readinessProbe:
          httpGet:
            path: /ping
            port: http
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
