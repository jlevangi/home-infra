apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflare-exposure
  namespace: cloudflare-exposure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudflare-exposure-ingress-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudflare-exposure-ingress-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudflare-exposure-ingress-reader
subjects:
  - kind: ServiceAccount
    name: cloudflare-exposure
    namespace: cloudflare-exposure
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflare-exposure-reconcile
  namespace: cloudflare-exposure
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: cloudflare-exposure
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: hashicorp/terraform:1.15.7@sha256:40e61a86763083ea987ded0ffa15f6d75e0df48ed16275811f949b3ecbcd8aae
              command: ["/bin/sh", "-euc"]
              args:
                - |
                  cd /tmp
                  git clone --quiet --depth 1 https://github.com/jlevangi/home-infra.git repo
                  cd repo/terraform/stacks/cloudflare/tunnel
                  # R2 S3 credentials derive from the Cloudflare token: key = token ID, secret = SHA-256(token).
                  AWS_ACCESS_KEY_ID="$(wget -qO- --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | sed -n 's/.*"id":"\([0-9a-f]\{32\}\)".*/\1/p')"
                  test -n "$AWS_ACCESS_KEY_ID"
                  AWS_SECRET_ACCESS_KEY="$(printf %s "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)"
                  export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TF_VAR_cloudflare_api_token="$CLOUDFLARE_API_TOKEN"
                  terraform init -input=false
                  # Refuse to run against an empty backend: that would recreate already-managed resources.
                  terraform state list | grep -qx cloudflare_zero_trust_tunnel_cloudflared_config.maurice_config
                  terraform apply -input=false -auto-approve
              envFrom:
                - secretRef:
                    name: cloudflare-exposure-secrets
              env:
                - name: HOME
                  value: /tmp
                - name: TF_IN_AUTOMATION
                  value: "true"
                - name: TF_CLI_ARGS
                  value: "-no-color"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
