apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-exposure-secrets
  namespace: cloudflare-exposure
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: cloudflare-exposure-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: prod/cloudflare-external-dns
        property: CLOUDFLARE_API_TOKEN
