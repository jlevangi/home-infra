apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: plex
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      containers:
        - name: plex
          image: lscr.io/linuxserver/plex:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 32400
              protocol: TCP
              name: http
          env:
            - name: PUID
              value: "911"
            - name: PGID
              value: "911"
            - name: TZ
              value: "America/New_York"
            - name: VERSION
              value: "docker"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 6000m
              # Headroom for the 8Gi tmpfs transcode volume which counts against pod memory.
              memory: 14Gi
          livenessProbe:
            httpGet:
              path: /identity
              port: 32400
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /identity
              port: 32400
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
            - name: transcode
              mountPath: /transcode
            - name: media
              mountPath: /tv
              subPath: tv
              readOnly: true
            - name: media
              mountPath: /movies
              subPath: movies
              readOnly: true
            - name: media
              mountPath: /anime
              subPath: anime
              readOnly: true
            - name: media
              mountPath: /music
              subPath: music
              readOnly: true
            - name: media
              mountPath: /kids
              subPath: kids
              readOnly: true
            - name: media
              mountPath: /private
              subPath: private_library
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: plex-config-pvc-rdn
        # tmpfs for transcode segments — keeps short-lived streaming writes off Longhorn.
        # Set Settings → Transcoder → "Transcoder temporary directory" to /transcode after first deploy.
        - name: transcode
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        - name: media
          nfs:
            server: 172.20.20.5
            path: /volume1/media
