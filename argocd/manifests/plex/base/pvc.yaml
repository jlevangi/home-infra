# See sibling jellyfin/base/pvc.yaml header for the full story.
# Desired SC: longhorn-redundant. Currently: longhorn-media + live patch:
#
#   kubectl patch volume.longhorn.io plex-config -n longhorn-system \
#     --type=merge \
#     -p '{"spec":{"numberOfReplicas":3,"nodeSelector":["general-storage"]}}'
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config-pvc
  namespace: plex
  labels:
    app: plex
    volume-type: config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: longhorn-media
