---
# Plex stores its library SQLite db on this PVC. Uses longhorn-redundant
# (3 replicas, singleton-focused placement policy) because Plex is single-pod / single-db;
# a volume going faulted (vs degraded) crashes the pod. Migrated from the
# old longhorn-media SC on 2026-05-21 — see
# argocd/manifests/longhorn-storage-classes/README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config-pvc-rdn
  namespace: plex
  labels:
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
    app: plex
    volume-type: config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: longhorn-redundant
