apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Ingress
      name: plex-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "plex.test.levangie.dev"
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-test.levangie.dev"
labels:
  - pairs:
      environment: test
    includeSelectors: true
