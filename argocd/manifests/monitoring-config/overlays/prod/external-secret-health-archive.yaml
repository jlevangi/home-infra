apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: health-archive-db-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: health-archive-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: prod/health-archive
        property: POSTGRES_PASSWORD
