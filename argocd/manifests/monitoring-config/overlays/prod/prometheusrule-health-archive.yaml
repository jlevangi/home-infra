apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: health-archive
  namespace: monitoring
spec:
  groups:
    - name: health-archive.freshness
      rules:
        # Thresholds are set per metric because collection cadence differs:
        # steps/heart rate stream continuously, sleep lands once a night.
        # These exist because heart rate silently stopped for two days and the
        # only signal was an empty Grafana panel.
        - alert: HealthArchiveStepsStale
          expr: time() - health_archive_last_observation_timestamp_seconds{source_system="health_connect_direct", metric_type="steps"} > 86400
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: No new step data for over 24h
            description: >-
              The authenticated Health Connect collector has received no 'steps' rows for more than 24 hours.

        - alert: HealthArchiveHeartRateStale
          expr: time() - health_archive_last_observation_timestamp_seconds{source_system="health_connect_direct", metric_type="heart_rate"} > 86400
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: No new heart rate data for over 24h
            description: >-
              The authenticated Health Connect collector has received no 'heart_rate' rows for more than 24 hours.

        - alert: HealthArchiveSleepStale
          expr: time() - health_archive_last_observation_timestamp_seconds{source_system="health_connect_direct", metric_type="sleep_segment"} > 172800
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: No new sleep data for over 48h
            description: >-
              The authenticated Health Connect collector has received no completed 'sleep_segment' rows for more than 48 hours.
              Two missed nights indicates a collector or upstream Health Connect issue.

        - alert: HealthIngesterDown
          expr: sum(up{namespace="health-archive", service="health-ingester"}) < 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Health ingester is not being scraped
            description: >-
              Prometheus cannot scrape the health-ingester service, so ingestion
              may have stopped and freshness alerts above will not fire.

        - alert: HealthCollectorAuthenticationFailures
          expr: increase(health_collector_auth_failures_total[15m]) > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Health collector authentication failures
            description: More than five Health Connect collector authentication failures occurred in the last 15 minutes.

        - alert: HealthConnectSyncStale
          expr: sum(increase(health_collector_records_total{outcome=~"accepted|duplicate"}[24h])) < 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: No Health Connect sync activity for 24 hours
            description: >-
              The Health Connect collector has processed no accepted or duplicate
              records of any type in the last 24 hours. The expected sync cadence is
              at least once every 12 hours.
