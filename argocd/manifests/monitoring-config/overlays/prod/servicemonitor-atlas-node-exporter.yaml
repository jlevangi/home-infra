apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: atlas-node-exporter
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-node-exporter
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
