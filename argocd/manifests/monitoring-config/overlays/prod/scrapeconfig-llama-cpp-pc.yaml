# Prometheus scrape target for the workstation llama-swap instance.
# pierce-pc.levangie.org resolves to 172.20.23.28 (LAN). The Windows
# llama-swap controller's shim (:9081, D:\local-llm\llama-swap-controller\
# assets\llama-swap-shim.py) serves /metrics: llama-swap host/GPU metrics
# plus each loaded llama-server's llamacpp:* metrics labelled by model.
#
# The static instance=workstation label lets the existing Grafana
# 'llama-cpp' dashboard's $instance template variable auto-discover
# this target alongside the in-cluster instance=cluster scrape.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: llama-cpp-pc
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: llama-cpp-pc
  scrapeInterval: 30s
  scrapeTimeout: 20s
  metricsPath: /metrics
  staticConfigs:
    - targets:
        - pierce-pc.levangie.org:9081
      labels:
        instance: workstation
