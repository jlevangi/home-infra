apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-prometheus-token
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: home-assistant-prometheus-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: prod/home-assistant
        property: prometheus-token
