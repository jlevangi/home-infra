apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: proxmox-node-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: proxmox-node-exporter
  scrapeInterval: 30s
  scrapeTimeout: 10s
  staticConfigs:
    - targets:
        - 172.20.20.6:9100
      labels:
        proxmox_host: atlas
        instance: atlas
    - targets:
        - 172.20.20.14:9100
      labels:
        proxmox_host: dellssf
        instance: dellssf
    - targets:
        - 172.20.20.7:9100
      labels:
        proxmox_host: elitedesk-1
        instance: elitedesk-1
  relabelings:
    - sourceLabels: [instance]
      targetLabel: proxmox_host
      regex: (.+)
      replacement: $1
      action: replace
