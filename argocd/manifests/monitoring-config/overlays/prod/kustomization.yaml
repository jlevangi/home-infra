apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - external-secret-home-assistant.yaml
  - service-home-assistant.yaml
  - endpoints-home-assistant.yaml
  - servicemonitor-home-assistant.yaml
  - scrapeconfig-proxmox-node-exporter.yaml
  - scrapeconfig-llama-cpp-pc.yaml
configMapGenerator:
  - name: grafana-dashboard-home-assistant
    namespace: monitoring
    files:
      - home-assistant.json=home-assistant-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
generatorOptions:
  disableNameSuffixHash: true
labels:
  - pairs:
      environment: prod
    includeSelectors: false
