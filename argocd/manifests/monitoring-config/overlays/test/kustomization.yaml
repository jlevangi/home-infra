apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: ExternalSecret
      name: grafana-admin-credentials
    patch: |
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: "test/monitoring"
labels:
  - pairs:
      environment: test
    includeSelectors: false
