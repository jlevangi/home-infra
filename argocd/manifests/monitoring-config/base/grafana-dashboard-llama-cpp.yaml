apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-llama-cpp
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  llama-cpp.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "datasource",
              "uid": "grafana"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "llama-cpp / llama-swap host + inference stats. Inference panels populate only while a model is loaded; host panels are always live. Use the instance dropdown to switch between the cluster pod and any LAN llama-swap targets.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "type": "stat",
          "id": 1,
          "title": "Active model(s)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 3
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name",
            "colorMode": "value",
            "graphMode": "none",
            "orientation": "vertical"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "\u2014",
                      "color": "text"
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "noValue": "no model loaded"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "llamacpp_active_model_info{instance=~\"$instance\"}",
              "legendFormat": "{{model}}",
              "instant": true
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 5,
          "title": "Tokens / sec",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 3,
            "w": 24,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "tps",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10,
                "spanNulls": false
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "llamacpp:prompt_tokens_seconds{instance=~\"$instance\",model=~\"$model\"}",
              "legendFormat": "prompt"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "llamacpp:predicted_tokens_seconds{instance=~\"$instance\",model=~\"$model\"}",
              "legendFormat": "gen"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 8,
          "title": "GPU util",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 11,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "llamaswap_gpu_util_percent{instance=~\"$instance\"} and on(id) (llamaswap_gpu_memory_total_bytes{instance=~\"$instance\"} > 1e9)",
              "legendFormat": "GPU {{id}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 9,
          "title": "VRAM",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 11,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "llamaswap_gpu_memory_used_bytes{instance=~\"$instance\"} and on(id) (llamaswap_gpu_memory_total_bytes{instance=~\"$instance\"} > 1e9)",
              "legendFormat": "GPU {{id}} used"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "llamaswap_gpu_memory_total_bytes{instance=~\"$instance\"} > 1e9",
              "legendFormat": "GPU {{id}} total"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "type": "timeseries",
          "id": 7,
          "title": "Requests",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 19,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "stacking": {
                  "mode": "none"
                },
                "spanNulls": false
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "llamacpp:requests_processing{instance=~\"$instance\",model=~\"$model\"}",
              "legendFormat": "active"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "llamacpp:requests_deferred{instance=~\"$instance\",model=~\"$model\"}",
              "legendFormat": "queued"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 12,
          "title": "RAM",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 19,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "llamaswap_memory_used_bytes{instance=~\"$instance\"}",
              "legendFormat": "used"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "llamaswap_memory_total_bytes{instance=~\"$instance\"}",
              "legendFormat": "total"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "llamaswap_swap_used_bytes{instance=~\"$instance\"}",
              "legendFormat": "swap"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "type": "stat",
          "id": 2,
          "title": "GPU temp",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 27,
            "w": 8,
            "h": 5
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "graphMode": "area",
            "colorMode": "value",
            "orientation": "horizontal"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 85
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "llamaswap_gpu_temperature_celsius{instance=~\"$instance\"} > 0",
              "legendFormat": "GPU {{id}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 10,
          "title": "CPU",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 27,
            "w": 16,
            "h": 5
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 5,
                "showPoints": "never"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "avg(llamaswap_cpu_util_percent{instance=~\"$instance\"})",
              "legendFormat": "avg"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "max(llamaswap_cpu_util_percent{instance=~\"$instance\"})",
              "legendFormat": "busiest core"
            }
          ]
        },
        {
          "type": "timeseries",
          "id": 13,
          "title": "Network",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 24,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10
              }
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (direction) (rate(llamaswap_network_bytes_total{instance=~\"$instance\"}[$__rate_interval]))",
              "legendFormat": "{{direction}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "llama-cpp",
        "llm",
        "inference"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "selected": false,
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "includeAll": false,
            "label": "Datasource",
            "multi": false,
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          },
          {
            "current": {
              "selected": false,
              "text": "cluster",
              "value": "cluster"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "definition": "label_values(llamaswap_load_average, instance)",
            "hide": 0,
            "includeAll": false,
            "label": "Instance",
            "multi": false,
            "name": "instance",
            "options": [],
            "query": {
              "query": "label_values(llamaswap_load_average, instance)",
              "refId": "Instance"
            },
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            },
            "datasource": {
              "type": "prometheus",
              "uid": "$datasource"
            },
            "definition": "label_values(llamacpp_active_model_info{instance=~\"$instance\"}, model)",
            "hide": 0,
            "includeAll": true,
            "label": "Model",
            "multi": true,
            "name": "model",
            "options": [],
            "query": {
              "query": "label_values(llamacpp_active_model_info{instance=~\"$instance\"}, model)",
              "refId": "Model"
            },
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query",
            "allValue": ".*"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "llama-cpp",
      "uid": "llama-cpp",
      "version": 1,
      "weekStart": ""
    }
