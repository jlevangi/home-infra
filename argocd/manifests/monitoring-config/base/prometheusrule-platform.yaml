apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-observability
  namespace: monitoring
spec:
  groups:
    - name: platform.observability
      rules:
        - alert: TraefikMetricsDown
          expr: sum(up{namespace="traefik-system", pod=~"traefik-.*"}) < 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Traefik metrics are unavailable
            description: Prometheus has not been able to scrape Traefik metrics for 5 minutes.
        - alert: TraefikHigh5xxRate
          expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) / clamp_min(sum(rate(traefik_service_requests_total[5m])), 1) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Traefik 5xx rate is elevated
            description: More than 5% of Traefik service requests have returned 5xx responses for 10 minutes.
        - alert: TraefikCertificateExpiringSoon
          expr: min(traefik_tls_certs_not_after) > 0 and (min(traefik_tls_certs_not_after) - time()) < 1209600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Traefik-managed certificate expires soon
            description: At least one Traefik certificate will expire within 14 days.
        - alert: ArgoCDApplicationDegraded
          expr: argocd_app_info{health_status=~"Degraded|Missing|Suspended|Unknown"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: ArgoCD application is degraded
            description: Application {{ $labels.name }} in namespace {{ $labels.namespace }} is {{ $labels.health_status }}.
        - alert: LonghornVolumesDegraded
          expr: count by (state) (longhorn_volume_robustness{state=~"degraded|faulted"} == 1) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $value }} Longhorn volume(s) are {{ $labels.state }}"
            description: "{{ $value }} volume(s) in {{ $labels.state }} state."
        - alert: LonghornVolumeReadOnly
          expr: longhorn_volume_file_system_read_only == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Longhorn volume filesystem is read-only
            description: Longhorn volume {{ $labels.volume }} is mounted read-only on node {{ $labels.node }}.
        - alert: LonghornBackupStale
          expr: longhorn_volume_last_backup_at > 0 and (time() - longhorn_volume_last_backup_at) > 172800
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Longhorn backup is stale
            description: Longhorn volume {{ $labels.volume }} has not had a successful backup in over 48 hours.
        - alert: GatusEndpointDown
          expr: sum by (group, name) (increase(gatus_results_total{success="false"}[10m])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Gatus endpoint is failing
            description: Gatus has recorded one or more failed checks for {{ $labels.group }}/{{ $labels.name }} in the last 10 minutes.
        - alert: BlackboxProbeFailed
          expr: probe_success == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Blackbox probe failed
            description: Blackbox probe {{ $labels.instance }} has been failing for 5 minutes.
        - alert: KubernetesNodeNotReady
          expr: kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes node is not ready
            description: Node {{ $labels.node }} has not reported Ready for 10 minutes.
        - alert: KubeMemoryOvercommitWithoutLlamaCpp
          expr: |-
            # Same intent as the upstream KubeMemoryOvercommit rule, but exclude
            # llama-cpp because it is intentionally pinned to the only GPU node
            # and cannot be made HA in this cluster.
            # Non-HA clusters.
            (
              (
                sum by (cluster) (namespace_memory:kube_pod_container_resource_requests:sum{namespace!="llama-cpp"})
                -
                sum by (cluster) (kube_node_status_allocatable{job="kube-state-metrics",resource="memory"}) > 0
              )
              and
              count by (cluster) (max by (cluster, node) (kube_node_role{job="kube-state-metrics", role="control-plane"})) < 3
            )
            or
            # HA clusters.
            (
              sum by (cluster) (namespace_memory:kube_pod_container_resource_requests:sum{namespace!="llama-cpp"})
              -
              (
                # Skip clusters with only one allocatable node.
                (
                  sum by (cluster) (kube_node_status_allocatable{job="kube-state-metrics",resource="memory"})
                  -
                  max by (cluster) (kube_node_status_allocatable{job="kube-state-metrics",resource="memory"})
                ) > 0
              ) > 0
            )
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Cluster has overcommitted memory resource requests excluding llama-cpp.
            description: Cluster {{ $labels.cluster }} has overcommitted non-llama-cpp memory requests by {{ $value | humanize }} bytes and cannot tolerate node failure.
        - alert: NodeDiskPressureDetected
          expr: kube_node_status_condition{condition="DiskPressure", status="true"} == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes node is under disk pressure
            description: Node {{ $labels.node }} has reported DiskPressure for 10 minutes.
        - alert: NodeMemoryPressureDetected
          expr: kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Kubernetes node is under memory pressure
            description: Node {{ $labels.node }} has reported MemoryPressure for 10 minutes.
        - alert: NodeSustainedSaturation
          expr: node_load1{job="node-exporter"} / count without (cpu, mode) (node_cpu_seconds_total{job="node-exporter", mode="idle"}) > 4
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: Node has been saturated for 30 minutes
            description: Load per core on {{ $labels.instance }} has exceeded 4 for 30 minutes (currently {{ printf "%.2f" $value }}). Replaces the upstream NodeSystemSaturation alert with a homelab-tolerant threshold.
        - alert: ContainerCPUThrottlingMaterial
          expr: |-
            (
              sum by (cluster, namespace, pod, container) (
                rate(container_cpu_cfs_throttled_periods_total{container!="", job="kubelet", metrics_path="/metrics/cadvisor"}[5m])
              )
              /
              sum by (cluster, namespace, pod, container) (
                rate(container_cpu_cfs_periods_total{container!="", job="kubelet", metrics_path="/metrics/cadvisor"}[5m])
              )
            ) > 0.25
            and on (cluster, namespace, pod, container)
            (
              sum by (cluster, namespace, pod, container) (
                rate(container_cpu_usage_seconds_total{container!="", job="kubelet", metrics_path="/metrics/cadvisor"}[5m])
              )
              /
              max by (cluster, namespace, pod, container) (
                kube_pod_container_resource_limits{resource="cpu"} > 0
              )
            ) > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: CPU throttling is materially constraining a container
            description: Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} has spent over 25% of CPU periods throttled while using over 80% of its CPU limit for 15 minutes.
        - alert: ProxmoxThinPoolDataHigh
          expr: node_lvm_thin_pool_data_percent{vg="pve", thin_pool="data"} > 90
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: Proxmox thin pool {{ $labels.vg }}/{{ $labels.thin_pool }} is above 90%
            description: Proxmox host {{ $labels.instance }} LVM thin pool {{ $labels.vg }}/{{ $labels.thin_pool }} is {{ printf "%.2f" $value }}% full. Extend the pool or move VM disks before it reaches 100% and Proxmox VMs enter io-error.
