apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingvin-share-x
  namespace: pingvin-share-x
  labels:
    app.kubernetes.io/name: pingvin-share-x
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pingvin-share-x
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pingvin-share-x
      annotations:
        pingvin-share-x.levangie.dev/config-revision: "5"
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: wait-for-clamav
          image: busybox:1.38.0@sha256:1cfa4e2b09e127b9c4ed43578d3f3c18e7d44ea47b9ea98475c0cbe9086525f8
          command:
            - sh
            - -c
            - until nc -z clamav 3310; do sleep 5; done
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: pingvin-share-x
          image: smp46/pingvin-share-x@sha256:38480232d3ec26858e0313e09584b662fde356a32aaf83f6270f26c5414065ec
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
          env:
            - name: TRUST_PROXY
              value: "true"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: CONFIG_FILE
              value: /opt/app/config.yaml
            - name: DATA_DIRECTORY
              value: /opt/app/backend/data
            - name: DATABASE_URL
              value: file:/opt/app/backend/data/pingvin-share.db?connection_limit=1
            - name: CLAMAV_HOST
              value: clamav
            - name: CLAMAV_PORT
              value: "3310"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /opt/app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: data
              mountPath: /opt/app/backend/data
            - name: files
              mountPath: /opt/app/backend/data/uploads/shares
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: config
          secret:
            secretName: pingvin-share-x-config
        - name: data
          persistentVolumeClaim:
            claimName: pingvin-share-x-data
        - name: files
          persistentVolumeClaim:
            claimName: pingvin-share-x-files
