apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pingvin-share-x-data
  namespace: pingvin-share-x
  labels:
    app.kubernetes.io/name: pingvin-share-x
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn-redundant
