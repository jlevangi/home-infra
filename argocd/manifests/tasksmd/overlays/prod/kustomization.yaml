apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: baldissaramatheus/tasks.md
    newTag: "3.3.0"
patches:
  - target:
      kind: Ingress
      name: tasksmd-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
commonLabels:
  environment: prod
