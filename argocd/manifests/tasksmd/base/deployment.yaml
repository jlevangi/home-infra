apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasksmd
  namespace: tasksmd
  labels:
    app: tasksmd
    app.kubernetes.io/name: tasksmd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tasksmd
  template:
    metadata:
      labels:
        app: tasksmd
        app.kubernetes.io/name: tasksmd
    spec:
      containers:
        - name: tasksmd
          image: baldissaramatheus/tasks.md:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: tasksmd-data
              mountPath: /tasks
              subPath: tasks
            - name: tasksmd-data
              mountPath: /config
              subPath: config
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: tasksmd-data
          persistentVolumeClaim:
            claimName: tasksmd-data-pvc
