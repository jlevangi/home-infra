apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasksmd-ingress
  namespace: tasksmd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: tasksmd.levangie.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tasksmd
                port:
                  number: 8080
