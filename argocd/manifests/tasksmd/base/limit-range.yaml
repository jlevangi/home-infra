apiVersion: v1
kind: LimitRange
metadata:
  name: tasksmd-storage-limits
  namespace: tasksmd
spec:
  limits:
    - type: PersistentVolumeClaim
      max:
        storage: "250Mi"
      min:
        storage: "100Mi"
      default:
        storage: "250Mi"
      defaultRequest:
        storage: "250Mi"
