apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-oidc-config
  namespace: affine
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: affine-oidc-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        config.json: |
          {
            "$schema": "https://github.com/toeverything/affine/releases/latest/download/config.schema.json",
            "server": {
              "name": "AFFiNE Self Hosted"
            },
            "oauth": {
              "providers.oidc": {
                "clientId": "affine",
                "clientSecret": "{{ .OIDC_CLIENT_SECRET }}",
                "issuer": "https://auth.levangie.org/realms/master",
                "args": {
                  "scope": "openid profile email"
                }
              }
            }
          }
  dataFrom:
    - extract:
        key: prod/affine
