apiVersion: apps/v1
kind: Deployment
metadata:
  name: affine
  namespace: affine
  labels:
    app: affine
    app.kubernetes.io/name: affine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: affine
  template:
    metadata:
      labels:
        app: affine
        app.kubernetes.io/name: affine
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres..."
              until nc -z affine-postgres 5432; do sleep 5; done
              echo "Waiting for redis..."
              until nc -z affine-redis 6379; do sleep 5; done
              echo "Dependencies ready."
        - name: render-config
          image: busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - cp /tmp/oidc/config.json /root/.affine/config/config.json && chmod 0644 /root/.affine/config/config.json
          volumeMounts:
            - name: config
              mountPath: /root/.affine/config
            - name: oidc-config
              mountPath: /tmp/oidc
              readOnly: true
        - name: migrate
          image: ghcr.io/toeverything/affine:0.27.3
          imagePullPolicy: IfNotPresent
          command:
            - node
            - ./scripts/self-host-predeploy.js
          envFrom:
            - configMapRef:
                name: affine-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: affine-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://affine:$(DB_PASSWORD)@affine-postgres:5432/affine"
            - name: AFFINE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: affine-secrets
                  key: AFFINE_PRIVATE_KEY
          volumeMounts:
            - name: storage
              mountPath: /root/.affine/storage
            - name: config
              mountPath: /root/.affine/config
      containers:
        - name: affine
          image: ghcr.io/toeverything/affine:0.27.3
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: affine-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: affine-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://affine:$(DB_PASSWORD)@affine-postgres:5432/affine"
            - name: AFFINE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: affine-secrets
                  key: AFFINE_PRIVATE_KEY
          ports:
            - name: http
              containerPort: 3010
              protocol: TCP
          volumeMounts:
            - name: storage
              mountPath: /root/.affine/storage
            - name: config
              mountPath: /root/.affine/config
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /api/info
              port: 3010
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/info
              port: 3010
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: affine-storage-pvc
        - name: config
          emptyDir: {}
        - name: oidc-config
          secret:
            secretName: affine-oidc-config
            items:
              - key: config.json
                path: config.json
