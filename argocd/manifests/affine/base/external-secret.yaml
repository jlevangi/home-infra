apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-secrets
  namespace: affine
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: affine-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: prod/affine
