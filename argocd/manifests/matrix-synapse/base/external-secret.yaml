apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-synapse-secrets
  namespace: matrix-synapse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: matrix-synapse-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/matrix-synapse
