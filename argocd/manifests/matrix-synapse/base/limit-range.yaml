apiVersion: v1
kind: LimitRange
metadata:
  name: matrix-synapse-storage-limits
  namespace: matrix-synapse
spec:
  limits:
    - type: PersistentVolumeClaim
      max:
        storage: 30Gi
      min:
        storage: 1Gi
      default:
        storage: 10Gi
      defaultRequest:
        storage: 10Gi
