apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/element-hq/synapse
    newTag: v1.160.0
  - name: postgres
    newTag: "16"
patches:
  - target:
      kind: PersistentVolumeClaim
      name: matrix-synapse-data
    patch: |
      - op: add
        path: /spec/volumeName
        value: pvc-f49cbe71-6089-442b-9194-935ab61c4d86
      - op: replace
        path: /spec/storageClassName
        value: longhorn-flash
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
  - target:
      kind: PersistentVolumeClaim
      name: matrix-postgres-data
    patch: |
      - op: add
        path: /spec/volumeName
        value: pvc-bf409570-8d12-45f4-a123-491e8815b2ef
      - op: replace
        path: /spec/storageClassName
        value: longhorn-flash
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
