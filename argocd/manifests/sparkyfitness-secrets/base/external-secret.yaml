apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkyfitness-app
  namespace: sparkyfitness
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: sparkyfitness-app
    creationPolicy: Owner
  data:
    - secretKey: api_encryption_key
      remoteRef:
        key: prod/sparkyfitness
        property: api_encryption_key
    - secretKey: better_auth_secret
      remoteRef:
        key: prod/sparkyfitness
        property: better_auth_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkyfitness-appdb
  namespace: sparkyfitness
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: sparkyfitness-appdb
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: prod/sparkyfitness
        property: app_db_username
    - secretKey: password
      remoteRef:
        key: prod/sparkyfitness
        property: app_db_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sparkyfitness-postgresql-auth
  namespace: sparkyfitness
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: sparkyfitness-postgresql-auth
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: prod/sparkyfitness
        property: postgres_password
    - secretKey: user-password
      remoteRef:
        key: prod/sparkyfitness
        property: db_owner_password
    - secretKey: replication-password
      remoteRef:
        key: prod/sparkyfitness
        property: replication_password
