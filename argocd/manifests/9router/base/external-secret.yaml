apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: 9router-secrets
  namespace: 9router
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: 9router-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/9router
