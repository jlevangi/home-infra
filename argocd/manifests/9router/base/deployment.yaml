apiVersion: apps/v1
kind: Deployment
metadata:
  name: 9router
  namespace: 9router
  labels:
    app: 9router
    app.kubernetes.io/name: 9router
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: 9router
  template:
    metadata:
      labels:
        app: 9router
        app.kubernetes.io/name: 9router
    spec:
      initContainers:
        - name: init-data
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - chown -R 1000:1000 /app/data
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: 9router
          image: ghcr.io/decolua/9router:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_DIR
              value: /app/data
            - name: PORT
              value: "20128"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_BASE_URL
              value: https://9router.levangie.dev
          envFrom:
            - secretRef:
                name: 9router-secrets
          ports:
            - name: http
              containerPort: 20128
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: 9router-data-pvc
