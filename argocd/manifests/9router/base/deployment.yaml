apiVersion: apps/v1
kind: Deployment
metadata:
  name: 9router
  namespace: 9router
  labels:
    app: 9router
    app.kubernetes.io/name: 9router
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: 9router
  template:
    metadata:
      annotations:
        # Bump this whenever configmap-seed-local-llm.yaml changes - ArgoCD updates the
        # ConfigMap but will not restart the pod on its own, so the initContainer would
        # otherwise keep running the old seed script.
        checksum/9router-local-llm-seed: discover-local-models-v2-resilient
      labels:
        app: 9router
        app.kubernetes.io/name: 9router
    spec:
      initContainers:
        - name: init-data
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - chown -R 1000:1000 /app/data
          volumeMounts:
            - name: data
              mountPath: /app/data
        - name: seed-local-llm
          image: ghcr.io/decolua/9router:latest
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /app/seed/seed-local-llm.js
          env:
            - name: NINE_ROUTER_DB
              value: /app/data/db/data.sqlite
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: 9router-secrets
                  key: OIDC_CLIENT_SECRET
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: local-llm-seed
              mountPath: /app/seed
              readOnly: true
      containers:
        - name: 9router
          image: ghcr.io/decolua/9router:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_DIR
              value: /app/data
            - name: PORT
              value: "20128"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_BASE_URL
              value: https://9router.levangie.dev
            - name: BASE_URL
              value: https://9router.levangie.dev
          envFrom:
            - secretRef:
                name: 9router-secrets
          ports:
            - name: http
              containerPort: 20128
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
        # Re-runs the same discovery the initContainer does, on a timer, so model changes
        # on llama-swap reach 9router without restarting the pod. Without this the model
        # list is only ever as fresh as the last pod start.
        #
        # Runs in the same pod on purpose: it shares the PVC and the node, so it never
        # contends with another node for the RWO volume. SQLite is in WAL mode and the
        # seed writes in a single short transaction, so it can safely interleave with
        # 9router's own writes.
        - name: seed-refresh
          image: ghcr.io/decolua/9router:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              # Offset the first run so it does not race the initContainer's seed.
              sleep "${SEED_REFRESH_INTERVAL}"
              while true; do
                node /app/seed/seed-local-llm.js || echo "[seed-refresh] seed failed; retrying next cycle"
                sleep "${SEED_REFRESH_INTERVAL}"
              done
          env:
            - name: SEED_REFRESH_INTERVAL
              value: "300"
            - name: NINE_ROUTER_DB
              value: /app/data/db/data.sqlite
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: 9router-secrets
                  key: OIDC_CLIENT_SECRET
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: local-llm-seed
              mountPath: /app/seed
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: 9router-data-pvc
        - name: local-llm-seed
          configMap:
            name: 9router-local-llm-seed
