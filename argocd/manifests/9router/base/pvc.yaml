apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: 9router-data-pvc
  namespace: 9router
  labels:
    app: 9router
    app.kubernetes.io/name: 9router
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
