apiVersion: v1
kind: ConfigMap
metadata:
  name: 9router-local-llm-seed
  namespace: 9router
data:
  seed-local-llm.js: |
    const Database = require("better-sqlite3");

    const dbPath = process.env.NINE_ROUTER_DB || "/app/data/db/data.sqlite";
    const now = new Date().toISOString();
    const apiKey = "local-no-auth";

    const endpoints = [
      {
        id: "openai-compatible-chat-local-llama-swap",
        connectionId: "local-llama-swap",
        prefix: "llama-swap",
        name: "Local llama-swap",
        baseUrl: "https://llm.levangie.dev/v1",
        models: [
          "Gemma4-26B-A4B",
          "Gemma4-31B",
          "MiniMax-M2.7-UD-Q4_K_M",
          "Qwen3-Coder-Next-UD-Q4_K_M",
          "Qwen3.6-27B-Q5_K_S",
          "Qwen3.6-27B-Q5_K_S-MTP",
          "Qwen3.6-27B-Q5_K_S-MTP-n8n",
          "Qwen3.6-27B-UD-Q8_K_XL",
          "Qwen3.6-35B-A3B-UD-Q4_K_M",
          "Qwen3.6-35B-A3B-UD-Q4_K_M-planner",
          "Qwopus3.5-9B-Coder-MTP"
        ]
      },
      {
        id: "openai-compatible-chat-pc-llama-swap",
        connectionId: "pc-llama-swap",
        prefix: "pc-llama-swap",
        name: "PC llama-swap (optional)",
        baseUrl: "http://pierce-pc.levangie.org:9080/v1",
        models: [
          "Gemma-4-12B-coder-fable5-composer2.5-v1",
          "Gemma4-26B-A4B",
          "Gemma4-31B",
          "Qwen3-Embedding-0.6B-Q8_0",
          "Qwen3.6-27B-MTP-Q4KM-131k",
          "Qwen3.6-27B-browseruse-vision",
          "Qwen3.6-27B-dense-Q4KS-256k"
        ]
      }
    ];

    const db = new Database(dbPath);
    db.pragma("journal_mode = WAL");

    const upsertNode = db.prepare(`
      INSERT INTO providerNodes(id, type, name, data, createdAt, updatedAt)
      VALUES(?, ?, ?, ?, ?, ?)
      ON CONFLICT(id) DO UPDATE SET
        type = excluded.type,
        name = excluded.name,
        data = excluded.data,
        updatedAt = excluded.updatedAt
    `);

    const upsertConnection = db.prepare(`
      INSERT INTO providerConnections(id, provider, authType, name, email, priority, isActive, data, createdAt, updatedAt)
      VALUES(?, ?, ?, ?, NULL, ?, 1, ?, ?, ?)
      ON CONFLICT(id) DO UPDATE SET
        provider = excluded.provider,
        authType = excluded.authType,
        name = excluded.name,
        priority = excluded.priority,
        isActive = excluded.isActive,
        data = excluded.data,
        updatedAt = excluded.updatedAt
    `);

    const upsertCustomModel = db.prepare(`
      INSERT INTO kv(scope, key, value)
      VALUES('customModels', ?, ?)
      ON CONFLICT(scope, key) DO UPDATE SET value = excluded.value
    `);

    const listCustomModelKeys = db.prepare(`
      SELECT key FROM kv
      WHERE scope = 'customModels'
        AND key LIKE ?
    `);

    const deleteCustomModel = db.prepare(`
      DELETE FROM kv
      WHERE scope = 'customModels'
        AND key = ?
    `);

    db.transaction(() => {
      const currentKeys = [];

      endpoints.forEach((endpoint, endpointIndex) => {
        const nodeData = {
          prefix: endpoint.prefix,
          apiType: "chat",
          baseUrl: endpoint.baseUrl
        };
        upsertNode.run(endpoint.id, "openai-compatible", endpoint.name, JSON.stringify(nodeData), now, now);

        const connectionData = {
          apiKey,
          testStatus: "active",
          providerSpecificData: {
            prefix: endpoint.prefix,
            apiType: "chat",
            baseUrl: endpoint.baseUrl,
            nodeName: endpoint.name,
            connectionProxyEnabled: false,
            connectionProxyUrl: "",
            connectionNoProxy: ""
          },
          lastError: null,
          lastErrorAt: null
        };
        upsertConnection.run(
          endpoint.connectionId,
          endpoint.id,
          "apikey",
          endpoint.name,
          endpointIndex + 1,
          JSON.stringify(connectionData),
          now,
          now
        );

        endpoint.models.forEach((model) => {
          const type = model.toLowerCase().includes("embedding") ? "embedding" : "llm";
          const key = `${endpoint.prefix}|${model}|${type}`;
          currentKeys.push(key);
          upsertCustomModel.run(key, JSON.stringify({
            providerAlias: endpoint.prefix,
            id: model,
            type,
            name: model
          }));
        });
      });

      endpoints.forEach((endpoint) => {
        const endpointKeys = new Set(currentKeys.filter((key) => key.startsWith(`${endpoint.prefix}|`)));
        listCustomModelKeys.all(`${endpoint.prefix}|%`).forEach(({ key }) => {
          if (!endpointKeys.has(key)) deleteCustomModel.run(key);
        });
      });
    })();

    db.pragma("wal_checkpoint(TRUNCATE)");
    db.close();

    console.log(`[9router local LLM seed] ensured ${endpoints.length} endpoints and ${endpoints.reduce((sum, endpoint) => sum + endpoint.models.length, 0)} models`);
