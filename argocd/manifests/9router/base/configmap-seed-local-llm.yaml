apiVersion: v1
kind: ConfigMap
metadata:
  name: 9router-local-llm-seed
  namespace: 9router
data:
  seed-local-llm.js: |
    const Database = require("better-sqlite3");

    const dbPath = process.env.NINE_ROUTER_DB || "/app/data/db/data.sqlite";
    const now = new Date().toISOString();
    const apiKey = "local-no-auth";

    // Combos keep their OWN copy of model references, separate from the discovered model
    // list. So renaming an alias in llama-swap's config.yaml leaves every combo pointing
    // at a name that no longer routes, and llama-swap answers:
    //     404 {"src":"llama-swap","error":"no router for requested model"}
    // Deleting the stale custom-model entry does NOT fix that - the combo still holds the
    // old string. Add a {from, to} pair here whenever an alias is renamed. Replacement is
    // a plain string swap on the quoted name, so it is idempotent and safe to re-run.
    const MODEL_RENAMES = [
      { from: "llama-swap/Qwen3.6-27B-Q5_K_S", to: "llama-swap/Qwen3.6-27B-Q5_K_S-MTP" },
      { from: "pc-llama-swap/Qwen3.8-27B-MTP-Q4KXL-131k", to: "pc-llama-swap/Qwen3.8-27B" },
    ];

    // 9router is the single source of truth for which models exist. Nothing downstream
    // (LibreChat included) should hardcode a model list - they fetch from 9router, and
    // 9router discovers from the llama-swap endpoints below.
    const endpoints = [
      {
        id: "openai-compatible-chat-local-llama-swap",
        connectionId: "local-llama-swap",
        prefix: "llama-swap",
        name: "Local llama-swap",
        baseUrl: "https://llm.levangie.dev/v1",
        discoverModels: true,
        // Cluster llama-cpp is intentionally out of rotation (too slow on CPU) and is
        // currently returning HTTP 503. While disabled the seed prunes every model it
        // owns and marks its connection inactive, so it disappears from 9router and
        // LibreChat instead of lingering as dead entries. Flip to true to bring it back.
        enabled: false
      },
      {
        id: "openai-compatible-chat-pc-llama-swap",
        connectionId: "pc-llama-swap",
        prefix: "pc-llama-swap",
        name: "PC llama-swap",
        baseUrl: "http://pierce-pc.levangie.org:9080/v1",
        enabled: true,
        // Discovery is the source of truth. This list was previously hardcoded and went
        // stale the moment the Qwen3.6 models were replaced, leaving 9router advertising
        // three models that no longer exist on disk.
        discoverModels: true,
        // Used only when the PC is asleep/unreachable at seed time.
        fallbackModels: [
          "Gemma-4-12B-coder-fable5-composer2.5-v1",
          "Gemma4-26B-A4B",
          "Gemma4-31B",
          "Qwen3-Embedding-0.6B-Q8_0",
          "Qwen3.8-27B-MTP-Q4KXL-131k"
        ]
      }
    ];

    async function main() {
      for (const endpoint of endpoints) {
        // A disabled endpoint keeps an empty model list, so the prune loop below removes
        // every model it previously owned. Its connection is also marked inactive.
        if (endpoint.enabled === false) {
          endpoint.models = [];
          console.warn(`[9router local LLM seed] ${endpoint.name} is disabled; pruning its models`);
          continue;
        }
        if (!endpoint.discoverModels) continue;

        try {
          const response = await fetch(`${endpoint.baseUrl.replace(/\/$/, "")}/models`, {
            headers: { Authorization: `Bearer ${apiKey}` },
            signal: AbortSignal.timeout(5000)
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const payload = await response.json();
          endpoint.models = (payload.data || payload.models || [])
            .map((model) => model.id || model.name || model.model)
            .filter((model) => typeof model === "string" && model.length > 0);
          if (endpoint.models.length === 0) throw new Error("discovery returned no models");
        } catch (error) {
          // A single unreachable endpoint must NOT abort the whole seed. This previously
          // threw, so while llm.levangie.dev was returning 503 the job exited(1) and no
          // endpoint got seeded at all - including the healthy ones.
          if (endpoint.fallbackModels && endpoint.fallbackModels.length > 0) {
            endpoint.models = endpoint.fallbackModels;
            console.warn(`[9router local LLM seed] ${endpoint.name} discovery failed (${error.message}); using ${endpoint.models.length} fallback models`);
          } else {
            // No fallback: leave whatever is already in the DB alone rather than pruning
            // this endpoint's models to nothing. Honoured by the upsert and prune loops.
            endpoint.skipped = true;
            console.warn(`[9router local LLM seed] ${endpoint.name} discovery failed (${error.message}); leaving its existing models untouched`);
          }
        }
      }

      if (endpoints.every((endpoint) => endpoint.skipped)) {
        throw new Error("every endpoint failed model discovery");
      }

    const db = new Database(dbPath);
    db.pragma("journal_mode = WAL");

    const headroomUrl = "http://headroom:8787";

    const upsertNode = db.prepare(`
      INSERT INTO providerNodes(id, type, name, data, createdAt, updatedAt)
      VALUES(?, ?, ?, ?, ?, ?)
      ON CONFLICT(id) DO UPDATE SET
        type = excluded.type,
        name = excluded.name,
        data = excluded.data,
        updatedAt = excluded.updatedAt
    `);

    const upsertConnection = db.prepare(`
      INSERT INTO providerConnections(id, provider, authType, name, email, priority, isActive, data, createdAt, updatedAt)
      VALUES(?, ?, ?, ?, NULL, ?, ?, ?, ?, ?)
      ON CONFLICT(id) DO UPDATE SET
        provider = excluded.provider,
        authType = excluded.authType,
        name = excluded.name,
        priority = excluded.priority,
        isActive = excluded.isActive,
        data = excluded.data,
        updatedAt = excluded.updatedAt
    `);

    const upsertCustomModel = db.prepare(`
      INSERT INTO kv(scope, key, value)
      VALUES('customModels', ?, ?)
      ON CONFLICT(scope, key) DO UPDATE SET value = excluded.value
    `);

    const listCustomModelKeys = db.prepare(`
      SELECT key FROM kv
      WHERE scope = 'customModels'
        AND key LIKE ?
    `);

    const deleteCustomModel = db.prepare(`
      DELETE FROM kv
      WHERE scope = 'customModels'
        AND key = ?
    `);

    const migrateComboModel = db.prepare(`
      UPDATE combos
      SET models = replace(models, ?, ?), updatedAt = ?
      WHERE models LIKE ?
    `);

    const upsertSettings = db.prepare(`
      INSERT INTO settings(id, data)
      VALUES(1, ?)
      ON CONFLICT(id) DO UPDATE SET data = excluded.data
    `);

    const currentSettings = db.prepare(`
      SELECT data FROM settings WHERE id = 1
    `).get();

    db.transaction(() => {
      const currentKeys = [];

      endpoints.forEach((endpoint, endpointIndex) => {
        const nodeData = {
          prefix: endpoint.prefix,
          apiType: "chat",
          baseUrl: endpoint.baseUrl
        };
        upsertNode.run(endpoint.id, "openai-compatible", endpoint.name, JSON.stringify(nodeData), now, now);

        const connectionData = {
          apiKey,
          testStatus: "active",
          providerSpecificData: {
            prefix: endpoint.prefix,
            apiType: "chat",
            baseUrl: endpoint.baseUrl,
            nodeName: endpoint.name,
            connectionProxyEnabled: false,
            connectionProxyUrl: "",
            connectionNoProxy: ""
          },
          lastError: null,
          lastErrorAt: null
        };
        upsertConnection.run(
          endpoint.connectionId,
          endpoint.id,
          "apikey",
          endpoint.name,
          endpointIndex + 1,
          endpoint.enabled === false ? 0 : 1,
          JSON.stringify(connectionData),
          now,
          now
        );

        // Node + connection stay registered even if discovery failed; only the model
        // list is left untouched for a skipped endpoint.
        if (endpoint.skipped) return;

        endpoint.models.forEach((model) => {
          const type = model.toLowerCase().includes("embedding") ? "embedding" : "llm";
          const key = `${endpoint.prefix}|${model}|${type}`;
          currentKeys.push(key);
          upsertCustomModel.run(key, JSON.stringify({
            providerAlias: endpoint.prefix,
            id: model,
            type,
            name: model
          }));
        });
      });

      endpoints.forEach((endpoint) => {
        // Never prune an endpoint we could not enumerate - currentKeys has nothing for it,
        // so pruning would delete every model it has.
        if (endpoint.skipped) return;

        const endpointKeys = new Set(currentKeys.filter((key) => key.startsWith(`${endpoint.prefix}|`)));
        listCustomModelKeys.all(`${endpoint.prefix}|%`).forEach(({ key }) => {
          if (!endpointKeys.has(key)) deleteCustomModel.run(key);
        });
      });

      for (const { from, to } of MODEL_RENAMES) {
        const info = migrateComboModel.run(`"${from}"`, `"${to}"`, now, `%"${from}"%`);
        if (info && info.changes > 0) {
          console.log(`[9router local LLM seed] rewrote ${info.changes} combo(s): ${from} -> ${to}`);
        }
      }

      const settings = currentSettings?.data ? JSON.parse(currentSettings.data) : {};
      settings.headroomEnabled = true;
      settings.headroomUrl = headroomUrl;
      settings.authMode = "oidc";
      settings.oidcIssuerUrl = "https://auth.levangie.org/realms/master";
      settings.oidcClientId = "9router";
      settings.oidcClientSecret = process.env.OIDC_CLIENT_SECRET;
      settings.oidcScopes = "openid profile email";
      settings.oidcLoginLabel = "Sign in with Keycloak";
      upsertSettings.run(JSON.stringify(settings));
    })();

    db.pragma("wal_checkpoint(TRUNCATE)");
    db.close();

    const seeded = endpoints.filter((endpoint) => !endpoint.skipped);
    console.log(`[9router local LLM seed] ensured ${seeded.length}/${endpoints.length} endpoints and ${seeded.reduce((sum, endpoint) => sum + endpoint.models.length, 0)} models`);
    }

    main().catch((error) => {
      console.error(`[9router local LLM seed] ${error.message}`);
      process.exit(1);
    });
