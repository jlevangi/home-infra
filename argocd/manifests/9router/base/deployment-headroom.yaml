apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom
  namespace: 9router
  labels:
    app: headroom
    app.kubernetes.io/name: headroom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headroom
  template:
    metadata:
      labels:
        app: headroom
        app.kubernetes.io/name: headroom
    spec:
      containers:
        - name: headroom
          image: ghcr.io/chopratejas/headroom@sha256:50b85d8e320cfcdf1b38919bb7ae067b93ff7a8de0a93f05b2c1246370200d1c
          imagePullPolicy: IfNotPresent
          command:
            - headroom
            - proxy
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8787"
            - --openai-api-url
            - http://nine-router:20128/v1
            - --no-cache
            - --no-rate-limit
            - --no-ccr-inject-tool
            - --no-ccr-marker
          env:
            - name: HOME
              value: /tmp/headroom-home
            - name: HEADROOM_WORKSPACE_DIR
              value: /tmp/headroom-home/.headroom
            - name: HEADROOM_CONFIG_DIR
              value: /tmp/headroom-home/.headroom/config
            - name: HEADROOM_HOST
              value: 0.0.0.0
            - name: HEADROOM_PORT
              value: "8787"
            - name: OPENAI_TARGET_API_URL
              value: http://nine-router:20128/v1
            - name: HEADROOM_MODE
              value: token
            - name: HEADROOM_NO_CCR_INJECT_TOOL
              value: "1"
            - name: HEADROOM_NO_CCR_MARKER
              value: "1"
            - name: HEADROOM_TELEMETRY
              value: "off"
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          volumeMounts:
            - name: headroom-home
              mountPath: /tmp/headroom-home
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 6
      volumes:
        - name: headroom-home
          emptyDir: {}
