apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 9router-ingress
  namespace: 9router
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: 9router.levangie.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: 9router
                port:
                  number: 20128
