apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: linkding-config
    patch: |
      - op: replace
        path: /data/LD_CSRF_TRUSTED_ORIGINS
        value: "https://linkding.test.levangie.dev"
  - target:
      kind: Ingress
      name: linkding-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "linkding.test.levangie.dev"
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-test.levangie.dev"

labels:
  - pairs:
      environment: test
    includeSelectors: true
