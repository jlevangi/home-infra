apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: sissbruecker/linkding
    newTag: "1.45.0"
patches:
  - target:
      kind: PersistentVolumeClaim
      name: linkding-data-pvc
    patch: |
      - op: replace
        path: /spec/storageClassName
        value: longhorn-one-replica-flash
      - op: add
        path: /spec/volumeName
        value: linkding-data-pv
  - target:
      kind: Ingress
      name: linkding-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
