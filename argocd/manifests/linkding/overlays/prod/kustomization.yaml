apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: sissbruecker/linkding
    newTag: "1.45.0"
patchesStrategicMerge:
  - pvc-patch.yaml
patches:
  - target:
      kind: Ingress
      name: linkding-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
