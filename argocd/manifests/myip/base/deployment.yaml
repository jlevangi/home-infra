apiVersion: apps/v1
kind: Deployment
metadata:
  name: myip
  namespace: myip
  labels:
    app: myip
    app.kubernetes.io/name: myip
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myip
  template:
    metadata:
      labels:
        app: myip
        app.kubernetes.io/name: myip
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: myip
          image: jason5ng32/myip:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ALLOWED_DOMAINS
              value: myip.levangie.dev
          ports:
            - name: http
              containerPort: 18966
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
