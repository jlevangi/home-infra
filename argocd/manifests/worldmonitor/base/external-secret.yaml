apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: worldmonitor-secrets
  namespace: worldmonitor
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: worldmonitor-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/worldmonitor
