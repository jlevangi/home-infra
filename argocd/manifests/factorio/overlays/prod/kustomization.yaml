apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: factoriotools/factorio
    newTag: "2.0.76"
patches:
  # Use a stable LoadBalancer VIP for LAN access and fixed NodePorts for router forwarding.
  # Port forward on router: external 34197/UDP -> <stable-node-ip>:32097/UDP
  # Optional RCON forward: external 27015/TCP -> <stable-node-ip>:32015/TCP
  - target:
      kind: Deployment
      name: factorio
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/ports
        value:
          - containerPort: 34197
            protocol: UDP
            name: game
          - containerPort: 27015
            protocol: TCP
            name: rcon
  - target:
      kind: Service
      name: factorio
    patch: |
      - op: add
        path: /metadata/annotations
        value:
          metallb.universe.tf/loadBalancerIPs: 172.20.20.204
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /spec/externalTrafficPolicy
        value: Cluster
      - op: replace
        path: /spec/ports
        value:
          - name: game
            port: 34197
            targetPort: 34197
            protocol: UDP
            nodePort: 32097
          - name: rcon
            port: 27015
            targetPort: 27015
            protocol: TCP
            nodePort: 32015
  - target:
      kind: PersistentVolumeClaim
      name: factorio-data
    patch: |
      - op: add
        path: /spec/volumeName
        value: factorio-data
  # DNS hook - creates factorio.levangie.dev -> 172.20.20.204 (MetalLB VIP)
  - target:
      kind: Job
      name: factorio-dns-record
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "factorio"
      - op: replace
        path: /spec/template/spec/containers/0/env/4/value
        value: "172.20.20.204"
commonLabels:
  environment: prod
