apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # Pin Factorio to a specific node for stable hostPort access
  # Port forward on router: external 34197 -> 172.20.21.122:34197 (UDP)
  - target:
      kind: Deployment
      name: factorio
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: k3s-test-node-2
  # DNS hook - creates factorio.test.levangie.dev -> k3s-test.levangie.dev
  - target:
      kind: Job
      name: factorio-dns-record
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "factorio.test"
      - op: replace
        path: /spec/template/spec/containers/0/env/4/value
        value: "k3s-test"
labels:
  - pairs:
      environment: test
    includeSelectors: true
