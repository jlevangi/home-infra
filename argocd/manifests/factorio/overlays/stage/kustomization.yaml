apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: factoriotools/factorio
    newTag: "2.0.76"
patches:
  # Pin Factorio to a specific node for stable hostPort access
  # Port forward on router: external 34197 -> 172.20.20.112:34197 (UDP)
  - target:
      kind: Deployment
      name: factorio
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: k3s-stage-node-2
  # DNS hook - creates factorio.stage.levangie.dev -> 172.20.20.112 (node IP)
  - target:
      kind: Job
      name: factorio-dns-record
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "factorio.stage"
      - op: replace
        path: /spec/template/spec/containers/0/env/4/value
        value: "172.20.20.112"
commonLabels:
  environment: stage
