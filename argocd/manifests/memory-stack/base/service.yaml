apiVersion: v1
kind: Service
metadata:
  name: mem0-postgres
  namespace: memory-stack
spec:
  selector:
    app: mem0-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: mem0-api
  namespace: memory-stack
spec:
  selector:
    app: mem0-api
  ports:
    - name: http
      port: 8889
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: mem0-dashboard
  namespace: memory-stack
spec:
  selector:
    app: mem0-dashboard
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: mem0-api-lb
  namespace: memory-stack
spec:
  type: LoadBalancer
  loadBalancerIP: 172.20.20.206
  selector:
    app: mem0-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: letta
  namespace: memory-stack
spec:
  selector:
    app: letta
  ports:
    - name: http
      port: 8283
      targetPort: 8283
