apiVersion: apps/v1
kind: Deployment
metadata:
  name: letta
  namespace: memory-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: letta
  template:
    metadata:
      labels:
        app: letta
    spec:
      containers:
        - name: letta
          image: letta/letta:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: LETTA_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memory-stack-secrets
                  key: LETTA_SERVER_PASSWORD
            - name: LETTA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: memory-stack-secrets
                  key: LETTA_ENCRYPTION_KEY
            - name: LETTA_MEMFS_SERVICE_URL
              value: local
            - name: LETTA_PGDATA
              value: /var/lib/postgresql/data
            - name: LETTA_ENVIRONMENT
              value: DEV
            - name: POSTGRES_USER
              value: letta
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: memory-stack-secrets
                  key: LETTA_POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: letta
            - name: LMSTUDIO_BASE_URL
              value: http://llm.levangie.dev/v1
          ports:
            - name: http
              containerPort: 8283
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: letta-pgdata
