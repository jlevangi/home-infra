apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mem0-api-ingress
  namespace: memory-stack
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: pierce-pc.levangie.org
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /api-keys
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /memories
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /search
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /configure
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /reset
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /requests
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /entities
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /generate-instructions
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
    - host: mem0.levangie.org
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /api-keys
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /memories
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /search
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /configure
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /reset
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /requests
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /entities
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /generate-instructions
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
---
apiVersion: networking.k8s.io/v1
