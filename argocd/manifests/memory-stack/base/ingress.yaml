spec:
  ingressClassName: traefik
  rules:
    - host: pierce-pc.levangie.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: mem0-dashboard, port: {number: 3000}}}
    - host: mem0.levangie.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: mem0-dashboard, port: {number: 3000}}}
---
