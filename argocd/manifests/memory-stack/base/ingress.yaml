    - host: mem0.levangie.dev
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /api/auth
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /api-keys
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /memories
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /search
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /configure
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
          - path: /reset
            pathType: Prefix
            backend: {service: {name: mem0-api, port: {number: 8889}}}
