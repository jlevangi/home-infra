apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mem0-postgres-data
  namespace: memory-stack
  labels:
    app: memory-stack
    component: mem0-postgres
    recurring-job-group.longhorn.io/hourly: "enabled"
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn-tank
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: letta-pgdata
  namespace: memory-stack
  labels:
    app: memory-stack
    component: letta
    recurring-job-group.longhorn.io/hourly: "enabled"
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn-tank
