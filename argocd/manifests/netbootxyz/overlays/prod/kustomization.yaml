apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/netbootxyz/netbootxyz
    newTag: "0.7.6-nbxyz23"
patches:
  # Pin to a specific node for stable hostPort TFTP access (worker-2 retired 2026-10-03)
  - target:
      kind: Deployment
      name: netbootxyz
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: k3s-prod-worker-1
  - target:
      kind: PersistentVolumeClaim
      name: netbootxyz-data-pvc
    patch: |
      - op: add
        path: /spec/volumeName
        value: netbootxyz-data-pv
  - target:
      kind: Ingress
      name: netbootxyz-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
