apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbootxyz
  namespace: netbootxyz
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: netbootxyz
    app.kubernetes.io/name: netbootxyz
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netbootxyz
  template:
    metadata:
      labels:
        app: netbootxyz
        app.kubernetes.io/name: netbootxyz
    spec:
      initContainers:
        - name: stage-custom-config
          image: busybox:1.36
          # ConfigMap mounts are read-only, and the LSIO init process chowns
          # everything under custom-cont-init.d before running it (which
          # fails against a read-only mount). Copy onto the writable PVC
          # instead so ownership/exec bits can actually be set.
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /config/custom-cont-init.d /config/custom-assets
              cp /src-init/99-custom-nginx.sh /config/custom-cont-init.d/99-custom-nginx.sh
              chmod +x /config/custom-cont-init.d/99-custom-nginx.sh
              cp /src-menu/custom.ipxe /config/custom-assets/custom.ipxe
          volumeMounts:
            - name: netbootxyz-data
              mountPath: /config
              subPath: config
            - name: custom-init
              mountPath: /src-init
            - name: custom-menu
              mountPath: /src-menu
      containers:
        - name: netbootxyz
          image: ghcr.io/netbootxyz/netbootxyz:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "America/New_York"
            - name: WEB_APP_PORT
              value: "3000"
            - name: NGINX_PORT
              value: "80"
            - name: TFTPD_OPTS
              value: "--tftp-single-port"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: web-assets
              containerPort: 80
              protocol: TCP
            - name: tftp
              containerPort: 69
              protocol: UDP
          volumeMounts:
            - name: netbootxyz-data
              mountPath: /config
              subPath: config
            - name: netbootxyz-data
              mountPath: /assets
              subPath: assets
            - name: nas-isos
              mountPath: /isos
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: netbootxyz-data
          persistentVolumeClaim:
            claimName: netbootxyz-data-pvc
        - name: nas-isos
          nfs:
            server: 172.20.20.5
            path: /volume1/fileserver/ISOs
            readOnly: true
        - name: custom-init
          configMap:
            name: netbootxyz-custom-init
        - name: custom-menu
          configMap:
            name: netbootxyz-custom-menu
