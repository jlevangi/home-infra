apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbootxyz
  namespace: netbootxyz
  labels:
    app: netbootxyz
    app.kubernetes.io/name: netbootxyz
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netbootxyz
  template:
    metadata:
      labels:
        app: netbootxyz
        app.kubernetes.io/name: netbootxyz
    spec:
      containers:
        - name: netbootxyz
          image: lscr.io/linuxserver/netbootxyz:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
            - name: SUBFOLDER
              value: "/"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: web-assets
              containerPort: 80
              protocol: TCP
            - name: tftp
              containerPort: 69
              hostPort: 69
              protocol: UDP
          volumeMounts:
            - name: netbootxyz-data
              mountPath: /config
              subPath: config
            - name: netbootxyz-data
              mountPath: /assets
              subPath: assets
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: netbootxyz-data
          persistentVolumeClaim:
            claimName: netbootxyz-data-pvc
