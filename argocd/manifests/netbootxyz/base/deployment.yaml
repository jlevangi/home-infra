apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbootxyz
  namespace: netbootxyz
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: netbootxyz
    app.kubernetes.io/name: netbootxyz
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netbootxyz
  template:
    metadata:
      labels:
        app: netbootxyz
        app.kubernetes.io/name: netbootxyz
    spec:
      initContainers:
        - name: stage-custom-config
          image: busybox:1.36
          # This image runs supervisord directly with no custom-init-script
          # support, so nginx config is mounted straight into the main
          # container instead (see nginx-conf volume below). This init
          # container only needs to stage what has to land on the writable
          # PVC: the custom iPXE menu, and a one-time patch to boot.cfg so
          # menu.ipxe shows a "Custom URL Menu" entry pointing at it.
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /config/custom-assets
              cp /src-menu/custom.ipxe /config/custom-assets/custom.ipxe
              if ! grep -q '^set custom_url' /config/menus/boot.cfg; then
                sed -i '/^set site_name netboot.xyz/a set custom_url http://172.20.20.202/custom' /config/menus/boot.cfg
              fi
          volumeMounts:
            - name: netbootxyz-data
              mountPath: /config
              subPath: config
            - name: custom-menu
              mountPath: /src-menu
      containers:
        - name: netbootxyz
          image: ghcr.io/netbootxyz/netbootxyz:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "America/New_York"
            - name: WEB_APP_PORT
              value: "3000"
            - name: NGINX_PORT
              value: "80"
            - name: TFTPD_OPTS
              value: "--tftp-single-port"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: web-assets
              containerPort: 80
              protocol: TCP
            - name: tftp
              containerPort: 69
              protocol: UDP
          volumeMounts:
            - name: netbootxyz-data
              mountPath: /config
              subPath: config
            - name: netbootxyz-data
              mountPath: /assets
              subPath: assets
            - name: nas-isos
              mountPath: /isos
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/http.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: netbootxyz-data
          persistentVolumeClaim:
            claimName: netbootxyz-data-pvc
        - name: nas-isos
          nfs:
            server: 172.20.20.5
            path: /volume1/fileserver/ISOs
            readOnly: true
        - name: custom-menu
          configMap:
            name: netbootxyz-custom-menu
        - name: nginx-conf
          configMap:
            name: netbootxyz-nginx-conf
