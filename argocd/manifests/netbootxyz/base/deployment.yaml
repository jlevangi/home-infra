apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbootxyz
  namespace: netbootxyz
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: netbootxyz
    app.kubernetes.io/name: netbootxyz
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netbootxyz
  template:
    metadata:
      labels:
        app: netbootxyz
        app.kubernetes.io/name: netbootxyz
    spec:
      initContainers:
        - name: stage-custom-config
          image: busybox:1.36
          # nginx actually runs as `nginx -c /config/nginx/nginx.conf`, which
          # includes /config/nginx/site-confs/* - NOT /etc/nginx/http.d, and
          # NOT the /etc/nginx/nginx.conf that `nginx -T` shows by default
          # (that file/process isn't the one supervisord starts here). The
          # image's own init.sh only seeds site-confs/default if it's
          # missing ("[[ ! -f ... ]] &&"), so writing it here first via the
          # writable PVC mount sticks - a live ConfigMap mount at that path
          # doesn't, since some of this image's init steps write there too.
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /config/custom-assets /config/nginx/site-confs
              cp /src-menu/custom.ipxe /config/custom-assets/custom.ipxe
              cp /src-nginx/default.conf /config/nginx/site-confs/default
              if ! grep -q '^set custom_url' /config/menus/boot.cfg; then
                sed -i '/^set site_name netboot.xyz/a set custom_url http://172.20.20.202/custom' /config/menus/boot.cfg
              fi
          volumeMounts:
            - name: netbootxyz-data
              mountPath: /config
              subPath: config
            - name: custom-menu
              mountPath: /src-menu
            - name: nginx-conf
              mountPath: /src-nginx
      containers:
        - name: netbootxyz
          image: ghcr.io/netbootxyz/netbootxyz:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: "America/New_York"
            - name: WEB_APP_PORT
              value: "3000"
            - name: NGINX_PORT
              value: "80"
            - name: TFTPD_OPTS
              value: "--tftp-single-port"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: web-assets
              containerPort: 80
              protocol: TCP
            - name: tftp
              containerPort: 69
              protocol: UDP
          volumeMounts:
            - name: netbootxyz-data
              mountPath: /config
              subPath: config
            - name: netbootxyz-data
              mountPath: /assets
              subPath: assets
            - name: nas-isos
              mountPath: /isos
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: netbootxyz-data
          persistentVolumeClaim:
            claimName: netbootxyz-data-pvc
        - name: nas-isos
          nfs:
            server: 172.20.20.5
            path: /volume1/fileserver/ISOs
            readOnly: true
        - name: custom-menu
          configMap:
            name: netbootxyz-custom-menu
        - name: nginx-conf
          configMap:
            name: netbootxyz-nginx-conf
