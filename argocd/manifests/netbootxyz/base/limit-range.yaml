apiVersion: v1
kind: LimitRange
metadata:
  name: netbootxyz-storage-limits
  namespace: netbootxyz
spec:
  limits:
    - type: PersistentVolumeClaim
      max:
        storage: "1Gi"
      min:
        storage: "100Mi"
      default:
        storage: "1Gi"
      defaultRequest:
        storage: "1Gi"
