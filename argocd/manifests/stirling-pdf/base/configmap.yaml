apiVersion: v1
kind: ConfigMap
metadata:
  name: stirling-pdf-config
  namespace: stirling-pdf
data:
  DOCKER_ENABLE_SECURITY: "true"
  SECURITY_ENABLELOGIN: "true"
  SECURITY_LOGINMETHOD: "all"
  SECURITY_OAUTH2_ENABLED: "true"
  SECURITY_OAUTH2_AUTOCREATEUSER: "true"
  SECURITY_OAUTH2_CLIENT_KEYCLOAK_ISSUER: "https://auth.levangie.org/realms/master"
  SECURITY_OAUTH2_CLIENT_KEYCLOAK_CLIENTID: "stirling-pdf"
  SECURITY_OAUTH2_CLIENT_KEYCLOAK_SCOPES: "openid,profile,email"
  SECURITY_OAUTH2_CLIENT_KEYCLOAK_USEASUSERNAME: "email"
  SECURITY_SAML2_ENABLED: "false"
  SYSTEM_MAXFILESIZE: "500"
  SYSTEM_DEFAULTLOCALE: "en-US"
  TZ: "America/New_York"
  UI_APPNAME: "Stirling PDF"
  SECURITY_INITIALLOGIN_USERNAME: "pierce@levangie.org"
