apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-redundant
  annotations:
    description: "Canonical higher-redundancy Longhorn class for singleton state. longhorn-singleton is a legacy alias."
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  backupTargetName: default
  dataEngine: v1
  dataLocality: disabled
  disableRevisionCounter: "true"
  fromBackup: ""
  fsType: ext4
  nodeSelector: general-storage
  numberOfReplicas: "2"
  replicaAutoBalance: best-effort
  recurringJobSelector: '[{"name":"daily","isGroup":true},{"name":"weekly","isGroup":true}]'
  staleReplicaTimeout: "30"
  unmapMarkSnapChainRemoved: ignored
