# Legacy default Longhorn storage class.
#
# Owned by ArgoCD since home-infra-btv. The Longhorn helm chart's
# persistence.defaultClass is disabled so longhorn-manager doesn't
# fight on this object.
#
# `longhorn` is the canonical general-purpose class and remains the only default
# so manifests that still omit storageClassName keep their current behavior.
# `longhorn-general` remains as a legacy alias during the naming transition.
#
# numberOfReplicas=2 + replicaDiskSoftAntiAffinity=enabled.
#
# Was 3 (home-infra-rd0), chosen for a topology of 3 flash + 3 tank disks
# across workers 1/2/3; the 2026-05-30 spike (home-infra-pwo) verified that
# landed 2-tank + 1-flash deterministically. Two of those three Atlas workers
# are being retired (2026-08-17), so that rationale no longer holds, and with
# only three storage nodes left every 3-replica volume is forced onto all
# three — pushing k3s-prod-worker-4 past its DiskPressure threshold.
#
# Dropping to 2 also improves the flash:tank split for general volumes. Disk
# soft anti-affinity gave 2-tank + 1-flash at N=3; at N=2 it gives 1-flash +
# 1-tank, so less app data sits on the slow HDD pool.
#
# Note this still leaves one replica of every general volume on tank, so
# writes are gated by HDD latency. Pinning this class to flash would need more
# flash capacity than the post-retirement cluster has (~264G usable against
# ~308G of general replica data), so it stays cross-pool for now.
#
# Notes for downstream readers:
# - The StorageClass parameter accepts "enabled" / "disabled" / "ignored",
#   not "true" / "false". The cluster-level setting of the same name takes
#   booleans; the SC parameter does not. See bd memory
#   longhorn-sc-anti-affinity-value-format.
# - replicaAutoBalance:best-effort stays so Longhorn rebalances replicas
#   when a node drains or a disk fills.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn
  annotations:
    description: "Canonical general-purpose Longhorn class. Remains default; longhorn-general is a legacy alias during the naming transition."
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  replicaAutoBalance: best-effort
  replicaDiskSoftAntiAffinity: enabled
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: best-effort
  unmapMarkSnapChainRemoved: ignored
  disableRevisionCounter: "true"
  dataEngine: v1
  backupTargetName: default
  nodeSelector: general-storage
  recurringJobSelector: '[{"name":"daily","isGroup":true},{"name":"weekly","isGroup":true}]'
