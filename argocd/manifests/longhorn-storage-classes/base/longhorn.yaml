# Legacy default Longhorn storage class.
#
# Owned by ArgoCD since home-infra-btv. The Longhorn helm chart's
# persistence.defaultClass is disabled so longhorn-manager doesn't
# fight on this object.
#
# `longhorn` is the two-replica flash-backed default. Capacity and archival
# workloads must explicitly select `longhorn-tank`; the HDD pool is never an
# automatic spillover target for ordinary application state.
# `longhorn-general` remains as a compatibility alias.
#
# numberOfReplicas=2 + diskSelector=flash. This provides one replica on Atlas
# flash and one on the independent EliteDesk flash failure domain when space
# and anti-affinity permit.
#
# This replaces the former soft cross-pool policy. Mixed flash+tank replicas
# made every synchronous write wait for HDD latency and obscured workload
# intent. Existing Longhorn Volumes require an explicit one-volume-at-a-time
# selector reconciliation; changing this StorageClass only governs new ones.
#
# Notes for downstream readers:
# - The StorageClass parameter accepts "enabled" / "disabled" / "ignored",
#   not "true" / "false". The cluster-level setting of the same name takes
#   booleans; the SC parameter does not. See bd memory
#   longhorn-sc-anti-affinity-value-format.
# - replicaAutoBalance:best-effort stays so Longhorn rebalances replicas
#   when a node drains or a disk fills.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn
  annotations:
    description: "Default two-replica Longhorn class, pinned to flash. Capacity workloads must explicitly select longhorn-tank."
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  replicaAutoBalance: best-effort
  replicaDiskSoftAntiAffinity: enabled
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: best-effort
  unmapMarkSnapChainRemoved: ignored
  disableRevisionCounter: "true"
  dataEngine: v1
  backupTargetName: default
  diskSelector: flash
  nodeSelector: general-storage
  recurringJobSelector: '[{"name":"daily","isGroup":true},{"name":"weekly","isGroup":true}]'
