# Legacy steady-writer Longhorn storage class alias. All replicas pin to tank-tagged
# disks. Keep this for bound PVC compatibility while new manifests target longhorn-tank.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-steady
  annotations:
    description: "Legacy alias for the canonical longhorn-tank class. Both replicas land on tank disks."
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: best-effort
  unmapMarkSnapChainRemoved: ignored
  disableRevisionCounter: "true"
  dataEngine: v1
  backupTargetName: default
  diskSelector: tank
  recurringJobSelector: '[{"name":"daily","isGroup":true},{"name":"weekly","isGroup":true}]'
