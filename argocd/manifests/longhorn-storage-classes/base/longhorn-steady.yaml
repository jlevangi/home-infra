# Canonical steady-writer Longhorn storage class. All replicas pin to tank-tagged
# disks. Prefer this for heavy continuous writers.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-steady
  annotations:
    description: "Canonical steady-writer Longhorn storage (tank-pinned). Preferred target for new manifests; legacy alias is longhorn-tank."
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: best-effort
  unmapMarkSnapChainRemoved: ignored
  disableRevisionCounter: "true"
  dataEngine: v1
  backupTargetName: default
  diskSelector: tank
  recurringJobSelector: '[{"name":"daily","isGroup":true},{"name":"weekly","isGroup":true}]'
