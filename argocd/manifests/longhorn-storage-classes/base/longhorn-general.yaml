# Legacy general-purpose Longhorn storage class alias.
#
# During the naming transition, legacy `longhorn` remains the cluster default so
# existing manifests that still omit storageClassName keep binding the same way.
# New manifests should target `longhorn`; keep this alias for bound PVC compatibility.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-general
  annotations:
    description: "Legacy alias for the canonical longhorn class. Same 2-replica soft cross-pool placement."
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  replicaAutoBalance: best-effort
  replicaDiskSoftAntiAffinity: enabled
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: best-effort
  unmapMarkSnapChainRemoved: ignored
  disableRevisionCounter: "true"
  dataEngine: v1
  backupTargetName: default
  nodeSelector: general-storage
  recurringJobSelector: '[{"name":"daily","isGroup":true},{"name":"weekly","isGroup":true}]'
