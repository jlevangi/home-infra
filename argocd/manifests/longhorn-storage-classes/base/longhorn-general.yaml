# Compatibility alias for the flash-backed default Longhorn class.
# Keep for bound PVC compatibility; new manifests should use `longhorn-flash`
# when declaring the physical tier explicitly.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-general
  annotations:
    description: "Compatibility alias for the default two-replica flash-backed Longhorn class."
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  replicaAutoBalance: best-effort
  replicaDiskSoftAntiAffinity: enabled
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: ext4
  dataLocality: best-effort
  unmapMarkSnapChainRemoved: ignored
  disableRevisionCounter: "true"
  dataEngine: v1
  backupTargetName: default
  diskSelector: flash
  nodeSelector: general-storage
  recurringJobSelector: '[{"name":"daily","isGroup":true},{"name":"weekly","isGroup":true}]'
