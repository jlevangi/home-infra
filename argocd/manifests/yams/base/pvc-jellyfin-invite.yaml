apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-invite-data-pvc
  namespace: yams
  labels:
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
    app: jellyfin-invite
    volume-type: config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
  storageClassName: longhorn
