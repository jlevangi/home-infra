apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: yams-secrets
  namespace: yams
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: yams-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/yams
