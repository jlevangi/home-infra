apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  namespace: yams
  labels:
    app: seerr
    app.kubernetes.io/name: seerr
    app.kubernetes.io/part-of: yams
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seerr
  template:
    metadata:
      labels:
        app: seerr
        app.kubernetes.io/name: seerr
        app.kubernetes.io/part-of: yams
    spec:
      initContainers:
        - name: prepare-config
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /app/config/logs && chown -R 1000:1000 /app/config
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /app/config
      containers:
        - name: seerr
          # v3.3.0 — seerr-team only publishes :latest/:develop to GHCR, no semver tags
          image: ghcr.io/seerr-team/seerr@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: debug
            - name: TZ
              value: America/New_York
            - name: PORT
              value: "5055"
          ports:
            - name: http
              containerPort: 5055
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /app/config
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seerr-config-pvc
---
