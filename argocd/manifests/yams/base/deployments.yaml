apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: yams
  labels:
    app: qbittorrent
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/part-of: yams
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
        app.kubernetes.io/name: qbittorrent
        app.kubernetes.io/part-of: yams
    spec:
      # qBittorrent's lockfile + ipc-socket persist across pod restarts on
      # the config PVC. After an unclean SIGKILL (e.g. cluster shutdown),
      # the new pod sees the stale files, sends "show window" to the dead
      # IPC socket, and exits — s6 then crash-loops the process. Wiping
      # them on every pod start is safe because no qBittorrent instance is
      # actually running at this point.
      initContainers:
        - name: clear-stale-qbit-lock
          image: busybox:1.36
          command:
            - sh
            - -c
            - rm -f /config/qBittorrent/lockfile /config/qBittorrent/ipc-socket
          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
      containers:
        - name: gluetun
          image: ghcr.io/qdm12/gluetun:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: surfshark
            - name: VPN_TYPE
              value: openvpn
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: yams-secrets
                  key: OPENVPN_USER
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yams-secrets
                  key: OPENVPN_PASSWORD
            - name: SERVER_CITIES
              value: New York
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
          ports:
            - name: http-proxy
              containerPort: 8888
              protocol: TCP
            - name: shadowsocks-tcp
              containerPort: 8388
              protocol: TCP
            - name: shadowsocks-udp
              containerPort: 8388
              protocol: UDP
          volumeMounts:
            - name: gluetun-config
              mountPath: /config
            - name: dev-net-tun
              mountPath: /dev/net/tun
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: qbittorrent
          image: ghcr.io/linuxserver/qbittorrent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/New_York
            - name: WEB_UI_PORT
              value: "8080"
          ports:
            - name: qbit-http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: qbittorrent-config
              mountPath: /config
            - name: media
              mountPath: /downloads
              subPath: downloads/qbit
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: gluetun-config
          persistentVolumeClaim:
            claimName: qbittorrent-gluetun-config-pvc
        - name: qbittorrent-config
          persistentVolumeClaim:
            claimName: qbittorrent-config-pvc
        - name: media
          nfs:
            server: 172.20.20.5
            path: /volume1/media
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
