apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-invite-app
  namespace: yams
data:
  app.py: |
    import datetime as dt
    import json
    import os
    import secrets
    import sqlite3
    import urllib.error
    import urllib.parse
    import urllib.request
    from flask import Flask, jsonify, request

    DB = os.environ.get("DB_PATH", "/data/invites.sqlite3")
    ADMIN_TOKEN = os.environ["ADMIN_TOKEN"]
    KC_CLIENT_ID = os.environ["KEYCLOAK_CLIENT_ID"]
    KC_CLIENT_SECRET = os.environ["KEYCLOAK_CLIENT_SECRET"]
    KC_GROUP_ID = os.environ["KEYCLOAK_GROUP_ID"]
    KC_BASE = os.environ.get("KEYCLOAK_BASE", "https://auth.levangie.org")
    KC_REALM = os.environ.get("KEYCLOAK_REALM", "master")
    app = Flask(__name__)

    def now():
        return dt.datetime.now(dt.UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")

    def db():
        con = sqlite3.connect(DB)
        con.row_factory = sqlite3.Row
        con.execute("""create table if not exists invite_codes(
            code text primary key, note text, created_at text not null, expires_at text not null,
            used_at text, used_by_email text, revoked_at text)""")
        return con

    def rows(cur):
        return [dict(r) for r in cur.fetchall()]

    def need_admin():
        token = request.headers.get("X-Admin-Token") or request.headers.get("Authorization", "").removeprefix("Bearer ")
        if not secrets.compare_digest(token, ADMIN_TOKEN):
            return jsonify(ok=False, message="Unauthorized"), 401

    def http(method, url, token=None, body=None, form=None):
        data = None
        headers = {}
        if form is not None:
            data = urllib.parse.urlencode(form).encode()
            headers["Content-Type"] = "application/x-www-form-urlencoded"
        elif body is not None:
            data = json.dumps(body).encode()
            headers["Content-Type"] = "application/json"
        if token:
            headers["Authorization"] = "Bearer " + token
        req = urllib.request.Request(url, data=data, headers=headers, method=method)
        try:
            with urllib.request.urlopen(req, timeout=20) as res:
                raw = res.read().decode()
                return json.loads(raw) if raw else None
        except urllib.error.HTTPError as e:
            detail = e.read().decode(errors="replace")
            raise RuntimeError(f"Keycloak {e.code}: {detail[:300]}") from e

    def kc_token():
        url = f"{KC_BASE}/realms/master/protocol/openid-connect/token"
        return http("POST", url, form={"grant_type":"client_credentials","client_id":KC_CLIENT_ID,"client_secret":KC_CLIENT_SECRET})["access_token"]

    def kc_user(token, email):
        q = urllib.parse.urlencode({"email": email, "exact": "true"})
        users = http("GET", f"{KC_BASE}/admin/realms/{KC_REALM}/users?{q}", token=token)
        if users:
            return users[0]["id"]
        http("POST", f"{KC_BASE}/admin/realms/{KC_REALM}/users", token=token, body={
            "username": email, "email": email, "enabled": True, "emailVerified": False,
            "requiredActions": ["VERIFY_EMAIL", "UPDATE_PASSWORD"]})
        users = http("GET", f"{KC_BASE}/admin/realms/{KC_REALM}/users?{q}", token=token)
        if not users:
            raise RuntimeError("Created user was not found")
        return users[0]["id"]

    def grant_and_email(token, user_id):
        http("PUT", f"{KC_BASE}/admin/realms/{KC_REALM}/users/{user_id}/groups/{KC_GROUP_ID}", token=token)
        http("PUT", f"{KC_BASE}/admin/realms/{KC_REALM}/users/{user_id}/execute-actions-email", token=token, body=["VERIFY_EMAIL", "UPDATE_PASSWORD"])

    @app.get("/healthz")
    def healthz():
        return "ok\n"

    @app.get("/j/<code>")
    def join(code):
        return PAGE.replace("__CODE__", code)

    @app.get("/admin")
    def admin():
        return ADMIN_PAGE

    @app.post("/api/admin/invites")
    def create_invite():
        auth = need_admin()
        if auth: return auth
        data = request.get_json(silent=True) or {}
        days = max(1, min(90, int(data.get("expiresDays") or 14)))
        code = secrets.token_urlsafe(9).replace("-", "").replace("_", "")[:12].upper()
        expires = (dt.datetime.now(dt.UTC) + dt.timedelta(days=days)).replace(microsecond=0).isoformat().replace("+00:00", "Z")
        with db() as con:
            con.execute("insert into invite_codes(code,note,created_at,expires_at) values(?,?,?,?)", (code, data.get("note", "")[:200], now(), expires))
        return jsonify(ok=True, code=code, url=f"https://join.levangie.dev/j/{code}")

    @app.get("/api/admin/invites")
    def list_invites():
        auth = need_admin()
        if auth: return auth
        with db() as con:
            return jsonify(ok=True, invites=rows(con.execute("select * from invite_codes order by created_at desc limit 200")))

    @app.post("/api/admin/invites/<code>/revoke")
    def revoke_invite(code):
        auth = need_admin()
        if auth: return auth
        with db() as con:
            con.execute("update invite_codes set revoked_at=coalesce(revoked_at,?) where code=? and used_at is null", (now(), code.upper()))
        return jsonify(ok=True)

    @app.post("/api/activate")
    def activate():
        data = request.get_json(silent=True) or {}
        email = (data.get("email") or "").strip().lower()
        code = (data.get("code") or "").strip().upper()
        if "@" not in email or not code:
            return jsonify(ok=False, message="Email and invite code are required."), 400
        with db() as con:
            con.execute("begin immediate")
            invite = con.execute("select * from invite_codes where code=?", (code,)).fetchone()
            if not invite or invite["used_at"] or invite["revoked_at"] or invite["expires_at"] <= now():
                return jsonify(ok=False, message="Invite code is invalid, expired, used, or revoked."), 403
            token = kc_token()
            user_id = kc_user(token, email)
            grant_and_email(token, user_id)
            con.execute("update invite_codes set used_at=?, used_by_email=? where code=?", (now(), email, code))
        return jsonify(ok=True, message="Account has been created, and Jellyfin access granted. Please check your email to set a password.\n\nYou will sign in using Keycloak for:\n- jellyfin.levangie.org\n- request.levangie.org")

    PAGE = '''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Jellyfin</title><style>:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#0b1020;color:#eef2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,rgba(126,34,206,.35),transparent 32rem),radial-gradient(circle at 80% 90%,rgba(14,165,233,.28),transparent 28rem),#0b1020}main{width:min(100%,680px);border:1px solid rgba(148,163,184,.25);border-radius:28px;padding:clamp(28px,5vw,48px);background:rgba(15,23,42,.88);box-shadow:0 24px 80px rgba(0,0,0,.45);backdrop-filter:blur(16px)}h1{font-size:clamp(2.2rem,7vw,4rem);line-height:.95;margin:0 0 12px}.lede{color:#cbd5e1;font-size:1.08rem;line-height:1.65;margin-bottom:28px}label{display:block;font-weight:750;margin:18px 0 6px}input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #475569;background:#020617;color:#f8fafc;font:inherit}button,.btn{width:100%;margin-top:20px;padding:15px 18px;border:0;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#06b6d4);color:white;font:inherit;font-weight:850;cursor:pointer}.msg{white-space:pre-wrap;margin-top:22px;padding:16px;border-radius:16px;line-height:1.55}.ok{background:rgba(22,101,52,.45);border:1px solid rgba(134,239,172,.4)}.err{background:rgba(127,29,29,.48);border:1px solid rgba(252,165,165,.45)}.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:18px}.links a{text-align:center;text-decoration:none}.muted{color:#94a3b8;font-size:.95rem}</style></head><body><main><h1>Join Jellyfin</h1><p class="lede">Create your Keycloak account and unlock Jellyfin plus requests. Your invite code is already filled from the link you were sent.</p><form id="f"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required><label>Invite code</label><input id="code" value="__CODE__" readonly required><p class="muted">You will use Keycloak to sign in. No separate Jellyfin password needed.</p><button>Create account and grant access</button></form><div id="m" class="msg" hidden></div><div id="next" hidden><div class="links"><a class="btn" href="https://jellyfin.levangie.org">Open Jellyfin</a><a class="btn" href="https://request.levangie.org">Open Requests</a></div></div></main><script>f.onsubmit=async e=>{e.preventDefault();m.hidden=false;m.className='msg';m.textContent='Creating account...';try{let r=await fetch('/api/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,code:code.value})});let j=await r.json();if(!r.ok||!j.ok)throw Error(j.message||'Activation failed.');f.hidden=true;m.className='msg ok';m.textContent=j.message;next.hidden=false;}catch(x){m.className='msg err';m.textContent=x.message||'Activation failed. Contact Pierce.'}}</script></body></html>'''
    ADMIN_PAGE = '''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jellyfin Invites</title><style>:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#090e1a;color:#e5e7eb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 5%,rgba(139,92,246,.28),transparent 30rem),radial-gradient(circle at 90% 10%,rgba(6,182,212,.18),transparent 28rem),#090e1a}.wrap{max-width:1180px;margin:0 auto;padding:32px 20px}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}.card{border:1px solid rgba(148,163,184,.22);border-radius:28px;background:rgba(15,23,42,.92);box-shadow:0 24px 80px rgba(0,0,0,.38);padding:26px;backdrop-filter:blur(18px);animation:rise .45s cubic-bezier(.2,.8,.2,1)}.login{max-width:480px;margin:12vh auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}h1{margin:0;font-size:clamp(1.9rem,4vw,3rem);letter-spacing:-.04em}.muted{color:#94a3b8}.grid{display:grid;grid-template-columns:2fr 1fr auto;gap:12px;align-items:end;margin:22px 0}input{width:100%;min-height:48px;padding:12px 14px;border-radius:14px;border:1px solid #475569;background:#020617;color:#f8fafc;font:inherit}button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:128px;min-height:44px;padding:11px 15px;border:0;border-radius:14px;background:#2563eb;color:white;font:inherit;font-weight:850;cursor:pointer;transition:transform .15s,filter .15s}button:hover{transform:translateY(-1px);filter:brightness(1.08)}button.secondary{background:#334155}button.danger{background:#991b1b}.primary{background:linear-gradient(135deg,#8b5cf6,#06b6d4);min-width:160px}.hidden{display:none!important}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.stat{border:1px solid rgba(148,163,184,.14);border-radius:18px;padding:15px;background:rgba(15,23,42,.5)}.stat b{display:block;font-size:1.8rem}.table-wrap{overflow:auto;border:1px solid rgba(148,163,184,.14);border-radius:18px}.table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:15px 14px;border-bottom:1px solid rgba(148,163,184,.14);vertical-align:middle}tbody tr:hover{background:rgba(30,41,59,.45)}th{color:#94a3b8;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}.pill{border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:900;text-transform:capitalize}.active{background:#164e63;color:#a5f3fc}.used{background:#14532d;color:#bbf7d0}.expired,.revoked{background:#7f1d1d;color:#fecaca}.invite-link{max-width:390px;min-height:38px;padding:8px 11px;border:1px solid rgba(96,165,250,.28);border-radius:12px;background:rgba(15,23,42,.75);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#bfdbfe;cursor:pointer}.invite-link:hover{background:rgba(30,64,175,.25);border-color:rgba(96,165,250,.6)}.toast{position:fixed;right:18px;bottom:18px;padding:13px 16px;border:1px solid rgba(134,239,172,.35);border-radius:14px;background:rgba(20,83,45,.94)}@media(max-width:820px){.grid,.stats{grid-template-columns:1fr}.top{display:block}button{width:100%}.toolbar button{width:auto}}</style></head><body><div class="wrap"><section id="login" class="card login"><h1>Jellyfin invite admin</h1><p class="muted">Password required. The invite dashboard and controls stay hidden until unlocked.</p><input id="token" type="password" autocomplete="current-password" placeholder="Password" autofocus><p><button class="primary" onclick="unlock()">Unlock dashboard</button></p><p id="loginStatus" class="muted"></p></section><main id="app" class="card hidden"><div class="top"><div><h1>Jellyfin invites</h1><p class="muted">Create invite links and track whether they are active, used, expired, or revoked.</p></div><div class="toolbar"><button class="secondary" onclick="list()">Refresh</button><button class="secondary" onclick="lock()">Lock</button></div></div><div class="stats"><div class="stat"><b id="activeCount">0</b><span class="muted">Active</span></div><div class="stat"><b id="usedCount">0</b><span class="muted">Used</span></div><div class="stat"><b id="expiredCount">0</b><span class="muted">Expired</span></div><div class="stat"><b id="revokedCount">0</b><span class="muted">Revoked</span></div></div><div class="grid"><input id="note" placeholder="Friend name or context"><input id="days" type="number" min="1" max="90" value="14"><button class="primary" onclick="create()">Create invite</button></div><p id="status" class="muted"></p><div class="table-wrap"><table class="table"><thead><tr><th>Status</th><th>Invite link</th><th>Note</th><th>Expires</th><th>Used by</th><th>Actions</th></tr></thead><tbody id="out"></tbody></table></div></main></div><div id="toast" class="toast hidden"></div><script>token.value=sessionStorage.inviteToken||'';function headers(){return {'X-Admin-Token':sessionStorage.inviteToken||token.value,'Content-Type':'application/json'}}async function api(u,o={}){let r=await fetch(u,{...o,headers:headers()});let j=await r.json();if(!r.ok||!j.ok)throw Error(j.message||'Request failed');return j}function state(i){let now=new Date();if(i.revoked_at)return 'revoked';if(i.used_at)return 'used';if(new Date(i.expires_at)<now)return 'expired';return 'active'}function say(v){toast.textContent=v;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),1800)}async function copy(v){await navigator.clipboard?.writeText(v);say('Invite link copied')}function row(i){let st=state(i),url='https://join.levangie.dev/j/'+i.code;return `<tr><td><span class="pill ${st}">${st}</span></td><td><button class="invite-link" title="Click to copy" onclick="copy('${url}')">${url}</button></td><td>${i.note||''}</td><td>${new Date(i.expires_at).toLocaleString()}</td><td>${i.used_by_email||''}</td><td>${st==='active'?`<button class="danger" onclick="revoke('${i.code}')">Revoke</button>`:''}</td></tr>`}function counts(items){let c={active:0,used:0,expired:0,revoked:0};items.forEach(i=>c[state(i)]++);activeCount.textContent=c.active;usedCount.textContent=c.used;expiredCount.textContent=c.expired;revokedCount.textContent=c.revoked}async function unlock(){try{sessionStorage.inviteToken=token.value;await list();login.classList.add('hidden');app.classList.remove('hidden')}catch(e){loginStatus.textContent=e.message}}function lock(){sessionStorage.removeItem('inviteToken');token.value='';app.classList.add('hidden');login.classList.remove('hidden')}async function list(){let j=await api('/api/admin/invites');counts(j.invites);out.innerHTML=j.invites.map(row).join('')||'<tr><td colspan=6 class=muted>No invites yet.</td></tr>'}async function create(){try{let j=await api('/api/admin/invites',{method:'POST',body:JSON.stringify({note:note.value,expiresDays:days.value})});status.textContent='Created '+j.url;await copy(j.url);note.value='';await list()}catch(e){status.textContent=e.message}}async function revoke(c){if(!confirm('Revoke this invite?'))return;await api('/api/admin/invites/'+c+'/revoke',{method:'POST'});say('Invite revoked');await list()}if(token.value)unlock();</script></body></html>'''


    if __name__ == "__main__":
        app.run(host="0.0.0.0", port=8080)
