apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: ExternalSecret
      name: yams-secrets
    patch: |
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: "test/yams"
  - target:
      kind: Deployment
      name: wizarr
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "https://join.test.levangie.dev"
  - target:
      kind: Ingress
      name: tautulli-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "tautulli.test.levangie.dev"
  - target:
      kind: Ingress
      name: seerr-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "seerr.test.levangie.dev"
  - target:
      kind: Ingress
      name: jellyseerr-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "jellyseerr.test.levangie.dev"
  - target:
      kind: Ingress
      name: overseerr-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "request.test.levangie.dev"
  - target:
      kind: Ingress
      name: qbittorrent-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "torrent.test.levangie.dev"
  - target:
      kind: Ingress
      name: nzbget-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "nzbget.test.levangie.dev"
  - target:
      kind: Ingress
      name: sonarr-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "sonarr.test.levangie.dev"
  - target:
      kind: Ingress
      name: radarr-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "radarr.test.levangie.dev"
  - target:
      kind: Ingress
      name: radarr4k-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "radarr4k.test.levangie.dev"
  - target:
      kind: Ingress
      name: bazarr-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "bazarr.test.levangie.dev"
  - target:
      kind: Ingress
      name: prowlarr-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "prowlarr.test.levangie.dev"
  - target:
      kind: Ingress
      name: wizarr-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "join.test.levangie.dev"
      - op: replace
        path: /spec/rules/1/host
        value: "wizarr.test.levangie.dev"
  - target:
      kind: Ingress
      name: maintainerr-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "maintainerr.test.levangie.dev"
  - target:
      kind: Ingress
      name: flaresolverr-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "flaresolverr.test.levangie.dev"
  - target:
      kind: Ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-test.levangie.dev"
labels:
  - pairs:
      environment: test
    includeSelectors: true
