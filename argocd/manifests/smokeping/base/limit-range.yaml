apiVersion: v1
kind: LimitRange
metadata:
  name: smokeping-storage-limits
  namespace: smokeping
spec:
  limits:
    - type: PersistentVolumeClaim
      max:
        storage: "1Gi"
      min:
        storage: "100Mi"
      default:
        storage: "1Gi"
      defaultRequest:
        storage: "1Gi"
