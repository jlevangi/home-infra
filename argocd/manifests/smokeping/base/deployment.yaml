apiVersion: apps/v1
kind: Deployment
metadata:
  name: smokeping
  namespace: smokeping
  labels:
    app: smokeping
    app.kubernetes.io/name: smokeping
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: smokeping
  template:
    metadata:
      labels:
        app: smokeping
        app.kubernetes.io/name: smokeping
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: smokeping
          image: lscr.io/linuxserver/smokeping:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: smokeping-data
              mountPath: /config
              subPath: config
            - name: smokeping-data
              mountPath: /data
              subPath: data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: smokeping-data
          persistentVolumeClaim:
            claimName: smokeping-data-pvc
