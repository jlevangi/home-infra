apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: frigate
resources:
  - namespace.yaml
  - external-secret.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml
  - ingress.yaml
  - frigate-networkpolicy.yaml
configMapGenerator:
  - name: frigate-config
    files:
      - config.yml
  - name: frigate-oauth2-proxy-alpha
    files:
      - alpha.yaml=oauth2-proxy-alpha.yaml
