apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frigate-backend-access
  namespace: frigate
spec:
  podSelector:
    matchLabels:
      app: frigate
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frigate
              frigate.levangie.dev/proxy: "true"
      ports:
        - protocol: TCP
          port: 8971
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frigate-proxy-ingress
  namespace: frigate
spec:
  podSelector:
    matchLabels:
      app: frigate
      frigate.levangie.dev/proxy: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 4180
