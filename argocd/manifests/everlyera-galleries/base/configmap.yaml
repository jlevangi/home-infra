apiVersion: v1
kind: ConfigMap
metadata:
  name: everlyera-gallery-config
  namespace: everlyera-galleries
data:
  TZ: "America/New_York"
  DB_HOSTNAME: "everlyera-gallery-postgres"
  DB_USERNAME: "postgres"
  DB_DATABASE_NAME: "immich"
  REDIS_HOSTNAME: "everlyera-gallery-redis"
  DISABLE_REVERSE_GEOCODING: "false"
  REVERSE_GEOCODING_PRECISION: "3"
  PUBLIC_LOGIN_PAGE_MESSAGE: "Everly Era Photography client galleries"
  IMMICH_WEB_URL: "http://everlyera-gallery-server:2283"
  IMMICH_SERVER_URL: "http://everlyera-gallery-server:2283"
  IMMICH_MACHINE_LEARNING_URL: "http://everlyera-gallery-machine-learning:3003"
  IMMICH_API_URL_EXTERNAL: "https://gallery.everlyera.com"
