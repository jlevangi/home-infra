apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: everlyera-gallery-secrets
  namespace: everlyera-galleries
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: everlyera-gallery-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/everlyera-galleries
