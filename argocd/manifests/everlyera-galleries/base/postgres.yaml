apiVersion: apps/v1
kind: Deployment
metadata:
  name: everlyera-gallery-postgres
  namespace: everlyera-galleries
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: everlyera-gallery-postgres
  template:
    metadata:
      labels:
        app: everlyera-gallery-postgres
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        - name: prepare-data
          image: busybox:1.38
          command: [sh, -c, "mkdir -p /mnt/db/pgdata && chown -R 999:999 /mnt/db/pgdata"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: db-data
              mountPath: /mnt/db
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
          securityContext:
            runAsUser: 999
            runAsGroup: 999
          env:
            - { name: POSTGRES_USER, value: postgres }
            - { name: POSTGRES_DB, value: immich }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: everlyera-gallery-secrets
                  key: DB_PASSWORD
            - { name: POSTGRES_INITDB_ARGS, value: "--data-checksums" }
          ports:
            - { name: postgres, containerPort: 5432 }
          readinessProbe:
            tcpSocket: { port: postgres }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: postgres }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: everlyera-gallery-db-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: everlyera-gallery-postgres
  namespace: everlyera-galleries
spec:
  selector:
    app: everlyera-gallery-postgres
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
