apiVersion: v1
kind: ResourceQuota
metadata:
  name: everlyera-gallery-storage-quota
  namespace: everlyera-galleries
spec:
  hard:
    requests.storage: "25Gi"
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: everlyera-gallery-storage-limits
  namespace: everlyera-galleries
spec:
  limits:
    - type: PersistentVolumeClaim
      max:
        storage: "20Gi"
      min:
        storage: "100Mi"
      default:
        storage: "1Gi"
      defaultRequest:
        storage: "1Gi"
