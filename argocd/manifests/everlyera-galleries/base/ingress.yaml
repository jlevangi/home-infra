apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: everlyera-gallery-ingress
  namespace: everlyera-galleries
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
    traefik.ingress.kubernetes.io/router.tls.domains.0.main: gallery.everlyera.com
spec:
  ingressClassName: traefik
  tls:
    - hosts: [gallery.everlyera.com]
  rules:
    - host: gallery.everlyera.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: everlyera-gallery-server
                port:
                  number: 2283
