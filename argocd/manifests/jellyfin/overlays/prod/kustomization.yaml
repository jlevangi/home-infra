apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Ingress
      name: jellyfin-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
  - target:
      kind: Ingress
      name: tracearr-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
  # TEMPORARY: keep deployments scaled to 0 until LXC data is rsynced into the PVCs.
  # Remove these patches after pre-stage rsync completes to allow pods to start.
  - target:
      kind: Deployment
      name: jellyfin
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: tracearr
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0
commonLabels:
  environment: prod
