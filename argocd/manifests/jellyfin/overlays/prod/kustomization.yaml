apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Ingress
      name: jellyfin-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
  - target:
      kind: Ingress
      name: tracearr-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
  # Temporary CPU-only placement while the GPU node awaits a reboot to load
  # matching NVIDIA 535.309 kernel and userspace drivers.
  - target:
      kind: Deployment
      name: jellyfin
    patch: |
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - k3s-prod-worker-gpu-1
  - target:
      kind: PersistentVolumeClaim
      name: tracearr-data-pvc
    patch: |
      - op: add
        path: /spec/volumeName
        value: tracearr-data-pv
images:
  - name: lscr.io/linuxserver/jellyfin
    newTag: "12.0ubu2604-ls48"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
