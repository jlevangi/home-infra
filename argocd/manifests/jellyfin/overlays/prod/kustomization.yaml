apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: Ingress
      name: jellyfin-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
  - target:
      kind: Ingress
      name: tracearr-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
  - target:
      kind: Deployment
      name: jellyfin
    patch: |
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: nvidia
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          accelerator: nvidia
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: accelerator
            operator: Equal
            value: nvidia
            effect: NoSchedule
      - op: add
        path: /spec/template/spec/containers/0/resources/requests/nvidia.com~1gpu
        value: 1
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
        value: 1
  - target:
      kind: PersistentVolumeClaim
      name: tracearr-data-pvc
    patch: |
      - op: add
        path: /spec/volumeName
        value: tracearr-data-pv
images:
  - name: lscr.io/linuxserver/jellyfin
    newTag: "10.11.11"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
