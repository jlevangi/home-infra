---
# Jellyfin stores its library SQLite db on this PVC. Uses longhorn-redundant
# (3 replicas, excludes GPU worker) because Jellyfin is single-pod /
# single-db; a volume going faulted (vs degraded) crashes the pod.
# Migrated from the old longhorn-media SC on 2026-05-22 — see
# argocd/manifests/longhorn-redundant-sc/README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-pvc-rdn
  namespace: jellyfin
  labels:
    app: jellyfin
    volume-type: config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 80Gi
  storageClassName: longhorn-redundant
