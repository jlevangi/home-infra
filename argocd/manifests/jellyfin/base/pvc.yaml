# DESIRED FUTURE STATE: storageClassName should become `longhorn-redundant`
# (numberOfReplicas: 3, nodeSelector: general-storage). The SC is defined
# in argocd/manifests/longhorn-redundant-sc/; migration steps in that
# folder's README.md.
#
# CURRENT STATE: still bound to `longhorn-media` (single-replica-style
# placement). The Longhorn Volume CRD was live-patched on 2026-05-20 to
# match the desired state (numberOfReplicas: 3, nodeSelector:
# [general-storage]) — the patch holds across reboots, but IaC + runtime
# state diverge until we migrate. Patch command:
#
#   kubectl patch volume.longhorn.io jellyfin-config -n longhorn-system \
#     --type=merge \
#     -p '{"spec":{"numberOfReplicas":3,"nodeSelector":["general-storage"]}}'
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-pvc
  namespace: jellyfin
  labels:
    app: jellyfin
    volume-type: config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 80Gi
  storageClassName: longhorn-media
