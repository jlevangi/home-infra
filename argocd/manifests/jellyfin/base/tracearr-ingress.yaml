apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tracearr-ingress
  namespace: jellyfin
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: tracearr.levangie.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracearr
                port:
                  number: 3000
