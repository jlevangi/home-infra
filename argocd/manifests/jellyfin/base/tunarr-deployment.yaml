apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunarr
  namespace: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tunarr
  template:
    metadata:
      labels:
        app: tunarr
    spec:
      containers:
        - name: tunarr
          image: chrisbenincasa/tunarr:1.3.15
          imagePullPolicy: IfNotPresent
          args:
            - server
            - --database
            - /config/tunarr
          ports:
            - containerPort: 8000
              protocol: TCP
              name: http
          env:
            - name: TZ
              value: "America/New_York"
            - name: TUNARR_SERVER_TRUST_PROXY
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /api/version
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/version
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/version
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config/tunarr
            - name: media
              mountPath: /data/tvshows
              subPath: tv
              readOnly: true
            - name: media
              mountPath: /data/movies
              subPath: movies
              readOnly: true
            - name: media
              mountPath: /data/anime
              subPath: anime
              readOnly: true
            - name: media
              mountPath: /data/music
              subPath: music
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: tunarr-config-pvc
        - name: media
          nfs:
            server: 172.20.20.5
            path: /volume1/media
