apiVersion: v1
kind: LimitRange
metadata:
  name: jellyfin-storage-limits
  namespace: jellyfin
spec:
  limits:
    - type: PersistentVolumeClaim
      max:
        storage: "100Gi"
      min:
        storage: "100Mi"
      default:
        storage: "80Gi"
      defaultRequest:
        storage: "80Gi"
