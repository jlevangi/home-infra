apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8096
              protocol: TCP
              name: http
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
            - name: JELLYFIN_PublishedServerUrl
              value: "https://jellyfin.levangie.org"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 6000m
              memory: 6Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data/tvshows
              subPath: tv
              readOnly: true
            - name: media
              mountPath: /data/movies
              subPath: movies
              readOnly: true
            - name: media
              mountPath: /data/anime
              subPath: anime
              readOnly: true
            - name: media
              mountPath: /data/music
              subPath: music
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config-pvc
        - name: media
          nfs:
            server: 172.20.20.5
            path: /volume1/media
