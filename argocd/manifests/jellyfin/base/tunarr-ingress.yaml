apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tunarr-ingress
  namespace: jellyfin
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: tunarr.levangie.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tunarr
                port:
                  number: 8000
