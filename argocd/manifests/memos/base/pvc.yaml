apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memos-data-pvc
  namespace: memos
  labels:
    app: memos
    recurring-job.longhorn.io/source: "enabled"
    recurring-job-group.longhorn.io/hourly: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
