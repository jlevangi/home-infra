apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: neosmemo/memos
    newTag: "0.27.1"
patches:
  - target:
      kind: Ingress
      name: memos-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
commonLabels:
  environment: prod
