apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: neosmemo/memos
    newTag: "0.30.0"
patches:
  - target:
      kind: PersistentVolumeClaim
      name: memos-data-v3-pvc
    patch: |
      - op: add
        path: /spec/volumeName
        value: memos-data-v3-pv
      - op: replace
        path: /spec/storageClassName
        value: longhorn-one-replica-flash
      - op: add
        path: /metadata/labels/recurring-job-group.longhorn.io~1hourly
        value: "enabled"
  - target:
      kind: Ingress
      name: memos-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
