apiVersion: v1
kind: PersistentVolume
metadata:
  name: alist-fileserver
  labels:
    app.kubernetes.io/name: alist
    storage.levangie.dev/source: fileserver
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: alist-nfs
  mountOptions:
    - nfsvers=4.1
    - hard
  nfs:
    server: 172.20.20.5
    path: /volume1/fileserver
