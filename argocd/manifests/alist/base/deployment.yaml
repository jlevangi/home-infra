apiVersion: apps/v1
kind: Deployment
metadata:
  name: alist
  namespace: alist
  labels:
    app.kubernetes.io/name: alist
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alist
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alist
      annotations:
        alist.levangie.dev/config-revision: "1"
    spec:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: alist
          image: xhofe/alist:v3.63.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK
              value: "022"
          ports:
            - name: http
              containerPort: 5244
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /opt/alist/data
            - name: fileserver
              mountPath: /srv
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: alist-data
        - name: fileserver
          persistentVolumeClaim:
            claimName: alist-fileserver
