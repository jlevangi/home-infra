apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alist-data
  namespace: alist
  labels:
    app.kubernetes.io/name: alist
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn-redundant
