apiVersion: v1
kind: ConfigMap
metadata:
  name: plausible-config
  namespace: plausible
data:
  BASE_URL: "https://plausible.levangie.dev"
  HTTP_PORT: "8000"
  DISABLE_REGISTRATION: "invite_only"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "plausible_db"
  POSTGRES_HOST: "plausible-postgres"
  CLICKHOUSE_DATABASE_URL: "http://plausible-clickhouse:8123/plausible_events_db"
  TZ: "America/New_York"
  # ClickHouse config - minimal adjustments
  clickhouse-ipv4-only.xml: |
    <clickhouse>
      <listen_host>0.0.0.0</listen_host>
    </clickhouse>
  clickhouse-low-resources.xml: |
    <clickhouse>
      <max_server_memory_usage>1073741824</max_server_memory_usage>
      <max_concurrent_queries>100</max_concurrent_queries>
    </clickhouse>
