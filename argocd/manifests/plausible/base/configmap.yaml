apiVersion: v1
kind: ConfigMap
metadata:
  name: plausible-config
  namespace: plausible
data:
  BASE_URL: "https://plausible.levangie.dev"
  HTTP_PORT: "8000"
  DISABLE_REGISTRATION: "invite_only"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "plausible_db"
  POSTGRES_HOST: "plausible-postgres"
  CLICKHOUSE_DATABASE_URL: "http://plausible-clickhouse:8123/plausible_events_db"
  TZ: "America/New_York"
  # ClickHouse config - keep below 3Gi container limit while allowing Plausible stats queries to finish
  clickhouse-ipv4-only.xml: |
    <clickhouse>
      <listen_host>0.0.0.0</listen_host>
    </clickhouse>
  clickhouse-low-resources.xml: |
    <clickhouse>
      <logger>
        <level>warning</level>
      </logger>
      <max_server_memory_usage>2147483648</max_server_memory_usage>
      <max_concurrent_queries>20</max_concurrent_queries>
    </clickhouse>
  clickhouse-log-retention.xml: |
    <clickhouse>
      <text_log>
        <database>system</database>
        <table>text_log</table>
        <partition_by>toYYYYMM(event_date)</partition_by>
        <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        <flush_interval_milliseconds>7500</flush_interval_milliseconds>
      </text_log>
      <metric_log>
        <database>system</database>
        <table>metric_log</table>
        <engine>Engine = MergeTree PARTITION BY toYYYYMM(event_date) ORDER BY (event_date, event_time) TTL event_date + INTERVAL 7 DAY DELETE</engine>
      </metric_log>
      <asynchronous_metric_log>
        <database>system</database>
        <table>asynchronous_metric_log</table>
        <engine>Engine = MergeTree PARTITION BY toYYYYMM(event_date) ORDER BY (event_date, event_time) TTL event_date + INTERVAL 7 DAY DELETE</engine>
      </asynchronous_metric_log>
    </clickhouse>
