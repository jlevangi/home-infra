apiVersion: apps/v1
kind: Deployment
metadata:
  name: plausible
  namespace: plausible
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plausible
  template:
    metadata:
      labels:
        app: plausible
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        - name: prepare-data
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /var/lib/plausible/tmp && chown -R 999:999 /var/lib/plausible
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: plausible-data
              mountPath: /var/lib/plausible
      containers:
        - name: plausible
          image: ghcr.io/plausible/community-edition:v3.2.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plausible-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: plausible-secrets
                  key: SECRET_KEY_BASE
            - name: TOTP_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: plausible-secrets
                  key: TOTP_VAULT_KEY
            - name: CLICKHOUSE_DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: plausible-config
                  key: CLICKHOUSE_DATABASE_URL
            - name: BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: plausible-config
                  key: BASE_URL
            - name: HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: plausible-config
                  key: HTTP_PORT
            - name: DISABLE_REGISTRATION
              valueFrom:
                configMapKeyRef:
                  name: plausible-config
                  key: DISABLE_REGISTRATION
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: plausible-config
                  key: TZ
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: plausible-data
              mountPath: /var/lib/plausible
      volumes:
        - name: plausible-data
          emptyDir: {}
