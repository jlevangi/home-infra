apiVersion: batch/v1
kind: CronJob
metadata:
  name: plausible-clickhouse-log-retention
  namespace: plausible
spec:
  schedule: "17 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: apply-retention
              image: clickhouse/clickhouse-server:24.12-alpine
              command:
                - clickhouse-client
                - --host=plausible-clickhouse
                - --database=system
                - --multiquery
                - --query
                - |
                  ALTER TABLE text_log MODIFY TTL event_date + INTERVAL 1 DAY DELETE;
                  ALTER TABLE metric_log MODIFY TTL event_date + INTERVAL 1 DAY DELETE;
                  ALTER TABLE asynchronous_metric_log MODIFY TTL event_date + INTERVAL 1 DAY DELETE;
                  ALTER TABLE query_log MODIFY TTL event_date + INTERVAL 1 DAY DELETE;
                  ALTER TABLE processors_profile_log MODIFY TTL event_date + INTERVAL 1 DAY DELETE;
                  ALTER TABLE trace_log MODIFY TTL event_date + INTERVAL 1 DAY DELETE;
              resources:
                requests:
                  cpu: "10m"
                  memory: "64Mi"
                limits:
                  cpu: "100m"
                  memory: "128Mi"
