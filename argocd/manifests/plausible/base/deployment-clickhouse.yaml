apiVersion: apps/v1
kind: Deployment
metadata:
  name: plausible-clickhouse
  namespace: plausible
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plausible-clickhouse
  template:
    metadata:
      labels:
        app: plausible-clickhouse
    spec:
      securityContext:
        fsGroup: 101
      initContainers:
        - name: prepare-data
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - mkdir -p /var/lib/clickhouse /var/log/clickhouse-server && chown -R 101:101 /var/lib/clickhouse /var/log/clickhouse-server
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: event-data
              mountPath: /var/lib/clickhouse
            - name: event-logs
              mountPath: /var/log/clickhouse-server
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.12-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_SKIP_USER_SETUP
              value: "1"
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "3000m"
              memory: "3Gi"
          volumeMounts:
            - name: event-data
              mountPath: /var/lib/clickhouse
            - name: event-logs
              mountPath: /var/log/clickhouse-server
            - name: clickhouse-config
              mountPath: /etc/clickhouse-server/config.d/ipv4-only.xml
              subPath: clickhouse-ipv4-only.xml
              readOnly: true
            - name: clickhouse-config
              mountPath: /etc/clickhouse-server/config.d/low-resources.xml
              subPath: clickhouse-low-resources.xml
              readOnly: true
      volumes:
        - name: event-data
          persistentVolumeClaim:
            claimName: plausible-clickhouse-pvc
        - name: event-logs
          emptyDir: {}
        - name: clickhouse-config
          configMap:
            name: plausible-config
