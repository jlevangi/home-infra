apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: postgres
    newTag: "18-alpine"
  - name: clickhouse/clickhouse-server
    newTag: "26.5-alpine"
  - name: ghcr.io/plausible/community-edition
    newTag: v3.2.1
patches:
  - target:
      kind: Ingress
      name: plausible-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
