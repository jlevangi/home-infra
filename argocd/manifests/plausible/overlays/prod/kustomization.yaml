apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: postgres
    newTag: "16-alpine"
  - name: clickhouse/clickhouse-server
    newTag: "24.12-alpine"
  - name: ghcr.io/plausible/community-edition
    newTag: v3.2.1
patches:
  - target:
      kind: PersistentVolumeClaim
      name: plausible-postgres-pvc
    patch: |
      - op: add
        path: /spec/volumeName
        value: pvc-dd7a06d3-0c9c-47a4-90c7-059c346ae3bd
      - op: replace
        path: /spec/storageClassName
        value: longhorn-flash
      - op: replace
        path: /spec/resources/requests/storage
        value: 1Gi
  - target:
      kind: Ingress
      name: plausible-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
