apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
  labels:
    app: ntfy
    app.kubernetes.io/name: ntfy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
        app.kubernetes.io/name: ntfy
    spec:
      initContainers:
        - name: init-data
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - mkdir -p /data/cache /data/config
          volumeMounts:
            - name: ntfy-data
              mountPath: /data
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:latest
          imagePullPolicy: IfNotPresent
          args:
            - serve
          envFrom:
            - configMapRef:
                name: ntfy-config
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: ntfy-data
              mountPath: /var/cache/ntfy
              subPath: cache
            - name: ntfy-data
              mountPath: /etc/ntfy
              subPath: config
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: ntfy-data
          persistentVolumeClaim:
            claimName: ntfy-data-pvc
