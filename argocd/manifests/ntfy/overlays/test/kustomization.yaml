apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: ntfy-config
    patch: |
      - op: replace
        path: /data/NTFY_BASE_URL
        value: "https://ntfy.test.levangie.dev"
  - target:
      kind: PersistentVolumeClaim
      name: ntfy-data-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: "100Mi"
  - target:
      kind: ResourceQuota
      name: ntfy-storage-quota
    patch: |
      - op: replace
        path: /spec/hard/requests.storage
        value: "100Mi"
      - op: replace
        path: /spec/hard/longhorn.io~1requests.storage
        value: "100Mi"
  - target:
      kind: LimitRange
      name: ntfy-storage-limits
    patch: |
      - op: replace
        path: /spec/limits/0/max/storage
        value: "100Mi"
      - op: replace
        path: /spec/limits/0/default/storage
        value: "100Mi"
      - op: replace
        path: /spec/limits/0/defaultRequest/storage
        value: "100Mi"
  - target:
      kind: Ingress
      name: ntfy-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "ntfy.test.levangie.dev"
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-test.levangie.dev"

commonLabels:
  environment: test
