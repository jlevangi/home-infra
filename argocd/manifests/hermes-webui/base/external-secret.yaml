apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-webui-secrets
  namespace: hermes-webui
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: hermes-webui-secrets
    creationPolicy: Owner
  data:
    - secretKey: HERMES_WEBUI_GATEWAY_API_KEY
      remoteRef:
        key: prod/hermes-webui
        property: HERMES_WEBUI_GATEWAY_API_KEY
    - secretKey: HERMES_WEBUI_PASSWORD
      remoteRef:
        key: prod/hermes-webui
        property: HERMES_WEBUI_PASSWORD
