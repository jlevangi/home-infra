apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-webui-secrets
  namespace: hermes-webui
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: hermes-webui-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/hermes-webui
