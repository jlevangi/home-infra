apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-webui
  namespace: hermes-webui
  labels:
    app: hermes-webui
    app.kubernetes.io/name: hermes-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-webui
  template:
    metadata:
      labels:
        app: hermes-webui
        app.kubernetes.io/name: hermes-webui
    spec:
      containers:
        - name: hermes-webui
          image: ghcr.io/nesquena/hermes-webui@sha256:adf5380342c4e2da3515601eeead3e878b4969095dcf984b7ccf0d3d1bc2d8bb
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: TZ
              value: America/New_York
            - name: HERMES_WEBUI_HOST
              value: 0.0.0.0
            - name: HERMES_WEBUI_PORT
              value: "8787"
            - name: HERMES_WEBUI_STATE_DIR
              value: /home/hermeswebui/.hermes/webui
            - name: HERMES_WEBUI_DEFAULT_WORKSPACE
              value: /workspace
            - name: HERMES_WEBUI_CHAT_BACKEND
              value: gateway
            - name: HERMES_WEBUI_GATEWAY_BASE_URL
              value: http://172.20.23.94:8642
            - name: HERMES_WEBUI_GATEWAY_USE_RUNS_API
              value: "true"
            - name: HERMES_API_URL
              value: http://172.20.23.94:8642
          envFrom:
            - secretRef:
                name: hermes-webui-secrets
          volumeMounts:
            - name: hermes-home
              mountPath: /home/hermeswebui/.hermes
            - name: workspace
              mountPath: /workspace
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: hermes-home
          persistentVolumeClaim:
            claimName: hermes-webui-home
        - name: workspace
          emptyDir: {}
