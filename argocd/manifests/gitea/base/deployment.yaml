apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  labels:
    app: gitea
    app.kubernetes.io/name: gitea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
        app.kubernetes.io/name: gitea
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: gitea
          image: docker.gitea.com/gitea:28.0.0-rootless@sha256:c168e7ccb767164793a67e1e874639488260795567337452b06292d1515bea12
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # INSTALL_LOCK alone would use Gitea's insecure fallback SECRET_KEY.
          # Generate once, without printing it; app.ini/internal token persist here too.
          command:
            - /bin/sh
            - -ec
          args:
            - |
              umask 077
              mkdir -p /var/lib/gitea/config
              if [ ! -s /var/lib/gitea/config/secret_key ]; then
                gitea generate secret SECRET_KEY > /var/lib/gitea/config/secret_key.tmp
                test -s /var/lib/gitea/config/secret_key.tmp
                mv /var/lib/gitea/config/secret_key.tmp /var/lib/gitea/config/secret_key
              fi
              /usr/local/bin/docker-setup.sh
              gitea migrate --config "$GITEA_APP_INI"
              sources=$(gitea admin auth list --config "$GITEA_APP_INI")
              ids=$(printf '%s\n' "$sources" | while read -r id name rest; do
                if [ "$name" = Keycloak ]; then printf '%s\n' "$id"; fi
              done)
              case "$ids" in
                '') set -- add-oauth ;;
                *[!0-9]*) printf '%s\n' 'Ambiguous Keycloak auth sources; refusing bootstrap' >&2; exit 1 ;;
                *) set -- update-oauth --id "$ids" ;;
              esac
              gitea admin auth "$@" --config "$GITEA_APP_INI" \
                --name Keycloak --provider openidConnect --key gitea \
                --secret "$OIDC_CLIENT_SECRET" \
                --auto-discover-url https://auth.levangie.org/realms/master/.well-known/openid-configuration \
                --scopes profile --scopes email \
                --required-claim-name groups --required-claim-value Gitea-users \
                --group-claim-name groups --admin-group Gitea-admins
              unset OIDC_CLIENT_SECRET
              exec /usr/bin/dumb-init -- gitea web --config "$GITEA_APP_INI"
          env:
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: OIDC_CLIENT_SECRET
          envFrom:
            - configMapRef:
                name: gitea-config
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # Upstream warns against restarting on DB/cache health failures or migrations.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data-pvc
