apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meshcentral-data-pvc
  namespace: meshcentral
  labels:
    recurring-job-group.longhorn.io/hourly: "enabled"
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
    app: meshcentral
    component: data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn-tank
