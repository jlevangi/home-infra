apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meshcentral-ingress
  namespace: meshcentral
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # Internal clients must reach MeshCentral via the Caddy reverse proxy (caddy.levangie.dev -> 172.20.20.3),
    # the same TLS front-door external agents use. MeshCentral runs in TlsOffload mode and pins the Caddy
    # (ZeroSSL) cert hash via CertUrl; routing internal agents straight to traefik (k3s-prod) serves a
    # different (Let's Encrypt) cert, which MeshCentral rejects with "bad web cert hash, holding connection".
    external-dns.alpha.kubernetes.io/target: caddy.levangie.dev
spec:
  ingressClassName: traefik
  rules:
    - host: mesh.levangie.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: meshcentral
                port:
                  number: 80
