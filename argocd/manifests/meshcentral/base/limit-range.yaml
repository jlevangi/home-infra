apiVersion: v1
kind: LimitRange
metadata:
  name: meshcentral-storage-limits
  namespace: meshcentral
spec:
  limits:
    - type: PersistentVolumeClaim
      max:
        storage: "15Gi"
      min:
        storage: "100Mi"
      default:
        storage: "10Gi"
      defaultRequest:
        storage: "10Gi"
