apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # Route internal clients to MeshCentral via the Caddy reverse proxy
  # (caddy.levangie.dev -> 172.20.20.3), the same TLS front-door external agents use.
  # MeshCentral runs in TlsOffload mode and pins the Caddy (ZeroSSL) cert hash via
  # CertUrl; pointing internal agents straight at traefik (k3s-prod) serves a different
  # (Let's Encrypt) cert, which MeshCentral rejects with "bad web cert hash, holding connection".
  - target:
      kind: Ingress
      name: meshcentral-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "caddy.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
