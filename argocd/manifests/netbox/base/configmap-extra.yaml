apiVersion: v1
kind: ConfigMap
metadata:
  name: netbox-extra-config
  namespace: netbox
data:
  extra_config.py: |
    import os

    REMOTE_AUTH_ENABLED = True
    REMOTE_AUTH_BACKEND = 'social_core.backends.open_id_connect.OpenIdConnectAuth'
    REMOTE_AUTH_AUTO_CREATE_USER = True

    # Members of this Keycloak group (realm: master) get Superuser + Staff in NetBox.
    REMOTE_AUTH_SUPERUSER_GROUPS = ['netbox-superadmins']
    REMOTE_AUTH_STAFF_GROUPS = ['netbox-superadmins']

    # Keycloak OIDC Settings
    SOCIAL_AUTH_OIDC_ENDPOINT = 'https://auth.levangie.org/realms/master'
    SOCIAL_AUTH_OIDC_KEY = os.getenv('SOCIAL_AUTH_OIDC_KEY', 'netbox')
    SOCIAL_AUTH_OIDC_SECRET = os.getenv('SOCIAL_AUTH_OIDC_SECRET', 'netbox-client-secret-placeholder')

    SOCIAL_AUTH_OIDC_SCOPE = ['openid', 'email', 'profile', 'groups']
    SOCIAL_AUTH_OIDC_USERNAME_KEY = 'preferred_username'

    # REMOTE_AUTH_SUPERUSER_GROUPS/STAFF_GROUPS above are only honored by
    # NetBox's own RemoteUserBackend (header-based auth). The social_core OIDC
    # backend used here never runs that logic, so a pipeline step reads the
    # Keycloak "groups" claim from the ID token directly and applies the same
    # superuser/staff assignment.
    def set_superuser_status(backend, user, response, *args, **kwargs):
        groups = set(response.get('groups') or [])
        user.is_superuser = bool(groups & set(REMOTE_AUTH_SUPERUSER_GROUPS))
        user.is_staff = bool(groups & set(REMOTE_AUTH_STAFF_GROUPS))
        user.save()

    SOCIAL_AUTH_PIPELINE = (
        'social_core.pipeline.social_auth.social_details',
        'social_core.pipeline.social_auth.social_uid',
        'social_core.pipeline.social_auth.social_user',
        'social_core.pipeline.user.get_username',
        'social_core.pipeline.user.create_user',
        'social_core.pipeline.social_auth.associate_user',
        'netbox.authentication.user_default_groups_handler',
        'social_core.pipeline.social_auth.load_extra_data',
        'social_core.pipeline.user.user_details',
        'netbox_configuration_extra_config.set_superuser_status',
    )
