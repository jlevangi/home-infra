apiVersion: v1
kind: ConfigMap
metadata:
  name: netbox-config
  namespace: netbox
data:
  ALLOWED_HOSTS: "netbox.levangie.dev netbox.netbox.svc.cluster.local 127.0.0.1 localhost *"
  DB_HOST: "netbox-postgres"
  DB_PORT: "5432"
  DB_NAME: "netbox"
  DB_USER: "netbox"
  REDIS_HOST: "netbox-redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_CACHE_DB: "1"
  METRICS_ENABLED: "true"
