apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-proxmox-sync-secrets
  namespace: netbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: netbox-proxmox-sync-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/netbox-proxmox-sync
