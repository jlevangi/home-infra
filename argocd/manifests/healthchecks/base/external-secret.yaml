apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthchecks-secrets
  namespace: healthchecks
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: healthchecks-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: prod/healthchecks
