apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthchecks-ping-ingress
  namespace: healthchecks
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: healthchecks.levangie.dev
      http:
        paths:
          - path: /ping
            pathType: Prefix
            backend:
              service:
                name: healthchecks
                port:
                  number: 8000
