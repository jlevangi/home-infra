apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: healthchecks
  labels:
    app: oauth2-proxy
    app.kubernetes.io/name: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
        app.kubernetes.io/name: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
          imagePullPolicy: IfNotPresent
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://auth.levangie.org/realms/master
            - --redirect-url=https://healthchecks.levangie.dev/oauth2/callback
            - --http-address=0.0.0.0:4180
            - --upstream=static://202
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-domain=healthchecks.levangie.dev
            - --whitelist-domain=healthchecks.levangie.dev
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --pass-access-token=true
            - --pass-authorization-header=true
            - --skip-provider-button=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              value: healthchecks
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: healthchecks-secrets
                  key: OAUTH2_PROXY_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: healthchecks-secrets
                  key: OAUTH2_PROXY_COOKIE_SECRET
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
