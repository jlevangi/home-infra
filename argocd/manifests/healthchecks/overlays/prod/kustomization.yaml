apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: PersistentVolumeClaim
      name: healthchecks-data-pvc
    patch: |
      - op: add
        path: /spec/volumeName
        value: pvc-310104ac-8034-46e1-b0e9-25e1984f255d
      - op: replace
        path: /spec/storageClassName
        value: longhorn-flash
images:
  - name: healthchecks/healthchecks
    newTag: v4.3
