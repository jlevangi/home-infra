apiVersion: batch/v1
kind: Job
metadata:
  name: pairdrop-dns-record
  namespace: pairdrop
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: dns-create
          image: curlimages/curl:8.5.0
          env:
            - name: TECHNITIUM_SERVER
              valueFrom:
                secretKeyRef:
                  name: technitium-api-credentials
                  key: server
            - name: TECHNITIUM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: technitium-api-credentials
                  key: token
            - name: TECHNITIUM_TLD
              valueFrom:
                secretKeyRef:
                  name: technitium-api-credentials
                  key: tld
            - name: DNS_HOSTNAME
              value: "pairdrop"
            - name: DNS_TARGET
              value: "k3s-prod.levangie.dev"
            - name: DNS_TTL
              value: "3600"
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo "Creating DNS CNAME record: ${DNS_HOSTNAME}.${TECHNITIUM_TLD} -> ${DNS_TARGET}"
              curl -sf -X POST "http://${TECHNITIUM_SERVER}:5380/api/zones/records/add" \
                -d "token=${TECHNITIUM_TOKEN}" \
                -d "domain=${DNS_HOSTNAME}.${TECHNITIUM_TLD}" \
                -d "type=CNAME" \
                -d "value=${DNS_TARGET}" \
                -d "ttl=${DNS_TTL}" \
                -d "overwrite=true"
