apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-db-pvc
  namespace: paperless
  labels:
    app: paperless
    component: db
    recurringjob.group.longhorn.io/hourly: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: longhorn
