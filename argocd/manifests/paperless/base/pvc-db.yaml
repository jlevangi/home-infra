apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-db-pvc
  namespace: paperless
  labels:
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
    app: paperless
    component: db
    recurring-job.longhorn.io/source: "enabled"
    recurring-job-group.longhorn.io/hourly: "enabled"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # paperless-db is the postgres data PVC. Pinned to longhorn-tank because
  # postgres is a heavy continuous writer; routing its replicas to the flash
  # pool starved shared Atlas flash IOPS during the 2026-05-31 incident.
  # Volume CR also has diskSelector=["tank"] patched at runtime.
  # NOTE: changing storageClassName on a bound PVC is a no-op; this aligns
  # the manifest with runtime + future PVC recreations.
  storageClassName: longhorn-tank
