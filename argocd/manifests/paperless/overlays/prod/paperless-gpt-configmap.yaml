apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-gpt-config
  namespace: paperless
data:
  PAPERLESS_BASE_URL: http://paperless:8000
  PAPERLESS_PUBLIC_URL: https://paperless.levangie.dev
  LLM_PROVIDER: openai
  LLM_MODEL: agent-default
  OPENAI_BASE_URL: http://nine-router.9router.svc.cluster.local:20128/v1
  LLM_LANGUAGE: English
  SUGGESTION_WORKERS: "1"
  OCR_PROVIDER: llm
  VISION_LLM_PROVIDER: openai
  VISION_LLM_MODEL: agent-default
  OCR_LIMIT_PAGES: "5"
  OCR_MAX_RETRIES: "3"
  PDF_REPLACE: "false"
  LOG_LEVEL: info
  PUID: "10001"
  PGID: "10001"
