apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: paperless-gpt-oauth2-errors
  namespace: paperless
spec:
  errors:
    status:
      - "401-403"
    service:
      name: paperless-gpt-oauth2-proxy
      port: 4180
    query: /oauth2/sign_in?rd={url}
    statusRewrites:
      "401": 302
