apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: PersistentVolumeClaim
      name: paperless-data-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 5Gi
  - target:
      kind: PersistentVolumeClaim
      name: paperless-media-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  - target:
      kind: PersistentVolumeClaim
      name: paperless-export-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 5Gi
  - target:
      kind: PersistentVolumeClaim
      name: paperless-db-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 5Gi
  - target:
      kind: PersistentVolumeClaim
      name: paperless-redis-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
  - target:
      kind: ResourceQuota
      name: paperless-storage-quota
    patch: |
      - op: replace
        path: /spec/hard/requests.storage
        value: "40Gi"
      - op: replace
        path: /spec/hard/longhorn.io~1requests.storage
        value: "40Gi"
commonLabels:
  environment: prod
