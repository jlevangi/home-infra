apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/paperless-ngx/paperless-ngx
    newTag: "2.20.4"
  - name: mariadb
    newTag: "10.11.16"
  - name: redis
    newTag: "7.4.8"
patches:
  - target:
      kind: PersistentVolumeClaim
      name: paperless-data-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 5Gi
  - target:
      kind: PersistentVolumeClaim
      name: paperless-media-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi
  - target:
      kind: PersistentVolumeClaim
      name: paperless-export-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 5Gi
  - target:
      kind: PersistentVolumeClaim
      name: paperless-db-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 5Gi
  - target:
      kind: PersistentVolumeClaim
      name: paperless-redis-pvc
    patch: |
      - op: replace
        path: /spec/resources/requests/storage
        value: 2Gi
  - target:
      kind: ResourceQuota
      name: paperless-storage-quota
    patch: |
      - op: replace
        path: /spec/hard/requests.storage
        value: "40Gi"
      - op: replace
        path: /spec/hard/longhorn.io~1requests.storage
        value: "40Gi"
  # Prod ESO is pinned to 0.10.5, whose CRDs do not serve external-secrets.io/v1.
  - target:
      kind: ExternalSecret
      name: paperless-secrets
    patch: |
      - op: replace
        path: /apiVersion
        value: external-secrets.io/v1beta1
commonLabels:
  environment: prod
