apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: paperless-config
    patch: |
      - op: replace
        path: /data/PAPERLESS_URL
        value: "https://paperless.test.levangie.dev"
  - target:
      kind: Ingress
      name: paperless-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "paperless.test.levangie.dev"
  - target:
      kind: ExternalSecret
      name: paperless-secrets
    patch: |
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: "test/paperless"
commonLabels:
  environment: test
