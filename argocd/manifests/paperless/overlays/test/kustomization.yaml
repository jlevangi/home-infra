apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: ConfigMap
      name: paperless-config
    patch: |
      - op: replace
        path: /data/PAPERLESS_URL
        value: "https://paperless.test.levangie.dev"
  - target:
      kind: Ingress
      name: paperless-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "paperless.test.levangie.dev"
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-test.levangie.dev"
  - target:
      kind: ExternalSecret
      name: paperless-secrets
    patch: |
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: "test/paperless"
  - target:
      kind: Deployment
      name: paperless
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
  # Test workers (172.20.21.0/22) are outside the prod NFS export ACL and
  # would race prod over the same consume folder anyway. Swap the nfs
  # volume for an emptyDir so the pod can start if paperless is ever
  # enabled in test. Mirrors the stage overlay.
  - target:
      kind: Deployment
      name: paperless
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: paperless
      spec:
        template:
          spec:
            volumes:
              - name: consume
                nfs: null
                emptyDir: {}
commonLabels:
  environment: test
