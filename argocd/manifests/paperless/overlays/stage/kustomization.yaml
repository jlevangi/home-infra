apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ghcr.io/paperless-ngx/paperless-ngx
    newTag: "2.20.14"
  - name: mariadb
    newTag: "12.2.2"
  - name: redis
    newTag: "8.6.2"
patches:
  - target:
      kind: ConfigMap
      name: paperless-config
    patch: |
      - op: replace
        path: /data/PAPERLESS_URL
        value: "https://paperless.stage.levangie.dev"
  - target:
      kind: Ingress
      name: paperless-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "paperless.stage.levangie.dev"
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-stage.levangie.dev"
  - target:
      kind: Deployment
      name: paperless
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 90
  # Stage has no access to the prod NFS export at 172.20.20.5:/volume1/fileserver/PaperlessImport
  # (NAS ACL is scoped to the prod subnet) and shouldn't race prod over the
  # same consume folder anyway. Replace with an emptyDir; kubectl cp a test
  # PDF into /usr/src/paperless/consume on the pod when verifying ingestion.
  - target:
      kind: Deployment
      name: paperless
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: paperless
      spec:
        template:
          spec:
            volumes:
              - name: consume
                nfs: null
                emptyDir: {}
labels:
  - pairs:
      environment: stage
    includeSelectors: true
