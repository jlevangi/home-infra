apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kan
  namespace: kan
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: kan.levangie.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kan
                port:
                  number: 3000
