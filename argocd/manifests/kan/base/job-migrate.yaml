apiVersion: batch/v1
kind: Job
metadata:
  name: kan-migrate
  namespace: kan
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: kan-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:15.13-alpine
          command:
            - sh
            - -ec
            - until pg_isready -h kan-postgres -U kan -d kan; do sleep 3; done
      containers:
        - name: migrate
          image: ghcr.io/kanbn/kan-migrate@sha256:3296fd28e037a93dda478981494a72c6905ecd4f0d0739e79139172844acbc4b
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: kan-secrets
                  key: POSTGRES_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
