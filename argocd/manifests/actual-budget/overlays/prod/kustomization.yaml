apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: actualbudget/actual-server
    newTag: "edge-alpine"
patches:
  - target:
      kind: PersistentVolumeClaim
      name: actual-budget-data-pvc
    patch: |
      - op: add
        path: /spec/volumeName
        value: pvc-d644a183-a991-4c4f-b7c4-a318d6abcf6d
      - op: replace
        path: /spec/storageClassName
        value: longhorn-flash
  - target:
      kind: Ingress
      name: actual-budget-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
