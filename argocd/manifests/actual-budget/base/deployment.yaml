apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual-budget
  namespace: actual-budget
  labels:
    app: actual-budget
    app.kubernetes.io/name: actual-budget
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: actual-budget
  template:
    metadata:
      labels:
        app: actual-budget
        app.kubernetes.io/name: actual-budget
    spec:
      initContainers:
        - name: init-data
          image: busybox:1.38
          command:
            - /bin/sh
            - -c
            - chown -R 1000:1000 /data
          volumeMounts:
            - name: actual-budget-data
              mountPath: /data
      containers:
        - name: actual-budget
          image: actualbudget/actual-server:edge-alpine
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: actual-budget-config
            - secretRef:
                name: actual-budget-secrets
          ports:
            - name: http
              containerPort: 5006
              protocol: TCP
          volumeMounts:
            - name: actual-budget-data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5006
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 5006
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: actual-budget-data
          persistentVolumeClaim:
            claimName: actual-budget-data-pvc
