apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # Talos test ESO is pinned to 0.10.5, whose CRDs do not serve external-secrets.io/v1.
  - target:
      kind: ClusterSecretStore
      name: vault-kv
    patch: |
      - op: replace
        path: /apiVersion
        value: external-secrets.io/v1beta1
commonLabels:
  environment: talos-test
