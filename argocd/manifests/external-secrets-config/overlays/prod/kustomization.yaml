apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      environment: prod
    includeSelectors: true
patches:
  - target:
      kind: ClusterSecretStore
      name: vault-kv
    patch: |-
      - op: replace
        path: /spec/provider/vault/server
        value: http://vault-raft.vault-raft.svc:8200
