apiVersion: apps/v1
kind: Deployment
metadata:
  name: printcalc
  namespace: 3dprintcalc
  labels:
    app: printcalc
    app.kubernetes.io/name: printcalc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: printcalc
  template:
    metadata:
      labels:
        app: printcalc
        app.kubernetes.io/name: printcalc
    spec:
      containers:
        - name: printcalc
          image: jlevangie/3d-print-cost-calculator
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
