apiVersion: apps/v1
kind: Deployment
metadata:
  name: printcalc
  namespace: 3dprintcalc
  labels:
    app: printcalc
    app.kubernetes.io/name: printcalc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: printcalc
  template:
    metadata:
      labels:
        app: printcalc
        app.kubernetes.io/name: printcalc
    spec:
      imagePullSecrets:
        - name: printcalc-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: printcalc
          image: ghcr.io/jlevangi/3dprintcalculator:sha-9cd1773@sha256:dce1ca4328b69696227acb570626e0dcd8abd6d60eaab43cc1d21f511f3a0b8a
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_PATH
              value: /app/data/calculator.db
            - name: OIDC_ISSUER_URL
              value: https://auth.levangie.org/realms/master
            - name: OIDC_CLIENT_ID
              value: 3dprintcalc
            - name: OIDC_REDIRECT_URI
              value: https://3dprintcalc.levangie.org/auth/callback
            - name: SESSION_COOKIE_SECURE
              value: "true"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: printcalc-secrets
                  key: SECRET_KEY
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: printcalc-secrets
                  key: OIDC_CLIENT_SECRET
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: printcalc-data
