apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-invite
  namespace: jellyfin-invite
  labels:
    app: jellyfin-invite
    app.kubernetes.io/name: jellyfin-invite
    app.kubernetes.io/part-of: jellyfin-invite
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin-invite
  template:
    metadata:
      labels:
        app: jellyfin-invite
        app.kubernetes.io/name: jellyfin-invite
        app.kubernetes.io/part-of: jellyfin-invite
    spec:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: app
          image: ghcr.io/jlevangi/jellyfin-invite:0.1.1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DB_PATH
              value: /data/invites.sqlite3
            - name: KEYCLOAK_BASE
              value: https://auth.levangie.org
            - name: KEYCLOAK_REALM
              value: master
            - name: PUBLIC_BASE_URL
              value: https://join.levangie.dev
            - name: JELLYFIN_URL
              value: https://jellyfin.levangie.org
            - name: REQUESTS_URL
              value: https://request.levangie.dev
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jellyfin-invite-secrets
                  key: ADMIN_TOKEN
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: jellyfin-invite-secrets
                  key: KEYCLOAK_CLIENT_ID
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jellyfin-invite-secrets
                  key: KEYCLOAK_CLIENT_SECRET
            - name: KEYCLOAK_GROUP_ID
              valueFrom:
                secretKeyRef:
                  name: jellyfin-invite-secrets
                  key: KEYCLOAK_GROUP_ID
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jellyfin-invite-data-pvc
