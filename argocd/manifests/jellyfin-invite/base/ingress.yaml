apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyfin-invite
  namespace: jellyfin-invite
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: join.levangie.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyfin-invite
                port:
                  number: 8080
