apiVersion: apps/v1
kind: Deployment
metadata:
  name: reclip
  namespace: reclip
  labels:
    app: reclip
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reclip
  template:
    metadata:
      labels:
        app: reclip
    spec:
      imagePullSecrets:
        - name: reclip-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: reclip
          image: ghcr.io/jlevangi/home-infra-reclip:1d161d15a4fe93d9b3371377f0a421dc3e965b10
          imagePullPolicy: IfNotPresent
          env:
            - name: RECLIP_NO_UPDATE
              value: "1"
          ports:
            - name: http
              containerPort: 8899
              protocol: TCP
          volumeMounts:
            - name: downloads
              mountPath: /app/downloads
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 12Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: downloads
          emptyDir:
            sizeLimit: 10Gi
