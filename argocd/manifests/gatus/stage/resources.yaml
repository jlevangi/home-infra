# Source: gatus/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus
  namespace: gatus
  labels:
    helm.sh/chart: gatus-3.4.6
    app.kubernetes.io/name: gatus
    app.kubernetes.io/instance: gatus
    app.kubernetes.io/version: "v5.35.0"
    app.kubernetes.io/managed-by: Helm
data:
  config.yaml: |
    endpoints:
    - conditions:
      - '[STATUS] == 200'
      - '[RESPONSE_TIME] < 5000'
      group: Infrastructure
      interval: 5m
      name: ArgoCD
      url: https://argocd.stage.levangie.dev
    - conditions:
      - '[STATUS] == 200'
      group: Infrastructure
      interval: 5m
      name: Longhorn
      url: https://longhorn.stage.levangie.dev
    - conditions:
      - '[STATUS] == 200'
      - '[RESPONSE_TIME] < 5000'
      group: Monitoring
      interval: 5m
      name: Grafana
      url: https://grafana.stage.levangie.dev
    - conditions:
      - '[STATUS] == 200'
      group: Monitoring
      interval: 2m
      name: Prometheus
      url: http://prometheus-prometheus.monitoring.svc.cluster.local:9090/-/healthy
    - conditions:
      - '[STATUS] == 200'
      - '[RESPONSE_TIME] < 5000'
      group: Applications
      interval: 5m
      name: Bookstack
      url: https://bookstack.stage.levangie.dev
    - conditions:
      - '[STATUS] == 200'
      - '[RESPONSE_TIME] < 5000'
      group: Applications
      interval: 5m
      name: Vaultwarden
      url: https://vw.stage.levangie.dev
    - conditions:
      - '[STATUS] == 200'
      - '[RESPONSE_TIME] < 5000'
      group: Applications
      interval: 5m
      name: PocketID
      url: https://pocketid.stage.levangie.dev
    - conditions:
      - '[STATUS] == 200'
      - '[RESPONSE_TIME] < 5000'
      group: Applications
      interval: 5m
      name: Microbin
      url: https://bin.stage.levangie.dev
    - conditions:
      - '[STATUS] == 200'
      - '[RESPONSE_TIME] < 5000'
      group: Applications
      interval: 5m
      name: Paperless
      url: https://paperless.stage.levangie.dev
    metrics: true
    storage:
      path: /data/data.db
      type: sqlite

