apiVersion: v1
data:
  gallery.json: '[]'
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Kaylee N. Watkins — In Loving Memory</title>
      <meta name="description" content="In loving memory of Kaylee N. Watkins (2008-2026)">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
          font-family: 'Inter', system-ui, sans-serif;
          font-weight: 300;
          color: #1a1a1a;
          background: #faf7f2;
          line-height: 1.7;
          -webkit-font-smoothing: antialiased;
        }
        ::selection { background: #d4a574; color: #fff; }
        img { max-width: 100%; height: auto; display: block; }
        a { color: inherit; }
        h1, h2, h3, h4 {
          font-family: 'Cormorant Garamond', serif;
          font-weight: 400;
          text-align: center;
          letter-spacing: 0.02em;
        }
        h2 { font-size: 2rem; color: #5a4a3a; margin-bottom: 0.25rem; }
        h3 { font-size: 1.5rem; }
        .hero {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 3rem 2rem 2rem;
          background: linear-gradient(180deg, #faf7f2 0%, #f0e8dc 100%);
          position: relative;
        }
        .hero::after {
          content: '';
          position: absolute;
          bottom: 0; left: 10%; right: 10%;
          height: 1px;
          background: #c4b4a0;
        }
        .hero-portrait {
          width: 140px;
          height: 140px;
          border-radius: 50%;
          object-fit: cover;
          margin-bottom: 1.5rem;
          box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .hero h1 {
          font-size: 3rem;
          color: #3a2a1a;
          margin-bottom: 0.25rem;
        }
        .hero-dates {
          font-size: 1.15rem;
          font-weight: 400;
          color: #8a7a6a;
          margin-bottom: 0.5rem;
        }
        .hero-line {
          font-family: 'Cormorant Garamond', serif;
          font-size: 1.3rem;
          font-style: italic;
          color: #b08a6a;
        }
        @media (max-width: 640px) {
          .hero { padding: 2rem 1.25rem 1.5rem; }
          .hero h1 { font-size: 2.2rem; }
          .hero-portrait { width: 110px; height: 110px; }
          .hero-dates { font-size: 1rem; }
          .hero-line { font-size: 1.1rem; }
        }
        section { max-width: 720px; margin: 0 auto; padding: 3rem 2rem; }
        @media (max-width: 640px) { section { padding: 2rem 1.25rem; } }
        .section-text { font-size: 1.05rem; color: #4a3a2a; max-width: 600px; margin: 0 auto; }
        .section-text p { margin-bottom: 1rem; }
        .support-box {
          background: #f0e8dc;
          border-radius: 12px;
          padding: 2rem;
          text-align: center;
          margin: 2rem auto 0;
          max-width: 500px;
        }
        .support-box p { margin-bottom: 1rem; font-size: 1rem; color: #5a4a3a; }
        .support-box .gfm-btn {
          display: inline-block;
          padding: 0.75rem 2rem;
          background: #c4a67a;
          color: #fff;
          border-radius: 8px;
          text-decoration: none;
          font-weight: 500;
          transition: background 0.2s;
        }
        .support-box .gfm-btn:hover { background: #b08a6a; }
        .media-section { max-width: 820px; }
        .media-section h2 { margin-bottom: 1.5rem; }
        .embed-wrapper {
          position: relative;
          width: 100%;
          margin-bottom: 2rem;
          border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .embed-wrapper iframe {
          display: block;
          width: 100%;
          border: none;
        }
        .media-caption {
          text-align: center;
          font-size: 0.85rem;
          color: #a09080;
          margin-top: 0.25rem;
          margin-bottom: 2rem;
        }
        .media-caption a { color: #8a7a6a; text-decoration: underline; }
        footer {
          text-align: center;
          padding: 2rem;
          color: #a09080;
          font-size: 0.85rem;
        }
      </style>
    </head>
    <body>
      <header class="hero">
        <img class="hero-portrait" src="https://www.routsong.com/fh_live/17200/17256/images/obituaries/10054132.jpg" alt="Kaylee N. Watkins" loading="lazy">
        <h1>Kaylee N. Watkins</h1>
        <p class="hero-dates">April 9, 2008 — July 3, 2026</p>
        <p class="hero-line">"In the darkness, BE the light"</p>
      </header>

      <section>
        <h2>In Loving Memory</h2>
        <div class="section-text">
          <p>
            Kaylee Nicole Watkins, born April 9, 2008, in Dayton, Ohio, to David and Andry Watkins,
            passed away unexpectedly on July 3, 2026, at the age of 18.
          </p>
          <p>
            Kaylee was a proud 2026 graduate of Northridge High School, where she was a dedicated
            student who earned scholarships to Wright State University. Northridge was more than her
            school — it was her community. She was a three-sport athlete in volleyball, basketball,
            and softball, and formed bonds with teammates and coaches that lasted a lifetime.
          </p>
          <p>
            Kaylee was a regular attendee at Life Vineyard Church, which she considered family. She
            found strength in her faith, sharing in worship and fellowship. She was generous
            with her time, and remarkably loyal to her forever friends Lindsay, Jaynie, Lily,
            Becky, and the love of her life, Jacob. She saw the good in people and chose
            kindness every chance she had.
          </p>
          <p style="text-align:center; font-style:italic; color:#8a7a6a;">
            "In the darkness, BE the light."<br>
            <span style="font-size:0.85rem;">— David Watkins (her dad), a saying Kaylee carried with her as a tattoo</span>
          </p>
        </div>

        <div class="support-box">
          <p>
            <strong>Support the family during this difficult time.</strong><br>
            If you would like to help with funeral and memorial expenses,
            please consider contributing to the GoFundMe organized by the family.
          </p>
          <a class="gfm-btn" href="https://www.gofundme.com/f/help-us-honor-kaylees-beautiful-life?attribution_id=sl:a221eeed-3143-480f-bcf9-c55d1f227284&lang=en_US&ts=1783343597&utm_campaign=fp_sharesheet&utm_content=amp20_t1&utm_medium=customer&utm_source=copy_link" target="_blank" rel="noopener noreferrer">
            Support the Family
          </a>
        </div>
      </section>

      <section style="text-align:center; padding-top:0;">
        <p style="color:#8a7a6a; font-size:0.95rem;">
          Read the full obituary and leave a message for the family<br>
          <a href="https://www.routsong.com/obituaries/kaylee-watkins" target="_blank" rel="noopener noreferrer" style="text-decoration:underline; color:#5a4a3a; font-weight:400;">
            Routsong Funeral Home &rarr;
          </a>
        </p>
      </section>

      <section class="media-section">
        <h2>Photo Album</h2>
        <div class="embed-wrapper" style="background:#f0e8dc; height:560px;">
          <iframe
            src="/s/kaylee-n-watkins"
            style="position:absolute; top:0; left:0; width:100%; height:100%;"
            allowfullscreen
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </div>
        <p class="media-caption">
          A collection of photos shared by family and friends.
        </p>
      </section>

      <section class="media-section">
        <h2>Music She Loved</h2>
        <div class="embed-wrapper" style="background:#f0e8dc;">
          <iframe
            src="https://open.spotify.com/embed/playlist/0fVcmpyli9k1gs6Cp9zUIq?utm_source=generator&theme=0"
            width="100%"
            height="500"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy"
          ></iframe>
        </div>
        <p class="media-caption">
          Kay's playlist 💛 — music from her viewing and funeral
        </p>
      </section>

      <footer>
        <p style="margin-top:0.25rem;">2008 — 2026</p>
      </footer>
    </body>
    </html>
kind: ConfigMap
