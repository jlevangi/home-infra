apiVersion: v1
data:
  gallery.json: '[]'
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Kaylee N. Watkins — In Loving Memory</title>
      <meta name="description" content="In loving memory of Kaylee N. Watkins">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
      <style>
        /* ── Reset & Base ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
          font-family: 'Inter', system-ui, sans-serif;
          font-weight: 300;
          color: #1a1a1a;
          background: #faf7f2;
          line-height: 1.7;
          -webkit-font-smoothing: antialiased;
        }
        ::selection { background: #d4a574; color: #fff; }
        img { max-width: 100%; height: auto; display: block; }
        a { color: inherit; }

        /* ── Typography ── */
        h1, h2, h3, h4 {
          font-family: 'Cormorant Garamond', serif;
          font-weight: 400;
          text-align: center;
          letter-spacing: 0.02em;
        }
        h2 {
          font-size: 2rem;
          color: #5a4a3a;
          margin-bottom: 0.25rem;
        }
        h3 { font-size: 1.5rem; }

        /* ── Hero ── */
        .hero {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 2rem;
          background: linear-gradient(180deg, #faf7f2 0%, #f0e8dc 100%);
          position: relative;
        }
        .hero::before {
          content: '';
          position: absolute;
          top: 0; left: 0; right: 0;
          height: 6px;
          background: linear-gradient(90deg, #c4b4a0, #d4a574, #c4b4a0);
        }
        .hero-name {
          font-family: 'Cormorant Garamond', serif;
          font-weight: 300;
          font-size: clamp(2.5rem, 8vw, 5rem);
          color: #2a1a0a;
          letter-spacing: 0.05em;
          line-height: 1.1;
          margin-bottom: 0.5rem;
        }
        .hero-dates {
          font-size: 1.2rem;
          color: #8a7a6a;
          margin-bottom: 1.5rem;
        }
        .hero-line {
          font-family: 'Cormorant Garamond', serif;
          font-size: 1.5rem;
          font-style: italic;
          color: #5a4a3a;
          max-width: 600px;
          opacity: 0.8;
        }
        .hero-scroll {
          position: absolute;
          bottom: 2rem;
          font-size: 1.5rem;
          opacity: 0.4;
          animation: bounce 2s infinite;
        }
        @keyframes bounce {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(8px); }
        }

        /* ── Sections ── */
        section {
          max-width: 720px;
          margin: 0 auto;
          padding: 5rem 2rem;
        }
        .section-divider {
          width: 60px; height: 1px;
          background: #c4b4a0;
          margin: 0.5rem auto 2.5rem;
        }

        /* ── About / Tribute ── */
        .tribute p {
          font-size: 1.1rem;
          color: #444;
          margin-bottom: 1.5rem;
          text-indent: 1.5em;
        }
        .tribute p:first-of-type { text-indent: 0; }

        /* ── Embed / Album ── */
        .embed-container {
          margin-top: 1.5rem;
        }

        /* ── Spotify ── */
        .spotify-wrap {
          margin-top: 1.5rem;
        }

        /* ── Links ── */
        .album-link {
          display: inline-block;
          margin-top: 1.25rem;
          color: #8a7a6a;
          text-decoration: none;
          font-size: 0.9rem;
          letter-spacing: 0.05em;
          text-transform: uppercase;
          border-bottom: 1px solid #c4b4a0;
          padding-bottom: 0.15rem;
          transition: opacity 0.3s;
        }
        .album-link:hover { opacity: 0.6; }

        /* ── Footer ── */
        footer {
          text-align: center;
          padding: 3rem 2rem;
          color: #8a7a6a;
          font-size: 0.85rem;
        }
        footer .heart { color: #d4a574; }

        @media (max-width: 600px) {
          section { padding: 3rem 1rem; }
        }
      </style>
    </head>
    <body>

      <!-- ═══ Hero ═══ -->
      <header class="hero">
        <h1 class="hero-name">Kaylee N. Watkins</h1>
        <p class="hero-dates">2008 — 2026</p>
        <p class="hero-line">"In the darkness, BE the light"</p>
        <div class="hero-scroll">⌄</div>
      </header>

      <!-- ═══ Tribute ═══ -->
      <section>
        <h2>In Loving Memory</h2>
        <div class="section-divider"></div>
        <div class="tribute">
          <p>
            With the heaviest hearts, we remember Kaylee N. Watkins — 
            a radiant soul who brought light, laughter, and love to everyone she knew.
            Her warmth was contagious, her kindness unwavering, and her spirit impossible to forget.
          </p>
          <p>
            Kaylee had a gift for making people feel seen and valued. Whether through a shared 
            laugh, a listening ear, or her signature optimism, she left an indelible mark on all 
            who were lucky enough to cross her path. Her memory will be cherished by family, 
            friends, and everyone whose life she touched along the way.
          </p>
          <p>
            She is deeply loved and profoundly missed. May her light continue to shine 
            through all of us.
          </p>
        </div>
      </section>

      <!-- ═══ Obituary ═══ -->
      <section>
        <h2>Obituary</h2>
        <div class="section-divider"></div>
        <p style="text-align:center; color:#666; margin-bottom:1rem;">
          Read Kaylee&#39;s full obituary and leave a message for the family
        </p>
        <div style="text-align:center;">
          <a class="album-link" href="https://www.routsong.com/obituaries/kaylee-watkins" target="_blank">
            ↗ View obituary at Routsong Funeral Home
          </a>
        </div>
      </section>

      <!-- ═══ Photos ═══ -->
      <section>
        <h2>Photos</h2>
        <div class="section-divider"></div>
        <p style="text-align:center; color:#666; margin-bottom:1rem;">
          Memories captured through the years
        </p>
        <div class="embed-container" style="border-radius:4px; background:#e0d8cc;">
          <iframe
            src="https://kayleewatkins.com/s/kaylee-n-watkins"
            width="100%" height="600"
            allow="fullscreen"
            loading="lazy"
            title="Kaylee&#39;s photo album"
            style="border:0; border-radius:4px;">
          </iframe>
        </div>
        <div style="text-align:center;">
          <a class="album-link" href="https://kayleewatkins.com/s/kaylee-n-watkins" target="_blank">
            ↗ Open full photo album in new tab
          </a>
        </div>
      </section>

      <!-- ═══ Spotify Playlist ═══ -->
      <section>
        <h2>Her Playlist</h2>
        <div class="section-divider"></div>
        <p style="text-align:center; color:#666; margin-bottom:1rem;">
          Songs that captured her heart
        </p>
        <div class="spotify-wrap">
          <iframe
            src="https://open.spotify.com/embed/playlist/5qvARQ4RUEJ6dcSGYL9rKS?utm_source=generator&theme=0"
            width="100%" height="352"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy"
            title="Kaylee's Celebration of Life Playlist"
            style="border-radius:12px;">
          </iframe>
        </div>
      </section>

      <!-- ═══ Footer ═══ -->
      <footer>
        <p>In loving memory of Kaylee N. Watkins</p>
        <p style="margin-top:0.25rem;">2008 — 2026</p>
        <p style="margin-top:1rem;">Made with <span class="heart">♥</span> by those who loved you</p>
      </footer>

    </body>
    </html>
kind: ConfigMap
metadata:
  labels:
    environment: prod
  name: kayleewatkins-content
  namespace: kayleewatkins
