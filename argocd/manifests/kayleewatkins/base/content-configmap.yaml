apiVersion: v1
kind: ConfigMap
metadata:
  name: kayleewatkins-content
  namespace: kayleewatkins
data:
  gallery.json: "[]"
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Kaylee N. Watkins — In Loving Memory</title>
      <meta name="description" content="In loving memory of Kaylee N. Watkins (2008-2026)">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
      <!-- Privacy-friendly analytics by Plausible -->
      <script async defer src="https://plausible.levangie.dev/js/pa-y-heS5v132ZSlJrMcUgXG.js"></script>
      <script>
        window.plausible = window.plausible || function() { (plausible.q = plausible.q || []).push(arguments) };
      </script>
      <style>
        /* ── Reset & Base ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
          font-family: 'Inter', system-ui, sans-serif;
          font-weight: 300;
          color: #1a1a1a;
          background: #faf7f2;
          line-height: 1.7;
          -webkit-font-smoothing: antialiased;
        }
        ::selection { background: #d4a574; color: #fff; }
        img { max-width: 100%; height: auto; display: block; }
        a { color: inherit; }

        /* ── Typography ── */
        h1, h2, h3 { font-family: 'Cormorant Garamond', serif; font-weight: 300; }
        .serif { font-family: 'Cormorant Garamond', serif; }

        /* ── Hero ── */
        .hero {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 2rem;
          background: linear-gradient(180deg, #faf7f2 0%, #f0e8dc 50%, #e8dcc8 100%);
          position: relative;
          overflow: hidden;
        }
        .hero::before {
          content: '';
          position: absolute;
          top: 0; left: 0; right: 0; bottom: 0;
          background: radial-gradient(ellipse at 50% -20%, rgba(212,165,116,0.15) 0%, transparent 60%);
          pointer-events: none;
        }
        .hero-name {
          font-size: clamp(3rem, 10vw, 7rem);
          font-weight: 300;
          letter-spacing: 0.05em;
          line-height: 1.1;
          margin-bottom: 0.5rem;
        }
        .hero-dates {
          font-size: clamp(1rem, 2.5vw, 1.5rem);
          letter-spacing: 0.3em;
          color: #8a7a6a;
        }
        .hero-line {
          font-family: 'Cormorant Garamond', serif;
          font-style: italic;
          font-size: clamp(1.1rem, 2.5vw, 1.4rem);
          margin-top: 1.5rem;
          color: #6b5d50;
          max-width: 600px;
        }
        .hero-line .attribution {
          display: block;
          font-size: 0.7em;
          font-style: normal;
          margin-top: 0.5rem;
          color: #8a7a6a;
          font-family: 'Inter', sans-serif;
          font-weight: 300;
          letter-spacing: 0.05em;
        }
        .hero-scroll {
          position: absolute;
          bottom: 2rem;
          left: 50%;
          transform: translateX(-50%);
          opacity: 0.4;
          animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
          0%, 100% { transform: translateX(-50%) translateY(0); }
          50% { transform: translateX(-50%) translateY(-8px); }
        }

        /* ── Sections ── */
        section { padding: 5rem 1.5rem; max-width: 800px; margin: 0 auto; }
        section h2 {
          font-size: 2.2rem;
          font-weight: 300;
          margin-bottom: 0.5rem;
          color: #2a2a2a;
        }
        .section-divider {
          width: 60px; height: 1px;
          background: #c4b4a0;
          margin: 0 auto 2rem;
        }
        .section-text {
          font-size: 1.05rem;
          color: #4a3a2a;
          max-width: 600px;
          margin: 0 auto;
        }
        .section-text p { margin-bottom: 1rem; }

        /* ── Buttons ── */
        .btn {
          display: inline-block;
          padding: 0.75rem 1.5rem;
          border: 1px solid #c4b4a0;
          border-radius: 4px;
          text-decoration: none;
          font-size: 0.9rem;
          transition: background 0.2s, color 0.2s;
          color: #2a2a2a;
          background: transparent;
        }
        .btn:hover { background: #d4c8b8; color: #fff; }

        /* ── Support Box ── */
        .support-box {
          background: #f0e8dc;
          border-radius: 12px;
          padding: 2rem;
          margin-top: 2rem;
          max-width: 500px;
          margin-left: auto;
          margin-right: auto;
        }
        .support-box p {
          font-size: 0.95rem;
          color: #4a3a2a;
          margin-bottom: 1rem;
        }
        .support-box .btn { background: #fff; }

        /* ── Photo Grid ── */
        .photo-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
          gap: 1rem;
          margin-top: 1.5rem;
        }
        .photo-grid img {
          width: 100%;
          height: 300px;
          object-fit: cover;
          border-radius: 4px;
          transition: transform 0.3s ease;
        }
        .photo-grid img:hover { transform: scale(1.02); }

        /* ── Video ── */
        .video-wrapper {
          position: relative;
          padding-bottom: 56.25%;
          height: 0;
          overflow: hidden;
          border-radius: 4px;
          background: #e0d8cc;
          margin-top: 1.5rem;
        }
        .video-wrapper iframe {
          position: absolute;
          top: 0; left: 0;
          width: 100%;
          height: 100%;
          border: 0;
        }

        /* ── Embeds ── */
        .embed-container { margin-top: 1.5rem; border-radius: 4px; overflow: hidden; }
        .embed-container iframe { width: 100%; border: 0; }

        /* ── Photo Album Link ── */
        .album-link {
          display: inline-flex;
          align-items: center;
          gap: 0.5rem;
          margin-top: 1.5rem;
          padding: 0.75rem 1.5rem;
          background: #fff;
          border: 1px solid #d4c8b8;
          border-radius: 4px;
          text-decoration: none;
          color: #2a2a2a;
          font-size: 0.95rem;
        }
        .album-link:hover { background: #f0e8dc; }

        /* ── Spotify ── */
        .spotify-wrap {
          margin-top: 1.5rem;
          border-radius: 12px;
          overflow: hidden;
        }
        .spotify-wrap iframe {
          width: 100%;
          border: 0;
        }

        /* ── Footer ── */
        footer {
          text-align: center;
          padding: 3rem 1.5rem;
          font-size: 0.9rem;
          color: #8a7a6a;
        }
        footer .heart { color: #d4a574; }

        /* ── Misc ── */
        .text-center { text-align: center; }
        .mt-2 { margin-top: 2rem; }
      </style>
    </head>
    <body>
      <header class="hero">
        <h1 class="hero-name">Kaylee N. Watkins</h1>
        <p class="hero-dates">2008 — 2026</p>
        <p class="hero-line">
          "In the darkness, BE the light"
          <span class="attribution">— David Watkins</span>
        </p>
        <div class="hero-scroll">⌄</div>
      </header>

      <!-- ── Tribute ── -->
      <section>
        <h2>Remembering Kaylee</h2>
        <div class="section-divider"></div>
        <div class="section-text">
          <p>
            With the heaviest hearts, we remember Kaylee N. Watkins —
            a radiant soul who brought light, laughter, and love to everyone she knew.
            Her kindness touched so many, and though her time here was far too short,
            the beauty of her spirit will live on forever in the lives of all who were
            lucky enough to know her.
          </p>
          <p>
            In the face of incredible pain, Kaylee never stopped giving — she went
            out of her way to make others feel seen, supported, and loved. Her
            strength, her warmth, and her generous heart continue to inspire us all.
          </p>
          <p>
            She is deeply loved and profoundly missed. May her light continue to shine
            through each of us.
          </p>
        </div>
      </section>

      <!-- ── Obituary ── -->
      <section>
        <h2>Obituary</h2>
        <div class="section-divider"></div>
        <div class="text-center">
          <p class="section-text" style="max-width:600px;">
            Read Kaylee's full obituary and leave a message for the family
          </p>
          <div class="mt-2">
            <a href="https://www.routsong.com/obituaries/kaylee-watkins"
               class="btn" target="_blank" rel="noopener noreferrer">
              ↗ View obituary at Routsong Funeral Home
            </a>
          </div>
        </div>
      </section>

      <!-- ── Support ── -->
      <section>
        <h2>Support the Family</h2>
        <div class="section-divider"></div>
        <div class="support-box">
          <p>
            For those who have asked how to help, contributions to support Kaylee's
            family during this heartbreaking time are deeply appreciated.
          </p>
          <a href="https://www.gofundme.com/f/help-us-honor-kaylees-beautiful-life?attribution_id=sl:a221eeed-3143-480f-bcf9-c55d1f227284&lang=en_US&ts=1783343597&utm_campaign=fp_sharesheet&utm_content=amp20_t1&utm_medium=customer&utm_source=copy_link"
             class="btn" target="_blank" rel="noopener noreferrer">
            ♥ Donate via GoFundMe
          </a>
        </div>
      </section>

      <!-- ── Photos ── -->
      <section>
        <h2>Photo Album</h2>
        <div class="section-divider"></div>
        <div class="text-center">
          <div class="embed-container">
            <iframe
              src="https://kayleewatkins.com/s/kaylee-n-watkins"
              width="100%" height="700"
              allow="autoplay * clipboard-read clipboard-write encrypted-media * web-share"
              allowfullscreen
              style="border:0;border-radius:4px;"
              title="Kaylee's photo album">
            </iframe>
          </div>
          <a href="https://kayleewatkins.com/s/kaylee-n-watkins"
             class="album-link" target="_blank" rel="noopener noreferrer">
            ↗ Open full photo album in new tab
          </a>
        </div>
      </section>

      <!-- ── Music ── -->
      <section>
        <h2>Songs That Captured Her Heart</h2>
        <div class="section-divider"></div>
        <div class="text-center">
          <p class="section-text">Kay's playlist 💛 — music from her viewing and funeral</p>
          <div class="spotify-wrap">
            <iframe
              src="https://open.spotify.com/embed/playlist/0fVcmpyli9k1gs6Cp9zUIq?utm_source=generator&theme=0"
              width="100%" height="500"
              allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
              loading="lazy"
              title="Kaylee's Celebration of Life Playlist">
            </iframe>
          </div>
        </div>
      </section>

      <footer>
        <p>In loving memory of Kaylee N. Watkins</p>
        <p style="margin-top:0.25rem;">2008 — 2026</p>
        <p style="margin-top:1rem;">Made with <span class="heart">♥</span> by those who loved you</p>
      </footer>
    </body>
    </html>
