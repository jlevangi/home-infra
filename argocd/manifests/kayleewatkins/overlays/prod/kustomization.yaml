apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../k8s/manifests
  - ../../../../k8s/configmap.yaml
  - ../../../../k8s/nginx-configmap.yaml

patches:
  - target:
      kind: Ingress
      name: kayleewatkins-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"

labels:
  - pairs:
      environment: prod
