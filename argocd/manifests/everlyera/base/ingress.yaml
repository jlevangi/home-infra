apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: everlyera-ingress
  namespace: everlyera
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: everlyera.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: everlyera-web
                port: { number: 80 }
    - host: www.everlyera.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: everlyera-web
                port: { number: 80 }
