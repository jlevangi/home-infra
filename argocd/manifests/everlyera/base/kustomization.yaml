apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# MinIO and imgproxy used to live here, once per namespace. They now live once in
# the shared `everlyera-media` namespace and are consumed cross-namespace via
# S3_ENDPOINT / IMGPROXY_URL in configmap.yaml. Postgres stays per-namespace on
# purpose: separate databases per environment is the design.
resources:
  - configmap.yaml
  - pvc-postgres.yaml
  - deployment-postgres.yaml
  - service-postgres.yaml
  - deployment-web.yaml
  - middleware-redirect.yaml
  - service-web.yaml
  - ingress.yaml
  - resourcequota.yaml
  - limitrange.yaml
