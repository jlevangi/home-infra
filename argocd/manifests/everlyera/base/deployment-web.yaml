apiVersion: apps/v1
kind: Deployment
metadata:
  name: everlyera-web
  namespace: everlyera
  labels: { app: everlyera-web, component: web }
spec:
  # ponytail: single replica while Payload's admin is still stateful in
  # memory (dev workflows). Scale to 2+ once we've verified DB-locking
  # migrations and moved session state to Postgres.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: everlyera-web }
  template:
    metadata:
      labels: { app: everlyera-web, component: web }
    spec:
      imagePullSecrets:
        - name: everlyera-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: migrate
          image: ghcr.io/jlevangi/everlyera:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "npx payload migrate"]
          env:
            - { name: PAYLOAD_SECRET,          valueFrom: { secretKeyRef: { name: everlyera-secrets, key: PAYLOAD_SECRET } } }
            - { name: DATABASE_URI,             valueFrom: { secretKeyRef: { name: everlyera-secrets, key: DATABASE_URI } } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      containers:
        - name: web
          image: ghcr.io/jlevangi/everlyera:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: everlyera-config }
          env:
            - { name: PAYLOAD_SECRET,          valueFrom: { secretKeyRef: { name: everlyera-secrets, key: PAYLOAD_SECRET } } }
            - { name: IMGPROXY_KEY,            valueFrom: { secretKeyRef: { name: everlyera-secrets, key: IMGPROXY_KEY } } }
            - { name: IMGPROXY_SALT,           valueFrom: { secretKeyRef: { name: everlyera-secrets, key: IMGPROXY_SALT } } }
            - { name: S3_ACCESS_KEY_ID,        valueFrom: { secretKeyRef: { name: everlyera-secrets, key: S3_ACCESS_KEY_ID } } }
            - { name: S3_SECRET_ACCESS_KEY,    valueFrom: { secretKeyRef: { name: everlyera-secrets, key: S3_SECRET_ACCESS_KEY } } }
            - { name: DATABASE_URI,             valueFrom: { secretKeyRef: { name: everlyera-secrets, key: DATABASE_URI } } }
            # Outbound mail for inquiry notifications. Every one of these is
            # `optional: true` on purpose: the keys do not exist in Vault yet, and
            # a non-optional secretKeyRef for a missing key blocks the pod from
            # starting at all. The app is built to match — with SMTP_HOST unset
            # Payload keeps its console adapter, and with INQUIRY_NOTIFY_TO unset
            # the notification hook logs a warning instead of sending.
            #
            # `everlyera-secrets` is a `dataFrom: extract` of the whole
            # `prod/everlyera` Vault path, so adding these keys there is enough —
            # no ExternalSecret change is needed. Use `vault kv patch`, never
            # `vault kv put`, or the existing keys at that path are replaced.
            #
            # After populating Vault: wait for the refresh (or force one), then
            # `kubectl -n <ns> rollout restart deploy/everlyera-web`. Env is read
            # at pod start, so nothing takes effect until the pods cycle.
            - { name: SMTP_HOST,               valueFrom: { secretKeyRef: { name: everlyera-secrets, key: SMTP_HOST,          optional: true } } }
            - { name: SMTP_PORT,               valueFrom: { secretKeyRef: { name: everlyera-secrets, key: SMTP_PORT,          optional: true } } }
            - { name: SMTP_USER,               valueFrom: { secretKeyRef: { name: everlyera-secrets, key: SMTP_USER,          optional: true } } }
            - { name: SMTP_PASS,               valueFrom: { secretKeyRef: { name: everlyera-secrets, key: SMTP_PASS,          optional: true } } }
            - { name: EMAIL_FROM,              valueFrom: { secretKeyRef: { name: everlyera-secrets, key: EMAIL_FROM,         optional: true } } }
            - { name: INQUIRY_NOTIFY_TO,       valueFrom: { secretKeyRef: { name: everlyera-secrets, key: INQUIRY_NOTIFY_TO,  optional: true } } }
            # Keycloak SSO for the admin panel. Optional for the same reason as
            # the mail settings: with these unset the app hides the SSO button,
            # /auth/keycloak/* returns 503, and the local email/password login
            # continues to work. Local login is never disabled — it is the
            # break-glass path if Keycloak or its ingress is unavailable.
            #
            # Authorisation is enforced by the everlyera-admin realm role, not
            # by the client alone: the Keycloak client lives in the shared
            # `master` realm alongside unrelated personal accounts.
            - { name: KEYCLOAK_ISSUER,         valueFrom: { secretKeyRef: { name: everlyera-secrets, key: KEYCLOAK_ISSUER,        optional: true } } }
            - { name: KEYCLOAK_CLIENT_ID,      valueFrom: { secretKeyRef: { name: everlyera-secrets, key: KEYCLOAK_CLIENT_ID,     optional: true } } }
            - { name: KEYCLOAK_CLIENT_SECRET,  valueFrom: { secretKeyRef: { name: everlyera-secrets, key: KEYCLOAK_CLIENT_SECRET, optional: true } } }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: false
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: 2000m, memory: 1500Mi }
