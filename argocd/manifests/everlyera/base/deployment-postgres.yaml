apiVersion: apps/v1
kind: Deployment
metadata:
  name: everlyera-postgres
  namespace: everlyera
  labels: { app: everlyera-postgres, component: database }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: everlyera-postgres }
  template:
    metadata:
      labels: { app: everlyera-postgres, component: database }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: pg
              containerPort: 5432
          env:
            - { name: POSTGRES_DB, valueFrom: { configMapKeyRef: { name: everlyera-config, key: POSTGRES_DB } } }
            - { name: POSTGRES_USER, valueFrom: { configMapKeyRef: { name: everlyera-config, key: POSTGRES_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: everlyera-secrets, key: POSTGRES_PASSWORD } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "everlyera", "-d", "everlyera"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "everlyera", "-d", "everlyera"] }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1500m, memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: everlyera-postgres-pvc }
