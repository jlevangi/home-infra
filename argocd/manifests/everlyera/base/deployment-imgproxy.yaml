apiVersion: apps/v1
kind: Deployment
metadata:
  name: everlyera-imgproxy
  namespace: everlyera
  labels: { app: everlyera-imgproxy, component: image-proxy }
spec:
  replicas: 2
  selector:
    matchLabels: { app: everlyera-imgproxy }
  template:
    metadata:
      labels: { app: everlyera-imgproxy, component: image-proxy }
    spec:
      containers:
        - name: imgproxy
          image: darthsim/imgproxy:v3.28.0
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: IMGPROXY_KEY,  valueFrom: { secretKeyRef: { name: everlyera-secrets, key: IMGPROXY_KEY } } }
            - { name: IMGPROXY_SALT, valueFrom: { secretKeyRef: { name: everlyera-secrets, key: IMGPROXY_SALT } } }
            - { name: IMGPROXY_USE_S3, value: "true" }
            - { name: IMGPROXY_S3_ENDPOINT, value: "http://everlyera-minio:9000" }
            - { name: IMGPROXY_S3_REGION, value: "us-east-1" }
            - { name: IMGPROXY_S3_USE_PATH_STYLE, value: "true" }
            - { name: AWS_ACCESS_KEY_ID,     valueFrom: { secretKeyRef: { name: everlyera-secrets, key: S3_ACCESS_KEY_ID } } }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: everlyera-secrets, key: S3_SECRET_ACCESS_KEY } } }
            - { name: IMGPROXY_ENFORCE_WEBP, value: "true" }
            - { name: IMGPROXY_ENFORCE_AVIF, value: "true" }
            - { name: IMGPROXY_QUALITY, value: "82" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 1000m, memory: 512Mi }
