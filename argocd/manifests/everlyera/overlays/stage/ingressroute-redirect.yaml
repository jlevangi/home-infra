apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: everlyera-redirect-http
  namespace: everlyera-stage
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`staging.everlyera.com`)
      kind: Rule
      middlewares:
        - name: everlyera-redirect-https
      services:
        - name: everlyera-web
          port: 80
