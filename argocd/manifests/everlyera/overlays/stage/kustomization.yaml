apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: everlyera-stage
resources:
  - ../../base
  - external-secrets.yaml
  - ingressroute-redirect.yaml
images:
  - name: ghcr.io/jlevangi/everlyera
    newTag: "0.14.0-stage"
labels:
  - pairs: { environment: stage }
    includeSelectors: true
patches:
  - target: { kind: PersistentVolumeClaim, name: everlyera-postgres-pvc }
    patch: |
      - { op: remove, path: /metadata/labels/recurring-job-group.longhorn.io~1hourly }
      - { op: remove, path: /metadata/labels/recurring-job-group.longhorn.io~1daily }
      - { op: remove, path: /metadata/labels/recurring-job-group.longhorn.io~1weekly }
  - target: { kind: ConfigMap, name: everlyera-config }
    patch: |
      - { op: replace, path: /data/NEXT_PUBLIC_SERVER_URL, value: "https://staging.everlyera.com" }
      - { op: replace, path: /data/PAYLOAD_PUBLIC_SERVER_URL, value: "https://staging.everlyera.com" }
      # Stage and prod share one MinIO but MUST NOT share a bucket: Payload's
      # s3Storage plugin deletes the S3 object when a media doc is deleted, and the
      # two environments have separate Postgres databases. This one line is what
      # stops a staging cleanup from destroying a live production image.
      - { op: replace, path: /data/S3_BUCKET, value: "everlyera-media-stage" }
  - target: { kind: Ingress, name: everlyera-ingress }
    patch: |
      - { op: replace, path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.tls.domains.0.main, value: "staging.everlyera.com" }
      - { op: remove, path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.tls.domains.0.sans }
      - { op: replace, path: /spec/tls/0/hosts/0, value: "staging.everlyera.com" }
      - { op: remove, path: /spec/tls/0/hosts/1 }
      - { op: replace, path: /spec/rules/0/host, value: "staging.everlyera.com" }
      - { op: remove, path: /spec/rules/1 }
  - target: { kind: Ingress, name: everlyera-ingress }
    patch: |
      - { op: add, path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares, value: "everlyera-stage-everlyera-redirect-https@kubernetescrd" }
