apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: everlyera-secrets
  namespace: everlyera-stage
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-kv, kind: ClusterSecretStore }
  target: { name: everlyera-secrets, creationPolicy: Owner }
  dataFrom:
    - extract: { key: stage/everlyera }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: everlyera-ghcr
  namespace: everlyera-stage
spec:
  refreshInterval: 1h
  secretStoreRef: { name: vault-kv, kind: ClusterSecretStore }
  target:
    name: everlyera-ghcr
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef: { key: stage/everlyera, property: GHCR_DOCKER_CONFIG_JSON }
