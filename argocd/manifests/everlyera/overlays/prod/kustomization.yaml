apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: everlyera
resources:
  - ../../base
  - external-secrets.yaml
  - ingressroute-redirect.yaml
images:
  - name: ghcr.io/jlevangi/everlyera
    newTag: "0.8.0"
labels:
  - pairs: { environment: prod }
    includeSelectors: true
patches:
  - target: { kind: Ingress, name: everlyera-ingress }
    patch: |
      - { op: add, path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares, value: "everlyera-everlyera-redirect-https@kubernetescrd" }
