apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: PersistentVolumeClaim
      name: semaphore-data-pvc
    patch: |
      - op: add
        path: /spec/volumeName
        value: pvc-be29aed4-6be4-4fb2-b5ae-5dc06a720ccb
      - op: replace
        path: /spec/storageClassName
        value: longhorn-flash
  - target:
      kind: Ingress
      name: semaphore-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
