apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netlock-mysql-data-pvc
  namespace: netlock-rmm
  labels:
    recurring-job-group.longhorn.io/hourly: "enabled"
    recurring-job-group.longhorn.io/daily: "enabled"
    recurring-job-group.longhorn.io/weekly: "enabled"
    app: netlock-mysql
    component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: longhorn-tank
