apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netlock-console-appsettings
  namespace: netlock-rmm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: netlock-console-appsettings
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        appsettings.json: |
          {
            "Logging": {
              "LogLevel": {
                "Default": "Warning",
                "Microsoft": "Error",
                "Microsoft.Hosting.Lifetime": "Warning"
              },
              "Custom": { "Enabled": true }
            },
            "AllowedHosts": "*",
            "Kestrel": {
              "Endpoint": {
                "Http": { "Enabled": true, "Port": 5000 },
                "Https": {
                  "Enabled": false, "Port": 5001, "Force": false,
                  "Hsts": { "Enabled": false },
                  "Certificate": { "Path": "", "Password": "" }
                }
              },
              "KnownProxies": []
            },
            "NetLock_Remote_Server": {
              "Server": "netlock-server",
              "Port": 7080,
              "UseSSL": false
            },
            "NetLock_File_Server": {
              "Server": "netlock-server",
              "Port": 7080,
              "UseSSL": false
            },
            "MySQL": {
              "Server": "netlock-mysql",
              "Port": 3306,
              "Database": "netlock",
              "User": "netlock",
              "Password": "{{ .MySQL_Password }}",
              "SslMode": "None",
              "AdditionalConnectionParameters": "AllowPublicKeyRetrieval=True;"
            },
            "Webinterface": {
              "Language": "en-US",
              "Membership_Reminder": false,
              "PublicOverrideUrl": "https://rmm.levangie.dev"
            },
            "Members_Portal_Api": {
              "Enabled": true,
              "Cloud": false,
              "ApiKeyOverride": "9126ceb9-a445-42b0-b26f-776fb34d6b69-9ad1d146-aa62-42df-a1a9-fed5855e5f1f",
              "ServerGuid": "Test-Guid"
            }
          }
  data:
    - secretKey: MySQL_Password
      remoteRef:
        key: prod/netlock-rmm
        property: MySQL_Password
