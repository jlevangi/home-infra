apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netlock-server-appsettings
  namespace: netlock-rmm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-kv
    kind: ClusterSecretStore
  target:
    name: netlock-server-appsettings
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        appsettings.json: |
          {
            "Logging": {
              "LogLevel": {
                "Default": "Warning",
                "Microsoft": "Error",
                "Microsoft.Hosting.Lifetime": "Warning",
                "Microsoft.AspNetCore.SignalR": "Error",
                "Microsoft.AspNetCore.Http.Connections": "Error"
              },
              "Custom": { "Enabled": false, "VerbosityLevel": 0 }
            },
            "AllowedHosts": "*",
            "Kestrel": {
              "Endpoint": {
                "Http": { "Enabled": true, "Port": 7080 },
                "Https": {
                  "Enabled": false, "Port": 7443, "Force": false,
                  "Hsts": { "Enabled": false },
                  "Certificate": { "Path": "", "Password": "" }
                }
              },
              "Limits": {
                "MaxConcurrentConnections": 2000,
                "MaxConcurrentUpgradedConnections": 2000,
                "MaxRequestBodySize": 10737418240,
                "KeepAliveTimeout": 120
              },
              "Roles": {
                "Comm": true, "Update": false, "Trust": false, "Remote": true,
                "Notification": true, "File": true, "LLM": true, "Relay": false
              }
            },
            "SignalR": {
              "MaximumReceiveMessageSize": 102400000,
              "ClientTimeoutInterval": 120,
              "KeepAliveInterval": 15,
              "HandshakeTimeout": 30,
              "EnableDetailedErrors": true,
              "StreamBufferCapacity": 20,
              "MaximumParallelInvocationsPerClient": 5,
              "MaxConnectionAttempts": 5,
              "ConnectionAttemptDelayMs": 5000
            },
            "Relay_Server": { "Port": 7081 },
            "MySQL": {
              "Server": "netlock-mysql",
              "Port": 3306,
              "Database": "netlock",
              "User": "netlock",
              "Password": "{{ .MySQL_Password }}",
              "SslMode": "None",
              "AdditionalConnectionParameters": ""
            },
            "Members_Portal_Api": {
              "Enabled": false,
              "Cloud": false,
              "ApiKeyOverride": "",
              "ServerGuid": "Test-Guid"
            },
            "Environment": { "Docker": true }
          }
  data:
    - secretKey: MySQL_Password
      remoteRef:
        key: prod/netlock-rmm
        property: MySQL_Password
