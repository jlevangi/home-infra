apiVersion: apps/v1
kind: Deployment
metadata:
  name: netlock-server
  namespace: netlock-rmm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netlock-server
  template:
    metadata:
      labels:
        app: netlock-server
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for MySQL to be ready..."
              until nc -z netlock-mysql 3306; do
                echo "MySQL not ready, waiting..."
                sleep 5
              done
              echo "MySQL is ready!"
              sleep 5
      containers:
        - name: server
          image: nicomak101/netlock-rmm-server@sha256:a13e6fb2520d0c8321614aa32dd8580b7486585189e1c5cf9c2f500a734caaf5
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: netlock-rmm-config
                  key: TZ
            - name: Kestrel__Endpoint__Http__Enabled
              valueFrom:
                configMapKeyRef:
                  name: netlock-rmm-config
                  key: Kestrel__Endpoint__Http__Enabled
            - name: Kestrel__Endpoint__Http__Port
              valueFrom:
                configMapKeyRef:
                  name: netlock-rmm-config
                  key: Kestrel__Endpoint__Http__Port
            - name: Kestrel__Endpoint__Https__Enabled
              valueFrom:
                configMapKeyRef:
                  name: netlock-rmm-config
                  key: Kestrel__Endpoint__Https__Enabled
            - name: LettuceEncrypt__Enabled
              valueFrom:
                configMapKeyRef:
                  name: netlock-rmm-config
                  key: LettuceEncrypt__Enabled
            - name: MySQL__Server
              valueFrom:
                configMapKeyRef:
                  name: netlock-rmm-config
                  key: MySQL__Server
            - name: MySQL__Port
              valueFrom:
                configMapKeyRef:
                  name: netlock-rmm-config
                  key: MySQL__Port
            - name: MySQL__Database
              valueFrom:
                configMapKeyRef:
                  name: netlock-rmm-config
                  key: MySQL__Database
            - name: MySQL__User
              valueFrom:
                configMapKeyRef:
                  name: netlock-rmm-config
                  key: MySQL__User
            - name: MySQL__SslMode
              valueFrom:
                configMapKeyRef:
                  name: netlock-rmm-config
                  key: MySQL__SslMode
            - name: MySQL__Password
              valueFrom:
                secretKeyRef:
                  name: netlock-rmm-secrets
                  key: MySQL_Password
            - name: PublicServerUrl
              valueFrom:
                configMapKeyRef:
                  name: netlock-rmm-config
                  key: PublicServerUrl
          ports:
            - containerPort: 7080
          volumeMounts:
            - name: server-config
              mountPath: /app/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket:
              port: 7080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 7080
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: server-config
          persistentVolumeClaim:
            claimName: netlock-server-config-pvc
