apiVersion: apps/v1
kind: Deployment
metadata:
  name: netlock-server
  namespace: netlock-rmm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netlock-server
  template:
    metadata:
      labels:
        app: netlock-server
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              echo "Waiting for MySQL to be ready..."
              until nc -z netlock-mysql 3306; do
                echo "MySQL not ready, waiting..."
                sleep 5
              done
              echo "MySQL is ready!"
              sleep 5
      containers:
        - name: server
          image: nicomak101/netlock-rmm-server@sha256:a13e6fb2520d0c8321614aa32dd8580b7486585189e1c5cf9c2f500a734caaf5
          env:
            - name: TZ
              value: "America/New_York"
          ports:
            - name: http
              containerPort: 7080
          volumeMounts:
            - name: appsettings
              mountPath: /app/appsettings.json
              subPath: appsettings.json
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket:
              port: 7080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 7080
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: appsettings
          secret:
            secretName: netlock-server-appsettings
            defaultMode: 0444
