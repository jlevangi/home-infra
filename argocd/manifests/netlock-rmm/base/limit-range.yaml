apiVersion: v1
kind: LimitRange
metadata:
  name: netlock-rmm-storage-limits
  namespace: netlock-rmm
spec:
  limits:
    - type: PersistentVolumeClaim
      max:
        storage: "25Gi"
      min:
        storage: "100Mi"
      default:
        storage: "5Gi"
      defaultRequest:
        storage: "5Gi"
