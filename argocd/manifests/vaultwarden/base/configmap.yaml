apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-config
  namespace: vaultwarden
data:
  # Domain will be patched per environment
  DOMAIN: "https://vw.levangie.dev"
  # Reverse proxy configuration - Traefik terminates SSL
  # Note: ROCKET_TLS is not set because Traefik handles TLS termination
  ROCKET_PORT: "80"
  # Database configuration
  DB_TYPE: "default"
  # User settings
  WEB_VAULT_ENABLED: "true"
  SIGNUPS_ALLOWED: "false"
  INVITATIONS_ALLOWED: "true"
  # Timezone
  TZ: "America/New_York"
  # SMTP settings (non-secret parts)
  SMTP_PORT: "587"
  SMTP_SECURITY: "starttls"
  SMTP_FROM: "vaultwarden@levangie.org"
