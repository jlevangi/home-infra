apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: vaultwarden/server
    newTag: "1.37.1"
patches:
  - target:
      kind: PersistentVolumeClaim
      name: vaultwarden-data-pvc
    patch: |
      - op: replace
        path: /spec/volumeName
        value: vaultwarden-data-pv
  - target:
      kind: Ingress
      name: vaultwarden-ingress
    patch: |
      - op: add
        path: /spec/rules/-
        value:
          host: vw.levangie.org
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: vaultwarden
                    port:
                      number: 80
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
