apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: vaultwarden/server
    newTag: "1.35.7"
# Prod uses base values (vw.levangie.dev) - no patches needed
patches:
  - target:
      kind: PersistentVolumeClaim
      name: vaultwarden-data-pvc
    patch: |
      - op: replace
        path: /spec/volumeName
        value: vaultwarden-data-pv
  - target:
      kind: Ingress
      name: vaultwarden-ingress
    patch: |
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-prod.levangie.dev"
labels:
  - pairs:
      environment: prod
    includeSelectors: true
