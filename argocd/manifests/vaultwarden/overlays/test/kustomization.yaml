apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  # Patch ConfigMap DOMAIN for test environment
  - target:
      kind: ConfigMap
      name: vaultwarden-config
    patch: |
      - op: replace
        path: /data/DOMAIN
        value: "https://vw.test.levangie.dev"
  # Patch Ingress host for test environment
  - target:
      kind: Ingress
      name: vaultwarden-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "vw.test.levangie.dev"
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: "k3s-test.levangie.dev"
  - target:
      kind: ExternalSecret
      name: vaultwarden-secrets
    patch: |
      - op: replace
        path: /spec/dataFrom/0/extract/key
        value: "test/vaultwarden"
labels:
  - pairs:
      environment: test
    includeSelectors: true
